}

/* ==========================================================================
   PALETTE
   ========================================================================== */

const PALETTE = {
  ink:          "#dce6f2",
  inkSoft:      "rgba(220, 230, 242, 0.55)",
  inkFaint:     "rgba(220, 230, 242, 0.18)",
  inkGuide:     "rgba(220, 230, 242, 0.28)",

  paper:        "#0a0e14",
  paperTint:    "#060a10",

  step:         "#ff2bd6",
  stepSoft:     "rgba(255, 43, 214, 0.75)",
  stepFaint:    "rgba(255, 43, 214, 0.40)",

  transit:      "#00e5ff",
  transitSoft:  "rgba(0, 229, 255, 0.80)",
  transitFaint: "rgba(0, 229, 255, 0.42)",

  highlight:    "#ffe600",
  highlightBg:  "rgba(255, 230, 0, 0.16)",
  highlightSft: "rgba(255, 230, 0, 0.60)",
};

/* ==========================================================================
   SHEET CONSTANTS
   ========================================================================== */

const SHEET_MARGIN     = 6;
const RIBBON_BAND_H    = 22;
const FLOOR_PAD        = 60;
const MARGIN_TICK_LEN  = 5;
const REG_CROSS_R      = 9;

/* Zoom bounds.  There is no fixed minimum scale: the effective
   minimum is a fraction of the fit scale, which fitView() sets from
   the room's bounding box and the current viewport.  A fixed minimum
   (the earlier design used MIN_ZOOM = 0.20 px/mm) is wrong because
   the fit scale for a large room in a small window can be well below
   that: the first wheel-down event would jump the view IN to the
   fixed floor, and every subsequent wheel-down would be clamped
   there.  Making the floor relative to the fit means zoom-out always
   has slack to spare, however the room and viewport are sized. */
const MIN_ZOOM_FACTOR  = 0.20;   // zoom out to 1/5 of the fit scale
const MAX_ZOOM         = 8.0;

const CORNER_HIT       = 11;
const EDGE_HIT         = 10;
const DRAG_CANCEL      = 6;
const MIN_BOX_MM       = 10;

/* Rotation-handle geometry.  See the module docstring for why the
   offset is in screen pixels rather than world millimetres. */
const ROTATE_HANDLE_OFFSET_PX = 32;
const ROTATE_HANDLE_R         = 9;

/* ==========================================================================
   PANEL-FADE STATE
   ========================================================================== */

let panelHovered      = false;
let panelLastActivity = 0;

/* ==========================================================================
   SCREEN TEXTURES
   ==========================================================================
   Two cached pattern canvases:

     stepHatch   the light-blue step footprint.  On the light theme this
                 was a solid tint; on dark, a sparse diagonal hatch at
                 medium alpha reads as "surface, not wall" without
                 competing with the boxes.
     wallFill    a very faint hatch behind the walls, so the wall fill
                 reads as a material rather than a solid blob.  At this
                 alpha it is nearly invisible and mostly serves to keep
                 the wall's silhouette from looking like a printed bar.

   The pattern canvases are transparent — the caller's fillRect or
   path.fill() picks up whatever is beneath.  This differs from the
   cable project's patterns, which carried their own paper background;
   here the walls sit on top of a paper canvas and we do not want to
   repaint the paper behind every hatch tile. */

const _SCREEN_PATTERNS = Object.create(null);

function _screenPattern(kind) {
  if (_SCREEN_PATTERNS[kind]) return _SCREEN_PATTERNS[kind];
  const make = (size, draw) => {
    const pc = document.createElement("canvas");
    pc.width = pc.height = size;
    const p = pc.getContext("2d");
    p.lineCap = "round";
    draw(p, size);
    return pc;
  };
  const defs = {
    stepHatch: [12, (p, s) => {
      p.strokeStyle = "rgba(220, 230, 242, 0.16)";
      p.lineWidth = 0.9;
      p.beginPath();
      p.moveTo(-1, s + 1); p.lineTo(s + 1, -1);
      p.stroke();
    }],
    wallFill: [14, (p, s) => {
      p.strokeStyle = "rgba(220, 230, 242, 0.06)";
      p.lineWidth = 0.6;
      p.beginPath();
      p.moveTo(s + 1, -1); p.lineTo(-1, s + 1);
      p.stroke();
    }],
  };
  const [size, draw] = defs[kind];
  _SCREEN_PATTERNS[kind] = make(size, draw);
  return _SCREEN_PATTERNS[kind];
}

function _screenPat(kind) {
  return ctx.createPattern(_screenPattern(kind), "repeat");
}

/* ==========================================================================
   SHARED DRAWING HELPERS
   ========================================================================== */

function _roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arc(x + w - r, y + r, r, -Math.PI / 2, 0);
  ctx.lineTo(x + w, y + h - r);
  ctx.arc(x + w - r, y + h - r, r, 0, Math.PI / 2);
  ctx.lineTo(x + r, y + h);
  ctx.arc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
  ctx.lineTo(x, y + r);
  ctx.arc(x + r, y + r, r, Math.PI, Math.PI * 3 / 2);
  ctx.closePath();
}

function _drawValuePill(cx, cy, text, accent) {
  ctx.save();
  ctx.font = "600 10px ui-monospace, monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const w = ctx.measureText(text).width + 10;
  const h = 13;
  ctx.fillStyle = PALETTE.paper;
  ctx.fillRect(cx - w / 2, cy - h / 2, w, h);
  ctx.strokeStyle = accent || PALETTE.ink;
  ctx.lineWidth = 0.9;
  ctx.strokeRect(cx - w / 2 + 0.4, cy - h / 2 + 0.4, w - 0.8, h - 0.8);
  ctx.fillStyle = accent || PALETTE.ink;
  ctx.fillText(text, cx, cy + 0.5);
  ctx.restore();
}

/* ==========================================================================
   PATH BUILDERS
   ========================================================================== */

function pathFace(face) {
  ctx.beginPath();
  const o = face.outer;
  if (!o.length) return;
  let [x0, y0] = w2s(o[0][0], o[0][1]);
  ctx.moveTo(x0, y0);
  for (let i = 1; i < o.length; i++) {
    const [x, y] = w2s(o[i][0], o[i][1]);
    ctx.lineTo(x, y);
  }
  ctx.closePath();
  for (const h of face.holes) {
    if (!h.length) continue;
    [x0, y0] = w2s(h[0][0], h[0][1]);
    ctx.moveTo(x0, y0);
    for (let i = 1; i < h.length; i++) {
      const [x, y] = w2s(h[i][0], h[i][1]);
      ctx.lineTo(x, y);
    }
    ctx.closePath();
  }
}

function pathBox(b) {
  const c = boxCorners(b.x, b.y, b.w, b.h, b.rot);
  ctx.beginPath();
  let [sx, sy] = w2s(c[0][0], c[0][1]);
  ctx.moveTo(sx, sy);
  for (let i = 1; i < 4; i++) {
    [sx, sy] = w2s(c[i][0], c[i][1]);
    ctx.lineTo(sx, sy);
  }
  ctx.closePath();
}

/* ==========================================================================
   BOX SHAPES AND LABELS
   ========================================================================== */

function drawBoxShape(b, stroke, fill, lw, dashed) {
  pathBox(b);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) {
    if (dashed) ctx.setLineDash([7, 5]);
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lw || 2;
    ctx.stroke();
    if (dashed) ctx.setLineDash([]);
  }
}

function drawBoxLabel(b, faded) {
  if (!b.name) return;
  const c = boxCorners(b.x, b.y, b.w, b.h, b.rot);
  const sc = c.map(([x, y]) => w2s(x, y));
  const screenW = Math.abs(sc[1][0] - sc[0][0]) + Math.abs(sc[2][0] - sc[1][0]);
  const screenH = Math.abs(sc[3][1] - sc[0][1]) + Math.abs(sc[2][1] - sc[1][1]);
  const minDim = Math.min(screenW, screenH);
  const fontSize = Math.max(8, Math.min(16, minDim * 0.13));
  if (fontSize < 8) return;

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(sc[0][0], sc[0][1]);
  for (let i = 1; i < 4; i++) ctx.lineTo(sc[i][0], sc[i][1]);
  ctx.closePath();
  ctx.clip();

  const [cxs, cys] = w2s(b.x, b.y);
  let tRot = b.rot;
  while (tRot >  90) tRot -= 180;
  while (tRot < -90) tRot += 180;

  ctx.translate(cxs, cys);
  ctx.rotate(-tRot * Math.PI / 180);
  ctx.fillStyle = faded ? PALETTE.inkSoft : PALETTE.ink;
  ctx.font = `600 ${fontSize.toFixed(1)}px ui-monospace, monospace`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(b.name, 0, 0);
  ctx.restore();
}

function drawInvalidChip(b) {
  const sc = boxCorners(b.x, b.y, b.w, b.h, b.rot).map(([x, y]) => w2s(x, y));
  const minY = Math.min(sc[0][1], sc[1][1], sc[2][1], sc[3][1]);
  const cxs = (sc[0][0] + sc[1][0] + sc[2][0] + sc[3][0]) / 4;
  const label = T("chipInvalid");
  ctx.save();
  ctx.translate(cxs, minY - 11);
  ctx.font = "700 10px ui-monospace, monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const tw = ctx.measureText(label).width;
  ctx.fillStyle = PALETTE.paper;
  ctx.fillRect(-tw / 2 - 6, -9, tw + 12, 18);
  ctx.strokeStyle = PALETTE.step;
  ctx.lineWidth = 1;
  ctx.strokeRect(-tw / 2 - 6 + 0.5, -9 + 0.5, tw + 12 - 1, 18 - 1);
  ctx.fillStyle = PALETTE.step;
  ctx.fillText(label, 0, 0);
  ctx.restore();
}

/* ==========================================================================
   HANDLES
   ==========================================================================
   Three visual kinds, ordered least-intrusive to most:

     edge        8 × 8 square, thin outline — one-axis resize
     corner     11 × 11 square, thicker outline — two-axis resize
     rotate     18 px circle with a ↻ glyph, floating above the top
                 edge, connected by a dashed leader line

   Corner squares are deliberately larger than edge squares: a bigger
   handle reads as "this does more" without any caption, and a user
   reaching for a two-axis resize almost always goes for the corner
   first. */

function drawHandles(b) {
  const corners = boxCorners(b.x, b.y, b.w, b.h, b.rot);
  const edges   = boxEdgeMidpoints(b.x, b.y, b.w, b.h, b.rot);

  /* Edge handles — smaller squares, resize one axis. */
  for (let i = 0; i < 4; i++) {
    const [sx, sy] = w2s(edges[i][0], edges[i][1]);
    ctx.beginPath();
    ctx.rect(sx - 4, sy - 4, 8, 8);
    ctx.fillStyle = PALETTE.paper; ctx.fill();
    ctx.strokeStyle = PALETTE.highlight; ctx.lineWidth = 1.6; ctx.stroke();
  }

  /* Corner handles — larger squares, resize both axes at once. */
  for (let i = 0; i < 4; i++) {
    const [sx, sy] = w2s(corners[i][0], corners[i][1]);
    ctx.beginPath();
    ctx.rect(sx - 5.5, sy - 5.5, 11, 11);
    ctx.fillStyle = PALETTE.paper; ctx.fill();
    ctx.strokeStyle = PALETTE.highlight; ctx.lineWidth = 2; ctx.stroke();
  }

  /* Rotation handle — a floating circle above the box's top edge,
     connected by a dashed leader line.  The offset is in screen
     pixels (see rotateHandleWorldPos in bx_core), so the handle sits
     the same distance from the box edge at every zoom level. */
  const r = b.rot * Math.PI / 180;
  const topCx = b.x - Math.sin(r) * (b.h / 2);
  const topCy = b.y + Math.cos(r) * (b.h / 2);
  const [tcx, tcy] = w2s(topCx, topCy);
  const [rhx, rhy] = rotateHandleScreenPos(b);

  ctx.save();

  ctx.beginPath();
  ctx.moveTo(tcx, tcy);
  ctx.lineTo(rhx, rhy);
  ctx.strokeStyle = PALETTE.highlight;
  ctx.lineWidth = 1.4;
  ctx.setLineDash([3, 3]);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.beginPath();
  ctx.arc(rhx, rhy, ROTATE_HANDLE_R, 0, Math.PI * 2);
  ctx.fillStyle = PALETTE.paper;
  ctx.fill();
  ctx.strokeStyle = PALETTE.highlight;
  ctx.lineWidth = 1.8;
  ctx.stroke();

  /* ↻ glyph inside the circle.  U+21BB is well-supported in every
     monospace stack the playground falls back to. */
  ctx.font = "700 12px ui-monospace, monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = PALETTE.highlight;
  ctx.fillText("\u21BB", rhx, rhy + 0.5);

  ctx.restore();
}

/* ==========================================================================
   GHOST
   ==========================================================================
   Two alphas, deliberately different:

     GHOST_ALPHA_PRESET   the box that follows the cursor in draw-box
                          mode.  A suggestion, not an action — drawn
                          at a very low alpha so it can be seen but
                          does not compete with the drawing beneath.
     GHOST_ALPHA_DRAG     the rectangle the user is actively drawing.
                          An action in progress — drawn noticeably
                          stronger so the user can see exactly what
                          they are about to commit.

   The whole shape (fill, paper backing, outline) is drawn under one
   globalAlpha; the collision pill is drawn after restoring the
   alpha, so a warning stays full-strength even when its shape is
   faint. */

const GHOST_ALPHA_PRESET = 0.15;
const GHOST_ALPHA_DRAG   = 0.40;

function drawGhost(b, invalid, alpha) {
  const stroke = invalid ? PALETTE.step : PALETTE.highlight;
  const fill   = invalid
    ? "rgba(255, 43, 214, 0.18)"
    : "rgba(255, 230, 0, 0.18)";

  ctx.save();
  ctx.globalAlpha = alpha;

  pathBox(b);
  ctx.fillStyle = fill;
  ctx.fill();

  pathBox(b);
  ctx.strokeStyle = PALETTE.paper;
  ctx.lineWidth = 6;
  ctx.stroke();

  pathBox(b);
  if (invalid) ctx.setLineDash([7, 5]);
  ctx.strokeStyle = stroke;
  ctx.lineWidth = 2.2;
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.restore();

  if (invalid) {
    const sc = boxCorners(b.x, b.y, b.w, b.h, b.rot).map(([x, y]) => w2s(x, y));
    const edgeW = Math.hypot(sc[1][0] - sc[0][0], sc[1][1] - sc[0][1]);
    const edgeH = Math.hypot(sc[3][0] - sc[0][0], sc[3][1] - sc[0][1]);
    if (Math.min(edgeW, edgeH) > 46) {
      const [cx, cy] = w2s(b.x, b.y);
      _drawValuePill(cx, cy, T("ghostCollision"), PALETTE.step);
    }
  }
}

/* ==========================================================================
   OVERLAP FLAGS
   ========================================================================== */

function computeOverlapFlags(validFlags) {
  const n = placedBoxes.length;
  const flags = new Array(n).fill(false);
  const corners = placedBoxes.map(b =>
    boxCorners(b.x, b.y, b.w, b.h, b.rot));
  for (let i = 0; i < n; i++) {
    if (!validFlags[i]) continue;
    for (let j = i + 1; j < n; j++) {
      if (!validFlags[j]) continue;
      if (polygonsOverlap(corners[i], corners[j])) {
        flags[i] = true;
        flags[j] = true;
      }
    }
  }
  return flags;
}

/* ==========================================================================
   SHEET DECORATION
   ========================================================================== */

function drawSheetFrame(cw, ch) {
  ctx.save();
  ctx.strokeStyle = PALETTE.inkFaint;
  ctx.lineWidth = 0.8;
  ctx.strokeRect(SHEET_MARGIN + 0.4, SHEET_MARGIN + 0.4,
                 cw - 2 * SHEET_MARGIN - 0.8,
                 ch - 2 * SHEET_MARGIN - 0.8);
  ctx.restore();
  drawRegistrationMark(SHEET_MARGIN + 4, SHEET_MARGIN + 4);
  drawRegistrationMark(cw - SHEET_MARGIN - 4, SHEET_MARGIN + 4);
  drawRegistrationMark(SHEET_MARGIN + 4, ch - SHEET_MARGIN - 4);
  drawRegistrationMark(cw - SHEET_MARGIN - 4, ch - SHEET_MARGIN - 4);
}

function drawRegistrationMark(x, y) {
  ctx.save();
  ctx.strokeStyle = PALETTE.inkFaint;
  ctx.lineWidth = 0.8;
  const r = REG_CROSS_R;
  ctx.beginPath();
  ctx.moveTo(x - r, y); ctx.lineTo(x + r, y);
  ctx.moveTo(x, y - r); ctx.lineTo(x, y + r);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x, y, r * 0.55, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

/* ==========================================================================
   MAIN RENDER
   ========================================================================== */

function drawFloorView() {
  const cw = window.innerWidth, ch = window.innerHeight;

  /* Step footprints — light hatch */
  for (const face of GEOMETRY.stepFaces) {
    pathFace(face);
    ctx.fillStyle = _screenPat("stepHatch");
    ctx.fill("evenodd");
    ctx.strokeStyle = PALETTE.stepSoft;
    ctx.lineWidth = 1;
    ctx.setLineDash([7, 5]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  /* Walls and columns — solid ink fill */
  for (const face of GEOMETRY.faces) {
    pathFace(face);
    ctx.fillStyle = PALETTE.ink;
    ctx.fill("evenodd");
    ctx.strokeStyle = PALETTE.ink;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  /* Placed boxes */
  const validFlags = placedBoxes.map(b => !boxIsInvalid(b));
  const overlapFlags = computeOverlapFlags(validFlags);

  for (let i = 0; i < placedBoxes.length; i++) {
    const b = placedBoxes[i];
    const isSel   = (b === selectedBox);
    const isHover = (b === hoveredBox);
    const valid = validFlags[i];
    const ov    = overlapFlags[i];

    let stroke, fill, dashed = false;

    if (!valid) {
      stroke = PALETTE.inkSoft;
      fill   = "rgba(220, 230, 242, 0.05)";
      dashed = true;
    } else if (ov) {
      stroke = PALETTE.step;
      fill   = "rgba(255, 43, 214, 0.18)";
    } else {
      stroke = PALETTE.transit;
      fill   = "rgba(0, 229, 255, 0.14)";
    }

    if (isSel) {
      if (valid && ov)      { stroke = PALETTE.highlight;
                              fill   = "rgba(255, 43, 214, 0.24)"; }
      else if (valid)       { stroke = PALETTE.highlight;
                              fill   = "rgba(0, 229, 255, 0.20)"; }
      else                  { stroke = PALETTE.inkSoft;
                              fill   = "rgba(220, 230, 242, 0.10)"; }
    }
    const lw = isSel ? 3 : (isHover ? 2.6 : 1.8);

    drawBoxShape(b, stroke, fill, lw, dashed);
  }

  /* Labels */
  for (let i = 0; i < placedBoxes.length; i++) {
    drawBoxLabel(placedBoxes[i], !validFlags[i]);
  }

  /* Invalid chips */
  for (let i = 0; i < placedBoxes.length; i++) {
    if (!validFlags[i]) drawInvalidChip(placedBoxes[i]);
  }

  /* Handles on the selected box.  In draw-box mode a selected box
     CAN exist — placing a box inside the mode selects it — so this
     line runs in both modes and the handles are visible in both.
     That visibility is what makes the "click a handle to exit draw
     mode" gesture discoverable. */
  if (selectedBox) drawHandles(selectedBox);

  /* Ghost.  Only in draw-box mode, and only over the canvas. */
  const overHandle = !!hitTestHandle(mouse.sx, mouse.sy);
  const canGhost =
    drawBoxMode &&
    mouse.inside && !panning && !drag && !handleDrag && !overHandle;

  if (canGhost) {
    if (pendingPlace && pendingPlace.drag) {
      const x0 = Math.min(pendingPlace.wx, pendingPlace.dragWx);
      const x1 = Math.max(pendingPlace.wx, pendingPlace.dragWx);
      const y0 = Math.min(pendingPlace.wy, pendingPlace.dragWy);
      const y1 = Math.max(pendingPlace.wy, pendingPlace.dragWy);
      const dw = x1 - x0;
      const dh = y1 - y0;
      if (dw >= 1 && dh >= 1) {
        const dcx = (x0 + x1) / 2;
        const dcy = (y0 + y1) / 2;
        const invalid = boxOverlapsWalls(dcx, dcy, dw, dh, 0);
        drawGhost({ x: dcx, y: dcy, w: dw, h: dh, rot: 0 },
                  invalid, GHOST_ALPHA_DRAG);
      }
    } else {
      const [wx, wy] = s2w(mouse.sx, mouse.sy);
      const { w, h, rot } = getBoxParams();
      const invalid = boxOverlapsWalls(wx, wy, w, h, rot);
      drawGhost({ x: wx, y: wy, w, h, rot },
                invalid, GHOST_ALPHA_PRESET);
    }
  }

  updateStatus(validFlags);
  updateTitleBlock();
}

/* ==========================================================================
   WALL-SLIDING BODY DRAG
   ==========================================================================
   Swept path: divide the drag into ~50 mm steps, and at each step try
   the full move; if that collides, try x-only; then y-only; then stop.
   A single 500 mm jump into a wall would be rejected by the plain
   collision test, so without the sweep a fast drag would refuse to
   slide along a wall. */

function moveBoxSafely(b, targetX, targetY) {
  if (boxIsInvalid(b)) {
    b.x = targetX;
    b.y = targetY;
    invalidateBox(b);
    return;
  }

  const totalDx = targetX - b.x, totalDy = targetY - b.y;
  const dist = Math.hypot(totalDx, totalDy);
  if (dist < 1e-6) return;
  const steps = Math.max(1, Math.ceil(dist / 50));
  const stepDx = totalDx / steps, stepDy = totalDy / steps;
  let moved = false;
  for (let i = 0; i < steps; i++) {
    const tx = b.x + stepDx;
    const ty = b.y + stepDy;
    if      (!boxOverlapsWalls(tx, ty, b.w, b.h, b.rot)) { b.x = tx; b.y = ty; moved = true; }
    else if (!boxOverlapsWalls(tx, b.y, b.w, b.h, b.rot)) { b.x = tx;       moved = true; }
    else if (!boxOverlapsWalls(b.x, ty, b.w, b.h, b.rot)) { b.y = ty;       moved = true; }
    else break;
  }
  if (moved) invalidateBox(b);
}

/* ==========================================================================
   ROTATE HANDLE DRAG
   ==========================================================================
   The rotation handle spins the box about its own centre.  Its
   position is computed by rotateHandleScreenPos in bx_core; both the
   renderer and the hit test share that function, so the handle the
   user sees is exactly the handle the hit test finds.

   The drag math is unchanged from the corner-rotate the previous
   revision used: record the angle from box centre to the initial
   cursor position, then on each move apply the delta angle to the
   box's original rotation.  Shift snaps the result to 15°. */

function startRotate(b, wx, wy) {
  handleDrag = {
    type: "rotate",
    b,
    orig: { x: b.x, y: b.y, w: b.w, h: b.h, rot: b.rot },
    startAngle: Math.atan2(wy - b.y, wx - b.x),
  };
}

function updateRotate(wx, wy, shift) {
  const hd = handleDrag, b = hd.b;
  const phi = Math.atan2(wy - b.y, wx - b.x);
  let delta = (phi - hd.startAngle) * 180 / Math.PI;
  let newRot = hd.orig.rot + delta;
  if (shift) newRot = Math.round(newRot / 15) * 15;
  newRot = ((newRot % 360) + 360) % 360;

  const curInvalid = boxIsInvalid(b);
  if (curInvalid || !boxOverlapsWalls(b.x, b.y, b.w, b.h, newRot)) {
    b.rot = newRot;
    invalidateBox(b);
    return true;
  }
  return false;
}

/* ==========================================================================
   EDGE RESIZE — one axis
   ==========================================================================
   Dragging an edge handle resizes that edge, keeping the opposite
   edge fixed.  Both edges of the pair share the box's local frame,
   so the math is a projection onto one of the box's two axes.

   The four edges, indexed by their position in boxEdgeMidpoints:

       edge 0   the "bottom" edge in the box's local frame
       edge 1   the "right"  edge
       edge 2   the "top"    edge
       edge 3   the "left"   edge */

function startResize(b, edgeIndex) {
  handleDrag = {
    type: "resize",
    edge: edgeIndex,
    b,
    orig: { x: b.x, y: b.y, w: b.w, h: b.h, rot: b.rot },
  };
}

function updateResize(wx, wy) {
  const hd = handleDrag, b = hd.b, o = hd.orig;
  const r = o.rot * Math.PI / 180;
  const ux = Math.cos(r),  uy = Math.sin(r);
  const vx = -Math.sin(r), vy = Math.cos(r);

  let newW = o.w, newH = o.h, newCx = o.x, newCy = o.y;

  if (hd.edge === 1) {
    const fx = o.x - ux * o.w / 2, fy = o.y - uy * o.w / 2;
    const t  = (wx - fx) * ux + (wy - fy) * uy;
    newW = Math.max(MIN_BOX_MM, t);
    newCx = fx + ux * newW / 2; newCy = fy + uy * newW / 2;
  } else if (hd.edge === 3) {
    const fx = o.x + ux * o.w / 2, fy = o.y + uy * o.w / 2;
    const t  = (wx - fx) * ux + (wy - fy) * uy;
    newW = Math.max(MIN_BOX_MM, -t);
    newCx = fx - ux * newW / 2; newCy = fy - uy * newW / 2;
  } else if (hd.edge === 2) {
    const fx = o.x - vx * o.h / 2, fy = o.y - vy * o.h / 2;
    const t  = (wx - fx) * vx + (wy - fy) * vy;
    newH = Math.max(MIN_BOX_MM, t);
    newCx = fx + vx * newH / 2; newCy = fy + vy * newH / 2;
  } else if (hd.edge === 0) {
    const fx = o.x + vx * o.h / 2, fy = o.y + vy * o.h / 2;
    const t  = (wx - fx) * vx + (wy - fy) * vy;
    newH = Math.max(MIN_BOX_MM, -t);
    newCx = fx - vx * newH / 2; newCy = fy - vy * newH / 2;
  }

  const curInvalid = boxIsInvalid(b);
  if (curInvalid ||
      !boxOverlapsWalls(newCx, newCy, newW, newH, o.rot)) {
    b.x = newCx; b.y = newCy; b.w = newW; b.h = newH;
    invalidateBox(b);
    return true;
  }
  return false;
}

/* ==========================================================================
   CORNER RESIZE — both axes
   ==========================================================================
   See the module docstring for the derivation.  In one sentence: pin
   the opposite corner, project the cursor onto the box's two local
   axes, take the absolutes as the new dimensions, and place the new
   centre at the midpoint between the anchor and the dragged corner.
   The projections' signs, preserved through MIN_BOX_MM clamping, give
   the box the ability to flip through its anchor corner. */

function startResizeCorner(b, cornerIndex) {
  handleDrag = {
    type: "resize-corner",
    corner: cornerIndex,
    b,
    orig: { x: b.x, y: b.y, w: b.w, h: b.h, rot: b.rot },
  };
}

function updateResizeCorner(wx, wy) {
  const hd = handleDrag, b = hd.b, o = hd.orig;
  const r = o.rot * Math.PI / 180;
  const ux = Math.cos(r),  uy = Math.sin(r);
  const vx = -Math.sin(r), vy = Math.cos(r);

  /* The anchor is the diagonally opposite corner in the box's local
     frame.  Local corner positions, in the same order the boxCorners
     helper uses:

         corner 0  (-w/2, -h/2)
         corner 1  (+w/2, -h/2)
         corner 2  (+w/2, +h/2)
         corner 3  (-w/2, +h/2)

     so the anchor for dragged corner `i` is at index (i + 2) % 4. */
  const oppLocal = [
    [-o.w / 2, -o.h / 2],
    [ o.w / 2, -o.h / 2],
    [ o.w / 2,  o.h / 2],
    [-o.w / 2,  o.h / 2],
  ][(hd.corner + 2) % 4];

  /* Anchor in world space. */
  const ax = o.x + ux * oppLocal[0] + vx * oppLocal[1];
  const ay = o.y + uy * oppLocal[0] + vy * oppLocal[1];

  /* Cursor relative to the anchor, projected onto the box's local
     axes.  localU / localV are signed distances in box-local mm. */
  const dx = wx - ax, dy = wy - ay;
  const localU = dx * ux + dy * uy;
  const localV = dx * vx + dy * vy;

  const signU = localU >= 0 ? 1 : -1;
  const signV = localV >= 0 ? 1 : -1;
  const newW = Math.max(MIN_BOX_MM, Math.abs(localU));
  const newH = Math.max(MIN_BOX_MM, Math.abs(localV));

  /* New centre = anchor + half the new extent along each axis, with
     the axis direction determined by the projection's sign. */
  const uOffset = signU * newW / 2;
  const vOffset = signV * newH / 2;

  const newCx = ax + ux * uOffset + vx * vOffset;
  const newCy = ay + uy * uOffset + vy * vOffset;

  const curInvalid = boxIsInvalid(b);
  if (curInvalid ||
      !boxOverlapsWalls(newCx, newCy, newW, newH, o.rot)) {
    b.x = newCx; b.y = newCy; b.w = newW; b.h = newH;
    invalidateBox(b);
    return true;
  }
  return false;
}

/* ==========================================================================
   SELECTION
   ========================================================================== */

function setSelected(b) {
  selectedBox = b;
  syncSelectionInputs();
  draw();
}

/* ==========================================================================
   WALL GATE
   ==========================================================================
   Every panel-driven edit passes through here.  An invalid box is
   editable freely; a valid box cannot be committed to a wall-overlap
   state. */

function tryApplyBoxChange(b, changes) {
  const test = { x: b.x, y: b.y, w: b.w, h: b.h, rot: b.rot };
  Object.assign(test, changes);
  const curInvalid = boxIsInvalid(b);
  if (!curInvalid &&
      boxOverlapsWalls(test.x, test.y, test.w, test.h, test.rot)) {
    flashStatus(T("msgWallBlocked"), "bad");
    return false;
  }
  Object.assign(b, changes);
  invalidateBox(b);
  return true;
}

/* ==========================================================================
   ROTATION HELPERS
   ========================================================================== */

function rotateSelection(deg) {
  const b = hoveredBox || selectedBox;
  if (b) {
    const newRot = ((b.rot + deg) % 360 + 360) % 360;
    const curInvalid = boxIsInvalid(b);
    if (!curInvalid && boxOverlapsWalls(b.x, b.y, b.w, b.h, newRot)) {
      flashStatus(T("msgRotationBlocked"), "bad");
      return;
    }
    b.rot = newRot;
    invalidateBox(b);
    if (b === selectedBox) syncSelectionInputs();
  } else {
    const cur = parseFloat(document.getElementById("boxRot").value) || 0;
    setRotation(cur + deg);
  }
}

/* ==========================================================================
   PRINT PATTERNS
   ==========================================================================
   Four cached pattern canvases with transparent backgrounds.  See the
   module docstring for why each class gets a different KIND of mark
   and why the pitches are looser than pg_export.py's band pitches. */

const _PNG_PATTERNS = Object.create(null);

function _pngPattern(kind) {
  if (_PNG_PATTERNS[kind]) return _PNG_PATTERNS[kind];
  const make = (size, draw) => {
    const pc = document.createElement("canvas");
    pc.width = pc.height = size;
    const p = pc.getContext("2d");
    p.strokeStyle = "#000000";
    p.fillStyle   = "#000000";
    p.lineCap     = "round";
    draw(p, size);
    return pc;
  };

  const defs = {
    wallStipple: [14, (p, s) => {
      p.beginPath(); p.arc(s * 0.25, s * 0.25, 0.8, 0, Math.PI * 2); p.fill();
      p.beginPath(); p.arc(s * 0.75, s * 0.75, 0.8, 0, Math.PI * 2); p.fill();
    }],
    stepHatch: [20, (p, s) => {
      p.lineWidth = 0.7;
      p.beginPath();
      p.moveTo(-1, s + 1);     p.lineTo(s + 1, -1);
      p.moveTo(-1, 1);         p.lineTo(1, -1);
      p.moveTo(s - 1, s + 1);  p.lineTo(s + 1, s - 1);
      p.stroke();
    }],
    boxOverlap: [16, (p, s) => {
      p.lineWidth = 0.55;
      p.beginPath();
      p.moveTo(-1, s + 1); p.lineTo(s + 1, -1);
      p.moveTo(-1, -1);    p.lineTo(s + 1, s + 1);
      p.stroke();
    }],
    voidHatch: [24, (p, s) => {
      p.lineWidth = 0.6;
      p.beginPath();
      p.moveTo(s + 1, -1); p.lineTo(-1, s + 1);
      p.stroke();
    }],
  };
  const [size, draw] = defs[kind];
  _PNG_PATTERNS[kind] = make(size, draw);
  return _PNG_PATTERNS[kind];
}


/* ==========================================================================
   LABEL HELPERS
   ========================================================================== */

/* AABB of a w × h rectangle centred at (cx, cy) and rotated by theta
   radians.  Used for the collision footprint of a rotated text. */
function labelAABB(cx, cy, w, h, theta) {
  const c = Math.cos(theta), s = Math.sin(theta);
  const hw = w / 2, hh = h / 2;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const corners = [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]];
  for (const [dx, dy] of corners) {
    const px = cx + c * dx - s * dy;
    const py = cy + s * dx + c * dy;
    if (px < x0) x0 = px; if (px > x1) x1 = px;
    if (py < y0) y0 = py; if (py > y1) y1 = py;
  }
  return { x0, y0, x1, y1 };
}

/* Text angle for a box name, in degrees.

   The name's text reads along the box's longest VISUAL side — the
   longer of the two edges its screen-projected corners define.  A
   2000 × 1000 box and a 1000 × 2000 box therefore show their names
   running along different axes, whichever reads longer on screen.

   The angle is normalised to keep the text upright: an angle past
   vertical (|θ| > 90°) is flipped by 180°, so the text never appears
   upside-down.  A square box falls through to the W direction,
   since the two edges tie and the `>=` picks the first.

   The corners are passed in screen space, not model space, so the
   "longest" comparison is on what the reader sees. */
function nameTextAngleDeg(boxScreenCorners) {
  const c0 = boxScreenCorners[0];
  const c1 = boxScreenCorners[1];
  const c2 = boxScreenCorners[2];
  const wEdge = Math.hypot(c1[0] - c0[0], c1[1] - c0[1]);
  const hEdge = Math.hypot(c2[0] - c1[0], c2[1] - c1[1]);

  let ang;
  if (wEdge >= hEdge) {
    ang = Math.atan2(c1[1] - c0[1], c1[0] - c0[0]);
  } else {
    ang = Math.atan2(c2[1] - c1[1], c2[0] - c1[0]);
  }

  if (ang >  Math.PI / 2) ang -= Math.PI;
  if (ang < -Math.PI / 2) ang += Math.PI;
  return ang * 180 / Math.PI;
}

/* Push overlapping labels apart.  Every label's rect is mutated in
   place.  A label with movable === false does not move; the other
   label of the pair takes the full displacement.  Labels that are
   both fixed are left as they are. */
function relaxLabels(labels, pad) {
  const MAX_PASSES = 40;
  for (let pass = 0; pass < MAX_PASSES; pass++) {
    let moved = false;
    for (let i = 0; i < labels.length; i++) {
      const A = labels[i];
      const a = A.rect;
      for (let j = i + 1; j < labels.length; j++) {
        const B = labels[j];
        const b = B.rect;

        const overlapX = Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0);
        const overlapY = Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0);
        if (overlapX <= 0 || overlapY <= 0) continue;

        const aMov = A.movable !== false;
        const bMov = B.movable !== false;
        if (!aMov && !bMov) continue;

        const shareA = (aMov && bMov) ? 0.5 : (aMov ? 1 : 0);
        const shareB = (aMov && bMov) ? 0.5 : (bMov ? 1 : 0);

        if (overlapX < overlapY) {
          const push = (overlapX + pad) / 2;
          const dir = ((a.x0 + a.x1) < (b.x0 + b.x1)) ? -1 : 1;
          a.x0 += dir * push * (shareA * 2);
          a.x1 += dir * push * (shareA * 2);
          b.x0 -= dir * push * (shareB * 2);
          b.x1 -= dir * push * (shareB * 2);
        } else {
          const push = (overlapY + pad) / 2;
          const dir = ((a.y0 + a.y1) < (b.y0 + b.y1)) ? -1 : 1;
          a.y0 += dir * push * (shareA * 2);
          a.y1 += dir * push * (shareA * 2);
          b.y0 -= dir * push * (shareB * 2);
          b.y1 -= dir * push * (shareB * 2);
        }
        moved = true;
      }
    }
    if (!moved) break;
  }
}

/* Nearest point on a target polyline to (cx, cy).  One point is a
   point; two points are a segment; longer targets are closed
   polylines (last point connects to first). */
function nearestPointOnTarget(cx, cy, target) {
  if (!target || target.length === 0) return null;
  if (target.length === 1) {
    return { x: target[0][0], y: target[0][1] };
  }
  let bestX = 0, bestY = 0, bestD = Infinity;
  const n = target.length;
  for (let i = 0; i < n; i++) {
    const A = target[i];
    const B = target[(i + 1) % n];
    const dx = B[0] - A[0], dy = B[1] - A[1];
    const L2 = dx * dx + dy * dy;
    let px, py, d;
    if (L2 < 1e-9) {
      px = A[0]; py = A[1];
      d = Math.hypot(cx - px, cy - py);
    } else {
      let t = ((cx - A[0]) * dx + (cy - A[1]) * dy) / L2;
      t = Math.max(0, Math.min(1, t));
      px = A[0] + t * dx; py = A[1] + t * dy;
      d = Math.hypot(cx - px, cy - py);
    }
    if (d < bestD) { bestD = d; bestX = px; bestY = py; }
  }
  return { x: bestX, y: bestY };
}

/* Dashed leader from a label's rect edge to a target point, with a
   solid arrowhead at the target.  The arrowhead's length is capped
   at half the leader's length so a very short leader still reads as
   an arrow and not as a solid triangle. */
function drawLabelLeader(g, rect, target, fontSize, pngRes) {
  const cx = (rect.x0 + rect.x1) / 2;
  const cy = (rect.y0 + rect.y1) / 2;
  const dx = target.x - cx, dy = target.y - cy;
  const L = Math.hypot(dx, dy);
  if (L < 3) return;

  const ux = dx / L, uy = dy / L;

  const hw = (rect.x1 - rect.x0) / 2;
  const hh = (rect.y1 - rect.y0) / 2;
  let tRect = Infinity;
  if (Math.abs(ux) > 1e-9) tRect = Math.min(tRect, hw / Math.abs(ux));
  if (Math.abs(uy) > 1e-9) tRect = Math.min(tRect, hh / Math.abs(uy));
  if (!isFinite(tRect)) return;
  const sx = cx + ux * tRect;
  const sy = cy + uy * tRect;

  const ah = Math.min(Math.max(2, fontSize * 0.55), L * 0.5);
  const ahw = ah * 0.55;
  const baseX = target.x - ux * ah;
  const baseY = target.y - uy * ah;

  g.save();
  g.strokeStyle = "#000000";
  g.lineWidth = Math.max(1, 0.5 * pngRes);
  g.setLineDash([3 * pngRes, 3 * pngRes]);
  g.beginPath();
  g.moveTo(sx, sy);
  g.lineTo(baseX, baseY);
  g.stroke();
  g.setLineDash([]);

  const px = -uy, py = ux;
  g.beginPath();
  g.moveTo(target.x, target.y);
  g.lineTo(baseX + px * ahw, baseY + py * ahw);
  g.lineTo(baseX - px * ahw, baseY - py * ahw);
  g.closePath();
  g.fillStyle = "#000000";
  g.fill();
  g.restore();
}

/* Draw the line + arrowheads of a dimension line.  No text: the
   number is a label now, drawn by the label pass. */
function drawDimLineBody(g, A, B, ahSize, lw) {
  const dx = B[0] - A[0], dy = B[1] - A[1];
  const len = Math.hypot(dx, dy);
  if (len < 1) return;
  const ux = dx / len, uy = dy / len;
  const px = -uy, py = ux;

  g.strokeStyle = "#000000";
  g.lineWidth = lw;
  g.beginPath();
  g.moveTo(A[0], A[1]);
  g.lineTo(B[0], B[1]);
  g.stroke();

  const ah  = ahSize;
  const ahw = ahSize * 0.5;

  g.fillStyle = "#000000";
  g.beginPath();
  g.moveTo(A[0], A[1]);
  g.lineTo(A[0] + ux * ah + px * ahw, A[1] + uy * ah + py * ahw);
  g.lineTo(A[0] + ux * ah - px * ahw, A[1] + uy * ah - py * ahw);
  g.closePath();
  g.fill();

  g.beginPath();
  g.moveTo(B[0], B[1]);
  g.lineTo(B[0] - ux * ah + px * ahw, B[1] - uy * ah + py * ahw);
  g.lineTo(B[0] - ux * ah - px * ahw, B[1] - uy * ah - py * ahw);
  g.closePath();
  g.fill();
}


/* ==========================================================================
   MAIN RENDERER
   ========================================================================== */

function renderFloorPlanPNG() {
  const PNG_RES   = 4;
  const PX_PER_MM = 0.05 * PNG_RES;
  const MARGIN_PX = 10   * PNG_RES;

  const PEN_PLAN = 0.7 * 0.5 * PNG_RES;
  const PEN_STEP = 0.5 * 0.5 * PNG_RES;
  const PEN_BOX  = 1.8 * 0.5 * PNG_RES;

  const MIN_FONT = 4 * PNG_RES;

  const b = GEOMETRY.bounds;
  const mmW = b.maxX - b.minX;
  const mmH = b.maxY - b.minY;

  const W = Math.max(1, Math.round(mmW * PX_PER_MM + 2 * MARGIN_PX));
  const H = Math.max(1, Math.round(mmH * PX_PER_MM + 2 * MARGIN_PX));

  const cv = document.createElement("canvas");
  cv.width = W;
  cv.height = H;
  const g = cv.getContext("2d");

  g.fillStyle = "#ffffff";
  g.fillRect(0, 0, W, H);

  const P = (x, y) => [
    (x - b.minX) * PX_PER_MM + MARGIN_PX,
    (b.maxY - y) * PX_PER_MM + MARGIN_PX,
  ];

  const _patStipple = g.createPattern(_pngPattern("wallStipple"), "repeat");
  const _patStep    = g.createPattern(_pngPattern("stepHatch"),   "repeat");
  const _patOverlap = g.createPattern(_pngPattern("boxOverlap"),  "repeat");
  const _patVoid    = g.createPattern(_pngPattern("voidHatch"),   "repeat");

  const traceFace = (face) => {
    g.beginPath();
    const o = face.outer;
    if (!o.length) return;
    let [px, py] = P(o[0][0], o[0][1]);
    g.moveTo(px, py);
    for (let i = 1; i < o.length; i++) {
      [px, py] = P(o[i][0], o[i][1]);
      g.lineTo(px, py);
    }
    g.closePath();
    for (const h of face.holes) {
      if (!h.length) continue;
      [px, py] = P(h[0][0], h[0][1]);
      g.moveTo(px, py);
      for (let i = 1; i < h.length; i++) {
        [px, py] = P(h[i][0], h[i][1]);
        g.lineTo(px, py);
      }
      g.closePath();
    }
  };

  /* ---------- 1. STEPS — forward-slash hatch ----------------------- */
  for (const face of GEOMETRY.stepFaces) {
    traceFace(face);
    g.fillStyle = _patStep;
    g.fill("evenodd");
    g.strokeStyle = "#000000";
    g.lineWidth = PEN_STEP;
    g.setLineDash([7 * PNG_RES, 5 * PNG_RES]);
    g.stroke();
    g.setLineDash([]);
  }

  /* ---------- 2. WALLS — dot stipple ------------------------------- */
  for (const face of GEOMETRY.faces) {
    traceFace(face);
    g.fillStyle = _patStipple;
    g.fill("evenodd");
    g.strokeStyle = "#000000";
    g.lineWidth = PEN_PLAN;
    g.stroke();
  }

  /* ---------- 3. BOXES — three classes, three visual rules --------- */
  const validFlags = placedBoxes.map(bx => !boxIsInvalid(bx));
  const overlapFlags = computeOverlapFlags(validFlags);

  for (let i = 0; i < placedBoxes.length; i++) {
    const bx = placedBoxes[i];
    const valid = validFlags[i];
    const ov    = overlapFlags[i];

    let fillStyle, dashed = false;
    if (!valid)      { fillStyle = _patVoid;    dashed = true;  }
    else if (ov)     { fillStyle = _patOverlap; dashed = false; }
    else             { fillStyle = "#ffffff";   dashed = false; }

    const sc = boxCorners(bx.x, bx.y, bx.w, bx.h, bx.rot)
                 .map(([x, y]) => P(x, y));

    g.beginPath();
    g.moveTo(sc[0][0], sc[0][1]);
    for (let k = 1; k < 4; k++) g.lineTo(sc[k][0], sc[k][1]);
    g.closePath();
    g.fillStyle = fillStyle;
    g.fill();
    if (dashed) g.setLineDash([7 * PNG_RES, 5 * PNG_RES]);
    g.strokeStyle = "#000000";
    g.lineWidth = PEN_BOX;
    g.stroke();
    g.setLineDash([]);
  }

  /* ---------- 4. LABELS --------------------------------------------
     One collection, one relaxation, one draw pass.  See the module
     docstring for the model. */

  const boxPolysProj = placedBoxes.map(bx =>
    boxCorners(bx.x, bx.y, bx.w, bx.h, bx.rot).map(([x, y]) => P(x, y)));

  const boxRects = boxPolysProj.map(sc => ({
    x0: Math.min(sc[0][0], sc[1][0], sc[2][0], sc[3][0]),
    y0: Math.min(sc[0][1], sc[1][1], sc[2][1], sc[3][1]),
    x1: Math.max(sc[0][0], sc[1][0], sc[2][0], sc[3][0]),
    y1: Math.max(sc[0][1], sc[1][1], sc[2][1], sc[3][1]),
  }));

  const wallFacesProj = GEOMETRY.faces.map(face => ({
    outer: face.outer.map(([x, y]) => P(x, y)),
    holes: face.holes.map(h => h.map(([x, y]) => P(x, y))),
  }));

  const allLabels = [];

  /* Box bodies enter the collision system as invisible fixed
     obstacles.  This keeps outside names and dimension numbers from
     drifting onto a neighbouring box during relaxation. */
  for (let i = 0; i < boxRects.length; i++) {
    allLabels.push({
      kind: "box-body",
      rect: { ...boxRects[i] },
      anchor: null,
      movable: false,
      draw: false,
    });
  }

  /* ---- 4a. pass 1: inside/outside decision ----
     The fit test now measures the name against the box's LONG and
     SHORT extents, not its W and H.  A name that reads along the
     box's long edge has to fit that edge; its text-height has to fit
     the short edge.  The dimension-number fit tests stay unchanged:
     each number is tied to its own edge and reads along it. */
  const insideFlags = new Array(placedBoxes.length).fill(false);
  const insideFS    = new Array(placedBoxes.length).fill(0);

  for (let i = 0; i < placedBoxes.length; i++) {
    const bx = placedBoxes[i];
    const hasName = !!(bx.name && bx.name.length);
    const nameStr = bx.name || "";
    const wStr = String(Math.round(bx.w));
    const hStr = String(Math.round(bx.h));
    const sc = boxPolysProj[i];

    const edgeW = Math.hypot(sc[1][0] - sc[0][0], sc[1][1] - sc[0][1]);
    const edgeH = Math.hypot(sc[2][0] - sc[1][0], sc[2][1] - sc[1][1]);
    const longEdge  = Math.max(edgeW, edgeH);
    const shortEdge = Math.min(edgeW, edgeH);

    let fs = Math.min(14 * PNG_RES, shortEdge * 0.16, longEdge * 0.12);
    if (fs < MIN_FONT) continue;
    for (let tries = 0; tries < 15; tries++) {
      const dimFS = fs * 0.82;
      g.font = `600 ${fs}px ui-monospace, monospace`;
      const nameW = hasName ? g.measureText(nameStr).width : 0;
      g.font = `500 ${dimFS}px ui-monospace, monospace`;
      const wW = g.measureText(wStr).width;
      const hW = g.measureText(hStr).width;
      const margin = 2.2 * dimFS;
      const ok =
        (nameW + margin <= longEdge) &&
        (fs + margin <= shortEdge) &&
        (wW <= edgeW * 0.85) &&
        (hW <= edgeH * 0.85);
      if (ok) { insideFlags[i] = true; insideFS[i] = fs; break; }
      fs *= 0.9;
      if (fs < MIN_FONT) break;
    }
  }

  /* ---- 4b. collect inside labels (fixed obstacles) ----
     Inside names read along the box's longest visual side.  Inside
     dimension numbers stay aligned with their own edges. */

  for (let i = 0; i < placedBoxes.length; i++) {
    if (!insideFlags[i]) continue;
    const bx = placedBoxes[i];
    const nameStr = bx.name || "";
    const wStr = String(Math.round(bx.w));
    const hStr = String(Math.round(bx.h));
    const sc = boxPolysProj[i];
    const fs = insideFS[i];
    const dimFS = fs * 0.82;

    /* Inside name. */
    if (nameStr) {
      const [cxs, cys] = P(bx.x, bx.y);
      const nameDeg = nameTextAngleDeg(sc);
      const nameRad = nameDeg * Math.PI / 180;

      g.font = `600 ${fs.toFixed(1)}px ui-monospace, monospace`;
      const nameW = g.measureText(nameStr).width;
      const plateW = nameW + fs * 0.3;
      const plateH = fs * 1.24;

      allLabels.push({
        kind: "inside-name",
        rect: labelAABB(cxs, cys, plateW, plateH, nameRad),
        anchor: sc,
        movable: false,
        text: nameStr,
        fontSize: fs,
        rotationDeg: nameDeg,
        plateW, plateH,
      });
    }

    /* Inside W dimension number — near the bottom edge midpoint,
       reading along the bottom edge. */
    {
      const mx = (sc[0][0] + sc[1][0]) / 2;
      const my = (sc[0][1] + sc[1][1]) / 2;
      const ox = (sc[2][0] + sc[3][0]) / 2 - mx;
      const oy = (sc[2][1] + sc[3][1]) / 2 - my;
      const ol = Math.hypot(ox, oy) || 1;
      const off = dimFS * 0.95;
      const px = mx + ox / ol * off;
      const py = my + oy / ol * off;

      let ang = Math.atan2(sc[1][1] - sc[0][1], sc[1][0] - sc[0][0]);
      if (ang >  Math.PI / 2) ang -= Math.PI;
      if (ang < -Math.PI / 2) ang += Math.PI;

      g.font = `500 ${dimFS.toFixed(1)}px ui-monospace, monospace`;
      const tw = g.measureText(wStr).width;
      const plateW = tw + dimFS * 0.3;
      const plateH = dimFS * 1.24;

      allLabels.push({
        kind: "inside-dim",
        rect: labelAABB(px, py, plateW, plateH, ang),
        anchor: [[mx, my]],
        movable: false,
        text: wStr,
        fontSize: dimFS,
        rotationDeg: ang * 180 / Math.PI,
        plateW, plateH,
      });
    }

    /* Inside H dimension number — near the right edge midpoint,
       reading along the right edge. */
    {
      const mx = (sc[1][0] + sc[2][0]) / 2;
      const my = (sc[1][1] + sc[2][1]) / 2;
      const ox = (sc[3][0] + sc[0][0]) / 2 - mx;
      const oy = (sc[3][1] + sc[0][1]) / 2 - my;
      const ol = Math.hypot(ox, oy) || 1;
      const off = dimFS * 0.95;
      const px = mx + ox / ol * off;
      const py = my + oy / ol * off;

      let ang = Math.atan2(sc[2][1] - sc[1][1], sc[2][0] - sc[1][0]);
      if (ang >  Math.PI / 2) ang -= Math.PI;
      if (ang < -Math.PI / 2) ang += Math.PI;

      g.font = `500 ${dimFS.toFixed(1)}px ui-monospace, monospace`;
      const tw = g.measureText(hStr).width;
      const plateW = tw + dimFS * 0.3;
      const plateH = dimFS * 1.24;

      allLabels.push({
        kind: "inside-dim",
        rect: labelAABB(px, py, plateW, plateH, ang),
        anchor: [[mx, my]],
        movable: false,
        text: hStr,
        fontSize: dimFS,
        rotationDeg: ang * 180 / Math.PI,
        plateW, plateH,
      });
    }
  }

  /* ---- 4c. collect outside labels (movable) ----
     For each outside box:
       1. draw the two dimension line bodies;
       2. collect the two dimension number labels at their midpoints;
       3. place the name via the candidate scan, then collect it.

     The name reads along the box's longest visual side, so the
     candidate ring uses the AABB of the rotated name — a box with a
     vertical long edge reserves a taller slot for its name than a
     box with a horizontal one. */

  const rectsOverlap = (a, b) =>
    !(a.x1 < b.x0 || a.x0 > b.x1 || a.y1 < b.y0 || a.y0 > b.y1);

  const rectToPoly = (r) =>
    [[r.x0, r.y0], [r.x1, r.y0], [r.x1, r.y1], [r.x0, r.y1]];

  function countHits(r, skipBoxIdx) {
    let n = 0;
    for (const L of allLabels) {
      if (L.kind === "box-body" && L.rect === boxRects[skipBoxIdx]) continue;
      if (rectsOverlap(r, L.rect)) n += 1;
    }
    const p = rectToPoly(r);
    for (const face of wallFacesProj) {
      if (polygonOverlapsFace(p, face)) n += 1;
    }
    return n;
  }

  const rectInsidePoly = (r, poly) => {
    const cs = [[r.x0, r.y0], [r.x1, r.y0], [r.x1, r.y1], [r.x0, r.y1]];
    for (const c of cs) if (!pointInPolygon(c, poly)) return false;
    return true;
  };

  for (let i = 0; i < placedBoxes.length; i++) {
    if (insideFlags[i]) continue;
    const bx = placedBoxes[i];
    const hasName = !!(bx.name && bx.name.length);
    const nameStr = bx.name || "";
    const wStr = String(Math.round(bx.w));
    const hStr = String(Math.round(bx.h));
    const sc = boxPolysProj[i];

    const outFS = 5 * PNG_RES;
    const numFS = outFS * 0.9;

    const BL = sc[0], BR = sc[1], TR = sc[2];
    const cx0 = (sc[0][0] + sc[1][0] + sc[2][0] + sc[3][0]) / 4;
    const cy0 = (sc[0][1] + sc[1][1] + sc[2][1] + sc[3][1]) / 4;

    const wdx = BR[0] - BL[0], wdy = BR[1] - BL[1];
    const wlen = Math.hypot(wdx, wdy) || 1;
    let wnx = -wdy / wlen, wny = wdx / wlen;
    const wmx = (BL[0] + BR[0]) / 2, wmy = (BL[1] + BR[1]) / 2;
    if ((cx0 - wmx) * wnx + (cy0 - wmy) * wny > 0) { wnx = -wnx; wny = -wny; }

    const hdx = TR[0] - BR[0], hdy = TR[1] - BR[1];
    const hlen = Math.hypot(hdx, hdy) || 1;
    let hnx = -hdy / hlen, hny = hdx / hlen;
    const hmx = (BR[0] + TR[0]) / 2, hmy = (BR[1] + TR[1]) / 2;
    if ((cx0 - hmx) * hnx + (cy0 - hmy) * hny > 0) { hnx = -hnx; hny = -hny; }

    const off = numFS * 1.8;

    const wA = [BL[0] + wnx * off, BL[1] + wny * off];
    const wB = [BR[0] + wnx * off, BR[1] + wny * off];
    const hA = [BR[0] + hnx * off, BR[1] + hny * off];
    const hB = [TR[0] + hnx * off, TR[1] + hny * off];

    const extLW = Math.max(1, 0.35 * PNG_RES);
    const dimLW = Math.max(1, 0.6 * PNG_RES);

    g.strokeStyle = "#000000";
    g.lineWidth = extLW;
    g.beginPath();
    g.moveTo(BL[0], BL[1]); g.lineTo(wA[0], wA[1]);
    g.moveTo(BR[0], BR[1]); g.lineTo(wB[0], wB[1]);
    g.moveTo(BR[0], BR[1]); g.lineTo(hA[0], hA[1]);
    g.moveTo(TR[0], TR[1]); g.lineTo(hB[0], hB[1]);
    g.stroke();

    drawDimLineBody(g, wA, wB, numFS * 0.7, dimLW);
    drawDimLineBody(g, hA, hB, numFS * 0.7, dimLW);

    /* W and H dimension numbers as labels.  Anchored to their own
       dimension lines, reading along them. */
    {
      g.font = `500 ${numFS.toFixed(1)}px ui-monospace, monospace`;
      const wTw = g.measureText(wStr).width;
      const hTw = g.measureText(hStr).width;

      let wAng = Math.atan2(wB[1] - wA[1], wB[0] - wA[0]);
      if (wAng >  Math.PI / 2) wAng -= Math.PI;
      if (wAng < -Math.PI / 2) wAng += Math.PI;
      let hAng = Math.atan2(hB[1] - hA[1], hB[0] - hA[0]);
      if (hAng >  Math.PI / 2) hAng -= Math.PI;
      if (hAng < -Math.PI / 2) hAng += Math.PI;

      const wMid = [(wA[0] + wB[0]) / 2, (wA[1] + wB[1]) / 2];
      const hMid = [(hA[0] + hB[0]) / 2, (hA[1] + hB[1]) / 2];

      const wPW = wTw + numFS * 0.4;
      const wPH = numFS * 1.24;
      const hPW = hTw + numFS * 0.4;
      const hPH = numFS * 1.24;

      allLabels.push({
        kind: "outside-dim",
        rect: labelAABB(wMid[0], wMid[1], wPW, wPH, wAng),
        anchor: [[wA[0], wA[1]], [wB[0], wB[1]]],
        movable: true,
        text: wStr,
        fontSize: numFS,
        rotationDeg: wAng * 180 / Math.PI,
        plateW: wPW, plateH: wPH,
      });

      allLabels.push({
        kind: "outside-dim",
        rect: labelAABB(hMid[0], hMid[1], hPW, hPH, hAng),
        anchor: [[hA[0], hA[1]], [hB[0], hB[1]]],
        movable: true,
        text: hStr,
        fontSize: numFS,
        rotationDeg: hAng * 180 / Math.PI,
        plateW: hPW, plateH: hPH,
      });
    }

    /* Outside name.  The name reads along the box's longest visual
       side, so the candidate ring uses the AABB of the rotated
       name.  A box whose long edge is vertical therefore reserves a
       slot taller than the text is wide, which is what keeps the
       ring honest for tall narrow boxes. */
    if (!hasName) continue;

    const nameDeg = nameTextAngleDeg(sc);
    const nameRad = nameDeg * Math.PI / 180;
    const absC = Math.abs(Math.cos(nameRad));
    const absS = Math.abs(Math.sin(nameRad));

    g.font = `600 ${outFS.toFixed(1)}px ui-monospace, monospace`;
    const textW = g.measureText(nameStr).width;
    const textH = outFS * 1.15;
    const plateW = textW + outFS * 0.3;
    const plateH = textH;
    const aabbW = plateW * absC + plateH * absS;
    const aabbH = plateW * absS + plateH * absC;

    const minX = Math.min(sc[0][0], sc[1][0], sc[2][0], sc[3][0]);
    const maxX = Math.max(sc[0][0], sc[1][0], sc[2][0], sc[3][0]);
    const minY = Math.min(sc[0][1], sc[1][1], sc[2][1], sc[3][1]);
    const maxY = Math.max(sc[0][1], sc[1][1], sc[2][1], sc[3][1]);
    const ncx0 = (minX + maxX) / 2;
    const ncy0 = (minY + maxY) / 2;
    const gap = outFS * 0.8;

    let chosenName = null;

    const insideCand = {
      x0: ncx0 - aabbW / 2, y0: ncy0 - aabbH / 2,
      x1: ncx0 + aabbW / 2, y1: ncy0 + aabbH / 2,
    };
    if (rectInsidePoly(insideCand, sc) && countHits(insideCand, i) === 0) {
      chosenName = insideCand;
    } else {
      const cands = [
        { x0: ncx0 - aabbW / 2, y0: minY - gap - aabbH,
          x1: ncx0 + aabbW / 2, y1: minY - gap },
        { x0: ncx0 - aabbW / 2, y0: maxY + gap,
          x1: ncx0 + aabbW / 2, y1: maxY + gap + aabbH },
        { x0: maxX + gap, y0: ncy0 - aabbH / 2,
          x1: maxX + gap + aabbW, y1: ncy0 + aabbH / 2 },
        { x0: minX - gap - aabbW, y0: ncy0 - aabbH / 2,
          x1: minX - gap, y1: ncy0 + aabbH / 2 },
        { x0: ncx0 - aabbW / 2, y0: minY - 3 * gap - aabbH,
          x1: ncx0 + aabbW / 2, y1: minY - 3 * gap },
        { x0: ncx0 - aabbW / 2, y0: maxY + 3 * gap,
          x1: ncx0 + aabbW / 2, y1: maxY + 3 * gap + aabbH },
        { x0: maxX + 3 * gap, y0: ncy0 - aabbH / 2,
          x1: maxX + 3 * gap + aabbW, y1: ncy0 + aabbH / 2 },
        { x0: minX - 3 * gap - aabbW, y0: ncy0 - aabbH / 2,
          x1: minX - 3 * gap, y1: ncy0 + aabbH / 2 },
      ];

      let fallbackName = null, bestHits = Infinity;
      for (const c of cands) {
        const ccx = (c.x0 + c.x1) / 2, ccy = (c.y0 + c.y1) / 2;
        if (ccx < 0 || ccx > W || ccy < 0 || ccy > H) continue;
        const hits = countHits(c, i);
        if (hits === 0) { chosenName = c; break; }
        if (hits < bestHits) { bestHits = hits; fallbackName = c; }
      }
      if (!chosenName) chosenName = fallbackName || cands[0];
    }

    allLabels.push({
      kind: "outside-name",
      rect: chosenName,
      anchor: sc,
      movable: true,
      text: nameStr,
      fontSize: outFS,
      rotationDeg: nameDeg,
      plateW, plateH,
    });
  }

  /* ---- 4d. relax ---- */
  relaxLabels(allLabels, 4);

  /* ---- 4e. draw ---- */
  for (const L of allLabels) {
    if (L.draw === false) continue;
    const r = L.rect;
    const cx = (r.x0 + r.x1) / 2;
    const cy = (r.y0 + r.y1) / 2;

    if (L.anchor) {
      const target = nearestPointOnTarget(cx, cy, L.anchor);
      if (target) {
        const d = Math.hypot(cx - target.x, cy - target.y);
        if (d > 3) {
          drawLabelLeader(g, r, target, L.fontSize, PNG_RES);
        }
      }
    }

    const rotRad = L.rotationDeg * Math.PI / 180;

    g.save();
    g.translate(cx, cy);
    g.rotate(rotRad);

    g.fillStyle = "#ffffff";
    g.fillRect(-L.plateW / 2, -L.plateH / 2, L.plateW, L.plateH);

    g.fillStyle = "#000000";
    g.font = `${L.kind === "inside-name" || L.kind === "outside-name"
                 ? "600" : "500"
              } ${L.fontSize.toFixed(1)}px ui-monospace, monospace`;
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillText(L.text, 0, 0);

    g.restore();
  }

  cv.toBlob((blob) => {
    if (!blob) { flashStatus(T("msgPNGFailed"), "bad"); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "room_boxes.png";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    flashStatus(T("msgPNGWritten")(W, H), "ok");
  }, "image/png");
}

/* ==========================================================================
   MAIN DRAW
   ========================================================================== */

function draw() {
  const cw = window.innerWidth, ch = window.innerHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = PALETTE.paper;
  ctx.fillRect(0, 0, cw, ch);

  drawFloorView();
  drawSheetFrame(cw, ch);

  updatePanelOpacity();
}

/* ==========================================================================
   EVENT HANDLERS
   ========================================================================== */

canvas.addEventListener("mousedown", (e) => {
  /* Middle-button drag pans; the same `panning` state and mousemove
     branch handle both this and the Space-held left drag below. */
  if (e.button === 1) {
    e.preventDefault();
    panning = { sx: e.clientX, sy: e.clientY,
                tx: view.tx, ty: view.ty };
    updateCursor(mouse.sx, mouse.sy);
    return;
  }
  if (e.button !== 0) return;

  /* Space-held left drag pans too.  This sits above every other
     branch on purpose: while Space is held, a left press must never
     grab a handle, start a draw-box gesture, or move a box.  The
     user is explicitly asking to move the view. */
  if (spaceHeld) {
    e.preventDefault();
    panning = { sx: e.clientX, sy: e.clientY,
                tx: view.tx, ty: view.ty };
    updateCursor(mouse.sx, mouse.sy);
    return;
  }

  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  const [wx, wy] = s2w(sx, sy);

  /* Handle FIRST, before the draw-box branch.  This is what lets the
     user click a handle on the box they just placed in draw-box mode
     and have the click grab the handle instead of starting a new
     box.  If nothing is selected (the state right after arming the
     mode), hitTestHandle returns null and the mousedown falls
     through to the draw-box branch below, which is the desired
     behaviour. */
  const h = hitTestHandle(sx, sy);
  if (h) {
    if (drawBoxMode) setDrawBoxMode(false);
    if (h.type === "rotate")      startRotate(selectedBox, wx, wy);
    else if (h.type === "corner") startResizeCorner(selectedBox, h.index);
    else                          startResize(selectedBox, h.index);
    updateCursor(sx, sy);
    return;
  }

  /* Draw-box mode owns the whole canvas.  Existing box bodies are
     not interactive while it is armed: a left mousedown on a box
     starts a place-or-draw gesture rather than a move drag, which is
     what lets a box be drawn over an existing one. */
  if (drawBoxMode) {
    pendingPlace = {
      wx, wy,
      sx, sy,
      drag: false,
      dragWx: wx,
      dragWy: wy,
    };
    return;
  }

  /* Normal interaction: body → empty floor. */
  const idx = hitTestBox(wx, wy);
  if (idx >= 0) {
    const b = placedBoxes.splice(idx, 1)[0];
    placedBoxes.push(b);
    setSelected(b);
    drag = { index: placedBoxes.length - 1,
             ox: b.x - wx, oy: b.y - wy };
    updateCursor(sx, sy);
    return;
  }

  /* Empty floor.  Nothing to drag, nothing to place — the click
     simply deselects whatever was selected. */
  if (selectedBox) setSelected(null);
  else            draw();
});

window.addEventListener("mousemove", (e) => {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  const inside = (sx >= 0 && sy >= 0 &&
                  sx < canvas.clientWidth && sy < canvas.clientHeight);

  /* The panning branch is shared by the middle-button drag and the
     Space-held left drag.  Whichever started the pan, this is how it
     moves. */
  if (panning) {
    view.tx = panning.tx + (e.clientX - panning.sx);
    view.ty = panning.ty + (e.clientY - panning.sy);
    draw(); return;
  }

  if (inside) { mouse.sx = sx; mouse.sy = sy; mouse.inside = true; }
  else        { mouse.inside = false; }

  if (handleDrag) {
    const [wx, wy] = s2w(sx, sy);
    if (handleDrag.type === "rotate") {
      updateRotate(wx, wy, e.shiftKey);
    } else if (handleDrag.type === "resize-corner") {
      updateResizeCorner(wx, wy);
    } else {
      updateResize(wx, wy);
    }
    updateCursor(sx, sy);
    draw(); return;
  }

  if (drag) {
    const [wx, wy] = s2w(sx, sy);
    const b = placedBoxes[drag.index];
    moveBoxSafely(b, wx + drag.ox, wy + drag.oy);
    updateCursor(sx, sy);
    draw(); return;
  }

  /* Place-or-draw gesture.  Flip into drag mode the first time the
     cursor crosses the threshold; from then on, keep tracking the
     cursor's world position.  Below the threshold, nothing happens —
     the state stays in click mode. */
  if (pendingPlace) {
    if (!pendingPlace.drag) {
      const dx = sx - pendingPlace.sx, dy = sy - pendingPlace.sy;
      if (Math.hypot(dx, dy) > DRAG_CANCEL) {
        pendingPlace.drag = true;
      }
    }
    if (pendingPlace.drag) {
      const [wx, wy] = s2w(sx, sy);
      pendingPlace.dragWx = wx;
      pendingPlace.dragWy = wy;
    }
  }

  /* Hover detection is skipped in draw-box mode: the cursor is not
     "hovering" a box, it is over a potential new box.  This is what
     lets the ghost follow the cursor even when the cursor is on top
     of an existing box. */
  if (!drawBoxMode && inside) {
    const [wx, wy] = s2w(sx, sy);
    hoveredBox = null;
    const idx = hitTestBox(wx, wy);
    if (idx >= 0) hoveredBox = placedBoxes[idx];
  } else {
    hoveredBox = null;
  }

  if (inside && !panelHovered && !drag && !handleDrag && !panning) {
    panelLastActivity = performance.now();
  }

  updateCursor(sx, sy);
  draw();
});

window.addEventListener("mouseup", (e) => {
  /* The panning check runs first and is not gated on button number:
     a middle-button drag and a Space-held left drag both end here,
     and both must clear the state.  Before this check was unified,
     the Space-held pan (button 0) fell through to the handleDrag /
     drag / pendingPlace branches — none of which were ever set — and
     left `panning` stuck. */
  if (panning) {
    panning = null;
    updateCursor(mouse.sx, mouse.sy);
    return;
  }
  if (e.button !== 0) return;

  if (handleDrag) {
    handleDrag = null;
    syncSelectionInputs();
    updateCursor(mouse.sx, mouse.sy);
    draw(); return;
  }
  if (drag) {
    drag = null;
    syncSelectionInputs();
    updateCursor(mouse.sx, mouse.sy);
    draw(); return;
  }

  if (pendingPlace) {
    const p = pendingPlace;
    pendingPlace = null;

    /* Two commit paths: drag-draw (an axis-aligned rectangle whose
       two corners are the down point and the current cursor world
       position) and click-place (a preset W×H×Rot at the down point).
       A drag whose rectangle collapses to below MIN_BOX_MM in either
       axis is treated as a click — a jittery release is still a
       release. */
    let w, h, cx, cy, rot;

    if (p.drag) {
      const x0 = Math.min(p.wx, p.dragWx);
      const x1 = Math.max(p.wx, p.dragWx);
      const y0 = Math.min(p.wy, p.dragWy);
      const y1 = Math.max(p.wy, p.dragWy);
      const dw = x1 - x0;
      const dh = y1 - y0;

      if (dw < MIN_BOX_MM || dh < MIN_BOX_MM) {
        /* Degenerate drag — fall through to click-place. */
        const params = getBoxParams();
        w = params.w; h = params.h; rot = params.rot;
        cx = p.wx; cy = p.wy;
      } else {
        w = dw; h = dh; rot = 0;
        cx = (x0 + x1) / 2;
        cy = (y0 + y1) / 2;
      }
    } else {
      const params = getBoxParams();
      w = params.w; h = params.h; rot = params.rot;
      cx = p.wx; cy = p.wy;
    }

    if (boxOverlapsWalls(cx, cy, w, h, rot)) {
      flashStatus(T("msgPlaceCollision"), "bad");
    } else {
      boxCounter += 1;
      const b = { x: cx, y: cy, w, h, rot,
                  name: `Box ${boxCounter}` };
      placedBoxes.push(b);
      setSelected(b);
      flashStatus(T("msgPlacedOk"), "ok");
    }
    draw();
  }
});

canvas.addEventListener("dblclick", (e) => {
  if (drawBoxMode) return;
  if (spaceHeld)   return;    // Space is a pan gesture, not a select
  const rect = canvas.getBoundingClientRect();
  const [wx, wy] = s2w(e.clientX - rect.left, e.clientY - rect.top);
  const idx = hitTestBox(wx, wy);
  if (idx >= 0) {
    setSelected(placedBoxes[idx]);
    const ni = document.getElementById("boxName");
    if (ni) { ni.focus(); ni.select(); }
  }
});

canvas.addEventListener("contextmenu", (e) => {
  e.preventDefault();
  if (drawBoxMode) return;
  if (spaceHeld)   return;    // Space is a pan gesture, not a delete
  const rect = canvas.getBoundingClientRect();
  const [wx, wy] = s2w(e.clientX - rect.left, e.clientY - rect.top);
  const idx = hitTestBox(wx, wy);
  if (idx >= 0) {
    const wasSel = placedBoxes[idx] === selectedBox;
    if (placedBoxes[idx] === hoveredBox) hoveredBox = null;
    placedBoxes.splice(idx, 1);
    if (wasSel) setSelected(null);
    draw();
  }
});

canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  const factor = Math.exp(-e.deltaY * 0.0015);
  zoomAt(sx, sy, factor);
  draw();
}, { passive: false });

/* ==========================================================================
   KEYBOARD
   ========================================================================== */

window.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;

  /* Space arms pan mode.  e.code rather than e.key: with Space,
     e.key is " " and that is fiddly to compare; e.code is "Space"
     and unambiguous.  preventDefault is required — a focused button
     activates on Space, and would fire its click even while the
     user is holding Space to pan. */
  if (e.code === "Space" && !spaceHeld) {
    spaceHeld = true;
    if (mouse.inside && !panning) canvas.style.cursor = "grab";
    e.preventDefault();
    return;
  }

  if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) {
    e.preventDefault();
    doSave(true);
    return;
  }

  /* Escape unwinds in priority order: an armed draw mode is the
     outermost thing on the interaction stack, so it is what
     Escape disarms first; if no mode is armed, Escape clears the
     selection.  (The help popover installs its own capture-phase
     Escape listener that fires before this one — see the module
     docstring.) */
  if (e.key === "Escape") {
    if (drawBoxMode) {
      setDrawBoxMode(false);
    } else {
      setSelected(null);
    }
    return;
  }

  if (drawBoxMode) return;   // the remaining shortcuts are mode-off only

  if (e.key === "r" || e.key === "R") {
    e.preventDefault();
    const deg = e.shiftKey ? 15 : 90;
    rotateSelection(deg);
    draw();
  } else if (e.key === "Delete" || e.key === "Backspace") {
    if (selectedBox) {
      const idx = placedBoxes.indexOf(selectedBox);
      if (idx >= 0) placedBoxes.splice(idx, 1);
      setSelected(null);
    }
  } else if (e.key === "0") {
    fitView();
    draw();
  }
});

window.addEventListener("keyup", (e) => {
  if (e.code === "Space") {
    spaceHeld = false;
    /* If a pan is in flight, leave it in flight: the mouseup that
       ends it will also refresh the cursor.  Otherwise refresh the
       cursor now, so the open-hand icon disappears the moment Space
       is released. */
    if (!panning) updateCursor(mouse.sx, mouse.sy);
  }
});

window.addEventListener("blur", () => {
  /* A Space pressed while the window had focus, followed by a click
     on another window, would otherwise leave `spaceHeld` stuck on
     for the next focus.  Reset both this and any in-flight pan. */
  spaceHeld = false;
  if (panning) {
    panning = null;
    updateCursor(mouse.sx, mouse.sy);
  }
});

/* ==========================================================================
   CURSOR + STATUS
   ========================================================================== */

function updateCursor(sx, sy) {
  /* Pan state first: it outranks every other cursor.  While a pan is
     in flight, the closed-hand cursor; while Space is merely held,
     the open hand.  Only after both of those, the mode / hover /
     handle cursors. */
  if (panning)                       { canvas.style.cursor = "grabbing"; return; }
  if (handleDrag || drag)            { canvas.style.cursor = "grabbing"; return; }
  if (spaceHeld)                     { canvas.style.cursor = "grab";     return; }
  if (drawBoxMode)                   { canvas.style.cursor = "crosshair"; return; }

  const h = hitTestHandle(sx, sy);
  if (h) {
    if (h.type === "rotate")      canvas.style.cursor = "grab";
    else if (h.type === "corner") canvas.style.cursor = "nwse-resize";
    else                          canvas.style.cursor = "grab";
    return;
  }

  const [wx, wy] = s2w(sx, sy);
  if (hitTestBox(wx, wy) >= 0)       { canvas.style.cursor = "move";     return; }
  canvas.style.cursor = "crosshair";
}

function updateStatus(validFlags) {
  const el = document.getElementById("status");
  if (!el || statusTimer) return;

  if (panning) {
    el.textContent = T("stPanningSpace");
    el.className = "";
    return;
  }
  if (handleDrag) {
    const b = handleDrag.b;
    const verb = handleDrag.type === "rotate"        ? T("stVerbRotating")
               : handleDrag.type === "resize-corner" ? T("stVerbResizingBoth")
               :                                       T("stVerbResizing");
    el.textContent = T("stHandleDrag")(
      verb,
      b.x.toFixed(0), b.y.toFixed(0),
      b.w.toFixed(0), b.h.toFixed(0),
      b.rot.toFixed(0));
    el.className = "";
    return;
  }
  if (drag) {
    const b = placedBoxes[drag.index];
    const inv = boxIsInvalid(b);
    el.textContent = T("stDragging")(
      inv,
      b.x.toFixed(0), b.y.toFixed(0), b.rot.toFixed(0));
    el.className = inv ? "warn" : "";
    return;
  }
  if (pendingPlace && pendingPlace.drag) {
    const x0 = Math.min(pendingPlace.wx, pendingPlace.dragWx);
    const x1 = Math.max(pendingPlace.wx, pendingPlace.dragWx);
    const y0 = Math.min(pendingPlace.wy, pendingPlace.dragWy);
    const y1 = Math.max(pendingPlace.wy, pendingPlace.dragWy);
    const dw = x1 - x0, dh = y1 - y0;
    const inv = boxOverlapsWalls((x0 + x1) / 2, (y0 + y1) / 2, dw, dh, 0);
    el.textContent = T("stDrawing")(inv, dw.toFixed(0), dh.toFixed(0));
    el.className = inv ? "warn" : "";
    return;
  }
  if (!mouse.inside) { el.textContent = ""; el.className = ""; return; }

  /* Space held (but no pan in flight): the user is one press away
     from panning.  Say so. */
  if (spaceHeld) {
    el.textContent = T("stSpaceHeld");
    el.className = "";
    return;
  }

  /* Draw mode: the cursor is a potential new box, not a hovering
     cursor.  Report the box that a click would place. */
  if (drawBoxMode) {
    const [wx, wy] = s2w(mouse.sx, mouse.sy);
    const { w, h, rot } = getBoxParams();
    const bad = boxOverlapsWalls(wx, wy, w, h, rot);
    el.textContent = T("stDrawPreview")(
      wx.toFixed(0), wy.toFixed(0),
      w.toFixed(0), h.toFixed(0), rot.toFixed(0), bad);
    el.className = bad ? "bad" : "ok";
    return;
  }

  if (hoveredBox) {
    const b = hoveredBox;
    const inv = boxIsInvalid(b);
    el.textContent = T("stHover")(
      inv,
      b.name || T("boxUnnamed"),
      b.x.toFixed(0), b.y.toFixed(0), b.rot.toFixed(0));
    el.className = inv ? "warn" : "";
    return;
  }

  const [wx, wy] = s2w(mouse.sx, mouse.sy);
  el.textContent = T("stCursor")(wx.toFixed(0), wy.toFixed(0));
  el.className = "";
}
