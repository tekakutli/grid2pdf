      if (focusSavedU) {
        for (let i = 0; i < WALL.segments.length; i++) {
          if (isSegHidden(i)) continue;
          const s = WALL.segments[i];
          if (g.pos < segBottom(s) - 0.5) continue;
          if (g.pos > segTop(s)    + 0.5) continue;
          const [gx0, gy] = w2sWall(s.u0, g.pos);
          const [gx1, _]  = w2sWall(s.u1, g.pos);
          ctx.beginPath();
          ctx.moveTo(gx0, gy); ctx.lineTo(gx1, gy);
          ctx.stroke();
        }
      } else {
        const [gx0, gy] = w2sWall(0, g.pos);
        const [gx1, _]  = w2sWall(WALL.totalU, g.pos);
        ctx.beginPath();
        ctx.moveTo(gx0, gy); ctx.lineTo(gx1, gy);
        ctx.stroke();
      }
    }
  }
  ctx.setLineDash([]);

  /* --- Pill labels ------------------------------------------------- */
  /* A pill is drawn only where the corresponding line actually exists.
     A vertical line whose original u sits on a hidden segment has no
     visible surface to label, so it is skipped.  A horizontal line's
     pill stays on the left margin at its height, which remains
     meaningful during focus — the level exists, the visible walls
     simply clip where it gets drawn. */
  for (const g of state.wallGrids) {
    const active = (state.dragGrid && state.dragGrid.grid === g);
    const sibs = state.wallGrids.filter(x => x.type === g.type)
                                .sort((a, b) => a.pos - b.pos);
    const idx = sibs.indexOf(g);
    const label = g.type === "v" ? "u" + (idx + 1) : "v" + (idx + 1);

    if (g.type === "v") {
      let uForPill = g.pos;
      if (focusSavedU) {
        const segIdx = _segAtOriginalU(g.pos);
        if (segIdx < 0) continue;
        const saved = focusSavedU.get(segIdx);
        const cur   = WALL.segments[segIdx];
        uForPill = cur.u0 + (g.pos - saved.u0);
      }
      const [gx] = w2sWall(uForPill, 0);
      _drawGridPill(gx, layout.wallY + 18, label, active);
    } else {
      const [, gy] = w2sWall(0, g.pos);
      if (gy < layout.wallY - 20)                  continue;
      if (gy > layout.wallY + layout.wallH + 20)   continue;
      _drawGridPill(SHEET_MARGIN + 24, gy, label, active);
    }
  }
}


function drawWallView() {
  const cw = window.innerWidth;
  ctx.fillStyle = PALETTE.paperTint;
  ctx.fillRect(0, layout.wallY, cw, layout.wallH);

  const [x0, y0] = w2sWall(0, 0);
  const [x1, y1] = w2sWall(WALL.totalU, 0);
  const [x2, y2] = w2sWall(WALL.totalU, WALL_HEIGHT);
  const [x3, y3] = w2sWall(0, WALL_HEIGHT);
  ctx.beginPath();
  ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
  ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.closePath();
  ctx.fillStyle = _screenPat("voidHatch");
  ctx.fill();
  ctx.strokeStyle = PALETTE.ink;
  ctx.lineWidth = 1.6;
  ctx.stroke();

  for (let i = 0; i < WALL.segments.length; i++) {
    if (isSegHidden(i)) continue;
    const s = WALL.segments[i];
    const [sx0, syHi] = w2sWall(s.u0, s.z_hi);
    const [sx1, syLo] = w2sWall(s.u1, s.z_lo);
    ctx.fillStyle = PALETTE.paper;
    ctx.fillRect(sx0, syHi, sx1 - sx0, syLo - syHi);
  }

  drawHoverStripHatch();

  for (let i = 0; i < WALL.segments.length; i++) {
    if (isSegHidden(i)) continue;
    const s = WALL.segments[i];
    const [sx0, syTop] = w2sWall(s.u0, 0);
    const [sx1, syBot] = w2sWall(s.u0, 0);
    ctx.strokeStyle = PALETTE.inkFaint;
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(sx0, syTop); ctx.lineTo(sx1, syBot);
    ctx.moveTo(sx1, syTop); ctx.lineTo(sx1, syBot);
    ctx.stroke();
  }
  for (let i = 0; i < WALL.segments.length; i++) {
    if (isSegHidden(i)) continue;
    const s = WALL.segments[i];
    const [sx0, sy0] = w2sWall(s.u1, 0);
    const [sx1, sy1] = w2sWall(s.u1, WALL_HEIGHT);
    ctx.beginPath(); ctx.moveTo(sx0, sy0); ctx.lineTo(sx1, sy1);
    ctx.strokeStyle = PALETTE.inkFaint;
    ctx.lineWidth = 0.8; ctx.stroke();
  }

  ctx.save();
  ctx.setLineDash([4, 3]);
  ctx.strokeStyle = PALETTE.step;
  ctx.lineWidth = 1.4;
  for (let i = 0; i < WALL.segments.length; i++) {
    if (isSegHidden(i)) continue;
    const s = WALL.segments[i];
    if (!isStepFace(s)) continue;
    const t = segTop(s);
    const [sx0, sy0] = w2sWall(s.u0, t);
    const [sx1, sy1] = w2sWall(s.u1, t);
    ctx.beginPath(); ctx.moveTo(sx0, sy0); ctx.lineTo(sx1, sy1);
    ctx.stroke();
  }
  ctx.setLineDash([]); ctx.restore();

  if (!focusSavedU) drawWallRulers();

  drawWallGridLines();

  drawStepBridgeBars();

  for (const c of state.wallCables) drawCable(c, "wall");
  drawVertexBalloons("wall");
  drawDimensionChain("wall");
  drawNotes("wall");
  drawDrawingPreview("wall");
  drawCrossMarkersFromFloorCables();

  drawStepDimensions();

  if (focusSavedU && focusSeg >= 0) {
    const seg = WALL.segments[focusSeg];
    const tag = (seg && seg.tag) ? seg.tag : ("segment " + (focusSeg + 1));
    ctx.font = "700 11px " + FONT_MONO;
    ctx.fillStyle = PALETTE.ink;
    ctx.textAlign = "left"; ctx.textBaseline = "bottom";
    ctx.fillText("FOCUS  ·  " + tag + "  ·  neighbours shown adjacent",
                 12, layout.wallY + 30);
  }

  if (mouse.inside && mouse.view === "floor") {
    const [wx, wy] = s2wFloor(mouse.sx, mouse.sy);
    const proj = projectOntoWalls(wx, wy);

    /* Which wall is the cursor's nearest neighbour?  Ties are won by
       the first entry in `proj`, which projectOntoWalls returns in
       segment-index order — deterministic enough that the highlight
       does not flicker between two walls at the same distance. */
    let nearestIdx = -1;
    let nearestDist = Infinity;
    for (let i = 0; i < proj.length; i++) {
      if (proj[i].dist < nearestDist) {
        nearestDist = proj[i].dist;
        nearestIdx  = i;
      }
    }

    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.font = "600 9px " + FONT_MONO;

    for (let i = 0; i < proj.length; i++) {
      const p = proj[i];
      const [sx, sy] = w2sWall(p.u, 0);
      const isNearest = (i === nearestIdx);

      const ink = isNearest ? PALETTE.highlight : PALETTE.transit;

      /* Paper halo, then the dot.  Every qualifying wall gets the
         same base marker; the nearest one is drawn a touch larger
         and in the highlight accent. */
      ctx.beginPath();
      ctx.arc(sx, sy, isNearest ? 5.5 : 4.5, 0, Math.PI * 2);
      ctx.fillStyle = PALETTE.paper;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(sx, sy, isNearest ? 4 : 3, 0, Math.PI * 2);
      ctx.fillStyle = ink;
      ctx.fill();

      /* Extra outer ring on the nearest one — the "this is the one
         you're actually closest to" cue, the same idiom the ruler
         uses for its locked second endpoint. */
      if (isNearest) {
        ctx.beginPath();
        ctx.arc(sx, sy, 8.5, 0, Math.PI * 2);
        ctx.strokeStyle = PALETTE.highlight;
        ctx.lineWidth = 1.6;
        ctx.setLineDash([3, 2]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      /* Distance label below the dot.  Paper-backed so it stays
         legible over the void hatch and the arrow runway; mono so
         it reads as a measurement; inked in the same colour as the
         dot it belongs to. */
      const label = fmtCm(p.dist) + " cm";
      const tw = ctx.measureText(label).width;
      const padX = 3;
      const labelY = sy + (isNearest ? 9 : 6);
      ctx.fillStyle = PALETTE.paper;
      ctx.fillRect(sx - tw / 2 - padX, labelY, tw + 2 * padX, 12);
      ctx.fillStyle = ink;
      ctx.fillText(label, sx, labelY + 2);
    }

    ctx.restore();
  }
}

function drawWallRulers() {
  if (!WALL.footprints.length) return;

  const FS = 10;
  const ROW_H = DIM_ROW_H;
  const PAD = 8;
  const MAX_ROWS = 8;
  const stripTopY = viewWall.stripTopY;

  ctx.font = `600 ${FS}px ${FONT_MONO}`;

  const items = [];
  for (const fp of WALL.footprints) {
    const [xa] = w2sWall(fp.u0, 0);
    const [xb] = w2sWall(fp.u1, 0);
    const lo = Math.min(xa, xb), hi = Math.max(xa, xb);
    const text = fmtCm(fp.len);
    const textW = ctx.measureText(text).width;
    items.push({
      xLo: lo, xHi: hi, xMid: (lo + hi) / 2,
      text, textW, row: 0, rowY: 0,
    });
  }
  items.sort((a, b) => a.xLo - b.xLo);

  const rowEnds = new Array(MAX_ROWS).fill(-Infinity);
  for (const it of items) {
    let row = 0;
    for (; row < MAX_ROWS; row++) {
      const pillLo = it.xMid - it.textW / 2 - 6;
      if (pillLo > rowEnds[row] + PAD) break;
    }
    if (row === MAX_ROWS) row = MAX_ROWS - 1;
    it.row = row;
    rowEnds[row] = Math.max(rowEnds[row], it.xHi + PAD);
  }
  for (const it of items) {
    it.rowY = stripTopY - (it.row + 1) * ROW_H + ROW_H * 0.4;
  }

  ctx.save();
  ctx.strokeStyle = PALETTE.ink;
  ctx.lineWidth = 0.7;

  for (const it of items) {
    const dimY = it.rowY;
    ctx.beginPath();
    ctx.moveTo(it.xLo, stripTopY);
    ctx.lineTo(it.xLo, dimY - DIM_EXT_OVER);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(it.xHi, stripTopY);
    ctx.lineTo(it.xHi, dimY - DIM_EXT_OVER);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(it.xLo, dimY); ctx.lineTo(it.xHi, dimY);
    ctx.stroke();

    const T = DIM_TICK_LEN;
    ctx.beginPath();
    ctx.moveTo(it.xLo - T, dimY + T); ctx.lineTo(it.xLo + T, dimY - T);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(it.xHi - T, dimY + T); ctx.lineTo(it.xHi + T, dimY - T);
    ctx.stroke();
  }
  ctx.restore();

  ctx.save();
  ctx.font = `600 ${FS}px ${FONT_MONO}`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (const it of items) {
    const dimY = it.rowY;
    const pillW = it.textW + 8;
    const pillH = 12;
    ctx.fillStyle = PALETTE.paper;
    ctx.fillRect(it.xMid - pillW / 2, dimY - pillH / 2, pillW, pillH);
    ctx.fillStyle = PALETTE.ink;
    ctx.fillText(it.text, it.xMid, dimY + 0.5);
  }
  ctx.restore();
}

/* ==========================================================================
   HOVER ROUTE HIGHLIGHTS
   ==========================================================================
   Three markers, each drawn in its own layer so the cables pass over
   the highlight rather than the reverse:

     crossHatch on the strip's wall under the cursor
     ink bar on the plan under the cursor
     tag callout next to the cursor

   The crosshatch and the bar are drawn inside drawWallView /
   drawFloorView, before the cables.  The callout is drawn last, on
   top of everything, so it never disappears under a cable. */

function drawHoverStripHatch() {
  const hl = state.hoveredRoute;
  if (!hl) return;
  const seg = WALL.segments[hl.segIdx];
  if (!seg || isSegHidden(hl.segIdx)) return;

  const [x0, yTop] = w2sWall(seg.u0, segTop(seg));
  const [x1, yBot] = w2sWall(seg.u1, segBottom(seg));
  ctx.save();
  ctx.fillStyle = _screenPat("crossHatch");
  ctx.fillRect(x0, yTop, x1 - x0, yBot - yTop);
  ctx.restore();
}

function drawHoverPlanBar() {
  const hl = state.hoveredRoute;
  if (!hl) return;
  const seg = WALL.segments[hl.segIdx];
  if (!seg || isSegHidden(hl.segIdx)) return;

  const [ax, ay] = w2sFloor(seg.a[0], seg.a[1]);
  const [bx, by] = w2sFloor(seg.b[0], seg.b[1]);
  ctx.save();
  ctx.lineCap = "round";
  ctx.strokeStyle = PALETTE.paper; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
  ctx.stroke();
  ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 5.5;
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
  ctx.stroke();
  ctx.restore();
}

function drawHoverCallout() {
  const hl = state.hoveredRoute;
  if (!hl || drawing) return;
  const seg = WALL.segments[hl.segIdx];
  if (!seg || isSegHidden(hl.segIdx)) return;
  if (mouse.view === null) return;

  const tag = (seg.tag) ? seg.tag : ("seg " + (hl.segIdx + 1));
  const text = tag + "  ·  " + fmtCm(seg.len) + " cm"
             + "  ·  h " + fmtCm(segBottom(seg)) + "–" + fmtCm(segTop(seg));

  let mx, my;
  if (mouse.view === "floor") {
    [mx, my] = w2sFloor((seg.a[0] + seg.b[0]) / 2,
                        (seg.a[1] + seg.b[1]) / 2);
  } else {
    [mx, my] = w2sWall((seg.u0 + seg.u1) / 2,
                       (segBottom(seg) + segTop(seg)) / 2);
  }

  ctx.save();
  ctx.font = "600 11px " + FONT_MONO;
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  const tw = ctx.measureText(text).width;
  const pw = tw + 16;
  const ph = 20;
  let px = mx + 22;
  let py = my - 30;
  const cw = window.innerWidth;
  if (px + pw > cw - SHEET_MARGIN - 8) px = mx - 22 - pw;
  if (py - ph / 2 < SHEET_MARGIN + 8) py = SHEET_MARGIN + 8 + ph / 2;

  ctx.fillStyle = PALETTE.paper;
  ctx.fillRect(px, py - ph / 2, pw, ph);
  ctx.strokeStyle = PALETTE.ink;
  ctx.lineWidth = 0.9;
  ctx.strokeRect(px + 0.4, py - ph / 2 + 0.4, pw - 0.8, ph - 0.8);

  ctx.fillStyle = PALETTE.ink;
  ctx.fillText(text, px + 8, py + 0.5);
  ctx.restore();
}

/* ==========================================================================
   SHEET FRAME, MARGIN TICKS, REGISTRATION MARKS
   ========================================================================== */

function drawSheetFrame(cw, ch) {
  ctx.save();
  ctx.strokeStyle = PALETTE.ink;
  ctx.lineWidth = 0.8;
  ctx.strokeRect(SHEET_MARGIN + 0.4, SHEET_MARGIN + 0.4,
                 cw - 2 * SHEET_MARGIN - 0.8,
                 ch - 2 * SHEET_MARGIN - 0.8);
  ctx.restore();
  drawMarginTicks(cw, ch);
  drawRegistrationMark(SHEET_MARGIN + 4, SHEET_MARGIN + 4);
  drawRegistrationMark(cw - SHEET_MARGIN - 4, SHEET_MARGIN + 4);
  drawRegistrationMark(SHEET_MARGIN + 4, ch - SHEET_MARGIN - 4);
  drawRegistrationMark(cw - SHEET_MARGIN - 4, ch - SHEET_MARGIN - 4);
}

function drawRegistrationMark(x, y) {
  ctx.save();
  ctx.strokeStyle = PALETTE.inkFaint;
  ctx.lineWidth = 0.8;
  const r = REG_CROSS_R;
  ctx.beginPath();
  ctx.moveTo(x - r, y); ctx.lineTo(x + r, y);
  ctx.moveTo(x, y - r); ctx.lineTo(x, y + r);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x, y, r * 0.55, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function drawMarginTicks(cw, ch) {
  const b = GEOMETRY.bounds;

  const pxPerMmX = viewFloor.scale;
  let stepX = 1000;
  while (stepX * pxPerMmX < 40) stepX *= 2;

  ctx.save();
  ctx.font = "600 9px " + FONT_MONO;
  ctx.fillStyle = PALETTE.inkFaint;
  ctx.strokeStyle = PALETTE.inkFaint;
  ctx.lineWidth = 0.8;

  ctx.textAlign = "center";
  ctx.textBaseline = "bottom";
  const x0 = Math.ceil(b.minX / stepX) * stepX;
  for (let wx = x0; wx <= b.maxX; wx += stepX) {
    const [sx] = w2sFloor(wx, 0);
    if (sx < SHEET_MARGIN + 16 || sx > cw - SHEET_MARGIN - 16) continue;
    /* Skip ticks under the scale bar (top-right of the plan band). */
    if (sx > cw - SHEET_MARGIN - 260 && sx < cw - SHEET_MARGIN - 10) continue;
    const y = SHEET_MARGIN;
    ctx.beginPath();
    ctx.moveTo(sx, y); ctx.lineTo(sx, y + MARGIN_TICK_LEN);
    ctx.stroke();
    ctx.fillText(String(Math.round(wx / 100)), sx, y + MARGIN_TICK_LEN + 1);
  }

  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  const pyPerMmY = viewFloor.scale;
  let stepY = 1000;
  while (stepY * pyPerMmY < 40) stepY *= 2;
  const y0 = Math.ceil(b.minY / stepY) * stepY;
  for (let wy = y0; wy <= b.maxY; wy += stepY) {
    const [, sy] = w2sFloor(0, wy);
    if (sy < SHEET_MARGIN + 16) continue;
    if (sy > layout.dividerY - 12) continue;
    const x = SHEET_MARGIN;
    ctx.beginPath();
    ctx.moveTo(x, sy); ctx.lineTo(x + MARGIN_TICK_LEN, sy);
    ctx.stroke();
    ctx.fillText(String(Math.round(wy / 100)),
                 x + MARGIN_TICK_LEN + 1, sy);
  }
  ctx.restore();
}

/* ==========================================================================
   SECTION RIBBON
   ==========================================================================
   The ribbon at the divider names the two bands and shows their
   current zoom, if it is not 1:1.  It is drawn twice — once for the
   plan, once for the wall — so the two captions never overlap even
   when the canvas is narrow. */

function drawSectionRibbon(cw) {
  const yMid = layout.dividerY + 1;
  const bandH = RIBBON_BAND_H;
  const yTop = yMid - bandH / 2;
  const pad = 14;

  ctx.save();
  ctx.font = "600 10px " + FONT_MONO;
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";

  const leftText  = "PLAN  @  " + Math.round(GEOMETRY.cutZ) + " mm"
                  + (Math.abs(viewFloor.zoom - 1) > 0.02
                     ? "  ·  " + Math.round(viewFloor.zoom * 100) + " %" : "");
  const leftW     = ctx.measureText(leftText).width;
  const rightText = "UNFOLDED WALL  ·  PERIMETER  " +
                    Math.round(WALL.totalU) + " mm"
                  + (Math.abs(viewWall.zoom - 1) > 0.02
                     ? "  ·  " + Math.round(viewWall.zoom * 100) + " %" : "");
  const rightW    = ctx.measureText(rightText).width;

  ctx.fillStyle = PALETTE.paper;
  ctx.fillRect(0, yTop, leftW + 2 * pad, bandH);

  const rx = cw - rightW - 2 * pad;
  ctx.fillRect(rx, yTop, rightW + 2 * pad, bandH);

  ctx.fillStyle = PALETTE.ink;
  ctx.fillText(leftText, pad, yMid + 0.5);
  ctx.fillText(rightText, rx + pad, yMid + 0.5);

  ctx.restore();
}

/* ==========================================================================
   NOTES / REDLINES
   ==========================================================================
   Session-scoped notes anchored to a world point in either view.
   Each note is a paper-backed label hung off a diagonal leader at
   -45°, with a small ring at the anchor.  Text is truncated to a
   maximum width; a note that outgrows its box keeps its head and
   loses its tail with an ellipsis. */

const NOTE_MAX_W = 220;

function drawNotes(view) {
  if (!NOTES.length) return;
  ctx.save();
  ctx.font = "600 11px " + FONT_MONO;
  ctx.textBaseline = "middle";

  for (const note of NOTES) {
    if (note.space !== view) continue;
    let sx, sy;
    if (view === "floor") {
      [sx, sy] = w2sFloor(note.x, note.y);
    } else {
      [sx, sy] = w2sWall(note.u, note.v);
    }

    let text = note.text;
    while (ctx.measureText(text).width + 16 > NOTE_MAX_W &&
           text.length > 6) {
      text = text.slice(0, -2);
    }
    if (text !== note.text) text = text + "…";

    const tw = ctx.measureText(text).width;
    const pw = tw + 14;
    const ph = 18;
    const angle = -Math.PI / 4;
    const dist = 30;
    const px = sx + Math.cos(angle) * dist;
    const py = sy + Math.sin(angle) * dist;

    ctx.strokeStyle = PALETTE.ink;
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(px, py);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(sx, sy, 3.6, 0, Math.PI * 2);
    ctx.fillStyle = PALETTE.paper; ctx.fill();
    ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 1.2; ctx.stroke();

    ctx.fillStyle = PALETTE.paper;
    ctx.fillRect(px - 4, py - ph / 2, pw, ph);
    ctx.strokeStyle = PALETTE.ink;
    ctx.lineWidth = 0.9;
    ctx.strokeRect(px - 4 + 0.4, py - ph / 2 + 0.4, pw - 0.8, ph - 0.8);

    ctx.fillStyle = PALETTE.ink;
    ctx.textAlign = "left";
    ctx.fillText(text, px + 3, py + 0.5);
  }
  ctx.restore();
}

function addNote() {
  if (!mouse.inside || !mouse.view) return;
  const text = prompt("Note:");
  if (!text || !text.trim()) return;
  if (mouse.view === "floor") {
    const [wx, wy] = s2wFloor(mouse.sx, mouse.sy);
    NOTES.push({ space: "floor", x: wx, y: wy, text: text.trim() });
  } else {
    const [u, v] = s2wWall(mouse.sx, mouse.sy);
    NOTES.push({ space: "wall", u, v, text: text.trim() });
  }
  draw();
}

/* ==========================================================================
   DIMENSION CHAIN ON SELECTION
   ==========================================================================
   When a wall-edge vertex is selected, a short dimension chain runs
   from it to each of its neighbours on the same segment.  The chain
   is offset eighteen screen px perpendicular to the segment, with
   forty-five-degree tick marks and a value pill at each midpoint. */

function drawDimensionChain(view) {
  const sv = state.selectedVertex;
  if (!sv) return;
  const sel = anchors.get(sv.cable.anchorIds[sv.index]);
  if (!sel || sel.space !== "wall-edge") return;

  const sibs = [];
  for (const a of anchors.values()) {
    if (a.space !== "wall-edge") continue;
    if (a.segIdx !== sel.segIdx) continue;
    sibs.push(a);
  }
  if (sibs.length < 2) return;
  sibs.sort((a, b) => a.t - b.t);
  const idx = sibs.findIndex(a => a.id === sel.id);
  if (idx < 0) return;
  const neighbours = [];
  if (idx > 0) neighbours.push(sibs[idx - 1]);
  if (idx < sibs.length - 1) neighbours.push(sibs[idx + 1]);
  if (!neighbours.length) return;

  const seg = WALL.segments[sel.segIdx];
  if (!seg) return;

  const toScreen = (view === "floor") ? w2sFloor : w2sWall;
  const project  = (view === "floor") ? anchorPlan : anchorWall;

  for (const nb of neighbours) {
    const ps = project(sel), pn = project(nb);
    if (!ps || !pn) continue;
    const [sx0, sy0] = toScreen(ps[0], ps[1]);
    const [sx1, sy1] = toScreen(pn[0], pn[1]);

    const dx = sx1 - sx0, dy = sy1 - sy0;
    const len = Math.hypot(dx, dy);
    if (len < 4) continue;
    const nx = -dy / len, ny = dx / len;
    const off = 18;
    const ox = nx * off, oy = ny * off;

    const qx0 = sx0 + ox, qy0 = sy0 + oy;
    const qx1 = sx1 + ox, qy1 = sy1 + oy;

    ctx.save();
    ctx.strokeStyle = PALETTE.ink;
    ctx.lineWidth = 0.7;

    ctx.beginPath();
    ctx.moveTo(sx0, sy0); ctx.lineTo(qx0, qy0);
    ctx.moveTo(sx1, sy1); ctx.lineTo(qx1, qy1);
    ctx.moveTo(qx0, qy0); ctx.lineTo(qx1, qy1);
    ctx.stroke();

    const T = DIM_TICK_LEN;
    const ux = dx / len, uy = dy / len;
    const t1x = (ux + nx) / Math.SQRT2, t1y = (uy + ny) / Math.SQRT2;
    const t2x = (ux - nx) / Math.SQRT2, t2y = (uy - ny) / Math.SQRT2;
    for (const [cx, cy] of [[qx0, qy0], [qx1, qy1]]) {
      ctx.beginPath();
      ctx.moveTo(cx - t1x * T, cy - t1y * T);
      ctx.lineTo(cx + t1x * T, cy + t1y * T);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx - t2x * T, cy - t2y * T);
      ctx.lineTo(cx + t2x * T, cy + t2y * T);
      ctx.stroke();
    }
    ctx.restore();

    const du = Math.abs(nb.t - sel.t) * seg.len;
    _drawValuePill((qx0 + qx1) / 2, (qy0 + qy1) / 2, fmtCm(du));
  }
}

/* ==========================================================================
   DRAWING PREVIEW
   ==========================================================================
   The dashed ghost of a cable being drawn, plus the live crosshair
   that tracks the cursor and the several rings the different snap
   states use:

     plain crosshair + a small dot — free cursor, no snap
     a filled dot inside a halo    — a snap spec, but no anchor reuse
     a teal sticky ring            — reuse of an existing anchor
     a translucent teal ring       — a merge target (Alt+click)
     a dashed amber ring           — a ghost marker on the other view

   Only one of these can be active per frame, chosen by the same
   reuse policy addDrawPoint uses, so what the user sees during
   hover is exactly what the next click will commit.

   Snap-candidate feedback
   -----------------------
   drawSnapCandidates shows every anchor the current click would
   reuse, so the user can see what they are about to snap to before
   committing.  Three tiers, from loudest to quietest:

       primary in range     the anchor that would actually be picked
                            — a solid teal ring with a filled centre,
                            the same visual the earlier single-target
                            merge-target preview used.
       secondary in range   other candidates within the reuse
                            threshold — thin teal rings.  They would
                            be picked if the cursor moved closer.
       out of range         candidates the cursor is near but not
                            close enough to actually reuse — faint
                            dashed grey rings.  "Move closer and this
                            becomes selectable."

   The candidate set is exactly what isReusableAnchor(a, mouse.alt,
   view) accepts, minus the anchors already in the current drawing
   (those are the ghost's own vertices, not fresh snap targets).
   The in-range threshold matches ANCHOR_NEARBY_PX and
   findMergeTarget's 14 px, so the visuals never lie about what a
   click will do.

   drawSnapCandidates runs whenever the cursor is over the view it
   is called for — INCLUDING before the first point is placed, when
   drawing.view is still null.  The earlier design gated the whole
   preview on drawing.view === view, which meant no snap feedback
   appeared until after the first click; that gate is now split,
   with the ghost line still gated but the candidate feedback not.

   The old single-target block that used findMergeTarget is gone —
   drawSnapCandidates covers that case and shows the full candidate
   set at once.  findMergeTarget itself is unchanged and still used
   by addDrawPoint; only the preview stopped calling it. */

/* Reuse thresholds, in SCREEN pixels.  SNAP_IN_RANGE_PX matches
   ANCHOR_NEARBY_PX in pg_core and findMergeTarget's own 14; a click
   at or under this distance will reuse the anchor.  SNAP_VISIBLE_PX
   is the outer halo where a ring is still drawn but the click would
   not reuse — the "almost, move closer" band. */
const SNAP_IN_RANGE_PX = 14;
const SNAP_VISIBLE_PX  = 26;

function drawSnapCandidates(view) {
  const project  = (view === "floor") ? anchorPlan : anchorWall;
  const toScreen = (view === "floor") ? w2sFloor   : w2sWall;

  const candidates = [];
  for (const a of anchors.values()) {
    if (view === "wall" && a.space === "wall-edge" && isSegHidden(a.segIdx))
      continue;
    if (!isReusableAnchor(a, mouse.alt, view)) continue;
    if (drawing.anchorIds.indexOf(a.id) >= 0) continue;

    const p = project(a);
    if (!p) continue;
    const [sx, sy] = toScreen(p[0], p[1]);
    const d = Math.hypot(sx - mouse.sx, sy - mouse.sy);
    if (d > SNAP_VISIBLE_PX) continue;

    candidates.push({ sx, sy, d });
  }
  if (!candidates.length) return;

  candidates.sort((x, y) => x.d - y.d);
  const primary = candidates[0];

  ctx.save();
  ctx.lineCap = "round";

  /* Secondary rings, drawn first so the primary overlays them. */
  for (let i = candidates.length - 1; i >= 1; i--) {
    const c = candidates[i];
    const inRange = c.d <= SNAP_IN_RANGE_PX;
    ctx.beginPath();
    ctx.arc(c.sx, c.sy, 8, 0, Math.PI * 2);
    if (inRange) {
      ctx.strokeStyle = PALETTE.transitSoft;
      ctx.lineWidth = 1.4;
      ctx.setLineDash([]);
    } else {
      ctx.strokeStyle = PALETTE.inkFaint;
      ctx.lineWidth = 1.0;
      ctx.setLineDash([2, 2]);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  /* Primary ring — solid teal when in range, dashed grey when the
     cursor is still outside the reuse threshold.  The centre dot
     only appears when the click would actually reuse this anchor,
     so "does clicking do anything" is answerable at a glance. */
  const inRange = primary.d <= SNAP_IN_RANGE_PX;
  const ringR   = inRange ? 12 : 10;
  ctx.beginPath();
  ctx.arc(primary.sx, primary.sy, ringR, 0, Math.PI * 2);
  if (inRange) {
    ctx.strokeStyle = PALETTE.transit;
    ctx.lineWidth = 2.6;
    ctx.setLineDash([]);
  } else {
    ctx.strokeStyle = PALETTE.inkSoft;
    ctx.lineWidth = 1.8;
    ctx.setLineDash([3, 3]);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  if (inRange) {
    ctx.beginPath();
    ctx.arc(primary.sx, primary.sy, 5, 0, Math.PI * 2);
    ctx.fillStyle = PALETTE.transitFaint;
    ctx.fill();
  }

  ctx.restore();
}

function drawDrawingPreview(view) {
  if (!drawing) return;

  /* Snap-candidate feedback fires whenever the cursor is over the
     view this call is for, regardless of whether the drawing owns
     that view yet.  Two cases:

       drawing.view === null   no first point placed; the cursor
                               could go to either band, so whichever
                               band the cursor is over shows its
                               candidates.
       drawing.view === view   drawing locked to this band; show its
                               candidates.

     Any other combination means the drawing is committed to the
     other band and the cursor is here — a click would be rejected
     by addDrawPoint, so no rings are shown. */
  const candidateViewOK =
    (drawing.view === null) || (drawing.view === view);
  if (candidateViewOK && mouse.inside && mouse.view === view) {
    drawSnapCandidates(view);
  }

  if (drawing.view !== view) return;

  const toScreen = (view === "floor") ? w2sFloor : w2sWall;
  const s2w      = (view === "floor") ? s2wFloor : s2wWall;
  const project  = (view === "floor") ? anchorPlan : anchorWall;

  const visAnchor = (a) => {
    if (!a) return false;
    if (view !== "wall") return true;
    if (a.space !== "wall-edge") return true;
    return !isSegHidden(a.segIdx);
  };

  if (drawing.anchorIds.length > 0) {
    ctx.strokeStyle = PALETTE.ink;
    ctx.lineWidth = 2.2;
    ctx.setLineDash([6, 4]);
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.beginPath();
    let started = false;
    let lastA = null;
    const jumps = [];
    for (const id of drawing.anchorIds) {
      const a = anchors.get(id);
      if (!visAnchor(a)) { started = false; lastA = null; continue; }
      const p = a ? project(a) : null;
      if (!p) { started = false; lastA = null; continue; }
      const [sx, sy] = toScreen(p[0], p[1]);
      if (started && lastA && isHopTransition(lastA, a)) {
        const lp = project(lastA);
        const [lx, ly] = toScreen(lp[0], lp[1]);
        jumps.push({ fromX: lx, fromY: ly, toX: sx, toY: sy });
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(sx, sy);
      } else if (!started) {
        ctx.moveTo(sx, sy);
      } else {
        ctx.lineTo(sx, sy);
      }
      started = true;
      lastA = a;
    }
    ctx.stroke();
    ctx.setLineDash([]);
    for (const j of jumps) {
      drawHopArc(j.fromX, j.fromY, j.toX, j.toY, false);
    }

    for (const id of drawing.anchorIds) {
      const a = anchors.get(id);
      if (!visAnchor(a)) continue;
      const p = a ? project(a) : null;
      if (!p) continue;
      const [vx, vy] = toScreen(p[0], p[1]);
      const isStep = anchorIsStepFace(a);
      const side   = anchorSide(a);

      ctx.beginPath();
      ctx.arc(vx, vy, (isStep ? 6 : 5) + 2, 0, Math.PI * 2);
      ctx.fillStyle = PALETTE.paper;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(vx, vy, isStep ? 6 : 5, 0, Math.PI * 2);
      ctx.fillStyle = PALETTE.ink;
      ctx.fill();
      ctx.strokeStyle = PALETTE.highlight;
      ctx.lineWidth = 1.8;
      ctx.stroke();

      if (isStep) {
        ctx.beginPath();
        ctx.arc(vx, vy, 8.5, 0, Math.PI * 2);
        ctx.strokeStyle = (side === "top") ? PALETTE.step : PALETTE.transit;
        ctx.lineWidth = 1.4;
        ctx.stroke();
      }
    }
  }

  if (drawingPreview) {
    const [pwx, pwy] = s2w(drawingPreview.sx, drawingPreview.sy);

    let sticky   = null;
    let snapSpec = null;

    if (snapEnabled || mouse.alt) {
      const reuseFilter = (a) => isReusableAnchor(a, mouse.alt, view);
      sticky = findAnchorAtScreen(view, drawingPreview.sx, drawingPreview.sy,
                                  reuseFilter);

      if (!sticky) {
        snapSpec = (view === "floor")
          ? snapFloorSpec(pwx, pwy, true)
          : snapWallSpec(pwx, pwy, true);

        if (snapSpec && snapSpec.space === "wall-edge") {
          const scale = (view === "floor")
            ? viewFloor.scale
            : Math.min(viewWall.scaleX, viewWall.scaleY);
          const tolMm = ANCHOR_NEARBY_PX / scale;
          const s = WALL.segments[snapSpec.segIdx];
          if (s) {
            for (const a of anchors.values()) {
              if (a.space !== "wall-edge") continue;
              if (a.segIdx !== snapSpec.segIdx) continue;
              if (!isReusableAnchor(a, mouse.alt, view)) continue;
              if (Math.abs(a.v - snapSpec.v) > tolMm) continue;
              if (Math.abs(a.t - snapSpec.t) * s.len < tolMm) {
                sticky = a; snapSpec = null; break;
              }
            }
          }
        }
      }
    }

    let showX = pwx, showY = pwy;
    let show = true;
    if (sticky) {
      const p = project(sticky);
      if (p) { showX = p[0]; showY = p[1]; }
    } else if (snapSpec) {
      if (snapSpec.space === "floor") {
        showX = snapSpec.x; showY = snapSpec.y;
      } else if (snapSpec.space === "wall-edge") {
        const [px, py] = wallAttachToPlan(snapSpec.segIdx, snapSpec.t);
        if (view === "floor") { showX = px; showY = py; }
        else {
          showX = wallAttachToU(snapSpec.segIdx, snapSpec.t);
          showY = snapSpec.v;
        }
      }
    } else if (!snapEnabled && !mouse.alt && view === "wall") {
      const attach = uToWallAttach(pwx, pwy);
      if (attach) {
        showX = wallAttachToU(attach.segIdx, attach.t);
        showY = pwy;
      } else {
        show = false;
      }
    }
    const [px, py] = show ? toScreen(showX, showY) : [0, 0];

    if (show) {
      if (drawing.anchorIds.length > 0) {
        const lastId = drawing.anchorIds[drawing.anchorIds.length - 1];
        const lastA  = anchors.get(lastId);
        if (visAnchor(lastA)) {
          const lastP  = lastA ? project(lastA) : null;
          if (lastP) {
            const [lx, ly] = toScreen(lastP[0], lastP[1]);
            ctx.beginPath();
            ctx.moveTo(lx, ly); ctx.lineTo(px, py);
            ctx.setLineDash([6, 4]);
            ctx.strokeStyle = sticky ? PALETTE.transit
                            : (snapEnabled || mouse.alt) ? PALETTE.highlight
                            : PALETTE.inkSoft;
            ctx.lineWidth = 1.8;
            ctx.stroke(); ctx.setLineDash([]);
          }
        }
      }

      drawSnapCrosshair(px, py);

      ctx.beginPath();
      ctx.arc(px, py, sticky ? 6 : (snapSpec ? 5 : 4), 0, Math.PI * 2);
      ctx.fillStyle = sticky ? PALETTE.transit
                    : snapSpec ? PALETTE.highlight
                    : (snapEnabled || mouse.alt) ? PALETTE.ink
                    : PALETTE.inkSoft;
      ctx.fill();
      ctx.strokeStyle = PALETTE.paper;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      if (sticky) {
        ctx.beginPath();
        ctx.arc(px, py, 12, 0, Math.PI * 2);
        ctx.strokeStyle = PALETTE.transit;
        ctx.lineWidth = 2;
        ctx.setLineDash([3, 3]);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }
}

function drawCrossViewGhosts() {
  if (!drawing || !drawingPreview) return;
  if (drawing.view === null) return;
  if (!snapEnabled) return;
  const view = drawing.view;
  const s2w = (view === "floor") ? s2wFloor : s2wWall;
  const [pwx, pwy] = s2w(drawingPreview.sx, drawingPreview.sy);
  if (view === "floor") {
    const wall = findWallAttachSpec(pwx, pwy);
    if (!wall) return;
    const [gx, gy] = w2sWall(wallAttachToU(wall.segIdx, wall.t), wall.v);
    drawGhostMarker(gx, gy);
  } else {
    const edge = findWallEdgeSnapSpec(pwx, pwy);
    if (!edge) return;
    const [px, py] = wallAttachToPlan(edge.segIdx, edge.t);
    const [gx, gy] = w2sFloor(px, py);
    drawGhostMarker(gx, gy);
  }
}

function drawGhostMarker(sx, sy) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(sx, sy, 8, 0, Math.PI * 2);
  ctx.fillStyle = PALETTE.highlightBg;
  ctx.fill();
  ctx.strokeStyle = PALETTE.highlight;
  ctx.lineWidth = 1.6;
  ctx.setLineDash([3, 3]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.arc(sx, sy, 2.6, 0, Math.PI * 2);
  ctx.fillStyle = PALETTE.highlight;
  ctx.fill();
  ctx.restore();
}

/* ==========================================================================
   DRAWING LIFECYCLE
   ========================================================================== */

function beginDraw() {
  /* The two tool modes are exclusive: arming the drawing tool disarms
     the ruler.  The ruler's pending point, axis override, selection,
     and step-skip state are cleared so the next arm starts fresh;
     completed measurements survive, because they are independent of
     the mode. */
  if (state.ruler.active) {
    state.ruler.active            = false;
    state.ruler.pending           = null;
    state.ruler.axisPref          = null;
    state.ruler.pendingJumpedStep = false;
    state.ruler.ignoreSteps       = false;
    state.ruler._hasLeftStepEdge  = false;
    state.ruler._lastDStep        = Infinity;
    state.ruler.pendingEnd        = null;
    state.ruler.pendingAxis       = null;
    state.ruler.selected          = -1;
    _rulerCloseNumericInput();
    _rulerSyncMeasureInspector();
  }
  drawing = { view: null, anchorIds: [], id: null, name: null, baseCableId: null };
  drawingPreview = null;
  state.selectedCable = null;
  state.selectedVertex = null;
  flashStatus(T("msgDrawStart"), "ok");
  draw();
}

function cancelDraw(silent) {
  if (!drawing) return;
  exitFocus();
  drawing = null; drawingPreview = null;
  if (!silent) flashStatus(T("msgDrawCancelled"), "warn");
  draw();
}

function finishDraw() {
  if (!drawing) return;
  if (drawing.view === null) { cancelDraw(); return; }
  if (drawing.anchorIds.length < 2) {
    flashStatus(T("msgNeedTwoPoints"), "warn");
    exitFocus();
    drawing = null; drawingPreview = null; draw();
    return;
  }
  const list = (drawing.view === "floor") ? state.floorCables : state.wallCables;
  if (drawing.baseCableId != null) removeCableById(drawing.baseCableId);
  const c = {
    id: (drawing.id != null) ? drawing.id : idCounter++,
    name: drawing.name || ("Cable " + (state.floorCables.length + state.wallCables.length + 1)),
    anchorIds: drawing.anchorIds.slice(),
  };
  list.push(c);
  state.selectedCable = c;
  gcAnchors();
  recomputeTrueCables();
  exitFocus();
  drawing = null; drawingPreview = null;
  flashStatus(T("msgCableCreated")(c.anchorIds.length), "ok");
  draw();
}

function addDrawPoint(sx, sy, altKey) {
  if (!drawing) return;
  const view = drawing.view;

  if (altKey) {
    const target = findMergeTarget(view, sx, sy);
    if (target) {
      if (drawing.anchorIds.length === 0) adoptMergeBase(target);
      else                               mergeDrawingInto(target);
      return;
    }
  }

  const reuseFilter = (a) => isReusableAnchor(a, altKey, view);

  let anchorId = null;
  const nearby = findAnchorAtScreen(view, sx, sy, reuseFilter);
  if (nearby) anchorId = nearby.id;

  let spec = null;
  if (anchorId == null) {
    if (view === "floor") {
      const [wx, wy] = s2wFloor(sx, sy);
      spec = snapFloorSpec(wx, wy, snapEnabled);
    } else {
      const [u, v] = s2wWall(sx, sy);
      spec = snapWallSpec(u, v, snapEnabled);
      if (!spec) { draw(); return; }
    }
  }

  const scale = (view === "floor")
    ? viewFloor.scale
    : Math.min(viewWall.scaleX, viewWall.scaleY);
  const tolMm = ANCHOR_NEARBY_PX / scale;

  if (view === "wall" && anchorId == null && spec &&
      spec.space === "wall-edge" && drawing.anchorIds.length > 0) {
    const lastId = drawing.anchorIds[drawing.anchorIds.length - 1];
    const last = anchors.get(lastId);
    if (last && last.space === "wall-edge" && last.segIdx !== spec.segIdx) {
      const route = planWormholeRoute(
        { segIdx: last.segIdx, t: last.t, v: last.v },
        { segIdx: spec.segIdx, t: spec.t, v: spec.v }
      );
      if (route && route.length > 1) {
        let inserted = 0;
        for (let i = 1; i < route.length; i++) {
          const rid = resolveSpecToAnchorId(route[i], 5, null);
          if (rid == null) continue;
          const lastInList = drawing.anchorIds[drawing.anchorIds.length - 1];
          if (lastInList !== rid) {
            drawing.anchorIds.push(rid);
            inserted++;
          }
        }
        if (inserted > 0) {
          const lastAddedId = drawing.anchorIds[drawing.anchorIds.length - 1];
          const la = anchors.get(lastAddedId);
          if (la && la.space === "wall-edge" && la.segIdx !== focusSeg) {
            enterFocus(la.segIdx);
          }
          draw();
          return;
        }
      }
    }
  }

  if (anchorId == null) {
    anchorId = resolveSpecToAnchorId(spec, tolMm, reuseFilter);
    if (anchorId == null) { draw(); return; }
  }
  const last = drawing.anchorIds[drawing.anchorIds.length - 1];
  if (last === anchorId) { draw(); return; }
  drawing.anchorIds.push(anchorId);

  if (view === "wall") {
    const a = anchors.get(anchorId);
    let segIdx = -1;
    if (a && a.space === "wall-edge") segIdx = a.segIdx;
    if (segIdx >= 0 && segIdx !== focusSeg) {
      enterFocus(segIdx);
    }
  }

  draw();
}

function findAnchorAtScreen(view, sx, sy, reuseFilter) {
  const project  = (view === "floor") ? anchorPlan : anchorWall;
  const toScreen = (view === "floor") ? w2sFloor   : w2sWall;
  let best = null, bestD = ANCHOR_NEARBY_PX;
  for (const a of anchors.values()) {
    if (view === "wall" && a.space === "wall-edge" && isSegHidden(a.segIdx))
      continue;
    if (reuseFilter && !reuseFilter(a)) continue;
    const p = project(a);
    if (!p) continue;
    const [px, py] = toScreen(p[0], p[1]);
    const d = Math.hypot(px - sx, py - sy);
    if (d < bestD) { bestD = d; best = a; }
  }
  return best;
}

function anchorOwnerCable(anchorId) {
  for (const c of state.floorCables) {
    if (c.anchorIds.includes(anchorId)) return { cable: c, view: "floor" };
  }
  for (const c of state.wallCables) {
    if (c.anchorIds.includes(anchorId)) return { cable: c, view: "wall" };
  }
  return null;
}

function isReusableAnchor(a, altHeld, currentView) {
  if (!a) return false;
  if (altHeld) return true;
  if (drawing && drawing.anchorIds.includes(a.id)) return true;
  if (currentView) {
    const owner = anchorOwnerCable(a.id);
    if (owner && owner.view !== currentView) return true;
  }
  return false;
}

function adoptMergeBase(target) {
  const E = target.cable;
  const ids = (target.endpointIdx === 0)
    ? E.anchorIds.slice().reverse()
    : E.anchorIds.slice();
  drawing.id = E.id;
  drawing.name = E.name;
  drawing.anchorIds = ids;
  drawing.baseCableId = E.id;
  if (drawing.view === "wall") {
    const lastId = ids[ids.length - 1];
    const a = anchors.get(lastId);
    if (a && a.space === "wall-edge") enterFocus(a.segIdx);
  }
  flashStatus(T("msgAdopted"), "ok");
  draw();
}

function mergeDrawingInto(target) {
  const E = target.cable;
  const otherIds = (target.endpointIdx === 0)
    ? E.anchorIds.slice()
    : E.anchorIds.slice().reverse();
  let tail = otherIds;
  if (drawing.anchorIds.length > 0 && tail.length > 0 &&
      drawing.anchorIds[drawing.anchorIds.length - 1] === tail[0]) {
    tail = tail.slice(1);
  }
  const mergedIds = drawing.anchorIds.concat(tail);

  if (drawing.baseCableId != null && drawing.baseCableId !== E.id)
    removeCableById(drawing.baseCableId);
  removeCableById(E.id);

  const list = (drawing.view === "floor") ? state.floorCables : state.wallCables;
  const c = {
    id: (drawing.id != null) ? drawing.id : idCounter++,
    name: drawing.name || ("Cable " + (state.floorCables.length + state.wallCables.length + 1)),
    anchorIds: mergedIds,
  };
  list.push(c);
  state.selectedCable = c;
  state.selectedVertex = null;
  gcAnchors();
  recomputeTrueCables();
  exitFocus();
  drawing = null; drawingPreview = null;
  flashStatus(T("msgMerged")(c.anchorIds.length), "ok");
  draw();
}

function removeCableById(id) {
  let i = state.floorCables.findIndex(c => c.id === id);
  if (i >= 0) { state.floorCables.splice(i, 1); return; }
  i = state.wallCables.findIndex(c => c.id === id);
  if (i >= 0) { state.wallCables.splice(i, 1); }
}

function gcAnchors() {
  const referenced = new Set();
  for (const c of state.floorCables) for (const id of c.anchorIds) referenced.add(id);
  for (const c of state.wallCables)  for (const id of c.anchorIds) referenced.add(id);
  for (const id of Array.from(anchors.keys())) {
    if (!referenced.has(id)) anchors.delete(id);
  }
}

function clearAll() {
  if (!confirm(T("msgConfirmClear"))) return;
  exitFocus();
  anchors.clear();
  state.floorGrids = []; state.wallGrids = [];
  state.floorCables = []; state.wallCables = [];
  state.trueCables = [];
  state.selectedCable = null; state.selectedVertex = null;
  drawing = null; drawingPreview = null;
  NOTES.length = 0;
  draw();
}

/* ==========================================================================
   DELETION
   ========================================================================== */

function deleteSelectedCable() {
  const c = state.selectedCable;
  if (!c) { flashStatus(T("msgNoCableSelected"), "warn"); return; }
  removeCableById(c.id);
  state.selectedCable = null; state.selectedVertex = null;
  gcAnchors();
  recomputeTrueCables();
  flashStatus(T("msgCableDeleted"), "ok");
  draw();
}

function deleteSelectedVertex() {
  const sv = state.selectedVertex;
  if (!sv) { flashStatus(T("msgNoVertexSelected"), "warn"); return; }
  const { cable, index } = sv;
  if (!cable || !cable.anchorIds ||
      index < 0 || index >= cable.anchorIds.length) {
    state.selectedVertex = null; draw(); return;
  }
  cable.anchorIds.splice(index, 1);
  if (cable.anchorIds.length < 2) {
    removeCableById(cable.id);
    state.selectedCable = null;
  }
  state.selectedVertex = null;
  gcAnchors();
  recomputeTrueCables();
  flashStatus(T("msgVertexDeleted"), "ok");
  draw();
}

/* ==========================================================================
   DRAGGING
   ==========================================================================
   A vertex drag can take one of three forms:

     • a floor-space drag — the anchor is converted to a floor anchor
       at the cursor's world position, snapped to a grid line or wall
       attach when Shift is held
     • a wall-space drag on a non-corner anchor — the anchor is
       converted to a wall-edge anchor on the segment under the
       cursor, at the snapped t and clamped v
     • a wall-space drag on a corner anchor — the anchor is pinned to
       the corner's own side (t = 0 or 1), v follows the cursor, and
       every partner anchor at the same physical corner tracks the
       same v

   The same convertAnchor primitive performs the first two: it strips
   the anchor's old space-specific fields and copies the new spec's
   fields on, clamping the v if the new segment is a step.  The third
   form is _applyCornerDrag, which does not call convertAnchor at all
   because the anchor stays on the same segment and only its v moves. */

function convertAnchor(a, spec) {
  delete a.x; delete a.y; delete a.segIdx; delete a.t;
  delete a.gridId; delete a.gridAxis;
  a.space = spec.space;
  for (const k of Object.keys(spec)) {
    if (k === "space") continue;
    a[k] = spec[k];
  }
  if (a.space === "wall-edge") clampAnchorToSegment(a);
}

function computeCornerInfo(a) {
  const jid = junctionOfAnchor(a);
  if (jid < 0) return null;
  const side = Math.abs(a.t) < 0.01 ? 0 : 1;

  const vSource = a.v || 0;
  const partners = [];
  const j = JUNCTIONS[jid];
  if (j) {
    for (const t of j.terminals) {
      if (t.segIdx === a.segIdx) continue;
      for (const other of anchors.values()) {
        if (other === a) continue;
        if (other.space !== "wall-edge") continue;
        if (other.segIdx !== t.segIdx) continue;
        const oside = Math.abs(other.t) < 0.01 ? 0
                    : Math.abs(other.t - 1) < 0.01 ? 1 : -1;
        if (oside !== t.side) continue;
        if (Math.abs((other.v || 0) - vSource) > 5.0) continue;
        partners.push(other);
      }
    }
  }
  return { junctionId: jid, side, partners };
}

function _applyCornerDrag(a, corner, sx, sy) {
  const s = WALL.segments[a.segIdx];
  if (!s) return;
  const [u, v] = s2wWall(sx, sy);

  let nv;
  if (isStepFace(s)) {
    nv = (v > segTop(s) * 0.5) ? segTop(s) : 0;
  } else {
    nv = Math.max(segBottom(s), Math.min(segTop(s), v));
  }
  if (snapEnabled) {
    const SNAP = 22 / Math.min(viewWall.scaleX, viewWall.scaleY);
    if (Math.abs(v) < SNAP) nv = 0;
    if (isStepFace(s) && Math.abs(v - segTop(s)) < SNAP) nv = segTop(s);
  }

  a.t = corner.side;
  a.v = nv;
  clampAnchorToSegment(a);

  for (const p of corner.partners) {
    p.v = a.v;
    clampAnchorToSegment(p);
  }
}

function _applyVertexDrag(a, view, sx, sy) {
  if (view === "floor") {
    const [wx, wy] = s2wFloor(sx, sy);
    if (snapEnabled) {
      const SNAP = 14 / viewFloor.scale;
      for (const g of state.floorGrids) {
        if (g.type === "ns" && Math.abs(wx - g.pos) < SNAP) {
          convertAnchor(a, { space: "floor", x: g.pos, y: wy,
                             gridId: g.id, gridAxis: "ns" });
          return;
        }
        if (g.type === "ew" && Math.abs(wy - g.pos) < SNAP) {
          convertAnchor(a, { space: "floor", x: wx, y: g.pos,
                             gridId: g.id, gridAxis: "ew" });
          return;
        }
      }
      const wall = findWallAttachSpec(wx, wy);
      if (wall) { convertAnchor(a, wall); return; }
    }
    convertAnchor(a, { space: "floor", x: wx, y: wy });
    return;
  }

  const [u, v] = s2wWall(sx, sy);

  if (snapEnabled) {
    const edge = findWallEdgeSnapSpec(u, v);
    if (edge) { convertAnchor(a, edge); return; }
  }

  const attach = uToWallAttach(u, v);
  if (attach) {
    const s = WALL.segments[attach.segIdx];
    const vv = Math.max(segBottom(s), Math.min(segTop(s), v));
    convertAnchor(a, { space: "wall-edge", segIdx: attach.segIdx,
                       t: attach.t, v: vv });
    return;
  }
  const i = nearestSegmentToUV(u, v);
  if (i < 0) return;
  const s = WALL.segments[i];
  const t = Math.max(0, Math.min(1, (u - s.u0) / s.len));
  const vv = Math.max(segBottom(s), Math.min(segTop(s), v));
  convertAnchor(a, { space: "wall-edge", segIdx: i, t, v: vv });
}

function handleVertexDrag(sx, sy) {
  const { cable, index, view, corner } = state.dragVertex;
  const anchorId = cable.anchorIds[index];
  const a = anchors.get(anchorId);
  if (!a) return;

  if (view === "wall" && corner) {
    _applyCornerDrag(a, corner, sx, sy);
    return;
  }

  _applyVertexDrag(a, view, sx, sy);
}

function handleGridDrag(sx, sy) {
  const { grid, view } = state.dragGrid;
  if (view === "floor") {
    const [wx, wy] = s2wFloor(sx, sy);
    grid.pos = (grid.type === "ns") ? wx : wy;
    for (const a of anchors.values()) {
      if (a.space !== "floor") continue;
      if (a.gridId !== grid.id) continue;
      if (grid.type === "ns") a.x = grid.pos;
      else                    a.y = grid.pos;
    }
  } else {
    const [u, v] = s2wWall(sx, sy);
    grid.pos = (grid.type === "v") ? u : v;
    for (const a of anchors.values()) {
      if (a.space !== "wall-edge") continue;
      if (a.gridId !== grid.id) continue;
      const uv = anchorWall(a);
      if (!uv) continue;
      if (grid.type === "v") {
        const attach = uToWallAttach(grid.pos, uv[1]);
        if (attach) {
          a.segIdx = attach.segIdx;
          a.t = attach.t;
        }
      } else {
        a.v = grid.pos;
        clampAnchorToSegment(a);
      }
    }
  }
}

/* ==========================================================================
   HIT TESTING
   ==========================================================================
   Five separate tests, run in a fixed priority order by the event
   dispatcher:

     1. a floor grid line within 7 px of the cursor → drag the line
     2. a floor vertex within 9 px                     → select/drag vertex
     3. a floor cable polyline within 12 px            → select cable
     4. a wall grid line, then a wall vertex, then a wall cable
        polyline, same thresholds but in strip coordinates

   The cable polyline test walks the cable's projected vertices and
   calls polylineHit against the resulting point list, so a cable with
   a hop between distant walls still hit-tests on both sides of the
   hop. */

function nearestFloorVertex(sx, sy) {
  for (let ci = state.floorCables.length - 1; ci >= 0; ci--) {
    const c = state.floorCables[ci];
    if (drawing && drawing.baseCableId === c.id) continue;
    for (let i = 0; i < c.anchorIds.length; i++) {
      const a = anchors.get(c.anchorIds[i]);
      const p = a ? anchorPlan(a) : null;
      if (!p) continue;
      const [vx, vy] = w2sFloor(p[0], p[1]);
      if (Math.hypot(sx - vx, sy - vy) < 9) return { cable: c, index: i };
    }
  }
  return null;
}
function nearestWallVertex(sx, sy) {
  for (let ci = state.wallCables.length - 1; ci >= 0; ci--) {
    const c = state.wallCables[ci];
    if (drawing && drawing.baseCableId === c.id) continue;
    for (let i = 0; i < c.anchorIds.length; i++) {
      const a = anchors.get(c.anchorIds[i]);
      if (!a) continue;
      if (a.space === "wall-edge" && isSegHidden(a.segIdx)) continue;
      const p = anchorWall(a);
      if (!p) continue;
      const [vx, vy] = w2sWall(p[0], p[1]);
      if (Math.hypot(sx - vx, sy - vy) < 9) return { cable: c, index: i };
    }
  }
  return null;
}
function nearestFloorGridLine(sx, sy) {
  for (const g of state.floorGrids) {
    if (g.type === "ns") {
      const [gx] = w2sFloor(g.pos, 0);
      if (Math.abs(sx - gx) < 7) return g;
    } else {
      const [, gy] = w2sFloor(0, g.pos);
      if (Math.abs(sy - gy) < 7) return g;
    }
  }
  return null;
}
function nearestWallGridLine(sx, sy) {
  if (focusSavedU) return null;
  for (const g of state.wallGrids) {
    if (g.type === "v") {
      const [gx] = w2sWall(g.pos, 0);
      if (Math.abs(sx - gx) < 7) return g;
    } else {
      const [, gy] = w2sWall(0, g.pos);
      if (Math.abs(sy - gy) < 7) return g;
    }
  }
  return null;
}

function polylineHitView(view, x, y, c, tol) {
  const project  = (view === "floor") ? anchorPlan : anchorWall;
  const pts = [];
  for (const id of c.anchorIds) {
    const a = anchors.get(id);
    if (view === "wall" && a && a.space === "wall-edge" && isSegHidden(a.segIdx))
      continue;
    const p = a ? project(a) : null;
    if (p) pts.push(p);
  }
  return polylineHit(x, y, pts, tol);
}

/* ==========================================================================
   LAYOUT
   ==========================================================================
   The floor band's height is chosen so the room's aspect ratio sits
   comfortably in it: a room taller than it is wide gets a taller
   floor band, up to a 65 % cap; a room wider than it is tall gets a
   shorter floor band, down to a 35 % floor.  The band split between
   the two views is a straight snap — there is no transition. */

function computeTargetFloorH(cw, ch) {
  const b = GEOMETRY.bounds;
  const bw = Math.max(b.maxX - b.minX, 1);
  const bh = Math.max(b.maxY - b.minY, 1);
  const aspect = bh / bw;

  let frac = 0.50;
  if (aspect > 1) frac += Math.min(0.15, (aspect - 1) * 0.10);
  else            frac -= Math.min(0.15, (1 - aspect) * 0.10);
  frac = Math.max(SPLIT_MIN_FRAC, Math.min(SPLIT_MAX_FRAC, frac));

  const dividerH = 4;
  const availH = ch - dividerH;
  const h = Math.round(availH * frac);
  return Math.max(180, h);
}

function fitViews() {
  const cw = window.innerWidth;

  /* ---- Floor ---- */
  {
    const b = GEOMETRY.bounds;
    const bw = (b.maxX - b.minX) || 1;
    const bh = (b.maxY - b.minY) || 1;
    const sf = Math.min((cw - 2 * FLOOR_PAD) / bw,
                        (layout.floorH - 2 * FLOOR_PAD) / bh);
    const mx = (b.minX + b.maxX) / 2, my = (b.minY + b.maxY) / 2;
    const baseTx = cw / 2 - mx * sf;
    const baseTy = layout.floorH / 2 + my * sf;
    const cx = cw / 2, cy = layout.floorH / 2;

    viewFloor.scale = sf * viewFloor.zoom;
    viewFloor.tx = cx + (baseTx - cx) * viewFloor.zoom + viewFloor.panX;
    viewFloor.ty = cy + (baseTy - cy) * viewFloor.zoom + viewFloor.panY;
  }

  /* ---- Wall ----
     The wall band carries TWO independent scale factors:

         viewWall.zoom   uniform — applied to both axes.  This is what
                         the plain wheel adjusts.
         viewWall.zoomX  horizontal-only — applied to scaleX alone.
                         This is what Shift+wheel adjusts: it dilates
                         the unfolded strip sideways without touching
                         its height, which is what you want when a
                         narrow wall's cable geometry is packed too
                         tightly to read but you do not want to also
                         stretch every vertical dimension.

     zoomX = 1 is a no-op.  The two compose: an overall zoom of 1.5
     and an X-stretch of 2.0 gives scaleX a factor of 3.0 and scaleY
     a factor of 1.5.  The router base Xs are read from scaleX, so
     they track the dilation automatically — arrows and hit testing
     stay honest. */
  {
    const topPad = 20;
    const bottomPad = router.ESCAPE_DROP + 20;
    const gutterTop = estimateRulerGutter(cw);
    const W = WALL.totalU || 1, H = WALL_HEIGHT || 1;
    const availW = cw - 2 * topPad - 2 * WALL_SIDE_CHAN;
    const availH = Math.max(40, layout.wallH - topPad - bottomPad - gutterTop);
    const baseSx = availW / W;
    const baseSy = availH / H;
    const baseTx = topPad + WALL_SIDE_CHAN;
    const baseTy = layout.wallY + layout.wallH - bottomPad;
    const cx = cw / 2, cy = layout.wallY + layout.wallH / 2;

    viewWall.scaleX = baseSx * viewWall.zoom * viewWall.zoomX;
    viewWall.scaleY = baseSy * viewWall.zoom;
    viewWall.tx = cx + (baseTx - cx) * viewWall.zoom + viewWall.panX;
    viewWall.ty = cy + (baseTy - cy) * viewWall.zoom + viewWall.panY;
    viewWall.stripTopY = viewWall.ty - H * viewWall.scaleY;

    router.leftBaseX  = viewWall.tx - 12;
    router.rightBaseX = viewWall.tx + WALL.totalU * viewWall.scaleX + 12;
  }
}

/* Estimate the height the strip's footprint ruler will need at the
   current width, so the wall band's fit can reserve a gutter above
   the strip.  Runs the same row-packing pass the ruler itself runs,
   with one row's worth of margin — the ruler will then fit in the
   reserved gutter without a second pass. */
function estimateRulerGutter(cw) {
  if (!WALL.footprints || !WALL.footprints.length) return 36;
  const PAD = 8;
  const EST_TEXT_W = 22;
  const topPad = 20;
  const availW = cw - 2 * topPad - 2 * WALL_SIDE_CHAN;
  const totalU = WALL.totalU || 1;
  const pxPerU = availW / totalU;
  const rowEnds = [];
  const sorted = WALL.footprints.slice().sort((a, b) => a.u0 - b.u0);
  for (const fp of sorted) {
    const xLo = fp.u0 * pxPerU;
    const xHi = fp.u1 * pxPerU;
    const xMid = (xLo + xHi) / 2;
    let placed = false;
    for (let r = 0; r < rowEnds.length; r++) {
      const pillLo = xMid - EST_TEXT_W / 2 - 6;
      if (pillLo > rowEnds[r] + PAD) {
        rowEnds[r] = xHi + PAD;
        placed = true;
        break;
      }
    }
    if (!placed) rowEnds.push(xHi + PAD);
  }
  const rows = Math.max(1, rowEnds.length);
  return Math.max(36, Math.min(120, rows * DIM_ROW_H + 20));
}

/* ==========================================================================
   ZOOM AND PAN
   ==========================================================================
   The wheel zooms the view under the cursor about the cursor: the
   world point under the cursor is captured before the zoom, and the
   pan is adjusted so the same world point lands under the cursor
   again after.  The two fitViews calls are what make the adjustment
   stick — the base transform is recomputed at the new zoom first,
   then the pan correction is applied on top of it. */

function zoomViewAt(view, s2w, w2s, sx, sy, factor) {
  const [wx, wy] = s2w(sx, sy);
  const newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, view.zoom * factor));
  if (newZoom === view.zoom) return;
  view.zoom = newZoom;
  fitViews();
  const [nsx, nsy] = w2s(wx, wy);
  view.panX += sx - nsx;
  view.panY += sy - nsy;
  fitViews();
}

/* Horizontal-only stretch for the unfolded-wall band.

   The wall band's x-axis is the strip's u coordinate (unfolded
   perimeter), y-axis is height.  This function dilates only the x
   axis, leaving every vertical dimension untouched, and does so
   about the cursor — the wall's u coordinate under the cursor stays
   put while everything else slides horizontally around it.

   Derivation is the same as zoomViewAt's, with two differences:

     • the scale being changed is viewWall.zoomX, which feeds scaleX
       only, so the on-screen shift it produces is purely horizontal;
     • s2wWall(w, 0)[0] / w2sWall(u, 0)[0] are used to read/write the
       u pixel position, since there is no y component to worry about.

   Bounds share MIN_ZOOM / MAX_ZOOM with the uniform zoom.  That means
   a 1.0 uniform zoom can be X-stretched up to 8× and compressed down
   to 0.25×, or combined with a uniform zoom for more reach.  If you
   ever want a wider X-only range, split the bounds into
   MIN_ZOOM_X / MAX_ZOOM_X rather than loosening these.

   The seed guard is defensive: if viewWall.zoomX is somehow
   undefined or NaN (a partially-applied edit, an old saved state),
   the function self-heals to zoomX = 1 for one tick rather than
   propagating NaN through scaleX and every downstream renderer.

   The two fitViews() calls bracket the panX adjustment; the first
   recomputes tx at the new scaleX, the second re-applies tx with the
   corrected panX.  This is exactly the pattern zoomViewAt uses, and
   it is why the second fitViews cannot be elided. */

function stretchWallX(sx, factor) {
  const [wu] = s2wWall(sx, 0);
  const seed = (typeof viewWall.zoomX === "number" &&
                isFinite(viewWall.zoomX)) ? viewWall.zoomX : 1;
  const newZoomX = Math.max(MIN_ZOOM,
                            Math.min(MAX_ZOOM, seed * factor));
  if (newZoomX === viewWall.zoomX) return;
  viewWall.zoomX = newZoomX;
  fitViews();
  const [newSx] = w2sWall(wu, 0);
  viewWall.panX += sx - newSx;
  fitViews();
}

function panView(view, dx, dy) {
  view.panX += dx;
  view.panY += dy;
  fitViews();
}

function resetZoomPan() {
  viewFloor.zoom = 1; viewFloor.panX = 0; viewFloor.panY = 0;
  viewWall.zoom  = 1; viewWall.zoomX = 1;
  viewWall.panX  = 0; viewWall.panY  = 0;
  fitViews();
  state.hoveredRoute = null;
  draw();
  flashStatus(T("msgViewReset"), "ok");
}

/* ==========================================================================
   RESIZE
   ========================================================================== */

function resize() {
  dpr = window.devicePixelRatio || 1;
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width  = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  canvas.style.width  = cw + "px";
  canvas.style.height = ch + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  layout.floorH   = computeTargetFloorH(cw, ch);
  layout.dividerY = layout.floorH;
  layout.wallY    = layout.floorH + 4;
  layout.wallH    = ch - layout.wallY;

  fitViews();
  draw();
}
window.addEventListener("resize", resize);

/* ==========================================================================
   TITLE BLOCK REFRESHER
   ========================================================================== */

const _TB_REFS = {
  project: null, sheet: null, ceiling: null, scale: null, selection: null,
};
function updateTitleBlock() {
  if (!_TB_REFS.project) {
    _TB_REFS.project   = document.getElementById("tb_project");
    _TB_REFS.sheet     = document.getElementById("tb_sheet");
    _TB_REFS.ceiling   = document.getElementById("tb_ceiling");
    _TB_REFS.scale     = document.getElementById("tb_scale");
    _TB_REFS.selection = document.getElementById("tb_selection");
    if (!_TB_REFS.project) return;
  }

  const scaleN = Math.max(1, Math.round(1 / Math.max(viewFloor.scale, 1e-6)));

  let selText = T("tbSelNone");
  if (state.selectedCable) {
    const tid = trueCableIdOf(state.selectedCable);
    const sibs = trueCableSiblings(state.selectedCable);
    selText = T("tbSelCable")(tid, sibs.length);
  } else if (state.selectedVertex) {
    selText = T("tbSelVertex")(state.selectedVertex.index + 1);
  } else if (drawing) {
    selText = T("tbSelDrawing")(drawing.anchorIds.length);
  }

  _TB_REFS.project.textContent   = T("tbProjectVal");
  _TB_REFS.sheet.textContent     = T("tbSheetVal")(GEOMETRY.cutZ);
  _TB_REFS.ceiling.textContent   = T("tbCeilingVal")(WALL_HEIGHT);
  _TB_REFS.scale.textContent     = T("tbScaleVal")(scaleN, viewFloor.zoom);
  _TB_REFS.selection.textContent = selText;
}

/* ==========================================================================
   CABLE INSPECTOR REFRESHER
   ========================================================================== */

function _cableSyncInspector() {
  const section   = document.getElementById("cableSection");
  const idxEl     = document.getElementById("cableIndex");
  const vertexEl  = document.getElementById("cableVertexInfo");
  const delVertEl = document.getElementById("cableDeleteVertexBtn");
  if (!section || !idxEl || !vertexEl || !delVertEl) return;

  const cable = state.selectedCable;
  if (!cable) {
    section.style.display = "none";
    return;
  }
  section.style.display = "block";

  const tid    = trueCableIdOf(cable);
  const sibs   = trueCableSiblings(cable);
  const floors = sibs.filter(c => state.floorCables.includes(c)).length;
  const walls  = sibs.filter(c => state.wallCables.includes(c)).length;

  idxEl.textContent = T("ciHeader")(tid, sibs.length, floors, walls);

  const sv = state.selectedVertex;
  if (sv && sv.cable === cable) {
    const a = anchors.get(cable.anchorIds[sv.index]);
    let tag = T("ciVertexBase")(sv.index + 1);
    if (a) {
      if (a.space === "wall-edge") {
        const side = anchorSide(a);
        if (side === "top")         tag += "  ·  " + T("ciVertexStepTop");
        else if (side === "bottom") tag += "  ·  " + T("ciVertexStepBot");
        else                        tag += "  ·  " + T("ciVertexWallEdge");
        if (junctionOfAnchor(a) >= 0)
          tag += "  ·  " + T("ciVertexCorner");
      } else if (a.gridId != null) {
        tag += "  ·  " + T("ciVertexGrid");
      } else {
        tag += "  ·  " + T("ciVertexFree");
      }
    }
    vertexEl.textContent = tag;
    delVertEl.style.display = "block";
  } else {
    vertexEl.textContent = T("ciVertexNone");
    delVertEl.style.display = "none";
  }
}

/* ==========================================================================
   PANEL FADE
   ========================================================================== */

(function installPanelFade() {
  const ui = document.getElementById("ui");
  if (!ui) return;
  ui.style.transition = "none";
  ui.addEventListener("mouseenter", () => {
    panelHovered = true;
    updatePanelOpacity();
  });
  ui.addEventListener("mouseleave", () => {
    panelHovered = false;
    panelLastActivity = performance.now();
    updatePanelOpacity();
  });
  ui.addEventListener("mousedown", () => {
    panelLastActivity = performance.now();
  });
})();

function updatePanelOpacity() {
  const ui = document.getElementById("ui");
  if (!ui) return;
  if (ui.classList.contains("collapsed")) return;
  if (panelHovered || drawing || state.dragGrid || state.dragVertex ||
      state.pan || state.ruler.active) {
    ui.style.opacity = "";
    return;
  }
  if (!mouse.inside) { ui.style.opacity = ""; return; }
  const idle = performance.now() - panelLastActivity;
  ui.style.opacity = idle > 1800 ? "0.42" : "";
}

   original that used to live in the #hint div in pg_core's HTML_HEAD

    h3.insertBefore(helpBtn, collapseBtn);
  } else if (h3) {
    h3.appendChild(helpBtn);
  }

  const pop = document.createElement("div");
  pop.id = "helpPopover";

    '<h3>' + T("popTitle") +
      '<button class="closeBtn" id="helpClose">' + T("btnClose") +
      '</button>' +
    '</h3>' +
    '<div class="body">' + T("popInstructionsHTML") + '</div>';
