    if (!anyFlagged) continue;
    const cyBase = minPlanY - ROUTE_CLUSTER_GAP;

    const members = [];
    for (const ri of cluster) {
      const r = side.routes[ri];
      if (r.clusterAttack) members.push(r);
    }
    members.sort((a, b) =>
      (a.planX - b.planX) || (a.planY - b.planY));

    const maxRank = members.length - 1;
    let stagger = CLUSTER_CORRIDOR_STAGGER;
    if (maxRank > 0) {
      const room = minPlanY - cyBase - 4;
      const maxStagger = room > 0 ? room / maxRank : 0;
      if (stagger > maxStagger) stagger = maxStagger;
    }

    for (let i = 0; i < members.length; i++) {
      const r = members[i];
      r.clusterY      = cyBase + i * stagger;
      r.clusterDropX  = r.planX;
      r.clusterRank   = i;
      r.clusterSize   = members.length;
    }

    for (const ri of cluster) {
      const r = side.routes[ri];
      if (r.clusterAttack) {
        if (typeof r.clusterY !== "number") r.clusterY = cyBase;
        if (typeof r.clusterDropX !== "number") r.clusterDropX = r.planX;
        if (typeof r.clusterRank !== "number") r.clusterRank = 0;
        if (typeof r.clusterSize !== "number") r.clusterSize = 1;
      }
    }
  }
}

/* Pass 14 — force cluster-attack on tight knots.

   The regular cluster solver only flags a cluster for cluster attack
   after many iterations of score pressure.  A cluster whose members'
   plan targets all lie within ROUTE_CLUSTER_RADIUS / 2 of one another
   is a tight knot: their tips will pile up however the attacks are
   laid out, and the correct handling is cluster attack with a shared
   anchor.

   This pass detects that shape directly and flags it, without
   waiting for the score-based iteration to converge.  It runs after
   Pass 11 and after Pass 13, so the flags survive to shape
   assignment. */
function _raForceTightClusterAttack(side) {
  const routes = side.routes;
  let flagged = 0;

  for (const cluster of side.clusters || []) {
    const unflagged = [];
    for (const ri of cluster) {
      const r = routes[ri];
      if (r.clusterAttack) continue;
      unflagged.push(ri);
    }
    if (unflagged.length < 3) continue;

    const R2 = (ROUTE_CLUSTER_RADIUS * 0.5) *
               (ROUTE_CLUSTER_RADIUS * 0.5);
    let knot = false;
    for (let i = 0; i < unflagged.length && !knot; i++) {
      const a = routes[unflagged[i]];
      let nbr = 0;
      for (let j = 0; j < unflagged.length; j++) {
        if (i === j) continue;
        const b = routes[unflagged[j]];
        const dx = a.planX - b.planX;
        const dy = a.planY - b.planY;
        if (dx * dx + dy * dy < R2) nbr++;
      }
      if (nbr >= 2) knot = true;
    }
    if (!knot) continue;

    for (const ri of unflagged) routes[ri].clusterAttack = true;
    flagged += unflagged.length;
  }

  window.__tightClusterFlags = flagged;
  return flagged;
}

function _raUnifyClusterAnchors(side) {
  const routes = side.routes;
  for (const cluster of side.clusters || []) {
    const members = [];
    for (const ri of cluster) {
      const r = routes[ri];
      if (r.clusterAttack) members.push(r);
    }
    if (members.length === 0) continue;

    let sharedBundleY = Infinity;
    let minPlanX = Infinity;
    let maxPlanX = -Infinity;
    for (const r of members) {
      if (r.bundleY < sharedBundleY) sharedBundleY = r.bundleY;
      if (r.planX < minPlanX) minPlanX = r.planX;
      if (r.planX > maxPlanX) maxPlanX = r.planX;
    }
    const sharedDescentX = (minPlanX + maxPlanX) * 0.5;

    for (const r of members) {
      r.bundleY  = sharedBundleY;
      r.descentX = sharedDescentX;
    }
  }
}

function _raDedupeClusterAttacks(side) {
  const routes = side.routes;
  let droppedCount = 0;

  for (const cluster of side.clusters || []) {
    const entries = [];
    for (const ri of cluster) {
      const r = routes[ri];
      if (!r.clusterAttack) continue;
      const dx = r.planX - r.descentX;
      const dy = r.planY - r.bundleY;
      const len = Math.hypot(dx, dy);
      if (len < 1) continue;
      entries.push({ ri, angle: Math.atan2(dy, dx), len });
    }
    if (entries.length < 2) continue;

    entries.sort((a, b) => a.angle - b.angle);

    let prevKept = null;
    for (const e of entries) {
      if (prevKept === null) { prevKept = e; continue; }

      let diff = Math.abs(e.angle - prevKept.angle);
      if (diff > Math.PI) diff = 2 * Math.PI - diff;

      if (diff < ROUTE_PARALLEL_TOL) {
        if (e.len > prevKept.len) {
          routes[prevKept.ri].clusterAttack = false;
          droppedCount++;
          prevKept = e;
        } else {
          routes[e.ri].clusterAttack = false;
          droppedCount++;
        }
      } else {
        prevKept = e;
      }
    }
  }

  window.__clusterDedupeDrops = droppedCount;
}

function _raEnforceLongRouteBundling(side) {
  const routes = side.routes;
  let merged = 0;

  for (const b of side.bundles) {
    for (let gi = 0; gi < b.groups.length; gi++) {
      const g0 = b.groups[gi];
      if (g0.routeIndices.length !== 1) continue;
      const r = routes[g0.routeIndices[0]];
      if (r.clusterAttack) continue;

      const attLen = Math.hypot(r.planX - r.descentX,
                                r.planY - r.bundleY);
      if (attLen < LONG_ATTACK_THRESHOLD) continue;
      const ang0 = Math.atan2(r.planY - r.bundleY,
                              r.planX - r.descentX);

      let bestGi = -1;
      for (let gj = 0; gj < b.groups.length; gj++) {
        if (gj === gi) continue;
        const g = b.groups[gj];
        if (g.routeIndices.length < 2) continue;
        if (g.forceUnbundled) continue;
        if (g.routeIndices.length >= SOLVER_GROUP_MAX_ROUTES) continue;
        if (Math.abs(g.descentX - g0.descentX) > SAME_COL_TOL) continue;

        for (const ri2 of g.routeIndices) {
          const r2 = routes[ri2];
          const ang2 = Math.atan2(r2.planY - r2.bundleY,
                                   r2.planX - r2.descentX);
          if (_raAngleDiff(ang0, ang2) < ROUTE_PARALLEL_TOL) {
            bestGi = gj;
            break;
          }
        }
        if (bestGi >= 0) break;
      }

      if (bestGi < 0) continue;

      const target = b.groups[bestGi];
      const ri = g0.routeIndices[0];
      target.routeIndices.push(ri);
      target.routeIndices.sort((i, j) => routes[i].planX - routes[j].planX);
      g0.routeIndices = [];
      merged++;
    }

    b.groups = b.groups.filter(g => g.routeIndices.length > 0);
  }

  if (merged > 0) {
    _raRebuildRouteRefs(side);
    _raBundleFanOut(side);
  }
  window.__longSoloBundled = merged;
}

function _raForceBundleParallelAttacks(side) {
  const routes = side.routes;
  let merges = 0;

  for (const b of side.bundles) {
    const colMap = new Map();
    for (let gi = 0; gi < b.groups.length; gi++) {
      const g = b.groups[gi];
      for (const ri of g.routeIndices) {
        const r = routes[ri];
        if (r.clusterAttack) continue;
        const key = Math.round(r.descentX / SAME_COL_TOL);
        if (!colMap.has(key)) colMap.set(key, []);
        colMap.get(key).push({ ri, gi });
      }
    }

    for (const entries of colMap.values()) {
      if (entries.length < 2) continue;

      const infos = [];
      for (const { ri, gi } of entries) {
        const r = routes[ri];
        const H = r.planX - r.descentX;
        const V = r.planY - r.bundleY;
        const len = Math.hypot(H, V);
        infos.push({ ri, gi, len, ang: Math.atan2(V, H) });
      }

      infos.sort((a, c) => a.ang - c.ang);

      const blocks = [];
      let cur = [infos[0]];
      for (let i = 1; i < infos.length; i++) {
        if (_raAngleDiff(infos[i - 1].ang, infos[i].ang)
            < ROUTE_PARALLEL_TOL) {
          cur.push(infos[i]);
        } else {
          blocks.push(cur);
          cur = [infos[i]];
        }
      }
      blocks.push(cur);

      for (const block of blocks) {
        if (block.length < 2) continue;
        if (block.length > SOLVER_GROUP_MAX_ROUTES + 1) continue;

        const targetGi = block[0].gi;
        const targetGroup = b.groups[targetGi];
        if (targetGroup.forceUnbundled) continue;

        let sumDx = 0, sumDy = 0;
        for (const e of block) {
          sumDx += Math.cos(e.ang);
          sumDy += Math.sin(e.ang);
        }
        const nl = Math.hypot(sumDx, sumDy);
        if (nl < 1e-6) continue;

        for (const e of block) {
          if (e.gi === targetGi) continue;
          const src = b.groups[e.gi];
          const idx = src.routeIndices.indexOf(e.ri);
          if (idx >= 0) src.routeIndices.splice(idx, 1);
          targetGroup.routeIndices.push(e.ri);
        }
        targetGroup.routeIndices.sort((i, j) =>
          routes[i].planX - routes[j].planX);
        targetGroup.attackBundled = true;
        targetGroup.trunkDir = [sumDx / nl, sumDy / nl];
        targetGroup.forceUnbundled = false;
        merges++;
      }
    }

    b.groups = b.groups.filter(g => g.routeIndices.length > 0);
  }

  if (merges > 0) {
    _raRebuildRouteRefs(side);
    _raBundleFanOut(side);
  }
  window.__longSoloBundled = merges;
}

function _raSplitLongAttackBundles(side) {
  const routes = side.routes;
  const longArr = [];

  for (let i = 0; i < routes.length; i++) {
    const r = routes[i];
    if (!r.ownPts || r.ownPts.length < 2) continue;
    if (r.clusterAttack) continue;

    const bidx = r.bundleIdx;
    if (bidx >= 0 && bidx < side.bundles.length
        && side.bundles[bidx].isSatellite) continue;

    const a = r.ownPts[r.ownPts.length - 2];
    const b = r.ownPts[r.ownPts.length - 1];
    const attLen = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (attLen >= LONG_ATTACK_SPLIT_THRESHOLD) longArr.push(i);
  }

  if (longArr.length === 0) return 0;

  let minPY = Infinity;
  for (const ri of longArr) {
    if (routes[ri].planY < minPY) minPY = routes[ri].planY;
  }
  if (minPY === Infinity) return 0;

  const longSet = new Set(longArr);

  for (const b of side.bundles) {
    b.routeIndices = b.routeIndices.filter(ri => !longSet.has(ri));
    for (const g of b.groups) {
      g.routeIndices = g.routeIndices.filter(ri => !longSet.has(ri));
    }
    b.groups = b.groups.filter(g => g.routeIndices.length > 0);
  }
  side.bundles = side.bundles.filter(b => b.routeIndices.length > 0);

  const sorted = longArr.slice().sort((i, j) => {
    const hi = routes[i].upperHalf ? 0 : 1;
    const hj = routes[j].upperHalf ? 0 : 1;
    if (hi !== hj) return hi - hj;
    const dXi = routes[i].descentX;
    const dXj = routes[j].descentX;
    if (dXi !== dXj) return dXi - dXj;
    return routes[i].planX - routes[j].planX;
  });

  const groups = [];
  let cur = [sorted[0]];
  let curX = routes[sorted[0]].descentX;
  let curH = routes[sorted[0]].upperHalf ? 0 : 1;
  for (let k = 1; k < sorted.length; k++) {
    const ri = sorted[k];
    const dX = routes[ri].descentX;
    const h  = routes[ri].upperHalf ? 0 : 1;
    if (h === curH && Math.abs(dX - curX) < ROUTE_MIN_SEP) {
      cur.push(ri);
    } else {
      groups.push(cur);
      cur = [ri];
      curX = dX;
      curH = h;
    }
  }
  groups.push(cur);

  const upperHalf = routes[sorted[0]].upperHalf;

  side.bundles.push({
    routeIndices: sorted.slice(),
    groups: groups.map(g => ({
      routeIndices: g.slice(),
      descentX: 0,
      attackBundled: false,
      trunkDir: null,
      forceUnbundled: false,
    })),
    isSatellite: true,
    satelliteMinPlanY: minPY,
    upperHalf: upperHalf,
  });

  _raRebuildRouteRefs(side);
  _raBundleFanOut(side);
  return longArr.length;
}


/* ==========================================================================
   SECTION 3c — CROSSING REDUCTION (PASS 12)
   ========================================================================== */

function _raCountPathCrossings(side) {
  let count = 0;
  const routes = side.routes;
  for (let i = 0; i < routes.length; i++) {
    const a = routes[i];
    if (!a.ownPts || a.ownPts.length < 2) continue;
    const aSegs = _raPathSegments(a.ownPts);
    if (!aSegs.length) continue;
    for (let j = i + 1; j < routes.length; j++) {
      const b = routes[j];
      if (!b.ownPts || b.ownPts.length < 2) continue;
      if (a.bundleIdx === b.bundleIdx && a.groupIdx === b.groupIdx) continue;
      const bSegs = _raPathSegments(b.ownPts);
      if (!bSegs.length) continue;
      for (const sa of aSegs) {
        for (const sb of bSegs) {
          if (_raSegmentsCross(sa, sb)) count++;
        }
      }
    }
  }
  return count;
}

function _raCrossingReducerCandidates(side) {
  const cands = [];

  let bestUnb = null, bestUnbSize = 0;
  for (let bi = 0; bi < side.bundles.length; bi++) {
    const b = side.bundles[bi];
    for (let gi = 0; gi < b.groups.length; gi++) {
      const g = b.groups[gi];
      if (!g.attackBundled) continue;
      if (g.forceUnbundled) continue;
      if (g.routeIndices.length > bestUnbSize) {
        bestUnbSize = g.routeIndices.length;
        bestUnb = { b: bi, g: gi };
      }
    }
  }
  if (bestUnb) {
    cands.push({ type: "unbundleGroup",
                 bundleIdx: bestUnb.b, groupIdx: bestUnb.g });
  }

  const bIdx = _raFindLargestBundle(side);
  if (bIdx >= 0 && side.bundles[bIdx].routeIndices.length >= 2) {
    cands.push({ type: "splitBundle", index: bIdx });
  }

  const bg = _raFindLargestGroup(side);
  if (bg) {
    cands.push({ type: "splitGroup",
                 bundleIdx: bg.b, groupIdx: bg.g });
  }

  if (side.bundleSpacing < SOLVER_MAX_BUNDLE_SPACING) {
    cands.push({ type: "growBundleSpacing" });
  }
  if (side.groupSpacing < SOLVER_MAX_GROUP_SPACING) {
    cands.push({ type: "growGroupSpacing" });
  }
  return cands;
}

function _raReduceCrossings(side) {
  const MAX_PASSES = 12;
  const MIN_IMPROVE = 2;
  const SCORE_SLACK = 200;

  let bestCross = _raCountPathCrossings(side);
  let bestScore = _raScoreSide(side).total;
  let bestSnap  = _raCloneSide(side);
  let passes = 0;

  window.__crossingCountStart = bestCross;
  window.__crossingCountEnd   = bestCross;
  window.__crossingPasses     = 0;

  if (bestCross === 0) return 0;

  for (let pass = 0; pass < MAX_PASSES; pass++) {
    if (bestCross === 0) break;
    const cands = _raCrossingReducerCandidates(side);
    if (!cands.length) break;

    let accepted = false;
    for (const act of cands) {
      const trial = _raCloneSide(side);
      _raApplyRefinement(side, act);
      _raLayoutSide(side);
      _raAssignShapes(side);

      const newCross = _raCountPathCrossings(side);
      const newScore = _raScoreSide(side).total;

      if (newCross <= bestCross - MIN_IMPROVE
          && newScore <= bestScore + SCORE_SLACK) {
        bestCross = newCross;
        bestScore = newScore;
        bestSnap  = _raCloneSide(side);
        accepted = true;
        passes++;
        break;
      }

      _raRestoreSide(side, trial);
    }

    if (!accepted) break;
  }

  _raRestoreSide(side, bestSnap);
  window.__crossingCountEnd = bestCross;
  window.__crossingPasses   = passes;
  return passes;
}

/* ==========================================================================
   SECTION 6 — SCORING
   ========================================================================== */

function _raScoreSide(side) {
  const byRoute = side.routes;
  let parallel = 0, crossing = 0;

  for (let i = 0; i < byRoute.length; i++) {
    const a = byRoute[i];
    if (!a.ownPts) continue;
    for (let j = i + 1; j < byRoute.length; j++) {
      const b = byRoute[j];
      if (!b.ownPts) continue;
      if (a.bundleIdx === b.bundleIdx && a.groupIdx === b.groupIdx) continue;

      const sameCluster = (a.clusterAttack && b.clusterAttack &&
                           a.clusterId >= 0 && a.clusterId === b.clusterId);
      const s = _raPathPairScore(a.ownPts, b.ownPts);
      if (sameCluster) {
        crossing += s.c;
      } else {
        parallel += s.p;
        crossing += s.c;
      }
    }
  }

  if (_raFrozenPolylines) {
    for (let i = 0; i < byRoute.length; i++) {
      const a = byRoute[i];
      if (!a.ownPts) continue;
      for (const fpts of _raFrozenPolylines) {
        const s = _raPathPairScore(a.ownPts, fpts);
        parallel += s.p;
        crossing += s.c;
      }
    }
  }

  let attackParallel = 0;
  for (const b of side.bundles) {
    for (const g of b.groups) {
      const attacks = [];
      for (const ri of g.routeIndices) {
        const r = side.routes[ri];
        if (!r.ownPts || r.ownPts.length < 2) continue;
        const a = r.ownPts[r.ownPts.length - 2];
        const c = r.ownPts[r.ownPts.length - 1];
        attacks.push({
          x0: a[0], y0: a[1], x1: c[0], y1: c[1],
          angle: Math.atan2(c[1] - a[1], c[0] - a[0]),
          minX: Math.min(a[0], c[0]), maxX: Math.max(a[0], c[0]),
          minY: Math.min(a[1], c[1]), maxY: Math.max(a[1], c[1]),
        });
      }
      for (let i = 0; i < attacks.length; i++) {
        const a = attacks[i];
        for (let j = i + 1; j < attacks.length; j++) {
          const c = attacks[j];
          if (_raAngleDiff(a.angle, c.angle) > ROUTE_PARALLEL_TOL) continue;
          if (a.maxX + ROUTE_MIN_SEP < c.minX) continue;
          if (c.maxX + ROUTE_MIN_SEP < a.minX) continue;
          if (a.maxY + ROUTE_MIN_SEP < c.minY) continue;
          if (c.maxY + ROUTE_MIN_SEP < a.minY) continue;
          const d = _raSegSegDist(a.x0, a.y0, a.x1, a.y1,
                                  c.x0, c.y0, c.x1, c.y1);
          if (d < ROUTE_MIN_SEP) {
            attackParallel += (ROUTE_MIN_SEP - d) * ROUTE_PARALLEL_W;
          }
        }
      }
    }
  }

  const segsByRoute = byRoute.map(r =>
    r.ownPts ? _raPathSegments(r.ownPts) : []);
  let tipPenalty = 0;
  for (let i = 0; i < byRoute.length; i++) {
    const a = byRoute[i];
    if (!a.ownPts) continue;
    for (let j = 0; j < byRoute.length; j++) {
      if (i === j) continue;
      const b = byRoute[j];
      if (!b.ownPts) continue;
      if (a.clusterAttack && b.clusterAttack &&
          a.clusterId >= 0 && a.clusterId === b.clusterId) continue;
      tipPenalty += _raTipClearanceAgainstSegs(a.planX, a.planY, segsByRoute[j]);
    }
  }

  let bundlePenalty = 0;
  for (let i = 0; i < side.bundles.length; i++) {
    for (let j = i + 1; j < side.bundles.length; j++) {
      const dy = Math.abs(i - j) * side.bundleSpacing;
      if (dy < ROUTE_MIN_SEP * 1.5) {
        bundlePenalty += (ROUTE_MIN_SEP * 1.5 - dy) * ROUTE_PARALLEL_W;
      }
    }
  }

  let groupPenalty = 0;
  for (const b of side.bundles) {
    const uniqueX = [];
    for (const g of b.groups) {
      if (g.routeIndices.length === 0) continue;
      let isNew = true;
      for (const sx of uniqueX) {
        if (Math.abs(sx - g.descentX) < 0.5) { isNew = false; break; }
      }
      if (isNew) uniqueX.push(g.descentX);
    }
    for (let i = 0; i < uniqueX.length; i++) {
      for (let j = i + 1; j < uniqueX.length; j++) {
        const dx = Math.abs(uniqueX[i] - uniqueX[j]);
        if (dx < ROUTE_MIN_SEP) {
          groupPenalty += (ROUTE_MIN_SEP - dx) * ROUTE_PARALLEL_W;
        }
      }
    }
  }

  const clusterPenalty = _raClusterPenalty(side);

  return {
    parallel, crossing, tipPenalty, attackParallel, bundlePenalty,
    groupPenalty, clusterPenalty,
    total: parallel + crossing + tipPenalty + attackParallel +
           bundlePenalty + groupPenalty + clusterPenalty,
  };
}

function _raClusterPenalty(side) {
  let penalty = 0;
  const clusters = side.clusters || [];
  const routes = side.routes;

  for (const cluster of clusters) {
    let longAttackCount = 0;

    for (const ri of cluster) {
      const r = routes[ri];
      if (r.clusterAttack) continue;
      if (!r.ownPts || r.ownPts.length < 2) continue;
      const p0 = r.ownPts[r.ownPts.length - 2];
      const p1 = r.ownPts[r.ownPts.length - 1];
      const len = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]);
      if (len > ROUTE_LAST_SEG_MIN * ROUTE_CLUSTER_LONG_MULT) {
        longAttackCount++;
      }
    }

    let tipConflictCount = 0;
    const unflagged = [];
    for (const ri of cluster) {
      const r = routes[ri];
      if (r.clusterAttack) continue;
      if (!r.ownPts) continue;
      unflagged.push(ri);
    }
    for (let i = 0; i < unflagged.length; i++) {
      const a = routes[unflagged[i]];
      const aSegs = _raPathSegments(a.ownPts);
      for (let j = i + 1; j < unflagged.length; j++) {
        const b = routes[unflagged[j]];
        const bSegs = _raPathSegments(b.ownPts);
        let conflict = false;
        if (_raTipClearanceAgainstSegs(a.planX, a.planY, bSegs) > 0) {
          conflict = true;
        } else if (_raTipClearanceAgainstSegs(b.planX, b.planY, aSegs) > 0) {
          conflict = true;
        }
        if (conflict) tipConflictCount++;
      }
    }

    const signal = longAttackCount + tipConflictCount;
    if (signal < ROUTE_CLUSTER_MIN_SIZE) continue;
    penalty += (signal - ROUTE_CLUSTER_MIN_SIZE + 1) *
               ROUTE_CLUSTER_LONG_W;
  }
  return penalty;
}


/* ==========================================================================
   SECTION 6b — ATTACK FAN DETECTION
   ========================================================================== */

function _raFindAttackFans(side) {
  const routes = side.routes;
  const n = routes.length;

  const attacks = routes.map(r => {
    if (!r.ownPts || r.ownPts.length < 2) return null;
    const a = r.ownPts[r.ownPts.length - 2];
    const b = r.ownPts[r.ownPts.length - 1];
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const len = Math.hypot(dx, dy);
    if (len < 2) return null;
    return {
      x0: a[0], y0: a[1], x1: b[0], y1: b[1],
      angle: Math.atan2(dy, dx),
      len,
      minX: Math.min(a[0], b[0]), maxX: Math.max(a[0], b[0]),
      minY: Math.min(a[1], b[1]), maxY: Math.max(a[1], b[1]),
    };
  });

  const adj = new Map();
  for (let i = 0; i < n; i++) adj.set(i, new Set());

  for (let i = 0; i < n; i++) {
    if (!attacks[i]) continue;
    for (let j = i + 1; j < n; j++) {
      if (!attacks[j]) continue;

      const aR = routes[i], bR = routes[j];
      if (aR.clusterAttack && bR.clusterAttack &&
          aR.clusterId >= 0 && aR.clusterId === bR.clusterId) continue;

      const A = attacks[i], B = attacks[j];
      if (_raAngleDiff(A.angle, B.angle) > ROUTE_ESCAPE_ANGLE_TOL) continue;

      if (A.maxX + ROUTE_ESCAPE_PROX < B.minX) continue;
      if (B.maxX + ROUTE_ESCAPE_PROX < A.minX) continue;
      if (A.maxY + ROUTE_ESCAPE_PROX < B.minY) continue;
      if (B.maxY + ROUTE_ESCAPE_PROX < A.minY) continue;

      const d = _raSegSegDist(A.x0, A.y0, A.x1, A.y1,
                              B.x0, B.y0, B.x1, B.y1);
      if (d >= ROUTE_ESCAPE_PROX) continue;

      if (_raProjOverlap(A, B) < ROUTE_ESCAPE_MIN_OVERLAP) continue;

      adj.get(i).add(j);
      adj.get(j).add(i);
    }
  }

  const visited = new Set();
  const fans = [];
  for (let i = 0; i < n; i++) {
    if (visited.has(i)) continue;
    if (adj.get(i).size === 0) { visited.add(i); continue; }
    const comp = [];
    const queue = [i];
    visited.add(i);
    while (queue.length) {
      const cur = queue.shift();
      comp.push(cur);
      for (const nbr of adj.get(cur)) {
        if (!visited.has(nbr)) { visited.add(nbr); queue.push(nbr); }
      }
    }
    if (comp.length >= 2) fans.push(comp);
  }
  return fans;
}

/* ==========================================================================
   SECTION 4 — LAYOUT
   ========================================================================== */

function _raComputeGroupAttackBundle(side, g) {
  g.attackBundled = false;
  g.trunkDir = null;
  if (g.forceUnbundled) return;

  const routes = g.routeIndices.map(ri => side.routes[ri]);
  if (routes.length < 2) return;

  const dirs = [];
  let sumDx = 0, sumDy = 0;
  for (const r of routes) {
    const H = r.planX - r.descentX;
    const V = r.planY - r.bundleY;
    const L = Math.hypot(H, V);
    if (L < 1e-6) continue;
    const dx = H / L, dy = V / L;
    dirs.push([dx, dy]);
    sumDx += dx;
    sumDy += dy;
  }
  if (dirs.length < 2) return;

  const normLen = Math.hypot(sumDx, sumDy);
  if (normLen < 1e-6) return;
  const ux = sumDx / normLen, uy = sumDy / normLen;

  let maxSpread = 0;
  for (const [dx, dy] of dirs) {
    const cos = Math.min(1, Math.abs(dx * ux + dy * uy));
    const ang = Math.acos(cos);
    if (ang > maxSpread) maxSpread = ang;
  }
  if (maxSpread > ROUTE_ATTACK_BUNDLE_TOL) return;

  g.attackBundled = true;
  g.trunkDir = [ux, uy];
}

function _raEvaluateGroupDescentCandidate(side, g, candidateX) {
  if (g.routeIndices.length === 0) return 0;
  const bundleY = side.routes[g.routeIndices[0]].bundleY;

  let sumDx = 0, sumDy = 0, n = 0;
  for (const ri of g.routeIndices) {
    const r = side.routes[ri];
    const H = r.planX - candidateX;
    const V = r.planY - bundleY;
    const L = Math.hypot(H, V);
    if (L < 1e-6) continue;
    sumDx += H / L;
    sumDy += V / L;
    n++;
  }
  if (n < 2) return 0;

  const nl = Math.hypot(sumDx, sumDy);
  if (nl < 1e-6) return 0;
  const ux = sumDx / nl, uy = sumDy / nl;

  let maxT = 0;
  for (const ri of g.routeIndices) {
    const r = side.routes[ri];
    const H = r.planX - candidateX;
    const V = r.planY - bundleY;
    let t = H * ux + V * uy;
    if (t > maxT) maxT = t;
  }
  const ex = candidateX + ux * maxT, ey = bundleY + uy * maxT;

  let pen = 0;
  for (const ri of g.routeIndices) {
    const r = side.routes[ri];
    const d = pointToSegmentDist(r.planX, r.planY,
                                  candidateX, bundleY, ex, ey);
    if (d < ROUTE_TIP_CLEARANCE) {
      pen += (ROUTE_TIP_CLEARANCE - d) * ROUTE_TIP_W;
    }
  }
  return pen;
}

function _raFindTinyBundledClusters(side, g) {
  if (!g.attackBundled || !g.trunkDir) return [];
  const [ux, uy] = g.trunkDir;
  const nx = -uy, ny = ux;

  const entries = [];
  for (const ri of g.routeIndices) {
    const r = side.routes[ri];
    if (r.clusterAttack) continue;

    const startX = r.descentX, startY = r.bundleY;
    const H = r.planX - startX, V = r.planY - startY;

    const tNatural = Math.max(0, H * ux + V * uy);
    const perpSigned = H * nx + V * ny;
    const perpDist = Math.abs(perpSigned);

    const MIN = BUNDLED_ATTACK_MIN;
    const disc = Math.sqrt(Math.max(0, MIN * MIN - perpDist * perpDist));

    const rank = (typeof r.bundleFanRank === "number")
      ? r.bundleFanRank : 0;
    let h = rank * BUNDLE_FAN_STEP;
    if (Math.abs(h) < disc) h = (rank < 0 ? -1 : 1) * disc;

    let t = tNatural - h;
    if (t < 0) t = 0;

    const qx = startX + ux * t, qy = startY + uy * t;
    const attLen = Math.hypot(r.planX - qx, r.planY - qy);

    entries.push({
      ri,
      x0: qx, y0: qy,
      x1: r.planX, y1: r.planY,
      len: attLen,
    });
  }

  const adj = new Map();
  for (const e of entries) adj.set(e.ri, new Set());
  for (let i = 0; i < entries.length; i++) {
    const A = entries[i];
    if (A.len > BUNDLE_TINY_ATTACK_MAX) continue;
    for (let j = i + 1; j < entries.length; j++) {
      const B = entries[j];
      if (B.len > BUNDLE_TINY_ATTACK_MAX) continue;
      const d = _raSegSegDist(A.x0, A.y0, A.x1, A.y1,
                              B.x0, B.y0, B.x1, B.y1);
      if (d < BUNDLE_TINY_PROX) {
        adj.get(A.ri).add(B.ri);
        adj.get(B.ri).add(A.ri);
      }
    }
  }

  const visited = new Set();
  const clusters = [];
  for (const e of entries) {
    if (visited.has(e.ri)) continue;
    if (adj.get(e.ri).size === 0) { visited.add(e.ri); continue; }
    const comp = [];
    const queue = [e.ri];
    visited.add(e.ri);
    while (queue.length) {
      const cur = queue.shift();
      comp.push(cur);
      for (const nbr of adj.get(cur)) {
        if (!visited.has(nbr)) { visited.add(nbr); queue.push(nbr); }
      }
    }
    if (comp.length >= 2) clusters.push(comp);
  }
  return clusters;
}

function _raLayoutSide(side) {
  {
    let sumX = 0, sumY = 0;
    const rr = side.routes;
    for (const r of rr) { sumX += r.planX; sumY += r.planY; }
    side.comX = rr.length > 0 ? sumX / rr.length : 0;
    side.comY = rr.length > 0 ? sumY / rr.length : 0;
  }

  /* ---- Pass 1: bundle Y, split by half ---- */
  {
    const upperBundles = side.bundles.filter(b => b.upperHalf && !b.isSatellite);
    const lowerBundles = side.bundles.filter(b => !b.upperHalf && !b.isSatellite);

    const distOf = (b) => {
      let d = 0;
      for (const ri of b.routeIndices) {
        const r = side.routes[ri];
        d = Math.max(d, Math.abs(r.corridorX - r.planX));
      }
      return d;
    };
    upperBundles.sort((a, b) => distOf(b) - distOf(a));
    lowerBundles.sort((a, b) => distOf(b) - distOf(a));

    const topBaseY    = ROUTE_BUNDLE_SCREEN_MIN;
    const bottomBaseY = layout.dividerY - ROUTE_BUNDLE_SCREEN_MIN;

    for (let k = 0; k < upperBundles.length; k++) {
      const b = upperBundles[k];
      const y = topBaseY + k * side.bundleSpacing;
      for (const ri of b.routeIndices) side.routes[ri].bundleY = y;
    }
    for (let k = 0; k < lowerBundles.length; k++) {
      const b = lowerBundles[k];
      const y = bottomBaseY - k * side.bundleSpacing;
      for (const ri of b.routeIndices) side.routes[ri].bundleY = y;
    }
  }

  /* Satellites */
  {
    let lowestUpperSatY = -Infinity;
    let highestLowerSatY = Infinity;
    for (const b of side.bundles) {
      if (!b.isSatellite) continue;
      if (b.routeIndices.length === 0) continue;

      let minPY = Infinity, maxPY = -Infinity;
      for (const ri of b.routeIndices) {
        const r = side.routes[ri];
        if (r.planY < minPY) minPY = r.planY;
        if (r.planY > maxPY) maxPY = r.planY;
      }
      if (minPY === Infinity) continue;

      let targetY;
      if (b.upperHalf) {
        targetY = minPY - ROUTE_LAST_SEG_MIN * 2;
        if (targetY < ROUTE_BUNDLE_SCREEN_MIN) targetY = ROUTE_BUNDLE_SCREEN_MIN;
        if (lowestUpperSatY > -Infinity
            && targetY < lowestUpperSatY + side.bundleSpacing) {
          targetY = lowestUpperSatY + side.bundleSpacing;
        }
        lowestUpperSatY = targetY;
      } else {
        targetY = maxPY + ROUTE_LAST_SEG_MIN * 2;
        const bottomLimit = layout.dividerY - ROUTE_BUNDLE_SCREEN_MIN;
        if (targetY > bottomLimit) targetY = bottomLimit;
        if (highestLowerSatY < Infinity
            && targetY > highestLowerSatY - side.bundleSpacing) {
          targetY = highestLowerSatY - side.bundleSpacing;
        }
        highestLowerSatY = targetY;
      }

      for (const ri of b.routeIndices) {
        side.routes[ri].bundleY = targetY;
      }
    }
  }

  /* ---- Pass 2: vertical-budget shift ---- */
  {
    let neededShift = 0;
    for (const b of side.bundles) {
      if (b.isSatellite) continue;
      let minPlanY = Infinity;
      for (const ri of b.routeIndices) {
        minPlanY = Math.min(minPlanY, side.routes[ri].planY);
      }
      if (minPlanY === Infinity) continue;
      const bY = side.routes[b.routeIndices[0]].bundleY;
      const maxAllowed = minPlanY - ROUTE_LAST_SEG_MIN;
      if (bY > maxAllowed && b.upperHalf) {
        neededShift = Math.max(neededShift, bY - maxAllowed);
      }
    }
    if (neededShift > 0) {
      let minBundleY = Infinity;
      for (const b of side.bundles) {
        if (b.isSatellite) continue;
        if (!b.upperHalf) continue;
        if (!b.routeIndices.length) continue;
        minBundleY = Math.min(minBundleY,
          side.routes[b.routeIndices[0]].bundleY);
      }
      if (minBundleY !== Infinity) {
        const maxShift = Math.max(0, minBundleY - ROUTE_BUNDLE_SCREEN_MIN);
        const actualShift = Math.min(neededShift, maxShift);
        if (actualShift > 0) {
          for (const b of side.bundles) {
            if (b.isSatellite) continue;
            if (!b.upperHalf) continue;
            for (const ri of b.routeIndices) {
              side.routes[ri].bundleY -= actualShift;
            }
          }
        }
      }
    }
  }

  /* ---- Pass 3: descent group X, clamped by half ---- */
  for (const b of side.bundles) {
    const withMedian = b.groups.map((g, gi) => {
      const xs = g.routeIndices.map(ri => side.routes[ri].planX);
      xs.sort((a, z) => a - z);
      const median = xs[Math.floor(xs.length / 2)];
      return { g, gi, median };
    });
    withMedian.sort((a, b) => a.median - b.median);

    const sign = side.routes[withMedian.length ? withMedian[0].g.routeIndices[0] : 0]
      ? (side.routes[withMedian[0].g.routeIndices[0]].sign) : 1;

    let prevX = -Infinity;
    for (const w of withMedian) {
      let x = w.median;
      if (prevX !== -Infinity) {
        x = Math.max(x, prevX + side.groupSpacing * sign > 0
                        ? prevX + side.groupSpacing
                        : prevX - side.groupSpacing);
      }
      if (sign > 0) x = Math.max(w.median, prevX === -Infinity ? w.median : prevX + side.groupSpacing);
      else          x = Math.min(w.median, prevX === -Infinity ? w.median : prevX - side.groupSpacing);

      const cx = side.comX;
      if (w.median < cx && x >= cx) x = cx - ROUTE_MIN_SEP;
      else if (w.median >= cx && x <= cx) x = cx + ROUTE_MIN_SEP;

      w.g.descentX = x;
      prevX = x;
    }

    for (const g of b.groups) {
      for (const ri of g.routeIndices) {
        side.routes[ri].descentX = g.descentX;
      }
    }
  }

  /* ---- Pass 3.5 ---- */
  {
    const routes = side.routes;
    const n = routes.length;
    const memberSet = new Set();
    const acceptedCols = [];

    const allGroups = [];
    for (const b of side.bundles) {
      for (const g of b.groups) {
        if (g.routeIndices.length === 0) continue;
        allGroups.push(g);
      }
    }

    for (const g of allGroups) {
      let x = g.descentX;
      for (const px of acceptedCols) {
        if (Math.abs(px - x) < ROUTE_MIN_SEP) { x = px; break; }
      }
      let already = false;
      for (const px of acceptedCols) {
        if (Math.abs(px - x) < 0.5) { already = true; break; }
      }
      if (!already) acceptedCols.push(x);
      g.descentX = x;
      for (const ri of g.routeIndices) routes[ri].descentX = x;
    }

    for (const g of allGroups) {
      const x0 = g.descentX;
      const bundleY = routes[g.routeIndices[0]].bundleY;

      let deepPlanY = -Infinity;
      for (const ri of g.routeIndices) {
        deepPlanY = Math.max(deepPlanY, routes[ri].planY);
      }
      if (bundleY >= deepPlanY) continue;

      memberSet.clear();
      for (const ri of g.routeIndices) memberSet.add(ri);

      const yMin = bundleY - ROUTE_TIP_CLEARANCE;
      const yMax = deepPlanY + ROUTE_TIP_CLEARANCE;

      const isClear = (candidateX) => {
        for (let i = 0; i < n; i++) {
          if (memberSet.has(i)) continue;
          const q = routes[i];
          if (Math.abs(q.planX - candidateX) >= ROUTE_TIP_CLEARANCE) continue;
          if (q.planY < yMin || q.planY > yMax) continue;
          return false;
        }
        return true;
      };

      if (isClear(x0)) continue;

      const sign = routes[g.routeIndices[0]].sign;
      const step = ROUTE_TIP_CLEARANCE * 1.5;
      let newX = x0;

      for (let trial = 1; trial <= 30; trial++) {
        const cand = x0 + sign * step * trial;
        if (isClear(cand)) { newX = cand; break; }
      }
      if (newX === x0) {
        for (let trial = 1; trial <= 30; trial++) {
          const cand = x0 - sign * step * trial;
          if (isClear(cand)) { newX = cand; break; }
        }
      }

      for (const px of acceptedCols) {
        if (Math.abs(px - newX) < ROUTE_MIN_SEP) { newX = px; break; }
      }
      let already = false;
      for (const px of acceptedCols) {
        if (Math.abs(px - newX) < 0.5) { already = true; break; }
      }
      if (!already) acceptedCols.push(newX);

      if (newX !== x0) {
        g.descentX = newX;
        for (const ri of g.routeIndices) routes[ri].descentX = newX;
      }
    }
  }

  /* ---- Pass 4: peel rank ---- */
  for (const b of side.bundles) {
    for (const g of b.groups) {
      const sorted = g.routeIndices.slice().sort((i, j) =>
        side.routes[i].planY - side.routes[j].planY);
      for (let rank = 0; rank < sorted.length; rank++) {
        side.routes[sorted[rank]].peelRank = rank;
      }
    }
  }

  /* ---- Pass 4b ---- */
  for (const b of side.bundles) {
    for (const g of b.groups) {
      const sorted = g.routeIndices.slice().sort((i, j) =>
        side.routes[i].peelRank - side.routes[j].peelRank);
      const stagger = side.peelStagger;
      let prevBreak = Infinity;
      for (const ri of sorted) {
        const r = side.routes[ri];
        const H = r.planX - r.descentX;
        const minVert = Math.sqrt(Math.max(0,
          ROUTE_LAST_SEG_MIN * ROUTE_LAST_SEG_MIN - H * H));
        let bk = r.planY - minVert;
        if (bk > prevBreak - stagger) bk = prevBreak - stagger;
        if (bk < r.bundleY)           bk = r.bundleY;
        r.baseBreak = bk;
        prevBreak = bk;
      }
    }
  }

  /* ---- Pass 4c ---- */
  for (const b of side.bundles) {
    for (const g of b.groups) {
      _raComputeGroupAttackBundle(side, g);
    }
  }

  /* ---- Pass 4d ---- */
  for (const b of side.bundles) {
    for (const g of b.groups) {
      if (!g.attackBundled) continue;
      if (g.routeIndices.length < 2) continue;

      const planXs = g.routeIndices
        .map(ri => side.routes[ri].planX)
        .sort((a, z) => a - z);

      const curPenalty = _raEvaluateGroupDescentCandidate(side, g, g.descentX);
      if (curPenalty === 0) continue;

      const candidates = [g.descentX];
      {
        let bestW = 0, bestMid = null;
        for (let i = 0; i < planXs.length - 1; i++) {
          const w = planXs[i + 1] - planXs[i];
          if (w > bestW) {
            bestW = w;
            bestMid = (planXs[i] + planXs[i + 1]) / 2;
          }
        }
        if (bestMid !== null) candidates.push(bestMid);
      }
      candidates.push(planXs[0] - ROUTE_TIP_CLEARANCE * 1.5);
      candidates.push(planXs[planXs.length - 1] + ROUTE_TIP_CLEARANCE * 1.5);

      let bestX = g.descentX, bestPen = curPenalty;
      for (const c of candidates) {
        const p = _raEvaluateGroupDescentCandidate(side, g, c);
        if (p < bestPen - 0.5) { bestPen = p; bestX = c; }
      }

      if (bestX !== g.descentX) {
        g.descentX = bestX;
        for (const ri of g.routeIndices) {
          side.routes[ri].descentX = bestX;
        }
      }
    }
  }

  /* ---- Pass 4d.5 ---- */
  {
    const allGroups = [];
    for (const b of side.bundles) {
      for (const g of b.groups) {
        if (g.routeIndices.length === 0) continue;
        allGroups.push(g);
      }
    }
    allGroups.sort((a, c) => a.descentX - c.descentX);

    const colClusters = [];
    let cur = [];
    for (const g of allGroups) {
      if (cur.length === 0 ||
          g.descentX - cur[cur.length - 1].descentX < ROUTE_MIN_SEP) {
        cur.push(g);
      } else {
        colClusters.push(cur);
        cur = [g];
      }
    }
    if (cur.length) colClusters.push(cur);

    for (const cluster of colClusters) {
      if (cluster.length < 2) continue;
      let sum = 0;
      for (const g of cluster) sum += g.descentX;
      const mean = sum / cluster.length;
      for (const g of cluster) {
        g.descentX = mean;
        for (const ri of g.routeIndices) side.routes[ri].descentX = mean;
      }
    }
  }
  for (const b of side.bundles) {
    for (const g of b.groups) {
      _raComputeGroupAttackBundle(side, g);
    }
  }

  /* ---- Pass 4e: bundle attack fan-out ---- */
  _raBundleFanOut(side);

  /* ---- Pass 4f ---- */
  for (const b of side.bundles) {
    for (const g of b.groups) {
      for (const ri of g.routeIndices) {
        side.routes[ri].bundleJogOffset = 0;
      }
      if (!g.attackBundled || !g.trunkDir) continue;
      if (g.routeIndices.length < 2) continue;

      const clusters = _raFindTinyBundledClusters(side, g);
      for (const cluster of clusters) {
        let sumRank = 0;
        for (const ri of cluster) {
          sumRank += side.routes[ri].bundleFanRank || 0;
        }
        const meanRank = sumRank / cluster.length;
        for (const ri of cluster) {
          const r = side.routes[ri];
          const rank = r.bundleFanRank || 0;
          r.bundleJogOffset = (rank - meanRank) * BUNDLE_JOG_STEP;
        }
      }
    }
  }

  /* ---- Pass 4g ---- */
  {
    const routes = side.routes;
    const n = routes.length;

    for (let ri = 0; ri < n; ri++) {
      const r = routes[ri];
      if (!r.ownPts || r.ownPts.length < 2) continue;
      if (r.clusterAttack) continue;
      if (r.tag === "R" || r.tag === "B" || r.tag === "C") continue;

      const b = side.bundles[r.bundleIdx];
      const g = b ? b.groups[r.groupIdx] : null;
      if (g && g.attackBundled && g.trunkDir) continue;

      const curBreak = (typeof r.baseBreak === "number")
        ? r.baseBreak : r.bundleY;

      const buildShape = (bY) => {
        let bk = bY;
        if (bk < r.bundleY) bk = r.bundleY;
        if (bk > r.planY)   bk = r.planY;
        const pts = [[r.descentX, r.bundleY]];
        if (bk > r.bundleY + 0.5) pts.push([r.descentX, bk]);
        const tail = pts[pts.length - 1];
        if (Math.abs(tail[0] - r.planX) > 0.5 ||
            Math.abs(tail[1] - r.planY) > 0.5) {
          pts.push([r.planX, r.planY]);
        }
        return pts;
      };

      const evalPenalty = (bY) => {
        const candPts = buildShape(bY);
        const candSegs = _raPathSegments(candPts);
        let pen = 0;
        for (let j = 0; j < n; j++) {
          if (j === ri) continue;
          const q = routes[j];
          if (!q.ownPts) continue;
          pen += _raTipClearanceAgainstSegs(q.planX, q.planY, candSegs);
        }
        return pen;
      };

      const curPen = evalPenalty(curBreak);
      if (curPen < 1) continue;

      let bestBk = curBreak, bestPen = curPen;
      const offsets = [-50, -40, -30, -25, -20, -15, -10, -5,
                        5, 10, 15, 20, 25, 30, 40, 50];
      for (const off of offsets) {
        const cand = curBreak + off;
        if (cand < r.bundleY || cand > r.planY) continue;
        const p = evalPenalty(cand);
        if (p < bestPen - 0.5) { bestPen = p; bestBk = cand; }
      }

      if (bestBk !== curBreak) {
        r.baseBreak = bestBk;
      }
    }
  }

  /* ---- Pass 5 ---- */
  _raAssignClusterY(side);

  /* ---- Pass 8 ---- */
  _raUnifyClusterAnchors(side);

  /* ---- Pass 9 ---- */
  _raDedupeClusterAttacks(side);
}

/* ==========================================================================
   SECTION 5 — SHAPE ASSIGNMENT
   ========================================================================== */

function _raBuildCandidates(r, side) {
  if (r.clusterAttack && typeof r.clusterY === "number") {
    return _raBuildClusterCandidates(r, side);
  }

  const b = side.bundles[r.bundleIdx];
  const g = b ? b.groups[r.groupIdx] : null;
  if (g && g.attackBundled && g.trunkDir) {
    return _raBuildAttackBundleCandidates(r, g);
  }

  const list = [];
  const { descentX, bundleY, planX, planY } = r;
  const MIN = ROUTE_LAST_SEG_MIN;
  const rank = r.peelRank || 0;
  const stagger = (side && side.peelStagger) || ROUTE_PEEL_STAGGER_MIN;

  const buildShape = (breakY) => {
    if (breakY < bundleY) breakY = bundleY;
    if (breakY > planY)   breakY = planY;
    const pts = [[descentX, bundleY]];
    if (breakY > bundleY + 0.5) pts.push([descentX, breakY]);
    const tail = pts[pts.length - 1];
    if (Math.abs(tail[0] - planX) > 0.5 ||
        Math.abs(tail[1] - planY) > 0.5) {
      pts.push([planX, planY]);
    }
    return pts;
  };

  const baseBreak = (typeof r.baseBreak === "number")
    ? r.baseBreak
    : planY - MIN - rank * stagger;

  list.push({ tag: "L0", pts: buildShape(baseBreak), isDiag: false });
  for (let k = 1; k <= 3; k++) {
    const bk = baseBreak - k * stagger;
    list.push({ tag: "L" + k, pts: buildShape(bk), isDiag: false });
  }
  list.push({ tag: "D", pts: buildShape(bundleY), isDiag: true });

  return list;
}

function _raBuildAttackBundleCandidates(r, group) {
  const [ux, uy] = group.trunkDir;
  const nx = -uy, ny = ux;
  const startX = r.descentX;
  const startY = r.bundleY;

  const H = r.planX - startX;
  const V = r.planY - startY;

  const tNatural = Math.max(0, H * ux + V * uy);
  const perpSigned = H * nx + V * ny;

  const rank = (typeof r.bundleFanRank === "number") ? r.bundleFanRank : 0;
  const jog  = (typeof r.bundleJogOffset === "number")
    ? r.bundleJogOffset : 0;

  const nComp = perpSigned - jog;
  const MIN = BUNDLED_ATTACK_MIN;
  const disc = Math.sqrt(Math.max(0, MIN * MIN - nComp * nComp));

  let h = rank * BUNDLE_FAN_STEP;
  if (Math.abs(h) < disc) {
    h = (rank < 0 ? -1 : 1) * disc;
  }

  let t = tNatural - h;
  if (t < 0) t = 0;

  /* Perpendicular offset.  Without this, the joint sits on the trunk
     line and every anchor-to-joint segment is collinear with the
     trunk — which reads as a fan of parallel diagonals from the same
     anchor, however much the short attack segments diverge.  The
     perpendicular offset slides each joint off the trunk in the
     direction of its target, so the anchor-to-joint strokes fan out
     too. */
  const perpJog = rank * BUNDLE_PERP_FAN_STEP;

  const qx = startX + ux * t + nx * (jog + perpJog);
  const qy = startY + uy * t + ny * (jog + perpJog);

  const raw = [
    [startX, startY],
    [qx, qy],
    [r.planX, r.planY],
  ];

  const pts = [raw[0]];
  for (let i = 1; i < raw.length; i++) {
    const prev = pts[pts.length - 1];
    const d = Math.hypot(raw[i][0] - prev[0], raw[i][1] - prev[1]);
    if (d > 0.5) pts.push(raw[i]);
  }

  return [{ tag: "B", pts, isDiag: false }];
}

function _raBuildClusterCandidates(r, side) {
  const { descentX, bundleY, planX, planY } = r;
  return [{
    tag: "C",
    pts: [[descentX, bundleY], [planX, planY]],
    isDiag: false,
  }];
}

function _raScoreAgainst(r, pts, others) {
  let p = 0, c = 0, tip = 0;
  const candSegs = _raPathSegments(pts);

  for (const q of others) {
    if (q === r) continue;
    if (!q.ownPts) continue;

    const sameGroup = (q.bundleIdx === r.bundleIdx &&
                       q.groupIdx  === r.groupIdx);
    const sameCluster = (r.clusterAttack && q.clusterAttack &&
                         r.clusterId >= 0 && r.clusterId === q.clusterId);

    if (!sameGroup && !sameCluster) {
      const s = _raPathPairScore(pts, q.ownPts);
      p += s.p; c += s.c;
    }

    if (sameCluster) continue;

    const qSegs = _raPathSegments(q.ownPts);
    tip += _raTipClearanceAgainstSegs(r.planX, r.planY, qSegs);
    tip += _raTipClearanceAgainstSegs(q.planX, q.planY, candSegs);
  }

  if (_raFrozenPolylines) {
    for (const fpts of _raFrozenPolylines) {
      const s = _raPathPairScore(pts, fpts);
      p += s.p; c += s.c;
      const fSegs = _raPathSegments(fpts);
      tip += _raTipClearanceAgainstSegs(r.planX, r.planY, fSegs);
    }
  }

  return { p, c, tip, total: p + c + tip };
}

function _raAssignShapes(side) {
  const sorted = side.routes.slice().sort((a, b) => a.planX - b.planX);

  const placed = [];
  for (const r of sorted) {
    const candidates = _raBuildCandidates(r, side);
    let best = null;
    for (const c of candidates) {
      const score = _raScoreAgainst(r, c.pts, placed);
      if (!best || score.total < best.score.total - 0.5) best = { c, score };
      if (!c.isDiag && score.total < ROUTE_ACCEPT_SCORE) break;
    }
    r.ownPts = best.c.pts;
    r.isDiag = best.c.isDiag;
    r.tag    = best.c.tag;
    placed.push(r);
  }

  for (let pass = 0; pass < ROUTE_PLACE_PASSES; pass++) {
    let changed = false;
    for (const r of sorted) {
      const others = sorted.filter(q => q !== r);
      const before = _raScoreAgainst(r, r.ownPts, others);
      const candidates = _raBuildCandidates(r, side);
      let best = null;
      for (const c of candidates) {
        const s = _raScoreAgainst(r, c.pts, others);
        if (!best || s.total < best.score.total - 0.5) best = { c, score: s };
      }
      if (best && best.score.total < before.total - 0.5) {
        r.ownPts = best.c.pts;
        r.isDiag = best.c.isDiag;
        r.tag    = best.c.tag;
        changed = true;
      }
    }
    if (!changed) break;
  }
}

/* ==========================================================================
   SECTION 5b — HIGH-CONFLICT REROUTE (PASS 6) AND REBUNDLE (PASS 6b)
   ========================================================================== */

function _raCountConflicts(r, allRoutes) {
  let nCross = 0, nParallel = 0, total = 0;
  let totalCross = 0, totalParallel = 0;
  for (const q of allRoutes) {
    if (q === r) continue;
    if (!q.ownPts) continue;
    const sameGroup = (q.bundleIdx === r.bundleIdx &&
                       q.groupIdx  === r.groupIdx);
    const sameCluster = (r.clusterAttack && q.clusterAttack &&
                         r.clusterId >= 0 && r.clusterId === q.clusterId);
    if (sameGroup || sameCluster) continue;
    const s = _raPathPairScore(r.ownPts, q.ownPts);
    const contrib = s.p + s.c;
    if (contrib > 0) {
      if (s.c > 0) nCross++;
      if (s.p > 0) nParallel++;
      totalCross += s.c;
      totalParallel += s.p;
      total += contrib;
    }
  }
  const n = nCross + nParallel;
  return { nCross, nParallel, n, total, totalCross, totalParallel };
}

function _raDetourPenalty(r, pts) {
  if (!pts || pts.length < 2) return 0;

  const directLen = Math.hypot(r.planX - r.descentX,
                               r.planY - r.bundleY);
  let totalLen = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    totalLen += Math.hypot(pts[i + 1][0] - pts[i][0],
                           pts[i + 1][1] - pts[i][1]);
  }
  const extraLen = Math.max(0, totalLen - directLen);

  let bendSum = 0;
  for (let i = 1; i < pts.length - 1; i++) {
    const ax = pts[i][0] - pts[i - 1][0];
    const ay = pts[i][1] - pts[i - 1][1];
    const bx = pts[i + 1][0] - pts[i][0];
    const by = pts[i + 1][1] - pts[i][1];
    const aLen = Math.hypot(ax, ay);
    const bLen = Math.hypot(bx, by);
    if (aLen < 0.5 || bLen < 0.5) continue;
    const cosA = Math.max(-1, Math.min(1,
      (ax * bx + ay * by) / (aLen * bLen)));
    bendSum += (1 - cosA);
  }

  return extraLen * REROUTE_LENGTH_W + bendSum * REROUTE_BEND_W;
}

function _raBuildDetourCandidates(r) {
  const startX = r.descentX, startY = r.bundleY;
  const endX   = r.planX,    endY   = r.planY;

  const vx = endX - startX, vy = endY - startY;
  const vLen = Math.hypot(vx, vy);
  if (vLen < 1) return [];

  const ux = vx / vLen, uy = vy / vLen;
  const nx = -uy, ny = ux;

  const perpExtent = Math.min(ROUTE_REROUTE_SPAN, vLen);
  const N = ROUTE_REROUTE_GRID_STEPS;
  const out = [];

  for (let i = 1; i < N; i++) {
    const t = i / N;
    const bx = startX + ux * vLen * t;
    const by = startY + uy * vLen * t;
    for (let j = 0; j < N; j++) {
      const s = ((j + 0.5) / N) * 2 - 1;
      const wx = bx + nx * perpExtent * s;
      const wy = by + ny * perpExtent * s;
      const pts = [ [startX, startY], [wx, wy], [endX, endY] ];
      out.push({ tag: "R", pts, wx, wy });
    }
  }
  return out;
}

function _raBuildRefineCandidates(r, centerW) {
  const startX = r.descentX, startY = r.bundleY;
  const endX   = r.planX,    endY   = r.planY;

  const vx = endX - startX, vy = endY - startY;
  const vLen = Math.hypot(vx, vy);
  if (vLen < 1) return [];

  const ux = vx / vLen, uy = vy / vLen;
  const nx = -uy, ny = ux;
  const perpExtent = Math.min(ROUTE_REROUTE_SPAN, vLen);

  const dxW = centerW[0] - startX;
  const dyW = centerW[1] - startY;
  const t0 = Math.max(0, Math.min(1, (dxW * ux + dyW * uy) / vLen));
  const s0 = (dxW * nx + dyW * ny) / (perpExtent || 1);

  const N = ROUTE_REROUTE_REFINE_STEPS;
  const stepT = 1 / ROUTE_REROUTE_GRID_STEPS;
  const stepS = 2 / ROUTE_REROUTE_GRID_STEPS;

  const out = [];
  for (let i = 0; i < N; i++) {
    const dt = (i / (N - 1) - 0.5) * stepT * 2;
    const t  = Math.max(0.05, Math.min(0.95, t0 + dt));
    const bx = startX + ux * vLen * t;
    const by = startY + uy * vLen * t;
    for (let j = 0; j < N; j++) {
      const ds = (j / (N - 1) - 0.5) * stepS * 2;
      const s  = Math.max(-1, Math.min(1, s0 + ds));
      const wx = bx + nx * perpExtent * s;
      const wy = by + ny * perpExtent * s;
      const pts = [ [startX, startY], [wx, wy], [endX, endY] ];
      out.push({ tag: "R", pts, wx, wy });
    }
  }
  return out;
}

function _raTryReroute(side, r) {
  const savedPts  = r.ownPts;
  const savedTag  = r.tag;
  const savedDiag = r.isDiag;

  const curScore = _raScoreSide(side).total;
  const curPen   = _raDetourPenalty(r, r.ownPts);
  const curTotal = curScore + curPen;

  let bestTotal = curTotal;
  let bestPts   = null;

  const coarse = _raBuildDetourCandidates(r);
  for (const cand of coarse) {
    r.ownPts = cand.pts;
    const s = _raScoreSide(side).total + _raDetourPenalty(r, cand.pts);
    if (s < bestTotal - 0.5) {
      bestTotal = s;
      bestPts   = cand.pts;
    }
  }

  if (bestPts) {
    const center = bestPts[1];
    const fine = _raBuildRefineCandidates(r, center);
    for (const cand of fine) {
      r.ownPts = cand.pts;
      const s = _raScoreSide(side).total + _raDetourPenalty(r, cand.pts);
      if (s < bestTotal - 0.5) {
        bestTotal = s;
        bestPts   = cand.pts;
      }
    }
  }

  if (bestPts && curTotal - bestTotal > ROUTE_REROUTE_ACCEPT) {
    r.ownPts = bestPts;
    r.tag    = "R";
    r.isDiag = false;
    return true;
  }

  r.ownPts = savedPts;
  r.tag    = savedTag;
  r.isDiag = savedDiag;
  return false;
}

function _raRerouteHighCrossers(side) {
  const routes = side.routes;
  const n = routes.length;
  if (n < 3) return false;

  const preScore  = _raScoreSide(side).total;
  const preOwnPts = routes.map(r => r.ownPts ? r.ownPts.slice() : null);
  const preTags   = routes.map(r => r.tag);
  const preIsDiag = routes.map(r => !!r.isDiag);

  const allCands = [];
  const breakdown = [];
  for (let i = 0; i < n; i++) {
    const r = routes[i];
    if (!r.ownPts) continue;
    if (r.clusterAttack) continue;
    const c = _raCountConflicts(r, routes);
    allCands.push({ ri: i, total: c.total, n: c.n,
                    nCross: c.nCross, nParallel: c.nParallel });
    breakdown.push({ ri: i,
                     nCross: c.nCross, nParallel: c.nParallel,
                     totalCross: c.totalCross,
                     totalParallel: c.totalParallel,
                     total: c.total });
  }
  allCands.sort((a, b) => b.total - a.total);

  const cands = allCands.slice(0, ROUTE_REROUTE_MAX_PER_SWEEP);

  side.rerouteInfo.candidates += cands.length;
  if (side.rerouteInfo.preScore == null) {
    side.rerouteInfo.preScore = preScore;
  }
  side.rerouteInfo.conflictTable = breakdown;

  let committed = 0;
  for (const entry of cands) {
    const r = routes[entry.ri];
    if (_raTryReroute(side, r)) committed++;
  }

  side.rerouteInfo.committed += committed;
  if (committed === 0) {
    if (side.rerouteInfo.postScore == null) {
      side.rerouteInfo.postScore = preScore;
    }
    return false;
  }

  const postScore = _raScoreSide(side).total;
  side.rerouteInfo.postScore = postScore;

  if (postScore >= preScore - 0.5) {
    for (let i = 0; i < n; i++) {
      if (preOwnPts[i]) routes[i].ownPts = preOwnPts[i];
      routes[i].tag    = preTags[i];
      routes[i].isDiag = preIsDiag[i];
    }
    side.rerouteInfo.committed -= committed;
    return false;
  }
  return true;
}

function _raRebundleAfterReroute(side) {
  let changed = false;
  const newBundles = [];

  for (const b of side.bundles) {
    const newGroups = [];

    for (const g of b.groups) {
      const rerouted = [];
      const kept     = [];

      for (const ri of g.routeIndices) {
        const r = side.routes[ri];
        if (r.tag === "R") rerouted.push(ri);
        else               kept.push(ri);
      }

      if (kept.length > 0) {
        newGroups.push({
          routeIndices: kept,
          descentX: g.descentX,
          attackBundled: !!g.attackBundled,
          trunkDir: g.trunkDir ? g.trunkDir.slice() : null,
          forceUnbundled: !!g.forceUnbundled,
        });
        if (rerouted.length > 0) changed = true;
      }

      for (const ri of rerouted) {
        newGroups.push({
          routeIndices: [ri],
          descentX: g.descentX,
          attackBundled: false,
          trunkDir: null,
          forceUnbundled: true,
        });
        changed = true;
      }
    }

    if (newGroups.length === 0) continue;

    const allRi = [];
    for (const gg of newGroups) {
      for (const ri of gg.routeIndices) allRi.push(ri);
    }
    const newBundle = { routeIndices: allRi, groups: newGroups,
                        upperHalf: !!b.upperHalf };
    if (b.isSatellite) {
      newBundle.isSatellite = true;
      newBundle.satelliteMinPlanY = b.satelliteMinPlanY;
    }
    newBundles.push(newBundle);
  }

  if (changed) {
    side.bundles = newBundles;
    _raRebuildRouteRefs(side);
    _raBundleFanOut(side);
  }
  return changed;
}

/* ==========================================================================
   SECTION 7 — SOLVER
   ========================================================================== */

function _raCloneSide(side) {
  return {
    bundles: side.bundles.map(b => {
      const bndl = {
        routeIndices: b.routeIndices.slice(),
        upperHalf: !!b.upperHalf,
        groups: b.groups.map(g => ({
          routeIndices: g.routeIndices.slice(),
          descentX: g.descentX,
          forceUnbundled: !!g.forceUnbundled,
          attackBundled:  !!g.attackBundled,
          trunkDir: g.trunkDir ? g.trunkDir.slice() : null,
        })),
      };
      if (b.isSatellite) {
        bndl.isSatellite = true;
        bndl.satelliteMinPlanY = b.satelliteMinPlanY;
      }
      return bndl;
    }),
    bundleSpacing: side.bundleSpacing,
    groupSpacing:  side.groupSpacing,
    peelStagger:   side.peelStagger,
    comX:          side.comX,
    comY:          side.comY,
    routeFlags:    side.routes.map(r => ({
      clusterAttack: !!r.clusterAttack,
    })),
    routeShapes: side.routes.map(r => ({
      ownPts:   r.ownPts ? r.ownPts.map(p => [p[0], p[1]]) : null,
      tag:      r.tag,
      isDiag:   !!r.isDiag,
      descentX: r.descentX,
      bundleY:  r.bundleY,
      baseBreak: (typeof r.baseBreak === "number") ? r.baseBreak : null,
      bundleFanRank:   (typeof r.bundleFanRank === "number")
                       ? r.bundleFanRank : 0,
      bundleJogOffset: (typeof r.bundleJogOffset === "number")
                       ? r.bundleJogOffset : 0,
    })),
  };
}

function _raRestoreSide(side, snap) {
  side.bundles = snap.bundles.map(b => {
    const bndl = {
      routeIndices: b.routeIndices.slice(),
      upperHalf: !!b.upperHalf,
      groups: b.groups.map(g => ({
        routeIndices: g.routeIndices.slice(),
        descentX: g.descentX,
        attackBundled: !!g.attackBundled,
        trunkDir: g.trunkDir ? g.trunkDir.slice() : null,
        forceUnbundled: !!g.forceUnbundled,
      })),
    };
    if (b.isSatellite) {
      bndl.isSatellite = true;
      bndl.satelliteMinPlanY = b.satelliteMinPlanY;
    }
    return bndl;
  });
  side.bundleSpacing = snap.bundleSpacing;
  side.groupSpacing  = snap.groupSpacing;
  side.peelStagger   = snap.peelStagger;
  if (typeof snap.comX === "number") side.comX = snap.comX;
  if (typeof snap.comY === "number") side.comY = snap.comY;

  if (snap.routeFlags) {
    for (let i = 0; i < side.routes.length; i++) {
      const f = snap.routeFlags[i];
      if (f) side.routes[i].clusterAttack = f.clusterAttack;
    }
  }

  if (snap.routeShapes) {
    for (let i = 0; i < side.routes.length; i++) {
      const s = snap.routeShapes[i];
      if (!s) continue;
      const r = side.routes[i];
      r.ownPts   = s.ownPts ? s.ownPts.map(p => [p[0], p[1]]) : null;
      r.tag      = s.tag;
      r.isDiag   = s.isDiag;
      r.descentX = s.descentX;
      r.bundleY  = s.bundleY;
      if (s.baseBreak !== null && s.baseBreak !== undefined) {
        r.baseBreak = s.baseBreak;
      }
      if (typeof s.bundleFanRank === "number") {
        r.bundleFanRank = s.bundleFanRank;
      }
      if (typeof s.bundleJogOffset === "number") {
        r.bundleJogOffset = s.bundleJogOffset;
      }
    }
  }

  _raRebuildRouteRefs(side);
}

function _raSolve(side) {
  if (!side.routes.length) return;

  let best = null;

  for (let iter = 0; iter < SOLVER_MAX_ITERATIONS; iter++) {
    _raLayoutSide(side);
    _raAssignShapes(side);
    const score = _raScoreSide(side);

    if (!best || score.total < best.score.total - 0.5) {
      best = { score, snapshot: _raCloneSide(side) };
    }

    if (score.total < SOLVER_ACCEPTABLE_SCORE &&
        score.attackParallel < SOLVER_ATTACK_PARALLEL_BUDGET &&
        score.clusterPenalty  < SOLVER_CLUSTER_BUDGET &&
        score.tipPenalty      < SOLVER_TIP_BUDGET) break;

    const action = _raChooseRefinement(side, score, iter);
    if (!action) break;
    _raApplyRefinement(side, action);
  }

  if (best) {
    _raRestoreSide(side, best.snapshot);
  }

  /* ---- Pass 10: merge long solo routes into nearby groups. ---- */
  _raEnforceLongRouteBundling(side);

  /* ---- Pass 11: force-bundle parallel attacks. ---- */
  _raForceBundleParallelAttacks(side);
  _raAssignShapes(side);

  /* ---- Pass 14 (pre-split): force cluster-attack on tight knots.
     Runs here so the flags are visible to the shape builder before
     Pass 13 repositions the long-attack satellites.  If it fires,
     re-run layout and shape assignment so the cluster-attack shapes
     are actually built. ---- */
  window.__tightClusterFlags = 0;
  if (_raForceTightClusterAttack(side) > 0) {
    _raLayoutSide(side);
    _raForceBundleParallelAttacks(side);
    _raAssignShapes(side);
  }

  /* ---- Pass 13: satellite bundle for long attacks. ----
     Now runs on every route including R-tagged ones, because the
     R-skip was removed from _raSplitLongAttackBundles (Fix A).  Long
     rerouted detours finally get their satellite. ---- */
  window.__longAttackSplits = 0;
  const splitCount = _raSplitLongAttackBundles(side);
  if (splitCount > 0) {
    window.__longAttackSplits = splitCount;
    _raLayoutSide(side);
    _raForceBundleParallelAttacks(side);
    _raAssignShapes(side);
  }

  /* ---- Pass 14 (post-split): re-run tight-knot detection.
     Pass 13 may have moved routes into new bundles; a knot that was
     hidden inside a mixed bundle before the split may now be
     exposed.  Re-flag if so. ---- */
  if (_raForceTightClusterAttack(side) > 0) {
    _raLayoutSide(side);
    _raForceBundleParallelAttacks(side);
    _raAssignShapes(side);
  }

  /* ---- Pass 12: iterated crossing reduction. ---- */
  _raReduceCrossings(side);

  if (!_raEscapeInProgress) {
    for (let p = 0; p < 2; p++) {
      if (!_raRerouteHighCrossers(side)) break;
      _raRebundleAfterReroute(side);
    }
    _raRebundleAfterReroute(side);
  }

  if (!_raEscapeInProgress) {
    side.escapeInfo.fans      = 0;
    side.escapeInfo.evacuees  = 0;
    side.escapeInfo.applied   = false;
    side.escapeInfo.preScore  = null;
    side.escapeInfo.postScore = null;

    for (let p = 0; p < ROUTE_ESCAPE_MAX_PASSES; p++) {
      if (!_raEscapeFans(side)) break;
    }
  }
}

function _raEscapeFans(side) {
  if (_raEscapeInProgress) return false;

  const fans = _raFindAttackFans(side);
  side.escapeInfo.fans += fans.length;
  if (!fans.length) {
    return false;
  }

  const fanMembers = new Set();
  const survivors = new Set();
  for (const fan of fans) {
    for (const ri of fan) fanMembers.add(ri);
    let best = -1, bestLen = Infinity;
    for (const ri of fan) {
      const r = side.routes[ri];
      if (!r.ownPts || r.ownPts.length < 2) continue;
      const a = r.ownPts[r.ownPts.length - 2];
      const b = r.ownPts[r.ownPts.length - 1];
      const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
      if (len < bestLen) { bestLen = len; best = ri; }
    }
    if (best >= 0) survivors.add(best);
  }

  const evacuees = new Set();
  for (const ri of fanMembers) {
    if (!survivors.has(ri)) evacuees.add(ri);
  }
  side.escapeInfo.evacuees += evacuees.size;
  if (evacuees.size === 0) {
    return false;
  }

  const preSnapshot = _raCloneSide(side);
  const preFlags = side.routes.map(r => ({
    escaped:  !!r.escaped,
    survivor: !!r.survivor,
  }));
  const preScore = _raScoreSide(side).total;
  if (side.escapeInfo.preScore == null) {
    side.escapeInfo.preScore = preScore;
  }

  const frozen = [];
  for (let i = 0; i < side.routes.length; i++) {
    if (evacuees.has(i)) continue;
    const r = side.routes[i];
    if (!r.ownPts || r.ownPts.length < 2) continue;
    const n = r.ownPts.length;
    const start = Math.max(0, n - 1 - ROUTE_ESCAPE_FROZEN_TAIL);
    frozen.push(r.ownPts.slice(start));
  }

  for (const b of side.bundles) {
    b.routeIndices = b.routeIndices.filter(ri => !evacuees.has(ri));
    for (const g of b.groups) {
      g.routeIndices = g.routeIndices.filter(ri => !evacuees.has(ri));
    }
    b.groups = b.groups.filter(g => g.routeIndices.length > 0);
  }
  side.bundles = side.bundles.filter(b => b.routeIndices.length > 0);

  const evacRoutes = [];
  for (let i = 0; i < side.routes.length; i++) {
    if (evacuees.has(i)) evacRoutes.push(side.routes[i]);
  }

  const subSide = {
    routes: evacRoutes,
    bundles: [],
    bundleSpacing: ROUTE_BUNDLE_SPACING_MIN,
    groupSpacing:  ROUTE_GROUP_SPACING_MIN,
    peelStagger:   ROUTE_PEEL_STAGGER_MIN,
    clusters:      [],
    comX:          side.comX,
    comY:          side.comY,
    escapeInfo:    { fans: 0, evacuees: 0, applied: false,
                     preScore: null, postScore: null },
    rerouteInfo:   { candidates: 0, committed: 0,
                     preScore: null, postScore: null,
                     conflictTable: null },
  };
  _raProposeInitialBundles(subSide);
  _raFindPlanClusters(subSide);

  _raEscapeInProgress = true;
  try {
    _raFrozenPolylines = frozen;
    _raSolve(subSide);
  } finally {
    _raEscapeInProgress = false;
    _raFrozenPolylines = null;
  }

  for (const b of subSide.bundles) {
    const newBundle = {
      routeIndices: b.routeIndices.map(ri =>
        side.routes.indexOf(subSide.routes[ri])),
      upperHalf: !!b.upperHalf,
      groups: b.groups.map(g => ({
        routeIndices: g.routeIndices.map(ri =>
          side.routes.indexOf(subSide.routes[ri])),
        descentX: g.descentX,
        attackBundled: !!g.attackBundled,
        trunkDir: g.trunkDir ? g.trunkDir.slice() : null,
        forceUnbundled: !!g.forceUnbundled,
      })),
    };
    if (b.isSatellite) {
      newBundle.isSatellite = true;
      newBundle.satelliteMinPlanY = b.satelliteMinPlanY;
    }
    side.bundles.push(newBundle);
  }
  _raRebuildRouteRefs(side);
  _raBundleFanOut(side);

  const postScore = _raScoreSide(side).total;
  side.escapeInfo.postScore = postScore;

  if (postScore >= preScore) {
    _raRestoreSide(side, preSnapshot);
    for (let i = 0; i < side.routes.length; i++) {
      side.routes[i].escaped  = preFlags[i].escaped;
      side.routes[i].survivor = preFlags[i].survivor;
    }
    side.escapeInfo.applied = false;
    return false;
  }

  for (const ri of evacuees)  side.routes[ri].escaped  = true;
  for (const ri of survivors) side.routes[ri].survivor = true;
  side.escapeInfo.applied = true;
  return true;
}

function _raChooseRefinement(side, score, iter) {
  if (iter >= SOLVER_CLUSTER_EARLY_ITER &&
      score.clusterPenalty > SOLVER_CLUSTER_BUDGET) {
    const cluster = _raFindClusterToFix(side);
    if (cluster) return { type: "enableClusterAttack", cluster };
  }

  const mergePair = _raFindParallelNearGroupPair(side);
  if (mergePair) {
    return { type: "mergeGroups", pair: mergePair };
  }

  const crowdedGroup = _raFindCrowdedGroup(side);
  if (crowdedGroup) {
    return { type: "splitGroup",
             bundleIdx: crowdedGroup.b, groupIdx: crowdedGroup.g };
  }

  const crowdedBundle = _raFindCrowdedBundle(side);
  if (crowdedBundle >= 0) {
    return { type: "splitBundle", index: crowdedBundle };
  }

  if ((score.parallel > SOLVER_PARALLEL_BUDGET ||
       score.bundlePenalty > SOLVER_BUNDLE_SPACING_BUDGET) &&
      side.bundleSpacing < SOLVER_MAX_BUNDLE_SPACING) {
    return { type: "growBundleSpacing" };
  }

  if ((score.crossing > SOLVER_CROSSING_BUDGET ||
       score.groupPenalty > 0) &&
      side.groupSpacing < SOLVER_MAX_GROUP_SPACING) {
    return { type: "growGroupSpacing" };
  }

  if (score.attackParallel > SOLVER_ATTACK_PARALLEL_BUDGET &&
      side.peelStagger < ROUTE_PEEL_STAGGER_MAX) {
    return { type: "growPeelStagger" };
  }

  if (score.crossing > SOLVER_CROSSING_BUDGET ||
      score.tipPenalty > SOLVER_TIP_BUDGET) {
    const g = _raFindBundledGroupToUnbundle(side);
    if (g) return { type: "unbundleGroup",
                    bundleIdx: g.b, groupIdx: g.g };
  }

  if (score.clusterPenalty > SOLVER_CLUSTER_BUDGET ||
      score.tipPenalty > SOLVER_TIP_BUDGET) {
    const cluster = _raFindClusterToFix(side);
    if (cluster) return { type: "enableClusterAttack", cluster };
  }

  if (score.total > SOLVER_ACCEPTABLE_SCORE) {
    const bIdx = _raFindLargestBundle(side);
    if (bIdx >= 0) return { type: "splitBundle", index: bIdx };
  }
  if (score.total > SOLVER_ACCEPTABLE_SCORE) {
    const bg = _raFindLargestGroup(side);
    if (bg) return { type: "splitGroup", bundleIdx: bg.b, groupIdx: bg.g };
  }
  return null;
}

function _raApplyRefinement(side, action) {
  if (action.type === "growBundleSpacing") {
    side.bundleSpacing += SOLVER_BUNDLE_SPACING_STEP;
  } else if (action.type === "growGroupSpacing") {
    side.groupSpacing += SOLVER_GROUP_SPACING_STEP;
  } else if (action.type === "growPeelStagger") {
    side.peelStagger += ROUTE_PEEL_STAGGER_STEP;
  } else if (action.type === "unbundleGroup") {
    const b = side.bundles[action.bundleIdx];
    if (!b) return;
    const g = b.groups[action.groupIdx];
    if (!g) return;
    g.forceUnbundled = true;
    g.attackBundled = false;
    g.trunkDir = null;
  } else if (action.type === "enableClusterAttack") {
    for (const ri of action.cluster) {
      side.routes[ri].clusterAttack = true;
    }
    _raAssignClusterY(side);
  } else if (action.type === "splitBundle") {
    const b = side.bundles[action.index];
    if (!b || b.routeIndices.length < 2) return;
    const sorted = b.routeIndices.slice()
      .sort((i, j) => side.routes[i].planX - side.routes[j].planX);
    const mid = Math.ceil(sorted.length / 2);
    const left  = sorted.slice(0, mid);
    const right = sorted.slice(mid);
    b.routeIndices = left;
    b.groups = [{ routeIndices: left.slice(), descentX: 0,
                  attackBundled: false, trunkDir: null,
                  forceUnbundled: false }];
    const newBundle = {
      routeIndices: right,
      upperHalf: !!b.upperHalf,
      groups: [{ routeIndices: right.slice(), descentX: 0,
                 attackBundled: false, trunkDir: null,
                 forceUnbundled: false }],
    };
    if (b.isSatellite) {
      newBundle.isSatellite = true;
      newBundle.satelliteMinPlanY = b.satelliteMinPlanY;
    }
    side.bundles.splice(action.index + 1, 0, newBundle);
  } else if (action.type === "splitGroup") {
    const b = side.bundles[action.bundleIdx];
    if (!b) return;
    const g = b.groups[action.groupIdx];
    if (!g || g.routeIndices.length < 2) return;
    const sorted = g.routeIndices.slice()
      .sort((i, j) => side.routes[i].planX - side.routes[j].planX);
    const mid = Math.ceil(sorted.length / 2);
    const left  = sorted.slice(0, mid);
    const right = sorted.slice(mid);
    g.routeIndices = left;
    b.groups.splice(action.groupIdx + 1, 0, {
      routeIndices: right,
      descentX: g.descentX,
      attackBundled: false,
      trunkDir: null,
      forceUnbundled: !!g.forceUnbundled,
    });
  } else if (action.type === "mergeGroups") {
    const b = side.bundles[action.pair.bundleIdx];
    if (!b) return;
    const gi = Math.min(action.pair.gi, action.pair.gj);
    const gj = Math.max(action.pair.gi, action.pair.gj);
    const ga = b.groups[gi], gb = b.groups[gj];
    if (!ga || !gb) return;
    const merged = ga.routeIndices.concat(gb.routeIndices);
    const newX = (ga.descentX + gb.descentX) / 2;
    const newGroup = { routeIndices: merged, descentX: newX,
                       attackBundled: false, trunkDir: null,
                       forceUnbundled: false };
    b.groups.splice(gj, 1);
    b.groups.splice(gi, 1, newGroup);
  }
}

function _raFindLargestBundle(side) {
  let bestIdx = -1, bestSize = 1;
  for (let i = 0; i < side.bundles.length; i++) {
    if (side.bundles[i].routeIndices.length > bestSize) {
      bestSize = side.bundles[i].routeIndices.length;
      bestIdx = i;
    }
  }
  return bestIdx;
}

function _raFindLargestGroup(side) {
  let best = null, bestSize = 1;
  for (let bi = 0; bi < side.bundles.length; bi++) {
    const b = side.bundles[bi];
    for (let gi = 0; gi < b.groups.length; gi++) {
      const g = b.groups[gi];
      if (g.routeIndices.length > bestSize) {
        bestSize = g.routeIndices.length;
        best = { b: bi, g: gi };
      }
    }
  }
  return best;
}

function _raFindCrowdedGroup(side) {
  for (let bi = 0; bi < side.bundles.length; bi++) {
    const b = side.bundles[bi];
    for (let gi = 0; gi < b.groups.length; gi++) {
      if (b.groups[gi].routeIndices.length > SOLVER_GROUP_MAX_ROUTES) {
        return { b: bi, g: gi };
      }
    }
  }
  return null;
}

function _raFindCrowdedBundle(side) {
  for (let bi = 0; bi < side.bundles.length; bi++) {
    if (side.bundles[bi].routeIndices.length > SOLVER_BUNDLE_MAX_ROUTES) {
      return bi;
    }
  }
  return -1;
}

function _raFindParallelNearGroupPair(side) {
  for (let bi = 0; bi < side.bundles.length; bi++) {
    const b = side.bundles[bi];
    for (let i = 0; i < b.groups.length; i++) {
      for (let j = i + 1; j < b.groups.length; j++) {
        const ga = b.groups[i], gb = b.groups[j];
        const dx = Math.abs(ga.descentX - gb.descentX);
        if (dx >= SOLVER_MERGE_THRESHOLD) continue;
        const ya = _raGroupYRange(side, ga);
        const yb = _raGroupYRange(side, gb);
        if (ya[1] < yb[0] + 2 || yb[1] < ya[0] + 2) continue;
        return { bundleIdx: bi, gi: i, gj: j, dX: dx };
      }
    }
  }
  return null;
}

function _raGroupYRange(side, group) {
  let lo = Infinity, hi = -Infinity;
  for (const ri of group.routeIndices) {
    const r = side.routes[ri];
    if (r.bundleY != null) { lo = Math.min(lo, r.bundleY); }
    hi = Math.max(hi, r.planY);
  }
  if (lo === Infinity) lo = 0;
  return [lo, hi];
}

function _raFindBundledGroupToUnbundle(side) {
  let best = null, bestSize = 0;
  for (let bi = 0; bi < side.bundles.length; bi++) {
    const b = side.bundles[bi];
    for (let gi = 0; gi < b.groups.length; gi++) {
      const g = b.groups[gi];
      if (!g.attackBundled) continue;
      if (g.forceUnbundled) continue;
      const n = g.routeIndices.length;
      if (n > bestSize) {
        bestSize = n;
        best = { b: bi, g: gi };
      }
    }
  }
  return best;
}

function _raFindClusterToFix(side) {
  let best = null, bestScore = 0;
  for (const cluster of side.clusters || []) {
    let signal = 0;
    let anyUnflagged = false;
    for (const ri of cluster) {
      const r = side.routes[ri];
      if (r.clusterAttack) continue;
      anyUnflagged = true;
      if (!r.ownPts || r.ownPts.length < 2) continue;
      const p0 = r.ownPts[r.ownPts.length - 2];
      const p1 = r.ownPts[r.ownPts.length - 1];
      const len = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]);
      if (len > ROUTE_LAST_SEG_MIN * ROUTE_CLUSTER_LONG_MULT) signal++;
    }
    if (!anyUnflagged) continue;
    if (signal > bestScore) {
      bestScore = signal;
      best = cluster;
    }
  }
  return best;
}

/* ==========================================================================
   SECTION 8 — DRAWING
   ========================================================================== */

function _raDrawArrowhead(x, y, dx, dy, color) {
  const size = 8, halfW = 4;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len;
  const px = -uy, py = ux;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - ux * size + px * halfW, y - uy * size + py * halfW);
  ctx.lineTo(x - ux * size - px * halfW, y - uy * size - py * halfW);
  ctx.closePath();
  ctx.save();
  ctx.strokeStyle = PALETTE.paper;
  ctx.lineWidth = 3;
  ctx.lineJoin = "round";
  ctx.stroke();
  ctx.restore();
  ctx.fillStyle = color;
  ctx.fill();
}

function _raBuildTrunkPath(r) {
  ctx.beginPath();
  ctx.moveTo(r.stripX,    r.stripBaseY);
  ctx.lineTo(r.stripX,    r.stripRouteY);
  ctx.lineTo(r.corridorX, r.stripRouteY);
  ctx.lineTo(r.corridorX, r.bundleY);
}

function _raBuildDestPath(r) {
  ctx.beginPath();
  ctx.moveTo(r.corridorX, r.bundleY);
  ctx.lineTo(r.descentX,  r.bundleY);
  if (r.ownPts && r.ownPts.length) {
    for (let i = 1; i < r.ownPts.length; i++) {
      ctx.lineTo(r.ownPts[i][0], r.ownPts[i][1]);
    }
  }
}

function _raClipToFloorBand() {
  ctx.beginPath();
  ctx.rect(0, 0, window.innerWidth, layout.dividerY);
  ctx.clip();
}

function _raDrawRoutePath(r, emphasized) {
  const inkW  = emphasized ? 2.4 : 1.4;
  const haloW = emphasized ? 5.2 : 3.4;

  ctx.save();
  ctx.lineJoin = "round";
  ctx.lineCap  = "round";

  _raBuildTrunkPath(r);
  ctx.strokeStyle = PALETTE.paper;
  ctx.lineWidth   = haloW;
  ctx.stroke();

  ctx.save();
  _raClipToFloorBand();
  _raBuildDestPath(r);
  ctx.strokeStyle = PALETTE.paper;
  ctx.lineWidth   = haloW;
  ctx.stroke();
  ctx.restore();

  _raBuildTrunkPath(r);
  ctx.strokeStyle = PALETTE.transit;
  ctx.lineWidth   = inkW;
  ctx.stroke();

  ctx.save();
  _raClipToFloorBand();
  _raBuildDestPath(r);
  ctx.strokeStyle = PALETTE.transit;
  ctx.lineWidth   = inkW;
  ctx.stroke();

  let adx = r.sign, ady = 0;
  const pts = r.ownPts || [];
  if (pts.length >= 2) {
    const a = pts[pts.length - 2];
    const b = pts[pts.length - 1];
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const L = Math.hypot(dx, dy) || 1;
    adx = dx / L; ady = dy / L;
  }
  _raDrawArrowhead(r.planX, r.planY, adx, ady, PALETTE.transit);
  ctx.restore();

  ctx.restore();
}

function _raDrawEndpointDot(x, y, r) {
  ctx.beginPath();
  ctx.arc(x, y, r + 2, 0, Math.PI * 2);
  ctx.fillStyle = PALETTE.paper;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = PALETTE.transit;
  ctx.fill();
}


/* ==========================================================================
   SECTION 9 — PREPARE ROUTES
   ========================================================================== */

function _raPrepareRoutes() {
  const routes = [];
  const midX = (GEOMETRY.bounds.minX + GEOMETRY.bounds.maxX) / 2;
  const stripBaseY  = viewWall.ty;
  const stripRouteY = stripBaseY + router.ESCAPE_DROP;

  for (let i = 0; i < WALL.segments.length; i++) {
    if (isSegHidden(i)) continue;
    const s = WALL.segments[i];
    const wxMid = (s.a[0] + s.b[0]) / 2;
    const wyMid = (s.a[1] + s.b[1]) / 2;
    const uMid  = (s.u0 + s.u1) / 2;
    const [stripX] = w2sWall(uMid, 0);
    const [planX, planY] = w2sFloor(wxMid, wyMid);
    const useLeft = (wxMid < midX);
    routes.push({
      stripX, stripBaseY, stripRouteY,
      planX, planY, useLeft, segIdx: i,
      corridorX: useLeft ? router.leftBaseX : router.rightBaseX,
      sign: useLeft ? 1 : -1,
      bundleIdx: 0, groupIdx: 0, peelRank: 0,
      bundleY: 0, descentX: 0, baseBreak: null,
      bundleFanRank: 0,
      bundleJogOffset: 0,
      isDiag: false, ownPts: null, tag: "L0",
      clusterId: -1,
      clusterAttack: false,
      clusterY: null,
      clusterDropX: null,
