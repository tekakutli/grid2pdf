      clusterRank: 0,
      clusterSize: 1,
      quadrant: -1,
      upperHalf: true,
      escaped: false,
      survivor: false,
    });
  }
  return routes;
}


/* ==========================================================================
   SECTION 11 — HIT TESTING
   ========================================================================== */

function hitTestRoute(sx, sy) {
  if (!_raArrowsEnabled) return null;
  if (!routeCache.length) return null;
  const TOL = 6;
  let best = null, bestDist = TOL;
  for (const r of routeCache) {
    const pts = [
      [r.stripX,    r.stripBaseY],
      [r.stripX,    r.stripRouteY],
      [r.corridorX, r.stripRouteY],
      [r.corridorX, r.bundleY],
      [r.descentX,  r.bundleY],
    ];
    if (r.ownPts) {
      for (let i = 1; i < r.ownPts.length; i++) pts.push(r.ownPts[i]);
    }
    for (let i = 0; i < pts.length - 1; i++) {
      const d = pointToSegmentDist(sx, sy,
        pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]);
      if (d < bestDist) { bestDist = d; best = r; }
    }
  }
  return best;
}


/* ==========================================================================
   SECTION 10 — BATCH DRAW
   ==========================================================================
   The batch painter lives here (rather than in pg_arrows_entry) because
   it is a drawing routine; the entry module calls it as its final step
   and never inspects its contents. */

function _raDrawAllRoutes() {
  ctx.save();
  ctx.lineJoin = "miter";
  ctx.lineCap  = "round";
  for (const r of routeCache) {
    _raDrawRoutePath(r);
    _raDrawEndpointDot(r.stripX, r.stripBaseY, 3);
  }
  ctx.restore();

  const hl = state.hoveredRoute;
  if (hl && !isSegHidden(hl.segIdx)) {
    ctx.save();
    _raDrawRoutePath(hl, true);
    _raDrawEndpointDot(hl.stripX, hl.stripBaseY, 5);
    ctx.save();
    _raClipToFloorBand();
    _raDrawEndpointDot(hl.planX, hl.planY, 5);
    ctx.restore();
    ctx.restore();
  }
}

/* ==========================================================================
   SECTION 10 — PUBLIC ENTRY POINT
   ========================================================================== */

let _raArrowsEnabled = true;

const _raTransCache = {
  topoSig:     null,
  floorScale:  1,
  floorTx:     0,
  floorTy:     0,
  wallScaleX:  1,
  wallScaleY:  1,
  wallTx:      0,
  wallTy:      0,
  routes:      null,
  lastSolveMs: 0,
};

function _raQuantize(v, prec) {
  return Math.round(v / prec) * prec;
}

/* Topology signature — the identity of a solve.

   The signature must change only when the SOLVE would produce a
   different result.  The solver reads only floor-space fields and the
   tuning constants; the four strip-space fields (stripX, stripBaseY,
   stripRouteY, corridorX) are written at solve time and thereafter
   only read by the drawing and hit-test code, so a change to either
   view's transform can be absorbed by transforming them in place.

   That leaves the following as the solve's real dependencies:

     • the viewport size and DPR         — affects GEOMETRY.bounds fit
     • the room's plan bounds            — ditto
     • the layout bands                  — bundleY base, screen min
     • the wall-segment table            — WALL.segments
     • router.ESCAPE_DROP                — stripRouteY offset

   Notably absent:

     • viewFloor.scale / tx / ty
     • viewWall.scaleX / scaleY / zoom / tx / ty
     • router.leftBaseX / rightBaseX

   These were in earlier revisions.  Keeping them there forced a full
   re-solve on every pan and every zoom tick of either view.  All of
   them are now handled by _raApplyFloorAffine / _raApplyWallAffine on
   the cached routes. */
function _raTopologySig() {
  const p = RA_SOLVE_SIGNATURE_PRECISION;
  const parts = [];

  parts.push('vp' + window.innerWidth + 'x' + window.innerHeight);
  parts.push('dpr' + (window.devicePixelRatio || 1).toFixed(2));

  const b = GEOMETRY.bounds;
  parts.push('gb'
    + _raQuantize(b.minX, p) + ','
    + _raQuantize(b.maxX, p) + ','
    + _raQuantize(b.minY, p) + ','
    + _raQuantize(b.maxY, p));

  parts.push('lo' + layout.dividerY
                  + ',' + layout.wallY
                  + ',' + layout.wallH
                  + ',' + layout.floorH);

  parts.push('r' + router.ESCAPE_DROP);

  parts.push('ws' + WALL.segments.length);
  for (let i = 0; i < WALL.segments.length; i++) {
    const s = WALL.segments[i];
    parts.push(
      (isSegHidden(i) ? 'h' : 'v')
      + _raQuantize(s.a[0], p) + ',' + _raQuantize(s.a[1], p)
      + _raQuantize(s.b[0], p) + ',' + _raQuantize(s.b[1], p)
      + _raQuantize(s.u0, 0.1) + ',' + _raQuantize(s.u1, 0.1));
  }

  return parts.join('|');
}

/* Apply a floor-view scale + translation to the floor-space fields of
   every cached route: planX, planY, descentX, bundleY, and every
   point in ownPts.

   w2sFloor(x, y) = [x·scale + tx, −y·scale + ty].  Under a floor
   view change from (scale0, tx0, ty0) to (scale1, tx1, ty1):

     planX_new = planX_old·k + (tx1 − tx0·k)
     planY_new = planY_old·k + (ty1 − ty0·k)   with k = scale1/scale0

   The four strip-space fields are untouched: they carry u/v
   coordinates that a floor-view change does not affect. */
function _raApplyFloorAffine(routes, s0, tx0, ty0, s1, tx1, ty1) {
  if (s0 <= 0) s0 = s1;
  const k  = s1 / s0;
  const dx = tx1 - tx0 * k;
  const dy = ty1 - ty0 * k;

  for (const r of routes) {
    r.planX    = r.planX    * k + dx;
    r.planY    = r.planY    * k + dy;
    r.descentX = r.descentX * k + dx;
    r.bundleY  = r.bundleY  * k + dy;
    if (r.ownPts) {
      for (const pt of r.ownPts) {
        pt[0] = pt[0] * k + dx;
        pt[1] = pt[1] * k + dy;
      }
    }
  }
}

/* Apply a wall-view scale + translation to the four strip-space
   fields of every cached route.

   w2sWall(u, v) = [u·scaleX + tx, −v·scaleY + ty].  Under a wall
   view change:

     stripX_new = (stripX_old − tx0)·kX + tx1
     where kX = scaleX1 / scaleX0.  Rearranged:

       stripX_new = stripX_old·kX + (tx1 − tx0·kX)

   so stripX takes the usual scale-about-a-shifted-origin form.

   stripBaseY and stripRouteY are row-space values — viewWall.ty and
   viewWall.ty + ESCAPE_DROP — so they shift by (ty1 − ty0) and
   never scale.

   corridorX is NOT a fixed strip-mm point: it is a fixed SCREEN
   offset from the strip's edge (12 px left of tx, or 12 px right of
   tx + totalU·scaleX).  It therefore cannot be derived by scaling
   an old value; it has to be re-read from router.leftBaseX /
   router.rightBaseX, which fitViews has already updated.  Each
   route's useLeft flag selects which one to take.

   The floor-space fields are untouched by a wall-view change.  The
   two transforms compose cleanly when both views move in the same
   frame: they write disjoint field sets. */
function _raApplyWallAffine(routes,
                            s0x, s0y, tx0, ty0,
                            s1x, s1y, tx1, ty1) {
  if (s0x <= 0) s0x = s1x;
  const kx = s1x / s0x;
  const cx = tx1 - tx0 * kx;   // stripX_new = stripX_old·kx + cx
  const dy = ty1 - ty0;        // stripBaseY / stripRouteY translate

  const lb = router.leftBaseX;
  const rb = router.rightBaseX;

  for (const r of routes) {
    r.stripX      = r.stripX      * kx + cx;
    r.stripBaseY  = r.stripBaseY  + dy;
    r.stripRouteY = r.stripRouteY + dy;
    r.corridorX   = r.useLeft ? lb : rb;
  }
  void s0y; void s1y;   // y scale is intentionally not used
}

window.__arrowForceResolve = function () {
  _raTransCache.topoSig = null;
  _raTransCache.routes = null;
  _raTransCache.lastSolveMs = 0;
};

function drawWallToPlanArrows() {
  if (!WALL.segments.length) {
    routeCache = [];
    return;
  }

  window.__arrowCacheStats = window.__arrowCacheStats
    || { reuse: 0, transformed: 0, misses: 0, skips: 0 };

  const topoSig = _raTopologySig();
  const fs   = viewFloor.scale;
  const ftx  = viewFloor.tx;
  const fty  = viewFloor.ty;
  const wsx  = viewWall.scaleX;
  const wsy  = viewWall.scaleY;
  const wtx  = viewWall.tx;
  const wty  = viewWall.ty;
  const now  = (typeof performance !== 'undefined')
               ? performance.now() : Date.now();

  if (topoSig === _raTransCache.topoSig && _raTransCache.routes) {
    const floorMoved =
      fs  !== _raTransCache.floorScale ||
      ftx !== _raTransCache.floorTx    ||
      fty !== _raTransCache.floorTy;

    const wallMoved =
      wsx !== _raTransCache.wallScaleX ||
      wsy !== _raTransCache.wallScaleY ||
      wtx !== _raTransCache.wallTx     ||
      wty !== _raTransCache.wallTy;

    /* Whole-cache fast path: neither view has moved.  Nothing to
       transform, nothing to re-solve — just redraw the cached
       routes. */
    if (!floorMoved && !wallMoved) {
      window.__arrowCacheStats.reuse++;
      if (_raArrowsEnabled) {
        routeCache = _raTransCache.routes;
        _raDrawAllRoutes();
      }
      return;
    }

    /* One or both views have moved rigidly (pan) or affinely (zoom).
       Apply the matching transform to the cached routes in place,
       then draw.

       The two transforms touch disjoint field sets, so they compose
       correctly when both views move in the same frame:

         _raApplyFloorAffine  writes planX, planY, descentX,
                              bundleY, ownPts            (floor-space)
         _raApplyWallAffine   writes stripX, stripBaseY,
                              stripRouteY, corridorX     (strip-space)

       The solver reads only floor-space fields; its decisions are
       invariant under either transform. */
    if (floorMoved) {
      _raApplyFloorAffine(
        _raTransCache.routes,
        _raTransCache.floorScale,
        _raTransCache.floorTx,
        _raTransCache.floorTy,
        fs, ftx, fty);
      _raTransCache.floorScale = fs;
      _raTransCache.floorTx    = ftx;
      _raTransCache.floorTy    = fty;
    }

    if (wallMoved) {
      _raApplyWallAffine(
        _raTransCache.routes,
        _raTransCache.wallScaleX,
        _raTransCache.wallScaleY,
        _raTransCache.wallTx,
        _raTransCache.wallTy,
        wsx, wsy, wtx, wty);
      _raTransCache.wallScaleX = wsx;
      _raTransCache.wallScaleY = wsy;
      _raTransCache.wallTx     = wtx;
      _raTransCache.wallTy     = wty;
    }

    window.__arrowCacheStats.transformed++;
    if (_raArrowsEnabled) {
      routeCache = _raTransCache.routes;
      _raDrawAllRoutes();
    }
    return;
  }

  if (_raTransCache.routes
      && (now - _raTransCache.lastSolveMs) < RA_SOLVE_DEBOUNCE_MS) {
    window.__arrowCacheStats.skips++;
    if (_raArrowsEnabled) {
      routeCache = _raTransCache.routes;
      _raDrawAllRoutes();
    }
    return;
  }

  if (!_raArrowsEnabled) return;

  window.__arrowCacheStats.misses++;
  routeCache = [];

  /* The tuning constants are held at their base values.  They are
     compared against floor-screen px inside _raScoreSide and
     _raSegmentPairScore, where floor zoom is already accounted for by
     the geometry itself; coupling them to the wall-view zoom was an
     earlier design choice, and it is what forced a full re-solve on
     every wheel tick of the wall view.  With both views now handled
     by their affine transform on the cache, the constants must not
     vary with either. */
  _raSetZoom(1);

  const allRoutes = _raPrepareRoutes();
  const sides = _raBuildSides(allRoutes);

  _raSolve(sides.left);
  _raSolve(sides.right);

  for (const r of allRoutes) routeCache.push(r);

  _raTransCache.topoSig     = topoSig;
  _raTransCache.floorScale  = fs;
  _raTransCache.floorTx     = ftx;
  _raTransCache.floorTy     = fty;
  _raTransCache.wallScaleX  = wsx;
  _raTransCache.wallScaleY  = wsy;
  _raTransCache.wallTx      = wtx;
  _raTransCache.wallTy      = wty;
  _raTransCache.routes      = routeCache;
  _raTransCache.lastSolveMs = now;

  _raDrawAllRoutes();
}

/* ==========================================================================
   SECTION 12 — DIAGNOSTICS
   ========================================================================== */

window.__arrowsDiag  = null;
window.__arrowsSides = null;

function _radSegsTable() {
  const out = [];
  for (let i = 0; i < WALL.segments.length; i++) {
    if (isSegHidden(i)) continue;
    const s = WALL.segments[i];
    out.push({
      idx: i,
      tag: s.tag || ('seg' + i),
      kind: s.kind || 'wall',
      a: s.a.slice(),
      b: s.b.slice(),
      mid: [(s.a[0] + s.b[0]) / 2, (s.a[1] + s.b[1]) / 2],
      len: s.len,
      u0: s.u0, u1: s.u1,
      z_lo: s.z_lo, z_hi: s.z_hi,
    });
  }
  return out;
}

function _radRouteRow(r, idx) {
  const s = WALL.segments[r.segIdx];
  const wxMid = s ? (s.a[0] + s.b[0]) / 2 : null;
  const wyMid = s ? (s.a[1] + s.b[1]) / 2 : null;

  let attackLen = null, attackAngleDeg = null;
  if (r.ownPts && r.ownPts.length >= 2) {
    const a = r.ownPts[r.ownPts.length - 2];
    const b = r.ownPts[r.ownPts.length - 1];
    attackLen = +Math.hypot(b[0] - a[0], b[1] - a[1]).toFixed(1);
    attackAngleDeg = +(Math.atan2(b[1] - a[1], b[0] - a[0])
                       * 180 / Math.PI).toFixed(1);
  }

  let groupAttackBundled = false;
  let groupForceUnbundled = false;
  let groupTrunkDir = null;
  let groupSize = 0;
  let bundleIsSatellite = false;
  let bundleUpperHalf = true;
  const sides = window.__arrowsSides;
  if (sides) {
    const side = r.useLeft ? sides.left : sides.right;
    if (side) {
      const b = side.bundles[r.bundleIdx];
      const g = b ? b.groups[r.groupIdx] : null;
      if (b) {
        bundleIsSatellite = !!b.isSatellite;
        bundleUpperHalf = !!b.upperHalf;
      }
      if (g) {
        groupAttackBundled = !!g.attackBundled;
        groupForceUnbundled = !!g.forceUnbundled;
        groupTrunkDir = g.trunkDir || null;
        groupSize = g.routeIndices.length;
      }
    }
  }

  return {
    idx,
    segIdx: r.segIdx,
    segTag: s ? s.tag : '?',
    segKind: s ? (s.kind || 'wall') : '?',
    segLen: s ? +s.len.toFixed(1) : null,
    worldMid: (wxMid !== null)
      ? [+wxMid.toFixed(0), +wyMid.toFixed(0)] : null,

    side: r.useLeft ? 'L' : 'R',
    quadrant: r.quadrant,
    upperHalf: !!r.upperHalf,
    stripX: +r.stripX.toFixed(1),
    planX: +r.planX.toFixed(1),
    planY: +r.planY.toFixed(1),

    bundleIdx: r.bundleIdx,
    groupIdx: r.groupIdx,
    groupSize,
    bundleIsSatellite,
    bundleUpperHalf,
    peelRank: r.peelRank,
    bundleY: +r.bundleY.toFixed(1),
    baseBreak: (typeof r.baseBreak === 'number')
      ? +r.baseBreak.toFixed(1) : null,
    bundleFanRank: (typeof r.bundleFanRank === 'number')
      ? +r.bundleFanRank.toFixed(2) : null,
    bundleJogOffset: (typeof r.bundleJogOffset === 'number')
      ? +r.bundleJogOffset.toFixed(1) : 0,
    descentX: +r.descentX.toFixed(1),

    clusterId: r.clusterId,
    clusterAttack: !!r.clusterAttack,
    clusterY: (typeof r.clusterY === 'number')
      ? +r.clusterY.toFixed(1) : null,
    clusterDropX: (typeof r.clusterDropX === 'number')
      ? +r.clusterDropX.toFixed(1) : null,
    clusterRank: (typeof r.clusterRank === 'number')
      ? r.clusterRank : null,
    clusterSize: (typeof r.clusterSize === 'number')
      ? r.clusterSize : null,

    groupAttackBundled,
    groupForceUnbundled,
    groupTrunkDir,

    escaped:  !!r.escaped,
    survivor: !!r.survivor,

    tag: r.tag,
    isDiag: !!r.isDiag,
    attackLen,
    attackAngleDeg,
    pts: r.ownPts
      ? r.ownPts.map(p => [+p[0].toFixed(1), +p[1].toFixed(1)])
      : null,
  };
}

function _radSideSummary(side, name) {
  const score = _raScoreSide(side);
  return {
    side: name,
    routeCount: side.routes.length,
    bundleCount: side.bundles.length,
    bundleSpacing: side.bundleSpacing,
    groupSpacing: side.groupSpacing,
    peelStagger: side.peelStagger,
    clusterCount: (side.clusters || []).length,
    comX: side.comX, comY: side.comY,
    escapeInfo: side.escapeInfo,
    rerouteInfo: side.rerouteInfo,
    score,
  };
}

function _radTopTipViolations(side, nMax) {
  const out = [];
  const routes = side.routes;
  const segsByRoute = routes.map(r =>
    r.ownPts ? _raPathSegments(r.ownPts) : []);
  for (let i = 0; i < routes.length; i++) {
    const a = routes[i];
    if (!a.ownPts) continue;
    for (let j = 0; j < routes.length; j++) {
      if (i === j) continue;
      const b = routes[j];
      if (!b.ownPts) continue;
      if (a.clusterAttack && b.clusterAttack &&
          a.clusterId >= 0 && a.clusterId === b.clusterId) continue;
      for (let si = 0; si < segsByRoute[j].length; si++) {
        const s = segsByRoute[j][si];
        const d = pointToSegmentDist(a.planX, a.planY,
                                      s.x0, s.y0, s.x1, s.y1);
        if (d < ROUTE_TIP_CLEARANCE) {
          const t = ROUTE_TIP_CLEARANCE - d;
          const pen = t * ROUTE_TIP_W + t * t * ROUTE_TIP_QUAD_W;
          out.push({
            tipRoute:  i,
            tipSeg:    a.segIdx,
            tipTag:    (WALL.segments[a.segIdx] || {}).tag || '?',
            hitRoute:  j,
            hitSeg:    b.segIdx,
            hitTag:    (WALL.segments[b.segIdx] || {}).tag || '?',
            hitSegIdx: si,
            dist:      +d.toFixed(1),
            penalty:   +pen.toFixed(1),
          });
        }
      }
    }
  }
  out.sort((x, y) => y.penalty - x.penalty);
  return out.slice(0, nMax);
}

function _radTinyBundledClusters(side) {
  const out = [];
  for (let bi = 0; bi < side.bundles.length; bi++) {
    const b = side.bundles[bi];
    for (let gi = 0; gi < b.groups.length; gi++) {
      const g = b.groups[gi];
      if (!g.attackBundled || !g.trunkDir) continue;
      const clusters = _raFindTinyBundledClusters(side, g);
      for (let ci = 0; ci < clusters.length; ci++) {
        const cluster = clusters[ci];
        let sumRank = 0;
        for (const ri of cluster) {
          sumRank += side.routes[ri].bundleFanRank || 0;
        }
        const meanRank = sumRank / cluster.length;
        const members = cluster.map(ri => {
          const r = side.routes[ri];
          const s = WALL.segments[r.segIdx];
          const rank = r.bundleFanRank || 0;
          const jog = (rank - meanRank) * BUNDLE_JOG_STEP;
          const attackLen = (() => {
            if (!r.ownPts || r.ownPts.length < 2) return null;
            const a = r.ownPts[r.ownPts.length - 2];
            const c = r.ownPts[r.ownPts.length - 1];
            return +Math.hypot(c[0] - a[0], c[1] - a[1]).toFixed(1);
          })();
          return {
            ri,
            segIdx: r.segIdx,
            segTag: s ? s.tag : '?',
            fanRank: +rank.toFixed(2),
            jog: +jog.toFixed(1),
            attackLen,
          };
        });
        out.push({
          bundleIdx: bi,
          groupIdx: gi,
          descentX: +g.descentX.toFixed(1),
          meanRank: +meanRank.toFixed(2),
          members,
        });
      }
    }
  }
  return out;
}

  const rule = '══════════════════════════════════════════════════════════════';

  L(' ARROW FIELD DIAGNOSTIC   ' + diag.timestamp);

  L('GEOMETRY');

      + '[' + s.z_lo.toFixed(0) + '..' + s.z_hi.toFixed(0) + ']');
  }

  if (diag.sides) {
    for (const [name, side] of [['LEFT', diag.sides.left],
                                 ['RIGHT', diag.sides.right]]) {
      if (!side || !side.routes.length) continue;

          + '   y=' + sum.comY.toFixed(1));

          + '   bundleSpacing ' + sum.bundleSpacing
          + '   groupSpacing '  + sum.groupSpacing
          + '   peelStagger '   + sum.peelStagger);
      L('  clusters       ' + sum.clusterCount);

      const ri6 = sum.rerouteInfo || {};
      L('  reroute        candidates=' + (ri6.candidates || 0)
          + '   committed=' + (ri6.committed || 0)
          + '   preScore=' + (ri6.preScore == null ? '—'
                                : ri6.preScore.toFixed(1))

                                : ri6.postScore.toFixed(1))
          + '   (cap ' + ROUTE_REROUTE_MAX_PER_SWEEP + '/sweep)');

      const cf = ri6.conflictTable;
      if (cf && cf.length) {
        const rows = cf.slice().sort((a, b) => b.total - a.total);
        const interesting = rows.filter(r => r.total > 0);
        if (interesting.length) {

          L('  per-route conflict breakdown (foreign routes only):');
          L('     #  nCross  nParallel  totalCross  totalParallel  total');
          for (const r of interesting) {
            L('    #' + String(r.ri).padStart(3)

                + '  ' + String(r.totalParallel.toFixed(1)).padStart(13)

        L('  top tip violations (tip landing within '
            + ROUTE_TIP_CLEARANCE + ' px of a foreign segment):');

      L('');
      L('  descent groups (attack-bundle status):');
      for (let bi = 0; bi < side.bundles.length; bi++) {
        const b = side.bundles[bi];
        for (let gi = 0; gi < b.groups.length; gi++) {

              + '  forceUnbundled=' + (g.forceUnbundled ? 'YES' : 'no ')

      const tiny = _radTinyBundledClusters(side);

        L('  tiny bundled attack clusters (Pass 4f detection):');
        for (let ci = 0; ci < tiny.length; ci++) {
          const tc = tiny[ci];
          L('    cluster[' + ci + ']  b' + tc.bundleIdx
              + '/g' + tc.groupIdx
              + '  descentX=' + tc.descentX
              + '  meanRank=' + tc.meanRank

          for (const m of tc.members) {
            L('      #' + String(m.ri).padStart(3)

                + '  b/g=' + r.bundleIdx + '/' + r.groupIdx
                + '  rank=' + rankStr
                + '  q=' + qStr + ' h=' + hStr
                + '  attackLen=' + (attackLen === null
                    ? '   —' : attackLen.toFixed(0).padStart(4))
                + '  flagged=' + (r.clusterAttack ? 'YES' : 'no '));
          }
        }
      }

  L('');
  L('ROUTES');
  L('     #  seg  tag      kind  worldMid          side  q  h  stripX  planX  planY   b/g  gs  rank  bundleY   brkY   fanR   jog   descentX   cl  cAtt   cY     cDX   cRk  cSz   bnd  unb  esc  sv   attLen  attAng   topo  pts');
  for (const r of diag.routes) {
    L('  '
      + String(r.idx).padStart(4) + '  '
      + String(r.segIdx).padStart(3) + '  '
      + String(r.segTag).padEnd(8) + ' '

      + '(' + String(r.worldMid[0]).padStart(5) + ','
      + String(r.worldMid[1]).padStart(5) + ')  '
      + String(r.side).padEnd(4) + '  '
      + String(r.quadrant).padStart(1) + '  '
      + (r.upperHalf ? 'U' : 'L') + '  '
      + String(r.stripX).padStart(6) + '  '
      + String(r.planX).padStart(5) + '  '
      + String(r.planY).padStart(5) + '   '
      + (r.bundleIdx + '/' + r.groupIdx).padStart(4) + '  '
      + String(r.groupSize).padStart(2) + '  '
      + String(r.peelRank).padStart(4) + '  '
      + String(r.bundleY).padStart(7) + '  '
      + (r.baseBreak === null
            ? '     — ' : String(r.baseBreak).padStart(7)) + '  '
      + (r.bundleFanRank === null
            ? '    —  ' : String(r.bundleFanRank).padStart(6)) + '  '
      + (r.bundleJogOffset === null
            ? '    —  ' : String(r.bundleJogOffset).padStart(6)) + '  '
      + String(r.descentX).padStart(8) + '  '
      + String(r.clusterId).padStart(3) + '  '
      + (r.clusterAttack ? ' Y  ' : ' .  ') + '  '
      + (r.clusterY === null
            ? '    —  ' : String(r.clusterY).padStart(6)) + '  '
      + (r.clusterDropX === null
            ? '    —  ' : String(r.clusterDropX).padStart(6)) + '  '
      + (r.clusterRank === null
            ? '   —' : String(r.clusterRank).padStart(4)) + '  '
      + (r.clusterSize === null
            ? '   —' : String(r.clusterSize).padStart(4)) + '  '
      + (r.groupAttackBundled ? ' Y  ' : ' .  ') + '  '
      + (r.groupForceUnbundled ? ' Y  ' : ' .  ') + '  '
      + (r.escaped  ? ' Y  ' : ' .  ') + '  '
      + (r.survivor ? ' Y  ' : ' .  ') + '  '
      + (r.attackLen === null
            ? '    — ' : String(r.attackLen).padStart(6)) + '  '
      + (r.attackAngleDeg === null
            ? '     —  ' : String(r.attackAngleDeg).padStart(7)) + '  '
      + String(r.tag).padEnd(4) + '  '
      + (r.pts ? JSON.stringify(r.pts) : '—'));
  }

  L('');
  L('Tip: window.__arrowsDiag holds the structured dump.');
  L('     window.__arrowsSides holds the live side handles.');
  L('     Re-dump any time:  dumpArrowsDiagnostics()  or  Ctrl+Shift+D');
  L('     Console-only dump: dumpArrowsDiagnostics({ terminal: false })');
  L('     Force a re-solve:  window.__arrowForceResolve()');
  L('     Topo codes: L0..L3 = orthogonal, D = diagonal, B = bundled attack,');
  L('                 C = cluster attack, R = rerouted detour.');
  L('     Half: U = upper (planY < comY), L = lower (planY >= comY).');
  L('     Quadrants (screen coords, y-down):');
  L('       0 = NW  x < comX, y < comY');
  L('       1 = NE  x >= comX, y < comY');
  L('       2 = SW  x < comX, y >= comY');
  L('       3 = SE  x >= comX, y >= comY');
  L('');

  for (const ln of lines) console.log(ln);
  if (sendTerminal) {
    try {
      fetch('/diag', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: lines.join('\n'),
      }).catch(() => {});
    } catch (e) { /* file:// — no fetch, no problem */ }
  }

  return diag;
}

const _raLastPointer = { x: 0, y: 0 };
window.addEventListener("mousemove", (e) => {
  _raLastPointer.x = e.clientX;
  _raLastPointer.y = e.clientY;
}, { passive: true });

function _raRequestRedraw() {
  const names = [
    "requestRender", "scheduleRender", "invalidate", "redraw",
    "renderAll", "scheduleDraw", "requestDraw", "paint",
  ];
  for (const n of names) {
    if (typeof window[n] === "function") {
      try { window[n](); } catch (e) { }
      return;
    }
  }

  const target =
    (typeof ctx !== "undefined" && ctx && ctx.canvas) ? ctx.canvas :
    (document.body || window);

  target.dispatchEvent(new MouseEvent("mousemove", {
    clientX: _raLastPointer.x,
    clientY: _raLastPointer.y,
    bubbles: true,
    cancelable: true,
    view: window,
  }));
}

const _PATTERN_CANVASES = Object.create(null);

function _patternCanvas(kind) {
  if (_PATTERN_CANVASES[kind]) return _PATTERN_CANVASES[kind];
  const make = (size, draw) => {
    const pc = document.createElement("canvas");
    pc.width = pc.height = size;
    const p = pc.getContext("2d");
    p.fillStyle = "#ffffff";
    p.fillRect(0, 0, size, size);
    p.strokeStyle = "#000000";
    p.fillStyle   = "#000000";
    p.lineWidth   = 0.7;
    p.lineCap     = "round";
    draw(p, size);
    return pc;
  };
  const defs = {
    step: [8, (p, s) => {
      p.lineWidth = 0.7;
      p.beginPath();
      p.moveTo(-1, s + 1);     p.lineTo(s + 1, -1);
      p.moveTo(-1, 1);         p.lineTo(1, -1);
      p.moveTo(s - 1, s + 1);  p.lineTo(s + 1, s - 1);
      p.stroke();
    }],
    void: [12, (p, s) => {
      p.lineWidth = 0.35;
      p.beginPath();
      p.moveTo(s + 1, -1);     p.lineTo(-1, s + 1);
      p.stroke();
    }],
    roomInterior: [22, (p, s) => {
      p.lineWidth = 0.4;
      p.beginPath();
      p.moveTo(-1, s + 1); p.lineTo(s + 1, -1);
      p.stroke();
    }],
  };
  const [size, draw] = defs[kind];
  _PATTERN_CANVASES[kind] = make(size, draw);
  return _PATTERN_CANVASES[kind];
}

function _pat(ctx, kind) {
  return ctx.createPattern(_patternCanvas(kind), "repeat");
}

/* ==========================================================================
   COLLINEAR VERTEX FILTER TOGGLE
   ========================================================================== */

window.filterCollinearVerticesInStrip = false;

/* Collinear-anchor filter.

   Drops the middle anchor of any three consecutive wall-edge anchors
   that sit on the same wall segment, at the same height, and on a
   straight line through their two neighbours.

   The same-segment check matters.  The room model can represent one
   physical wall as several segments — a column flush against it, an
   opening that punches through, a step riser that splits the stretch —
   and the boundary between those segments is a real vertex a cable can
   cross.  A cable running along a wall past the point where the wall
   was split must still show the vertex there.  Keeping the vertex also
   keeps the pill's two side-distance readings attached to the wall
   they were measured along. */
function _collapseStripCollinear(orderedIds) {
  if (!window.filterCollinearVerticesInStrip) return orderedIds.slice();
  if (orderedIds.length < 3) return orderedIds.slice();

  const out = [orderedIds[0]];
  for (let i = 1; i < orderedIds.length - 1; i++) {
    const prevId = out[out.length - 1];
    const curId  = orderedIds[i];
    const nextId = orderedIds[i + 1];
    const pa = anchors.get(prevId);
    const ca = anchors.get(curId);
    const na = anchors.get(nextId);
    if (!pa || !ca || !na ||
        pa.space !== "wall-edge" ||
        ca.space !== "wall-edge" ||
        na.space !== "wall-edge" ||
        pa.segIdx !== ca.segIdx ||
        ca.segIdx !== na.segIdx) {
      out.push(curId);
      continue;
    }
    const pu = wallAttachToU(pa.segIdx, pa.t), pv = pa.v || 0;
    const cu = wallAttachToU(ca.segIdx, ca.t), cv = ca.v || 0;
    const nu = wallAttachToU(na.segIdx, na.t), nv = na.v || 0;
    const dx1 = cu - pu, dy1 = cv - pv;
    const dx2 = nu - cu, dy2 = nv - cv;
    const cross = Math.abs(dx1 * dy2 - dy1 * dx2);
    const len = Math.hypot(dx2, dy2) || 1;
    const dist = cross / len;
    if (dist < 2.0) {
      /* skip curId */
    } else {
      out.push(curId);
    }
  }
  out.push(orderedIds[orderedIds.length - 1]);
  return out;
}

/* ==========================================================================
   CABLE RUN EXPORT
   ========================================================================== */

/* ---- Linearization ---- */

function computeAnchor3D(a) {
  if (!a) return null;
  if (a.space === "floor") return [a.x, a.y, 0];
  if (a.space === "wall-edge") {
    const p = wallAttachToPlan(a.segIdx, a.t);
    if (!p) return null;
    return [p[0], p[1], a.v || 0];
  }
  return null;
}

function totalCableLength(orderedIds) {
  let total = 0;
  for (let i = 0; i < orderedIds.length - 1; i++) {
    const p = computeAnchor3D(anchors.get(orderedIds[i]));
    const q = computeAnchor3D(anchors.get(orderedIds[i + 1]));
    if (!p || !q) continue;
    total += Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]);
  }
  return total;
}

function linearizeTrueCable(tcId) {
  const parts = allCables().filter(c => trueCableIdOf(c) === tcId);
  if (!parts.length) return [];

  const anchorIdSet = new Set();
  for (const c of parts) for (const id of c.anchorIds) anchorIdSet.add(id);

  const adj = new Map();
  for (const id of anchorIdSet) adj.set(id, new Set());
  for (const c of parts) {
    for (let i = 0; i < c.anchorIds.length - 1; i++) {
      const a = c.anchorIds[i], b = c.anchorIds[i + 1];
      adj.get(a).add(b);
      adj.get(b).add(a);
    }
  }
  for (const j of JUNCTIONS) {
    const here = [];
    for (const t of j.terminals) {
      for (const aid of anchorIdSet) {
        const a = anchors.get(aid);
        if (!a || a.space !== "wall-edge") continue;
        if (a.segIdx !== t.segIdx) continue;
        const side = Math.abs(a.t) < 0.01 ? 0
                   : Math.abs(a.t - 1) < 0.01 ? 1 : -1;
        if (side !== t.side) continue;
        here.push(a);
      }
    }
    for (let i = 0; i < here.length; i++) {
      for (let k = i + 1; k < here.length; k++) {
        if (Math.abs((here[i].v || 0) - (here[k].v || 0)) > 5.0) continue;
        adj.get(here[i].id).add(here[k].id);
        adj.get(here[k].id).add(here[i].id);
      }
    }
  }

  const endpoints = [];
  for (const [id, nbrs] of adj) if (nbrs.size === 1) endpoints.push(id);
  if (endpoints.length < 2) return Array.from(anchorIdSet);

  const visited = new Set();
  const path = [];
  let cur = endpoints[0];
  while (cur != null) {
    path.push(cur);
    visited.add(cur);
    let next = null;
    for (const n of adj.get(cur)) {
      if (!visited.has(n)) { next = n; break; }
    }
    cur = next;
  }
  return path;
}

function isFloorLevel(a) {
  if (!a) return false;
  if (a.space === "floor") return true;
  return Math.abs(a.v || 0) < 1e-3;
}

function groupCableRuns(orderedIds) {
  const runs = [];
  let cur = null;
  for (const id of orderedIds) {
    const a = anchors.get(id);
    if (!a) continue;
    const space = a.space === "floor" ? "floor" : "wall-edge";
    if (!cur || cur.space !== space) {
      cur = { space, ids: [] };
      runs.push(cur);
    }
    cur.ids.push(id);
  }
  return runs;
}

function groupPlanRuns(orderedIds) {
  const runs = [];
  let cur = null;
  for (const id of orderedIds) {
    const a = anchors.get(id);
    if (!a || !isFloorLevel(a)) { cur = null; continue; }
    if (!cur) { cur = { ids: [] }; runs.push(cur); }
    cur.ids.push(id);
  }
  return runs;
}

function buildSegmentDirectory(orderedIds) {
  const dir = new Map();
  let next = 1;
  for (const id of orderedIds) {
    const a = anchors.get(id);
    if (!a || a.space !== "wall-edge") continue;
    if (dir.has(a.segIdx)) continue;
    const s = WALL.segments[a.segIdx];
    dir.set(a.segIdx, {
      order: next,
      tag:   (s && s.tag) ? s.tag : ("seg " + (a.segIdx + 1)),
    });
    next++;
  }
  return dir;
}

function layoutWallRun(ids) {
  const chunks = [];
  let cur = null;
  for (const id of ids) {
    const a = anchors.get(id);
    if (!a || a.space !== "wall-edge") continue;
    const s = WALL.segments[a.segIdx];
    if (!s) continue;
    if (!cur || cur.segIdx !== a.segIdx) {
      cur = {
        segIdx:  a.segIdx,
        len:     s.len,
        z_lo:    (typeof s.z_lo === "number") ? s.z_lo : 0,
        z_hi:    (typeof s.z_hi === "number") ? s.z_hi : WALL_HEIGHT,
        kind:    s.kind || "wall",
        anchors: [],
      };
      chunks.push(cur);
    }
    cur.anchors.push({ aid: id, localU: a.t * s.len, v: a.v || 0 });
  }
  for (const ch of chunks) {
    const first = ch.anchors[0];
    const last  = ch.anchors[ch.anchors.length - 1];
    ch.mirror = first.localU > last.localU;
  }
  let totalLen = 0;
  for (const c of chunks) totalLen += c.len;
  return { chunks, totalLen };
}

function segmentKind(aid, bid, parts) {
  for (const c of parts) {
    for (let i = 0; i < c.anchorIds.length - 1; i++) {
      const a = c.anchorIds[i], b = c.anchorIds[i + 1];
      if ((a === aid && b === bid) || (a === bid && b === aid)) {
        return state.floorCables.includes(c) ? "floor" : "wall";
      }
    }
  }
  return null;
}

function buildCableRunMeta(tcId, orderedIds, segDirectory, chunks,
                            labelPlacement, stripOffsetX, stripW,
                            stripTotalMM) {
  const pillNameOf = (labelPlacement && labelPlacement.pillNameOf)
                     ? labelPlacement.pillNameOf
                     : new Map();

  const _r2 = (v) => Math.round(v * 100) / 100;
  const _r3 = (v) => Math.round(v * 1000) / 1000;

  const pxPerMm = (stripW > 0 && stripTotalMM > 0)
    ? stripW / stripTotalMM
    : 0;

  const parts = allCables().filter(c => trueCableIdOf(c) === tcId);

  const walls = [];
  for (const [segIdx, entry] of segDirectory) {
    const s = WALL.segments[segIdx];
    walls.push({
      badge:     entry.order,
      segIdx:    segIdx,
      tag:       entry.tag,
      length_mm: s ? s.len : 0,
      z_lo_mm:   s ? ((typeof s.z_lo === "number") ? s.z_lo : 0) : 0,
      z_hi_mm:   s ? ((typeof s.z_hi === "number") ? s.z_hi : WALL_HEIGHT) : 0,
      kind:      s ? (s.kind || "wall") : "wall",
    });
  }
  walls.sort((a, b) => a.badge - b.badge);

  let wallLen = 0, floorLen = 0;
  for (let i = 0; i < orderedIds.length - 1; i++) {
    const aid = orderedIds[i], bid = orderedIds[i + 1];
    const p = computeAnchor3D(anchors.get(aid));
    const q = computeAnchor3D(anchors.get(bid));
    if (!p || !q) continue;
    const d = Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]);
    if (d < 1e-3) continue;
    const kind = segmentKind(aid, bid, parts);
    if (kind === "floor")      floorLen += d;
    else if (kind === "wall")  wallLen += d;
  }

  const anchorLookup = new Map();
  for (const ch of chunks) {
    for (const a of ch.anchors) {
      anchorLookup.set(a.aid, {
        mirror:  ch.mirror,
        len:     ch.len,
        nativeU: a.nativeU,
      });
    }
  }

  const anchorsMeta = [];
  for (let i = 0; i < orderedIds.length; i++) {
    const id = orderedIds[i];
    const a = anchors.get(id);
    if (!a) continue;
    const e = { index: i, anchorId: id, space: a.space };

    if (pillNameOf) {
      const pn = pillNameOf.get(id);
      if (pn) e.pillName = pn;
    }

    if (a.space === "floor") {
      e.x_mm = a.x;
      e.y_mm = a.y;
    } else if (a.space === "wall-edge") {
      const segEntry = segDirectory.get(a.segIdx);
      const seg      = WALL.segments[a.segIdx];
      e.segIdx     = a.segIdx;
      e.segmentTag = segEntry ? segEntry.tag   : null;
      e.badge      = segEntry ? segEntry.order : null;
      e.t          = a.t;
      e.height_mm  = a.v || 0;
      e.segment_z_lo_mm = seg ? ((typeof seg.z_lo === "number") ? seg.z_lo : 0) : 0;
      e.segment_z_hi_mm = seg ? ((typeof seg.z_hi === "number") ? seg.z_hi : WALL_HEIGHT) : 0;
      e.segment_kind    = seg ? (seg.kind || "wall") : "wall";

      const info = anchorLookup.get(id);
      if (info) {
        e.distance_west_mm = info.mirror
          ? (info.len - info.nativeU)
          : info.nativeU;
        e.distance_east_mm = info.mirror
          ? info.nativeU
          : (info.len - info.nativeU);
        e.mirrored               = info.mirror;
        e.distance_from_a_end_mm = info.nativeU;
        e.distance_from_b_end_mm = info.len - info.nativeU;
      }

      const p = wallAttachToPlan(a.segIdx, a.t);
      if (p) {
        e.world_x_mm = p[0];
        e.world_y_mm = p[1];
      }
    }
    anchorsMeta.push(e);
  }

  const totalLen = totalCableLength(orderedIds);

  const pills = [];
  const pillRows = [];
  if (labelPlacement && Array.isArray(labelPlacement.placed)) {
    const areaX0 = labelPlacement.areaX0;
    const areaX1 = labelPlacement.areaX1;
    const usableWidth =
      (typeof areaX0 === "number" && typeof areaX1 === "number")
        ? areaX1 - areaX0
        : null;

    for (const it of labelPlacement.placed) {
      const members = Array.isArray(it.members) ? it.members.slice() : [];
      const memberIndices = members
        .map(id => orderedIds.indexOf(id))
        .filter(i => i >= 0);

      pills.push({
        name: it.name || null,
        track: it.track,

        x_logical:           _r2(it.pillCenterX),
        anchorX_logical:     _r2(it.anchorCx),
        displacement_logical:
          _r2(Math.abs(it.pillCenterX - it.anchorCx)),

        x_mm: (pxPerMm > 0 && typeof stripOffsetX === "number")
          ? _r2((it.pillCenterX - stripOffsetX) / pxPerMm) : null,
        anchorX_mm: (pxPerMm > 0 && typeof stripOffsetX === "number")
          ? _r2((it.anchorCx - stripOffsetX) / pxPerMm) : null,

        width_logical:  _r2(it.w),
        height_logical: _r2(it.h),

        memberAnchorIds:     members,
        memberAnchorIndices: memberIndices,

        channelYRel: (typeof it.channelYRel === "number")
                     ? _r2(it.channelYRel) : null,
        offsetA:    _r2(it.offsetA    || 0),
        detourBias: _r2(it.detourBias || 0),
        diveMode: it.diveMode || 0,
        bevel0:   _r2(it.bevel0 || 0),
        bevel1:   _r2(it.bevel1 || 0),
        jog0:     _r2(it.jog0   || 0),
        jog1:     _r2(it.jog1   || 0),

        leaderStyle: (it.leaderStyle === 1) ? "dashed" : "solid",

        lines: it.lines.map(l => ({
          left:  l.left  || "",
          right: l.right || null,
        })),
      });
    }

    const trackMap = new Map();
    for (const it of labelPlacement.placed) {
      if (!trackMap.has(it.track)) trackMap.set(it.track, []);
      trackMap.get(it.track).push(it);
    }
    const sortedTracks = Array.from(trackMap.keys()).sort((a, b) => a - b);
    for (const t of sortedTracks) {
      const row = trackMap.get(t);
      let xMin = Infinity, xMax = -Infinity;
      for (const it of row) {
        const left  = it.pillCenterX - it.w / 2;
        const right = it.pillCenterX + it.w / 2;
        if (left  < xMin) xMin = left;
        if (right > xMax) xMax = right;
      }
      const span = xMax - xMin;
      pillRows.push({
        track:         t,
        count:         row.length,
        xMin_logical:  _r2(xMin),
        xMax_logical:  _r2(xMax),
        span_logical:  _r2(span),
        fillRatio: (usableWidth && usableWidth > 0)
          ? _r3(span / usableWidth) : null,
        pillNames: row.map(it => it.name || "(anon)"),
      });
    }
  }

  return {
    schemaVersion:  6,
    cableId:        tcId,
    anchorCount:    orderedIds.length,
    partCount:      parts.length,
    totalLength_mm: totalLen,
    wallLength_mm:  wallLen,
    floorLength_mm: floorLen,

    stripScale_px_per_mm: _r3(pxPerMm),

    walls:          walls,
    anchors:        anchorsMeta,

    pills:          pills,
    pillRows:       pillRows,
  };
}

/* ---- Badge ---- */

function badgeRadiusFor(n) {
  const digits = String(n).length;
  if (digits <= 1) return 11;
  if (digits === 2) return 12;
  return 13;
}

function drawBadge(c, x, y, num) {
  const r = badgeRadiusFor(num);
  c.save();
  c.beginPath();
  c.arc(x, y, r, 0, Math.PI * 2);
  c.fillStyle = "#ffffff";
  c.fill();
  c.strokeStyle = "#000000";
  c.lineWidth = 1.6;
  c.stroke();
  c.font = "700 12px " + FONT_MONO;
  c.fillStyle = "#000000";
  c.textAlign = "center"; c.textBaseline = "middle";
  c.fillText(String(num), x, y + 0.5);
  c.restore();
}

/* ---- Arrow styles ---- */

const SEG_ARROW_STYLES = [
  { dash: null,           head: "solid-tri"      },
  { dash: [6, 4],         head: "hollow-tri"     },
  { dash: [2, 3],         head: "solid-circle"   },
  { dash: null,           head: "hollow-diamond" },
  { dash: [8, 3, 2, 3],   head: "solid-tri"      },
  { dash: [10, 4],        head: "solid-square"   },
  { dash: null,           head: "bar"            },
  { dash: [2, 3],         head: "hollow-circle"  },
  { dash: [6, 4],         head: "solid-diamond"  },
  { dash: null,           head: "hollow-square"  },
];

function styleFor(order) {
  return SEG_ARROW_STYLES[(order - 1) % SEG_ARROW_STYLES.length];
}

function drawArrowHead(c, x, y, ux, uy, style) {
  const px = -uy, py = ux;
  c.save();
  c.lineJoin = "round";
  c.lineCap = "round";

  const drawSilhouette = () => {
    c.beginPath();
    switch (style.head) {
      case "solid-tri":
      case "hollow-tri": {
        const s = 8, w = 4.5;
        c.moveTo(x, y);
        c.lineTo(x - ux * s + px * w, y - uy * s + py * w);
        c.lineTo(x - ux * s - px * w, y - uy * s - py * w);
        c.closePath();
        break;
      }
      case "solid-circle":
      case "hollow-circle": {
        c.arc(x, y, 4.5, 0, Math.PI * 2);
        break;
      }
      case "solid-diamond":
      case "hollow-diamond": {
        const s = 5.5;
        c.moveTo(x + ux * s, y + uy * s);
        c.lineTo(x + px * s, y + py * s);
        c.lineTo(x - ux * s, y - uy * s);
        c.lineTo(x - px * s, y - py * s);
        c.closePath();
        break;
      }
      case "solid-square":
      case "hollow-square": {
        const s = 4;
        c.moveTo(x + ux * s + px * s, y + uy * s + py * s);
        c.lineTo(x + ux * s - px * s, y + uy * s - py * s);
        c.lineTo(x - ux * s - px * s, y - uy * s - py * s);
        c.lineTo(x - ux * s + px * s, y - uy * s + py * s);
        c.closePath();
        break;
      }
      case "bar": {
        const s = 5.5;
        c.moveTo(x + px * s, y + py * s);
        c.lineTo(x - px * s, y - py * s);
        break;
      }
    }
  };

  drawSilhouette();
  c.strokeStyle = "#ffffff";
  c.lineWidth = 5;
  c.stroke();

  c.strokeStyle = "#000000";
  c.lineWidth = 1.6;
  drawSilhouette();

  switch (style.head) {
    case "solid-tri":
    case "solid-circle":
    case "solid-diamond":
    case "solid-square": {
      c.fillStyle = "#000000";
      c.fill();
      break;
    }
    case "hollow-tri":
    case "hollow-circle":
    case "hollow-diamond":
    case "hollow-square": {
      c.fillStyle = "#ffffff";
      c.fill();
      c.stroke();
      break;
    }
    case "bar": {
      c.stroke();
      break;
    }
  }
  c.restore();
}

function pathTotalLength(points) {
  let L = 0;
  for (let i = 1; i < points.length; i++) {
    L += Math.hypot(points[i][0] - points[i-1][0],
                    points[i][1] - points[i-1][1]);
  }
  return L;
}

function trimPathStart(points, trimLen) {
  if (trimLen <= 0 || points.length < 2) return points;
  const total = pathTotalLength(points);
  if (total <= trimLen) return [points[points.length - 1]];
  let acc = 0;
  for (let i = 1; i < points.length; i++) {
    const seg = Math.hypot(points[i][0] - points[i-1][0],
                            points[i][1] - points[i-1][1]);
    if (acc + seg >= trimLen) {
      const t = (trimLen - acc) / seg;
      const x = points[i-1][0] + (points[i][0] - points[i-1][0]) * t;
      const y = points[i-1][1] + (points[i][1] - points[i-1][1]) * t;
      return [[x, y], ...points.slice(i)];
    }
    acc += seg;
  }
  return points;
}

function trimPathEnd(points, trimLen) {
  if (trimLen <= 0 || points.length < 2) return points;
  const total = pathTotalLength(points);
  if (total <= trimLen) return [points[0]];
  const target = total - trimLen;
  let acc = 0;
  for (let i = 1; i < points.length; i++) {
    const seg = Math.hypot(points[i][0] - points[i-1][0],
                            points[i][1] - points[i-1][1]);
    if (acc + seg >= target) {
      const t = (target - acc) / seg;
      const x = points[i-1][0] + (points[i][0] - points[i-1][0]) * t;
      const y = points[i-1][1] + (points[i][1] - points[i-1][1]) * t;
      return [...points.slice(0, i), [x, y]];
    }
    acc += seg;
  }
  return points;
}

function drawStyledPath(c, points, style, gapStart) {
  if (points.length < 2) return;
  const HEAD_SIZE = 9;
  const total = pathTotalLength(points);

  if (total <= HEAD_SIZE + 1) {
    const tip  = points[points.length - 1];
    const prev = points[points.length - 2];
    const dx = tip[0] - prev[0], dy = tip[1] - prev[1];
    const d = Math.hypot(dx, dy);
    if (d < 0.1) return;
    drawArrowHead(c, tip[0], tip[1], dx / d, dy / d, style);
    return;
  }

  let pts = points.slice();
  if (gapStart > 0) pts = trimPathStart(pts, gapStart);
  if (pts.length < 2) return;

  const tip = pts[pts.length - 1];
  const beforeTip = pts[pts.length - 2];
  const dxT = tip[0] - beforeTip[0], dyT = tip[1] - beforeTip[1];
  const dT = Math.hypot(dxT, dyT);
  if (dT < 0.1) return;
  const ux = dxT / dT, uy = dyT / dT;

  const body = trimPathEnd(pts, HEAD_SIZE);
  if (body.length < 2) {
    drawArrowHead(c, tip[0], tip[1], ux, uy, style);
    return;
  }

  c.save();
  c.strokeStyle = "#000000";
  c.lineWidth = 1.4;
  c.lineCap = "round";
  c.lineJoin = "round";
  c.setLineDash(style.dash || []);
  c.beginPath();
  c.moveTo(body[0][0], body[0][1]);
  for (let i = 1; i < body.length; i++) {
    c.lineTo(body[i][0], body[i][1]);
  }
  c.stroke();
  c.setLineDash([]);
  c.restore();

  drawArrowHead(c, tip[0], tip[1], ux, uy, style);
}

function drawArrowSample(c, x, y, len, style) {
  drawStyledPath(c, [[x, y], [x + len, y]], style, 0);
}

/* ---- Vertex label geometry constants (shared) ---- */

const LABEL_CHANNEL_Y0   = 6;
const LABEL_CHANNEL_STEP = 8;
const LABEL_CHANNEL_GAP  = 6;
const LABEL_BOTTOM_PAD   = 4;

/* Minimum horizontal separation between a pill's left-aligned label
   (the "V<n>" name on the first vertex, or empty) and its right-aligned
   "h <cm>" height.  Ensures they never touch when the pill is only as
   wide as the widest of the two columns. */
const LABEL_LEFT_RIGHT_GAP = 18;

const LEADER_STYLES = [
  { dash: null   },
  { dash: [6, 4] },
];

/* ---- Leader offset refinement ---- */

function refineLeaderOffsets(placed, topPad, trackOffsets, stripH) {
  const MIN_SEP    = 3.0;
  const FAN_STEP   = 4.0;
  const MAX_OFFSET = 14.0;
  const MAX_PASSES = 20;

  if (!placed) return;
  for (const it of placed) {
    it.offsetA = 0;
    it.offsetP = 0;
  }
  if (placed.length < 2) return;

  for (const it of placed) {
    it._anchorYRel = it.anchorCyRel - stripH;
    it._chanYRel   = it.channelYRel;
  }

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const yOverlap = (a0, a1, b0, b1) =>
    Math.max(a0, b0) < Math.min(a1, b1) - 0.5;

  const anchorXAt = (it, y) => {
    const denom = it._chanYRel - it._anchorYRel;
    const t = denom > 1e-6 ? (y - it._anchorYRel) / denom : 0;
    return it.anchorCx + it.offsetA * t;
  };

  const anchorConflict = (A, B) => {
    if (!yOverlap(A._anchorYRel, A._chanYRel, B._anchorYRel, B._chanYRel))
      return false;
    const y0 = Math.max(A._anchorYRel, B._anchorYRel);
    const y1 = Math.min(A._chanYRel,   B._chanYRel);
    for (let s = 0; s <= 5; s++) {
      const y = y0 + (y1 - y0) * s / 5;
      if (Math.abs(anchorXAt(A, y) - anchorXAt(B, y)) < MIN_SEP) return true;
    }
    return false;
  };

  for (let pass = 0; pass < MAX_PASSES; pass++) {
    let anyChange = false;
    for (let i = 0; i < placed.length; i++) {
      for (let j = i + 1; j < placed.length; j++) {
        const A = placed[i], B = placed[j];
        if (anchorConflict(A, B)) {
          const dir = (B.anchorCx >= A.anchorCx) ? 1 : -1;
          const nA = clamp(A.offsetA - dir * FAN_STEP * 0.5,
                           -MAX_OFFSET, MAX_OFFSET);
          const nB = clamp(B.offsetA + dir * FAN_STEP * 0.5,
                           -MAX_OFFSET, MAX_OFFSET);
          if (Math.abs(nA - A.offsetA) > 1e-6) { A.offsetA = nA; anyChange = true; }
          if (Math.abs(nB - B.offsetA) > 1e-6) { B.offsetA = nB; anyChange = true; }
        }
      }
    }
    if (!anyChange) break;
  }

  for (const it of placed) {
    const h = it._chanYRel - it._anchorYRel;
    const cap = Math.min(MAX_OFFSET, Math.max(0, h * 0.5));
    it.offsetA = clamp(it.offsetA, -cap, cap);
  }
}

/* ---- Segment collision detection ---- */

const SEG_MIN_SEP  = 6.0;
const SEG_MIN_LEN  = 5.0;

const PILL_PROX = SEG_MIN_SEP;

const BOUNDARY_MIN_SEP = 10.0;
const WIRE_MIN_SEP = 10.0;
const WIRE_APPROACH_SEP = 26.0;
const WIRE_PARALLEL_TOL = Math.PI / 6;

const PARALLEL_TOL = Math.PI / 12;

/* Weight of one extra crossing between two leaders that already cross
   at least once.  Sits between the head tier (1e10) and the parallel
   / boundary tiers (1e11): strong enough to make the optimiser trade
   a second crossing for a first crossing elsewhere, weak enough that
   it never beats avoiding a parallel overlap or a boundary hug. */
const DOUBLE_CROSS_EXTRA_W = 1e11;

function _pointSegDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len2 = dx*dx + dy*dy;
  if (len2 < 1e-9) return Math.hypot(px - ax, py - ay);
  let t = ((px - ax)*dx + (py - ay)*dy) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t*dx), py - (ay + t*dy));
}

function _segSegDist(ax, ay, bx, by, cx, cy, dx, dy) {
  return Math.min(
    _pointSegDist(ax, ay, cx, cy, dx, dy),
    _pointSegDist(bx, by, cx, cy, dx, dy),
    _pointSegDist(cx, cy, ax, ay, bx, by),
    _pointSegDist(dx, dy, ax, ay, bx, by),
  );
}

function _pathSegments(path, pathIdx, minLen) {
  /* First, collapse consecutive collinear points.

     Two segments that share a vertex and lie on the same line are
     the same drawn line.  Splitting them at the shared vertex turns
     a T-junction — the endpoint of one leader's polyline touching
     the interior of another's — into two endpoint touches, both of
     which _segSegProperCross rejects.  The crossing at that touch
     is real: the vertical continues on both sides of the horizontal
     it touches.  Merging the two collinear segments back into one
     restores the interior parameter, and the crossing counts.

     This is the fix for V24 × V27: V27's descent from the channel
     down to the detour band is three consecutive collinear verticals
     at x = 811.45, and V24's channel horizontal at y = 144 touches
     them at their shared vertex (811.45, 144).  Without the merge
     the touch is a pair of endpoint contacts and V24 is classified
     as clean, so the optimiser never tries the diveMode = 2 that
     clears the pair. */
  const pts = [];
  for (let i = 0; i < path.length; i++) {
    const p = path[i];
    if (pts.length >= 2) {
      const a = pts[pts.length - 2];
      const b = pts[pts.length - 1];
      const abx = b[0] - a[0], aby = b[1] - a[1];
      const bcx = p[0] - b[0], bcy = p[1] - b[1];
      const cross = abx * bcy - aby * bcx;
      if (Math.abs(cross) < 1e-3) {
        /* a, b, p are collinear.  If b is between a and p (same
           direction), drop b.  If p is between a and b (reverse),
           skip p. */
        const dot = abx * bcx + aby * bcy;
        if (dot > 0) {
          pts.pop();
        } else {
          continue;
        }
      }
    }
    pts.push(p);
  }

  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const len = Math.hypot(dx, dy);
    if (len < minLen) continue;
    let kind;
    if (Math.abs(dx) < 0.5)      kind = "vert";
    else if (Math.abs(dy) < 0.5) kind = "horiz";
    else                          kind = "diag";
    out.push({
      pathIdx, segIdx: i, kind, len,
      ax: a[0], ay: a[1], bx: b[0], by: b[1],
      minX: Math.min(a[0], b[0]), maxX: Math.max(a[0], b[0]),
      minY: Math.min(a[1], b[1]), maxY: Math.max(a[1], b[1]),
      angle: Math.atan2(dy, dx),
    });
  }
  return out;
}

function _angleDiff(a, b) {
  let d = Math.abs(a - b) % Math.PI;
  if (d > Math.PI / 2) d = Math.PI - d;
  return d;
}

function _findSegmentConflicts(segs, minSep) {
  const out = [];
  for (let i = 0; i < segs.length; i++) {
    const A = segs[i];
    for (let j = i + 1; j < segs.length; j++) {
      const B = segs[j];
      if (A.pathIdx === B.pathIdx) continue;
      if (A.maxX + minSep < B.minX) continue;
      if (B.maxX + minSep < A.minX) continue;
      if (A.maxY + minSep < B.minY) continue;
      if (B.maxY + minSep < A.minY) continue;
      const d = _segSegDist(A.ax, A.ay, A.bx, A.by,
                            B.ax, B.ay, B.bx, B.by);
      if (d < minSep) out.push({ a: A, b: B, dist: d });
    }
  }
  return out;
}

function _segBoxOverlap(s, box) {
  const x0 = s.ax, y0 = s.ay;
  const dx = s.bx - x0, dy = s.by - y0;
  let t0 = 0, t1 = 1;
  const clip = (p, q) => {
    if (Math.abs(p) < 1e-9) return q >= 0;
    const r = q / p;
    if (p < 0) { if (r > t1) return false; if (r > t0) t0 = r; }
    else       { if (r < t0) return false; if (r < t1) t1 = r; }
    return true;
  };
  if (!clip(-dx, x0 - box.qL)) return 0;
  if (!clip( dx, box.qR - x0)) return 0;
  if (!clip(-dy, y0 - box.qT)) return 0;
  if (!clip( dy, box.qB - y0)) return 0;
  return Math.max(0, t1 - t0);
}

/* ---- Proper segment crossing ----

   Two segments properly cross when their lines intersect at a point
   that is strictly interior to both.  Endpoint touches (shared anchors,
   T-junctions) are excluded by the 1e-6 parameter epsilon on each side,
   and parallel-or-collinear pairs are excluded by the denom check. */
function _segSegProperCross(a, b) {
  const d1x = a.bx - a.ax, d1y = a.by - a.ay;
  const d2x = b.bx - b.ax, d2y = b.by - b.ay;
  const denom = d1x * d2y - d1y * d2x;
  if (Math.abs(denom) < 1e-9) return false;
  const rx = b.ax - a.ax, ry = b.ay - a.ay;
  const t = (rx * d2y - ry * d2x) / denom;
  const u = (rx * d1y - ry * d1x) / denom;
  return t > 1e-6 && t < 1 - 1e-6 && u > 1e-6 && u < 1 - 1e-6;
}

/* Count proper crossings between two segment lists.  Bbox pre-reject
   skips pairs that cannot possibly cross. */
function _countSegmentCrossings(segsA, segsB) {
  let n = 0;
  for (let i = 0; i < segsA.length; i++) {
    const a = segsA[i];
    for (let j = 0; j < segsB.length; j++) {
      const b = segsB[j];
      if (a.maxX + 0.5 < b.minX || b.maxX + 0.5 < a.minX) continue;
      if (a.maxY + 0.5 < b.minY || b.maxY + 0.5 < a.minY) continue;
      if (_segSegProperCross(a, b)) n++;
    }
  }
  return n;
}

/* ==========================================================================
   LAYOUT SNAPSHOT — one build per candidate
   ========================================================================== */

function _buildLayout(placed, stripH, topPad, trackOffsets) {
  const n = placed.length;
  const paths = new Array(n);
  const segs  = new Array(n);
  const boxes = new Array(n);
  for (let i = 0; i < n; i++) {
    const it = placed[i];
    let p;
    if (it.finalPath) {
      /* The overhang-hugging pass in pg_export_labels.py already
         rewrote this leader's polyline.  Use the rewritten path
         verbatim so the style-conflict graph and the drawn leaders
         both see the hugging shape, not the pre-hug shape. */
      p = it.finalPath;
    } else {
      const base = _buildLeaderPathRel(it, placed, stripH, topPad, trackOffsets);
      const bev  = _bevelPath(base, it.bevel0 || 0, it.bevel1 || 0);
      p    = _applyJogsToPath(bev, it);
    }
    paths[i] = p;
    segs[i]  = _pathSegments(p, i, 1.0);
    const qT = stripH + topPad + trackOffsets[it.track];
    boxes[i] = {
      qL: it.pillCenterX - it.w / 2,
      qR: it.pillCenterX + it.w / 2,
      qT,
      qB: qT + it.h,
    };
  }
  return { paths, segs, boxes };
}

function _expandBox(box, prox) {
  return {
    qL: box.qL - prox,
    qR: box.qR + prox,
    qT: box.qT - prox,
    qB: box.qB + prox,
  };
}

/* Count all conflicts of one leader (index idx) against the layout.

   Basic conflicts (always counted):
     • segment-segment within SEG_MIN_SEP of a foreign leader;
     • segment-foreign-pill within PILL_PROX of the expanded box.

   Additional conflicts (counted only when obstacleContext is
   passed):
     • boundary, wall-edge, and wire penalties from
       pg_export_penalties, evaluated on this leader's segments only.

   The boundary / wall-edge / wire penalties are single-count
   quantities (they do not have a foreign-leader to double-count),
   so no division by two is needed. */
function _countConflictsAt(idx, layout, obstacleContext) {
  const selfSegs = layout.segs[idx];
  let n = 0;

  for (let j = 0; j < layout.segs.length; j++) {
    if (j === idx) continue;
    const otherSegs = layout.segs[j];

    /* Base segment-segment conflicts. */
    for (let a = 0; a < selfSegs.length; a++) {
      const sa = selfSegs[a];
      for (let b = 0; b < otherSegs.length; b++) {
        const sb = otherSegs[b];
        if (sa.maxX + SEG_MIN_SEP < sb.minX) continue;
        if (sb.maxX + SEG_MIN_SEP < sa.minX) continue;
        if (sa.maxY + SEG_MIN_SEP < sb.minY) continue;
        if (sb.maxY + SEG_MIN_SEP < sa.minY) continue;
        const d = _segSegDist(sa.ax, sa.ay, sa.bx, sa.by,
                              sb.ax, sb.ay, sb.bx, sb.by);
        if (d < SEG_MIN_SEP) n++;
      }
    }

    /* Foreign pill proximity. */
    const expanded = _expandBox(layout.boxes[j], PILL_PROX);
    for (const s of selfSegs) {
      if (s.maxX < expanded.qL || s.minX > expanded.qR) continue;
      if (s.maxY < expanded.qT || s.minY > expanded.qB) continue;
      if (_segBoxOverlap(s, expanded) > 0) n++;
    }

    /* Extra crossings beyond the first between this pair. */
    const xc = _countSegmentCrossings(selfSegs, otherSegs);
    if (xc >= 2) n += (xc - 1);
  }

  if (obstacleContext) {
    const { boundaries, wireSegments, wallEdges, placed, stripH } =
      obstacleContext;
    if (boundaries && boundaries.length) {
      n += _boundaryOverlapPenalty(selfSegs, boundaries, stripH).count;
    }
    if (wallEdges && wallEdges.length) {
      n += _wallEdgeOverlapPenalty(selfSegs, wallEdges).count;
    }
    if (wireSegments && wireSegments.length) {
      const wPen = _wireOverlapPenalty(selfSegs, placed, wireSegments);
      n += wPen.parCount * 2 + (wPen.count - wPen.parCount);
    }
  }
  return n;
}

function _leaderHasConflictAt(idx, layout, obstacleContext) {
  const selfSegs = layout.segs[idx];
  for (let j = 0; j < layout.segs.length; j++) {
    if (j === idx) continue;
    const otherSegs = layout.segs[j];
    for (const sa of selfSegs) {
      for (const sb of otherSegs) {
        if (sa.maxX + SEG_MIN_SEP < sb.minX) continue;
        if (sb.maxX + SEG_MIN_SEP < sa.minX) continue;
        if (sa.maxY + SEG_MIN_SEP < sb.minY) continue;
        if (sb.maxY + SEG_MIN_SEP < sa.minY) continue;
        const d = _segSegDist(sa.ax, sa.ay, sa.bx, sa.by,
                              sb.ax, sb.ay, sb.bx, sb.by);
        if (d < SEG_MIN_SEP) return true;
      }
    }
    const expanded = _expandBox(layout.boxes[j], PILL_PROX);
    for (const s of selfSegs) {
      if (s.maxX < expanded.qL || s.minX > expanded.qR) continue;
      if (s.maxY < expanded.qT || s.minY > expanded.qB) continue;
      if (_segBoxOverlap(s, expanded) > 0) return true;
    }
    const xc = _countSegmentCrossings(selfSegs, otherSegs);
    if (xc >= 2) return true;
  }
  if (obstacleContext) {
    const { boundaries, wireSegments, wallEdges, placed, stripH } =
      obstacleContext;
    if (boundaries && boundaries.length &&
        _boundaryOverlapPenalty(selfSegs, boundaries, stripH).count > 0)
      return true;
    if (wallEdges && wallEdges.length &&
        _wallEdgeOverlapPenalty(selfSegs, wallEdges).count > 0)
      return true;
    if (wireSegments && wireSegments.length) {
      const wPen = _wireOverlapPenalty(selfSegs, placed, wireSegments);
      if (wPen.parCount > 0) return true;
    }
  }
  return false;
}

function _conflictedLeaderIndices(layout, obstacleContext) {
  const s = new Set();
  const n = layout.segs.length;
  for (let i = 0; i < n; i++) {
    if (_leaderHasConflictAt(i, layout, obstacleContext)) s.add(i);
  }
  return s;
}

/* ---- Wall-section boundary collision ----

   The boundary is a vertical line — the left or right edge of a wall
   chunk.  A leader running alongside it must keep BOUNDARY_MIN_SEP
   of air, and the angle gate admits segments up to ±45° from
   vertical.  The average-distance criterion (not max) is what makes
   a slanted leader count when it stays close over a stretch: an
   exactly-vertical leader has a single constant distance, and a
   30°-from-vertical leader varies over its length but its average
   is still small when the whole segment hugs the boundary. */
function _boundaryOverlapPenalty(leaderSegs, boundaries, stripH) {
  let count = 0, depth = 0;
  if (!boundaries || !boundaries.length) return { count, depth };

  /* Slope gate: catch any leader segment within 45° of vertical.
     A vertical segment has slope |dx/dy| = 0; a 45° segment has
     slope 1.0.  Beyond that the segment reads as diagonal, not as
     running alongside a vertical line. */
  const SLOPE_MAX = 1.0;

  for (const s of leaderSegs) {
    const dy = s.by - s.ay;
    if (Math.abs(dy) < 1e-6) continue;
    const slope = Math.abs((s.bx - s.ax) / dy);
    if (slope > SLOPE_MAX) continue;

    const yLo = Math.max(s.minY, 0);
    const yHi = Math.min(s.maxY, stripH);
    if (yHi - yLo < SEG_MIN_LEN) continue;

    const dx = s.bx - s.ax;
    for (const bx of boundaries) {
      if (s.maxX + BOUNDARY_MIN_SEP < bx) continue;
      if (s.minX - BOUNDARY_MIN_SEP > bx) continue;

      let sumDist = 0;
      const N = 8;
      for (let k = 0; k <= N; k++) {
        const y = yLo + (yHi - yLo) * k / N;
        const t = (y - s.ay) / dy;
        const x = s.ax + dx * t;
        sumDist += Math.abs(x - bx);
      }
      const avgDist = sumDist / (N + 1);
      if (avgDist < BOUNDARY_MIN_SEP) {
        count++;
        depth += (BOUNDARY_MIN_SEP - avgDist);
      }
    }
  }
  return { count, depth };
}

/* ---- Cable-wire collision ----

   See the module docstring for the anchor-proximity rule.  The
   stub guard is on segment LENGTH, not on the far endpoint's
   distance to the wire: a segment shorter than WIRE_ANCHOR_TRIM
   that touches the anchor is a genuine stub and is skipped; a
   longer segment from the anchor to a point 6 px off the wire is
   exactly the "leader hugs the wire" case and MUST fire. */
function _wireOverlapPenalty(leaderSegs, placed, wireSegments) {
  let count = 0, depth = 0;
  let parCount = 0, parDepth = 0;
  let approachCount = 0, approachDepth = 0;
  if (!wireSegments || !wireSegments.length)
    return { count, depth, parCount, parDepth,
             approachCount, approachDepth };

  for (const s of leaderSegs) {
    const it = placed[s.pathIdx];
    if (!it) continue;
    const ax = it.anchorCx;
    const ay = it.anchorCyRel;
    const sAngle = s.angle;

    /* Distance from the leader segment's endpoints to the anchor. */
    const dA = Math.hypot(s.ax - ax, s.ay - ay);
    const dB = Math.hypot(s.bx - ax, s.by - ay);
    const nearAnchor = Math.min(dA, dB) < WIRE_ANCHOR_TRIM;
    const farPt = dA > dB ? [s.ax, s.ay] : [s.bx, s.by];

    /* Stub guard: a leader segment that touches the anchor AND is
       shorter than WIRE_ANCHOR_TRIM is degenerate.  Skip it.  Any
       longer segment is evaluated normally, even if its far
       endpoint happens to be close to the wire — that IS the case
       this penalty exists to detect. */
    const segLen = Math.hypot(s.bx - s.ax, s.by - s.ay);
    if (nearAnchor && segLen < WIRE_ANCHOR_TRIM) continue;

    for (const w of wireSegments) {
      const wminX = Math.min(w.ax, w.bx);
      const wmaxX = Math.max(w.ax, w.bx);
      const wminY = Math.min(w.ay, w.by);
      const wmaxY = Math.max(w.ay, w.by);

      if (s.maxX + WIRE_APPROACH_SEP < wminX) continue;
      if (wmaxX + WIRE_APPROACH_SEP < s.minX) continue;
      if (s.maxY + WIRE_APPROACH_SEP < wminY) continue;
      if (wmaxY + WIRE_APPROACH_SEP < s.minY) continue;

      let d;
      if (nearAnchor) {
        d = _pointSegDist(farPt[0], farPt[1], w.ax, w.ay, w.bx, w.by);
      } else {
        d = _segSegDist(s.ax, s.ay, s.bx, s.by,
                        w.ax, w.ay, w.bx, w.by);
      }

      const wAngle = Math.atan2(w.by - w.ay, w.bx - w.ax);
      const angDiff = _angleDiff(sAngle, wAngle);

      if (angDiff < WIRE_PARALLEL_TOL && d < WIRE_MIN_SEP) {
        /* hard parallel tier */
        parCount++;
        parDepth += (WIRE_MIN_SEP - d);
        count++;
        depth += (WIRE_MIN_SEP - d);
      } else if (angDiff < WIRE_PARALLEL_TOL && d < WIRE_APPROACH_SEP) {
        /* soft parallel tier */
        approachCount++;
        approachDepth += (WIRE_APPROACH_SEP - d);
      } else if (d < SEG_MIN_SEP) {
        /* crossing tier */
        count++;
        depth += (SEG_MIN_SEP - d);
      }
    }
  }
  return { count, depth, parCount, parDepth,
           approachCount, approachDepth };
}

const WIRE_ANCHOR_TRIM = 8.0;

/* ---- Wall-edge collision ---- */

function _wallEdgeOverlapPenalty(leaderSegs, wallEdges) {
  let count = 0, depth = 0;
  if (!wallEdges || !wallEdges.length) return { count, depth };

  const SLOPE_MAX = 0.4;

  for (const s of leaderSegs) {
    const dx = s.bx - s.ax;
    const dy = s.by - s.ay;
    if (Math.abs(dx) < 1e-6) continue;
    const slope = Math.abs(dy / dx);
    if (slope > SLOPE_MAX) continue;

    for (const we of wallEdges) {
      const xLo = Math.max(s.minX, we.x0);
      const xHi = Math.min(s.maxX, we.x1);
      if (xHi - xLo < 2 * SEG_MIN_LEN) continue;

      if (s.minY - SEG_MIN_SEP > we.y) continue;
      if (s.maxY + SEG_MIN_SEP < we.y) continue;

      let maxDist = 0;
      let sumDist = 0;
      const N = 5;
      for (let k = 0; k <= N; k++) {
        const x = xLo + (xHi - xLo) * k / N;
        const t = (x - s.ax) / dx;
        const y = s.ay + dy * t;
        const d = Math.abs(y - we.y);
        if (d > maxDist) maxDist = d;
        sumDist += d;
      }
      if (maxDist < SEG_MIN_SEP) {
        count++;
        depth += (SEG_MIN_SEP - sumDist / (N + 1));
      }
    }
  }
  return { count, depth };
}

/* ---- Corner features ---- */

const CORNER_MIN_DIST = 24.0;

function _cornerFeature(it, placed, stripH, topPad, trackOffsets, which) {
  const anchorY  = it.anchorCyRel;
  const chanY    = stripH + (it.channelYRel || 0);
  const pillTopY = stripH + topPad + trackOffsets[it.track];
  const basePath = computeLeaderPath(
    it.anchorCx, anchorY, it.offsetA || 0,
    chanY, it.pillCenterX, pillTopY,
    it, placed, stripH, topPad, trackOffsets, it.diveMode || 0);

  if (basePath.length < 3) {
    const p = basePath[0] || [0, 0];
    return { x0: p[0], y0: p[1], x1: p[0], y1: p[1] };
  }

  let A, C, N, b;
  if (which === 0) {
    A = basePath[0];
    C = basePath[1];
    N = basePath[2];
    b = it.bevel0 || 0;
  } else {
    A = basePath[basePath.length - 3];
    C = basePath[basePath.length - 2];
    N = basePath[basePath.length - 1];
    b = it.bevel1 || 0;
  }

  if (b < BEVEL_MIN_APPLY) {
    return { x0: C[0], y0: C[1], x1: C[0], y1: C[1] };
  }
  const lenA = Math.hypot(C[0] - A[0], C[1] - A[1]);
  const lenB = Math.hypot(N[0] - C[0], N[1] - C[1]);
  const bU = Math.min(b, lenA * 0.85, lenB * 0.85);
  if (bU < BEVEL_MIN_APPLY || lenA < 1e-6 || lenB < 1e-6) {
    return { x0: C[0], y0: C[1], x1: C[0], y1: C[1] };
  }
  const t1 = (lenA - bU) / lenA;
  const t2 = bU / lenB;
  const p1 = [A[0] + (C[0] - A[0]) * t1, A[1] + (C[1] - A[1]) * t1];
  const p2 = [C[0] + (N[0] - C[0]) * t2, C[1] + (N[1] - C[1]) * t2];
  return { x0: p1[0], y0: p1[1], x1: p2[0], y1: p2[1] };
}

function _cornerDist(fA, fB) {
  const aIsPt = (Math.abs(fA.x0 - fA.x1) < 0.5 && Math.abs(fA.y0 - fA.y1) < 0.5);
  const bIsPt = (Math.abs(fB.x0 - fB.x1) < 0.5 && Math.abs(fB.y0 - fB.y1) < 0.5);
  if (aIsPt && bIsPt) {
    return Math.hypot(fA.x0 - fB.x0, fA.y0 - fB.y0);
  }
  if (aIsPt) {
    return _pointSegDist(fA.x0, fA.y0, fB.x0, fB.y0, fB.x1, fB.y1);
  }
  if (bIsPt) {
    return _pointSegDist(fB.x0, fB.y0, fA.x0, fA.y0, fA.x1, fA.y1);
  }
  return _segSegDist(fA.x0, fA.y0, fA.x1, fA.y1,
                     fB.x0, fB.y0, fB.x1, fB.y1);
}

/* ---- Style conflict detection ---- */

const STYLE_ANGLE_TOL   = Math.PI / 6;
const STYLE_PROX        = 10.0;
const STYLE_MIN_OVERLAP = 12.0;

function _segProjectionOverlap(A, B) {
  const lenA = Math.hypot(A.bx - A.ax, A.by - A.ay);
  const lenB = Math.hypot(B.bx - B.ax, B.by - B.ay);
  if (lenA < 1e-6 || lenB < 1e-6) return 0;
  let ux = (A.bx - A.ax) / lenA + (B.bx - B.ax) / lenB;
  let uy = (A.by - A.ay) / lenA + (B.by - B.ay) / lenB;
  const dLen = Math.hypot(ux, uy);
  if (dLen < 1e-6) return 0;
  ux /= dLen; uy /= dLen;
  const a0 = A.ax * ux + A.ay * uy;
  const a1 = A.bx * ux + A.by * uy;
  const b0 = B.ax * ux + B.ay * uy;
  const b1 = B.bx * ux + B.by * uy;
  const aLo = Math.min(a0, a1), aHi = Math.max(a0, a1);
  const bLo = Math.min(b0, b1), bHi = Math.max(b0, b1);
  return Math.max(0, Math.min(aHi, bHi) - Math.max(aLo, bLo));
}

function _buildStyleConflictGraph(placed, stripH, topPad, trackOffsets) {
  const layout = _buildLayout(placed, stripH, topPad, trackOffsets);
  const segsByPath = layout.segs;

  const adj = new Map();
  for (const it of placed) adj.set(it, new Set());

  for (let i = 0; i < segsByPath.length; i++) {
    for (let k = 0; k < segsByPath[i].length; k++) {
      const A = segsByPath[i][k];
      if (A.len < 2.0) continue;
      for (let j = i + 1; j < segsByPath.length; j++) {
        for (let l = 0; l < segsByPath[j].length; l++) {
          const B = segsByPath[j][l];
          if (B.len < 2.0) continue;
          if (_angleDiff(A.angle, B.angle) > STYLE_ANGLE_TOL) continue;
          if (A.maxX + STYLE_PROX < B.minX) continue;
          if (B.maxX + STYLE_PROX < A.minX) continue;
          if (A.maxY + STYLE_PROX < B.minY) continue;
          if (B.maxY + STYLE_PROX < A.minY) continue;
          const d = _segSegDist(A.ax, A.ay, A.bx, A.by,
                                B.ax, B.ay, B.bx, B.by);
          if (d >= STYLE_PROX) continue;
          if (_segProjectionOverlap(A, B) < STYLE_MIN_OVERLAP) continue;
          adj.get(placed[i]).add(placed[j]);
          adj.get(placed[j]).add(placed[i]);
        }
      }
    }
  }
  return adj;
}

/* ---- Leader geometry optimiser ---- */

const BEVEL_STEP      = 3.0;
const BEVEL_MAX       = 45.0;
const BEVEL_MIN_APPLY = 6.0;
const JOG_STEP        = 3.0;
const JOG_MAX         = 24.0;
const JOG_MIN_APPLY   = 6.0;
const OPT_MAX_PASSES  = 8;

/* ==========================================================================
   CHANNEL-TO-PILL TAIL
   ========================================================================== */

function _buildChannelToPill(pillX, chanY, pillTopY, self, placed,
                              stripBottom, topPad, trackOffsets) {
  const M = 4;
  const EPS = 2;
  const bias = (self && self.detourBias) || 0;

  const boxes = [];
  for (const Q of placed) {
    if (Q === self) continue;
    const qT = stripBottom + topPad + trackOffsets[Q.track];
    const qB = qT + Q.h;
    if (qB <= chanY) continue;
    if (qT >= pillTopY) continue;
    boxes.push({
      qL: Q.pillCenterX - Q.w / 2,
      qR: Q.pillCenterX + Q.w / 2,
      qT, qB,
    });
  }

  const blockers = [];
  for (const b of boxes) {
    if (pillX >= b.qL - EPS && pillX <= b.qR + EPS) blockers.push(b);
  }
  if (!blockers.length) return [[pillX, pillTopY]];

  blockers.sort((a, b) => a.qT - b.qT);
  const bands = [];
  let cur = { qT: blockers[0].qT, qB: blockers[0].qB,
              qL: blockers[0].qL, qR: blockers[0].qR };
  for (let i = 1; i < blockers.length; i++) {
    const b = blockers[i];
    if (b.qT <= cur.qB + 2 * M) {
      cur.qB = Math.max(cur.qB, b.qB);
      cur.qL = Math.min(cur.qL, b.qL);
      cur.qR = Math.max(cur.qR, b.qR);
    } else {
      bands.push(cur);
      cur = { qT: b.qT, qB: b.qB, qL: b.qL, qR: b.qR };
    }
  }
  bands.push(cur);

  const hClear = (y, xa, xb) => {
    const lo = Math.min(xa, xb), hi = Math.max(xa, xb);
    for (const b of boxes) {
      if (b.qT - EPS > y || b.qB + EPS < y) continue;
      if (b.qR < lo || b.qL > hi) continue;
      return false;
    }
    return true;
  };

  const vClear = (x, ya, yb) => {
    const lo = Math.min(ya, yb), hi = Math.max(ya, yb);
    for (const b of boxes) {
      if (b.qL - EPS > x || b.qR + EPS < x) continue;
      if (b.qB <= lo || b.qT >= hi) continue;
      return false;
    }
    return true;
  };

  const out = [];
  let curY = chanY;

  for (const band of bands) {
    const entryY = Math.max(curY, band.qT - M);
    const exitY  = Math.min(pillTopY, band.qB + M);
    if (entryY >= exitY - 0.5) continue;

    if (entryY > curY + 0.5) {
      out.push([pillX, entryY]);
      curY = entryY;
    }

    const leftX  = band.qL - M;
    const rightX = band.qR + M;
    const preferRight = (rightX - pillX) < (pillX - leftX);
    const tryOrder = preferRight ? [rightX, leftX] : [leftX, rightX];

    let detourX = null;
    for (const base of tryOrder) {
      const dir = base > pillX ? 1 : -1;
      let probe = base;
      for (let k = 0; k < 60; k++) {
        if (vClear(probe, entryY, exitY) &&
            hClear(entryY, pillX, probe) &&
            hClear(exitY,  pillX, probe)) {
          detourX = probe;
          break;
        }
        probe += dir * 6;
      }
      if (detourX !== null) break;
    }
    if (detourX === null) {
      detourX = preferRight ? rightX : leftX;
    }

    if (bias !== 0) {
      const biased = detourX + bias;
      if (vClear(biased, entryY, exitY) &&
          hClear(entryY, pillX, biased) &&
          hClear(exitY,  pillX, biased)) {
        detourX = biased;
      }
    }

    out.push([detourX, entryY]);
    out.push([detourX, exitY]);
    out.push([pillX,   exitY]);
    curY = exitY;
  }

  if (pillTopY > curY + 0.5) {
    out.push([pillX, pillTopY]);
  }
  return out;
}

function computeLeaderPath(anchorX, anchorY, offA, chanY, pillX, pillTopY,
                           self, placed, stripBottom, topPad, trackOffsets,
                           diveMode) {
  const mode = diveMode || 0;
  const path = [];
  path.push([anchorX, anchorY]);
  if (mode === 1) {
    path.push([anchorX, chanY]);
    path.push([pillX,   chanY]);
  } else if (mode === 2) {
    path.push([pillX, anchorY]);
    path.push([pillX, chanY]);
  } else {
    path.push([anchorX + offA, chanY]);
    path.push([pillX,          chanY]);
  }

  const tail = _buildChannelToPill(pillX, chanY, pillTopY, self, placed,
                                    stripBottom, topPad, trackOffsets);
  for (const p of tail) path.push(p);
  return path;
}

function _buildLeaderPathRel(it, placed, stripH, topPad, trackOffsets) {
  const anchorY  = it.anchorCyRel;
  const chanY    = stripH + it.channelYRel;
  const pillTopY = stripH + topPad + trackOffsets[it.track];
  return computeLeaderPath(
    it.anchorCx, anchorY, it.offsetA || 0,
    chanY, it.pillCenterX, pillTopY,
    it, placed, stripH, topPad, trackOffsets, it.diveMode || 0);
}

function _bevelPath(path, b0, b1) {
  const n = path.length;
  if (n < 4) return path;
  if (b0 < BEVEL_MIN_APPLY && b1 < BEVEL_MIN_APPLY) return path;

  const out = [path[0]];

  const A   = path[0];
  const C1  = path[1];
  const N1  = path[2];
  const lenA = Math.hypot(C1[0] - A[0],  C1[1] - A[1]);
  const lenB = Math.hypot(N1[0] - C1[0], N1[1] - C1[1]);
  const b0u  = Math.min(b0, lenA * 0.85, lenB * 0.85);
  if (b0u >= BEVEL_MIN_APPLY && lenA > 1e-6 && lenB > 1e-6) {
    const t1 = (lenA - b0u) / lenA;
    const t2 = b0u / lenB;
    out.push([A[0]  + (C1[0] - A[0])  * t1,
              A[1]  + (C1[1] - A[1])  * t1]);
    out.push([C1[0] + (N1[0] - C1[0]) * t2,
              C1[1] + (N1[1] - C1[1]) * t2]);
  } else {
    out.push(C1);
  }

  for (let i = 2; i <= n - 3; i++) out.push(path[i]);

  const M2  = path[n - 3];
  const C2  = path[n - 2];
  const P   = path[n - 1];
  const lenC = Math.hypot(C2[0] - M2[0], C2[1] - M2[1]);
  const lenD = Math.hypot(P[0]  - C2[0], P[1]  - C2[1]);
  const b1u  = Math.min(b1, lenC * 0.85, lenD * 0.85);
  if (b1u >= BEVEL_MIN_APPLY && lenC > 1e-6 && lenD > 1e-6) {
    const t1 = (lenC - b1u) / lenC;
    const t2 = b1u / lenD;
    out.push([M2[0] + (C2[0] - M2[0]) * t1,
              M2[1] + (C2[1] - M2[1]) * t1]);
    out.push([C2[0] + (P[0]  - C2[0]) * t2,
              C2[1] + (P[1]  - C2[1]) * t2]);
  } else {
    out.push(C2);
  }

  out.push(P);
  return out;
}

function _jogSegment(points, segIdx, shift) {
  if (!shift || Math.abs(shift) < JOG_MIN_APPLY) return points;
  const n = points.length;
  if (segIdx < 0 || segIdx >= n - 1) return points;
  const A = points[segIdx];
  const B = points[segIdx + 1];
  if (Math.abs(A[0] - B[0]) > 0.5) return points;
  const d  = Math.abs(shift);
  const X  = A[0];
  const yA = A[1], yB = B[1];
  const L  = Math.abs(yB - yA);
  if (L < 4 * d) return points;
  const sgn = (yB > yA) ? 1 : -1;
  const M1 = [X + shift, yA + sgn * d];
  const M2 = [X + shift, yB - sgn * d];
  return points.slice(0, segIdx + 1)
    .concat([M1, M2], points.slice(segIdx + 1));
}

function _applyJogsToPath(path, it) {
  let p = path;

  const anchorEndX = (it.anchorCx || 0) + (it.offsetA || 0);
  const fwd = Math.sign((it.pillCenterX || 0) - anchorEndX);

  const jogAllowed = (jog) => {
    if (fwd === 0) return true;
    if (jog === 0) return true;
    return Math.sign(jog) === fwd;
  };

  if (it.jog0 && Math.abs(it.jog0) >= JOG_MIN_APPLY && p.length >= 2
      && jogAllowed(it.jog0)) {
    p = _jogSegment(p, 0, it.jog0);
  }
  if (it.jog1 && Math.abs(it.jog1) >= JOG_MIN_APPLY && p.length >= 2
      && jogAllowed(it.jog1)) {
    p = _jogSegment(p, p.length - 2, it.jog1);
  }
  return p;
}

function _candidatesFor(cur, isBevel) {
  const step     = isBevel ? BEVEL_STEP : JOG_STEP;
  const maxV     = isBevel ? BEVEL_MAX  : JOG_MAX;
