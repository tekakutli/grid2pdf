  const minV     = isBevel ? BEVEL_MIN_APPLY : JOG_MIN_APPLY;
  const allowNeg = !isBevel;

  const set = new Set();

  const snap = (v) => {
    if (v === 0) return 0;
    if (!allowNeg && v < 0) return null;
    const a = Math.abs(v);
    if (a < minV) return null;
    const c = Math.min(maxV, a);
    return allowNeg ? Math.sign(v) * c : c;
  };

  const s1 = snap(cur + step);
  const s2 = snap(cur - step);
  if (s1 !== null) set.add(s1);
  if (s2 !== null) set.add(s2);

  if (cur === 0) {
    set.add(minV);
    if (allowNeg) set.add(-minV);
  }

  if (cur !== 0) set.add(0);

  set.delete(cur);
  return set;
}

const DIVE_MODES = [0, 1, 2];

const CHANNEL_Y_STEPS = [
  -24, -16, -8, -4, 4, 8, 16, 24, 32, 40, -32, -40,
];

const OFFSET_A_STEPS = [
  -240, -200, -160, -120, -80, -48, -24, -8, -2,
     2,    8,   24,   48,  80, 120, 160, 200, 240,
];

const OFFSET_A_ABS = [
  -240, -200, -160, -120, -80, -48, -24, -16, -8, 0,
     8,   16,   24,   48,  80, 120, 160, 200, 240,
];

const DETOUR_BIAS_STEPS = [-40, -20, 20, 40];

/* ==========================================================================
   LEADER GEOMETRY OPTIMISER
   ========================================================================== */

function optimizeLeaderGeometry(placed, stripH, topPad, trackOffsets,
                                boundaries, wireSegments, wallEdges) {
  for (const it of placed) {
    it.bevel0 = 0; it.bevel1 = 0;
    it.jog0   = 0; it.jog1   = 0;
    it.diveMode = 0;
    if (typeof it.detourBias !== "number") it.detourBias = 0;
  }
  if (placed.length < 2) return;

  const bxs   = Array.isArray(boundaries)   ? boundaries   : [];
  const wires = Array.isArray(wireSegments) ? wireSegments : [];
  const wes   = Array.isArray(wallEdges)    ? wallEdges    : [];

  const obstacleContext = {
    boundaries:   bxs,
    wireSegments: wires,
    wallEdges:    wes,
    placed:       placed,
    stripH:       stripH,
  };

  function evaluate() {
    const layout = _buildLayout(placed, stripH, topPad, trackOffsets);
    const pathSegs = layout.segs;
    const boxes    = layout.boxes;

    const allSegs = [];
    for (const segs of pathSegs) {
      for (const s of segs) {
        if (s.len >= SEG_MIN_LEN) allSegs.push(s);
      }
    }

    /* --- tier 1: V-V and H-H parallel collinear pairs --- */
    let vvCount = 0, vvDepth = 0;
    let hhCount = 0, hhDepth = 0;
    for (let i = 0; i < allSegs.length; i++) {
      const A = allSegs[i];
      for (let j = i + 1; j < allSegs.length; j++) {
        const B = allSegs[j];
        if (A.pathIdx === B.pathIdx) continue;

        if (A.kind === "vert" && B.kind === "vert") {
          const dx = Math.abs(A.ax - B.ax);
          if (dx >= SEG_MIN_SEP) continue;
          const oy0 = Math.max(A.minY, B.minY);
          const oy1 = Math.min(A.maxY, B.maxY);
          if (oy1 <= oy0) continue;
          vvCount++;
          vvDepth += (SEG_MIN_SEP - dx);
          continue;
        }
        if (A.kind === "horiz" && B.kind === "horiz") {
          const dy = Math.abs(A.ay - B.ay);
          if (dy >= SEG_MIN_SEP) continue;
          const ox0 = Math.max(A.minX, B.minX);
          const ox1 = Math.min(A.maxX, B.maxX);
          if (ox1 <= ox0) continue;
          hhCount++;
          hhDepth += (SEG_MIN_SEP - dy);
          continue;
        }
      }
    }

    /* --- tier 1b: double crossings --- */
    let extraCrossings = 0;
    for (let i = 0; i < pathSegs.length; i++) {
      for (let j = i + 1; j < pathSegs.length; j++) {
        const n = _countSegmentCrossings(pathSegs[i], pathSegs[j]);
        if (n >= 2) extraCrossings += (n - 1);
      }
    }

    /* --- tier 2b: segment vs foreign pill AABB --- */
    let pillCount = 0, pillDepth = 0;
    for (let i = 0; i < pathSegs.length; i++) {
      for (const s of pathSegs[i]) {
        if (s.len < 1.0) continue;
        for (let j = 0; j < boxes.length; j++) {
          if (j === i) continue;
          const box = boxes[j];
          const expanded = {
            qL: box.qL - PILL_PROX,
            qR: box.qR + PILL_PROX,
            qT: box.qT - PILL_PROX,
            qB: box.qB + PILL_PROX,
          };
          if (s.maxX < expanded.qL || s.minX > expanded.qR) continue;
          if (s.maxY < expanded.qT || s.minY > expanded.qB) continue;
          const t = _segBoxOverlap(s, expanded);
          if (t > 0) { pillCount++; pillDepth += t; }
        }
      }
    }

    /* --- tier 2: non-parallel-collinear segment pairs --- */
    let segCount = 0, segDepth = 0;
    for (let i = 0; i < allSegs.length; i++) {
      const A = allSegs[i];
      for (let j = i + 1; j < allSegs.length; j++) {
        const B = allSegs[j];
        if (A.pathIdx === B.pathIdx) continue;
        if (A.kind === "vert"  && B.kind === "vert")  continue;
        if (A.kind === "horiz" && B.kind === "horiz") continue;
        if (A.maxX + SEG_MIN_SEP < B.minX) continue;
        if (B.maxX + SEG_MIN_SEP < A.minX) continue;
        if (A.maxY + SEG_MIN_SEP < B.minY) continue;
        if (B.maxY + SEG_MIN_SEP < A.minY) continue;
        const d = _segSegDist(A.ax, A.ay, A.bx, A.by,
                              B.ax, B.ay, B.bx, B.by);
        if (d < SEG_MIN_SEP) { segCount++; segDepth += (SEG_MIN_SEP - d); }
      }
    }

    /* --- tier 3: boundary / wire / wall-edge --- */
    const bPen = _boundaryOverlapPenalty(allSegs, bxs, stripH);
    const bCount = bPen.count, bDepth = bPen.depth;

    const wPen = _wireOverlapPenalty(allSegs, placed, wires);
    const wireCount     = wPen.count;
    const wireDepth     = wPen.depth;
    const wireParCount  = wPen.parCount;
    const wireParDepth  = wPen.parDepth;
    const wireApprCount = wPen.approachCount;
    const wireApprDepth = wPen.approachDepth;

    const ePen = _wallEdgeOverlapPenalty(allSegs, wes);
    const weCount = ePen.count, weDepth = ePen.depth;

    /* --- tier 3d: arrowhead regions vs foreign segments --- */
    const HEAD_HALF = 5;
    let headCount = 0, headDepth = 0;
    for (let i = 0; i < placed.length; i++) {
      const it = placed[i];
      const anchorPt = [it.anchorCx, it.anchorCyRel];
      const pillPt   = [it.pillCenterX,
                        stripH + topPad + trackOffsets[it.track]];
      for (const [hx, hy] of [anchorPt, pillPt]) {
        const box = { qL: hx - HEAD_HALF, qR: hx + HEAD_HALF,
                      qT: hy - HEAD_HALF, qB: hy + HEAD_HALF };
        for (let j = 0; j < pathSegs.length; j++) {
          if (j === i) continue;
          for (const s of pathSegs[j]) {
            if (s.maxX < box.qL || s.minX > box.qR) continue;
            if (s.maxY < box.qT || s.minY > box.qB) continue;
            if (_segBoxOverlap(s, box) > 0) {
              headCount++;
              headDepth += HEAD_HALF;
            }
          }
        }
      }
    }

    /* --- tier 4: corner features --- */
    const corners = [];
    for (let pi = 0; pi < placed.length; pi++) {
      const it = placed[pi];
      corners.push({
        pathIdx: pi,
        ..._cornerFeature(it, placed, stripH, topPad, trackOffsets, 0),
      });
      corners.push({
        pathIdx: pi,
        ..._cornerFeature(it, placed, stripH, topPad, trackOffsets, 1),
      });
    }

    let cornerCount = 0, cornerDepth = 0;

    for (let i = 0; i < corners.length; i++) {
      for (let j = i + 1; j < corners.length; j++) {
        const A = corners[i], B = corners[j];
        if (A.pathIdx === B.pathIdx) continue;
        const d = _cornerDist(A, B);
        if (d < CORNER_MIN_DIST) {
          cornerCount++;
          cornerDepth += (CORNER_MIN_DIST - d);
        }
      }
    }

    for (const cf of corners) {
      const cfIsPt = (Math.abs(cf.x0 - cf.x1) < 0.5 &&
                      Math.abs(cf.y0 - cf.y1) < 0.5);
      for (const s of allSegs) {
        if (s.pathIdx === cf.pathIdx) continue;
        let d;
        if (cfIsPt) {
          d = _pointSegDist(cf.x0, cf.y0, s.ax, s.ay, s.bx, s.by);
        } else {
          d = _segSegDist(cf.x0, cf.y0, cf.x1, cf.y1,
                          s.ax, s.ay, s.bx, s.by);
        }
        if (d < CORNER_MIN_DIST) {
          cornerCount++;
          cornerDepth += (CORNER_MIN_DIST - d);
        }
      }
    }

    for (const cf of corners) {
      const cfIsPt = (Math.abs(cf.x0 - cf.x1) < 0.5 &&
                      Math.abs(cf.y0 - cf.y1) < 0.5);
      for (let bi = 0; bi < boxes.length; bi++) {
        if (bi === cf.pathIdx) continue;
        const box = boxes[bi];
        let hit = false;
        if (cfIsPt) {
          hit = cf.x0 >= box.qL && cf.x0 <= box.qR &&
                cf.y0 >= box.qT && cf.y0 <= box.qB;
        } else {
          const s = { ax: cf.x0, ay: cf.y0, bx: cf.x1, by: cf.y1,
                      minX: Math.min(cf.x0, cf.x1),
                      maxX: Math.max(cf.x0, cf.x1),
                      minY: Math.min(cf.y0, cf.y1),
                      maxY: Math.max(cf.y0, cf.y1) };
          hit = _segBoxOverlap(s, box) > 0;
        }
        if (hit) {
          cornerCount++;
          cornerDepth += CORNER_MIN_DIST;
        }
      }
    }

    const score =
      vvCount         * 1e12 + vvDepth         * 1e11 +
      hhCount         * 1e12 + hhDepth         * 1e11 +
      pillCount       * 5e11 + pillDepth       * 5e10 +
      wireParCount    * 1e11 + wireParDepth    * 1e10 +
      weCount         * 1e11 + weDepth         * 1e10 +
      bCount          * 1e11 + bDepth          * 1e10 +
      headCount       * 1e10 + headDepth       * 1e9  +
      extraCrossings  * DOUBLE_CROSS_EXTRA_W +
      segCount        * 1e9  + segDepth        * 1e8  +
      wireCount       * 1e9  + wireDepth       * 1e8  +
      wireApprCount   * 1e7  + wireApprDepth   * 1e6  +
      cornerCount     * 1e6  + cornerDepth     * 1e5;

    return { score };
  }

  let cur = evaluate();
  if (cur.score < 1) return;

  /* ---- Main pass loop ---- */
  for (let pass = 0; pass < OPT_MAX_PASSES; pass++) {
    const layout = _buildLayout(placed, stripH, topPad, trackOffsets);
    const conflicted = _conflictedLeaderIndices(layout, obstacleContext);

    let best = null;

    for (let li = 0; li < placed.length; li++) {
      if (!conflicted.has(li)) continue;
      const it = placed[li];

      for (const field of ["bevel0", "bevel1", "jog0", "jog1"]) {
        const curVal  = it[field] || 0;
        const isBevel = field.startsWith("bevel");
        const cands   = _candidatesFor(curVal, isBevel);

        for (const cand of cands) {
          const saved = it[field];
          it[field] = cand;
          const test = evaluate();
          it[field] = saved;

          if (test.score < cur.score - 0.5) {
            if (!best || test.score < best.test.score) {
              best = { it, field, newValue: cand, test };
            }
          }
        }
      }

      const curMode = it.diveMode || 0;
      for (const cand of DIVE_MODES) {
        if (cand === curMode) continue;
        const saved = it.diveMode;
        it.diveMode = cand;
        const test = evaluate();
        it.diveMode = saved;

        if (test.score < cur.score - 0.5) {
          if (!best || test.score < best.test.score) {
            best = { it, field: 'diveMode', newValue: cand, test };
          }
        }
      }

      const curLane = (typeof it.channelYRel === "number")
        ? it.channelYRel : 0;
      for (const dY of CHANNEL_Y_STEPS) {
        const newLane = curLane + dY;
        if (newLane < 2) continue;
        if (newLane >= topPad - 2) continue;

        const saved = it.channelYRel;
        it.channelYRel = newLane;
        const test = evaluate();
        it.channelYRel = saved;

        if (test.score < cur.score - 0.5) {
          if (!best || test.score < best.test.score) {
            best = { it, field: 'channelYRel', newValue: newLane, test };
          }
        }
      }

      const curOff = it.offsetA || 0;
      for (const dOff of OFFSET_A_STEPS) {
        const newOff = curOff + dOff;
        const saved = it.offsetA;
        it.offsetA = newOff;
        const test = evaluate();
        it.offsetA = saved;

        if (test.score < cur.score - 0.5) {
          if (!best || test.score < best.test.score) {
            best = { it, field: 'offsetA', newValue: newOff, test };
          }
        }
      }

      const curBias = it.detourBias || 0;
      for (const cand of DETOUR_BIAS_STEPS) {
        if (cand === curBias) continue;
        const saved = it.detourBias;
        it.detourBias = cand;
        const test = evaluate();
        it.detourBias = saved;

        if (test.score < cur.score - 0.5) {
          if (!best || test.score < best.test.score) {
            best = { it, field: 'detourBias', newValue: cand, test };
          }
        }
      }
    }

    if (!best) break;
    best.it[best.field] = best.newValue;
    cur = best.test;
    if (cur.score < 1) break;
  }

  /* ==========================================================================
     COORDINATED PAIR REFINEMENT
     ========================================================================== */
  {
    const laneChoices   = [2, 6, 10, 14, 18, 22, 26, 30];
    const biasChoices   = [0, -40, -20, 20, 40];

    const BYSTANDER_RADIUS = 100;
    const MAX_BYSTANDERS   = 4;

    for (let iter = 0; iter < 2; iter++) {
      const layout0 = _buildLayout(placed, stripH, topPad, trackOffsets);
      const badPairs = [];
      for (let i = 0; i < placed.length; i++) {
        for (let j = i + 1; j < placed.length; j++) {
          const xc = _countSegmentCrossings(layout0.segs[i], layout0.segs[j]);
          if (xc >= 2) badPairs.push({ i, j, xc });
        }
      }
      badPairs.sort((a, b) => b.xc - a.xc);

      let anyImproved = false;

      /* ---- Pass 1: 2-way coordinated ---- */
      for (let k = 0; k < Math.min(badPairs.length, 8); k++) {
        const { i, j } = badPairs[k];
        const A = placed[i], B = placed[j];

        const aOrigLane = A.channelYRel;
        const aOrigOff  = A.offsetA || 0;
        const aOrigBias = A.detourBias || 0;
        const bOrigLane = B.channelYRel;
        const bOrigOff  = B.offsetA || 0;
        const bOrigBias = B.detourBias || 0;

        let bestScore = cur.score;
        let bestALane = aOrigLane, bestAOff = aOrigOff, bestABias = aOrigBias;
        let bestBLane = bOrigLane, bestBOff = bOrigOff, bestBBias = bOrigBias;

        for (const aLane of laneChoices) {
          if (aLane >= topPad - 2) continue;
          A.channelYRel = aLane;
          for (const bLane of laneChoices) {
            if (bLane >= topPad - 2) continue;
            B.channelYRel = bLane;
            const s = evaluate().score;
            if (s < bestScore - 0.5) {
              bestScore = s;
              bestALane = aLane; bestBLane = bLane;
              bestAOff = aOrigOff; bestBOff = bOrigOff;
              bestABias = aOrigBias; bestBBias = bOrigBias;
            }
          }
        }
        A.channelYRel = aOrigLane; B.channelYRel = bOrigLane;

        for (const aOff of OFFSET_A_ABS) {
          A.offsetA = aOff;
          for (const bOff of OFFSET_A_ABS) {
            B.offsetA = bOff;
            const s = evaluate().score;
            if (s < bestScore - 0.5) {
              bestScore = s;
              bestAOff = aOff; bestBOff = bOff;
              bestALane = aOrigLane; bestBLane = bOrigLane;
              bestABias = aOrigBias; bestBBias = bOrigBias;
            }
          }
        }
        A.offsetA = aOrigOff; B.offsetA = bOrigOff;

        for (const aBias of biasChoices) {
          A.detourBias = aBias;
          for (const bBias of biasChoices) {
            B.detourBias = bBias;
            const s = evaluate().score;
            if (s < bestScore - 0.5) {
              bestScore = s;
              bestABias = aBias; bestBBias = bBias;
              bestALane = aOrigLane; bestBLane = bOrigLane;
              bestAOff = aOrigOff; bestBOff = bOrigOff;
            }
          }
        }
        A.detourBias = aOrigBias; B.detourBias = bOrigBias;

        for (const aLane of laneChoices) {
          if (aLane >= topPad - 2) continue;
          A.channelYRel = aLane;
          for (const bOff of OFFSET_A_ABS) {
            B.offsetA = bOff;
            const s = evaluate().score;
            if (s < bestScore - 0.5) {
              bestScore = s;
              bestALane = aLane; bestBOff = bOff;
              bestBLane = bOrigLane; bestAOff = aOrigOff;
              bestABias = aOrigBias; bestBBias = bOrigBias;
            }
          }
        }
        A.channelYRel = aOrigLane; B.offsetA = bOrigOff;

        for (const aOff of OFFSET_A_ABS) {
          A.offsetA = aOff;
          for (const bLane of laneChoices) {
            if (bLane >= topPad - 2) continue;
            B.channelYRel = bLane;
            const s = evaluate().score;
            if (s < bestScore - 0.5) {
              bestScore = s;
              bestAOff = aOff; bestBLane = bLane;
              bestALane = aOrigLane; bestBOff = bOrigOff;
              bestABias = aOrigBias; bestBBias = bOrigBias;
            }
          }
        }
        A.offsetA = aOrigOff; B.channelYRel = bOrigLane;

        for (const aLane of laneChoices) {
          if (aLane >= topPad - 2) continue;
          A.channelYRel = aLane;
          for (const bBias of biasChoices) {
            B.detourBias = bBias;
            const s = evaluate().score;
            if (s < bestScore - 0.5) {
              bestScore = s;
              bestALane = aLane; bestBBias = bBias;
              bestBLane = bOrigLane; bestABias = aOrigBias;
              bestAOff = aOrigOff; bestBOff = bOrigOff;
            }
          }
        }
        A.channelYRel = aOrigLane; B.detourBias = bOrigBias;

        for (const aBias of biasChoices) {
          A.detourBias = aBias;
          for (const bLane of laneChoices) {
            if (bLane >= topPad - 2) continue;
            B.channelYRel = bLane;
            const s = evaluate().score;
            if (s < bestScore - 0.5) {
              bestScore = s;
              bestABias = aBias; bestBLane = bLane;
              bestALane = aOrigLane; bestBBias = bOrigBias;
              bestAOff = aOrigOff; bestBOff = bOrigOff;
            }
          }
        }
        A.detourBias = aOrigBias; B.channelYRel = bOrigLane;

        for (const aOff of OFFSET_A_ABS) {
          A.offsetA = aOff;
          for (const bBias of biasChoices) {
            B.detourBias = bBias;
            const s = evaluate().score;
            if (s < bestScore - 0.5) {
              bestScore = s;
              bestAOff = aOff; bestBBias = bBias;
              bestALane = aOrigLane; bestBLane = bOrigLane;
              bestABias = aOrigBias; bestBOff = bOrigOff;
            }
          }
        }
        A.offsetA = aOrigOff; B.detourBias = bOrigBias;

        for (const aBias of biasChoices) {
          A.detourBias = aBias;
          for (const bOff of OFFSET_A_ABS) {
            B.offsetA = bOff;
            const s = evaluate().score;
            if (s < bestScore - 0.5) {
              bestScore = s;
              bestABias = aBias; bestBOff = bOff;
              bestALane = aOrigLane; bestBLane = bOrigLane;
              bestAOff = aOrigOff; bestBBias = bOrigBias;
            }
          }
        }
        A.detourBias = aOrigBias; B.offsetA = bOrigOff;

        A.channelYRel = bestALane;
        A.offsetA     = bestAOff;
        A.detourBias  = bestABias;
        B.channelYRel = bestBLane;
        B.offsetA     = bestBOff;
        B.detourBias  = bestBBias;

        if (bestScore < cur.score - 0.5) {
          cur = { score: bestScore };
          anyImproved = true;
        }
      }

      /* ---- Pass 1b: wire-avoidance coordinated ----

         Gate fires on any HARD wire conflict (parCount or crossing
         count, both folded into wPen.count) OR the soft approach
         tier.  An earlier revision gated on parCount alone and let
         a leader whose only wire issue was a crossing fall through
         — that was the V2 case. */
      {
        const layout1b = _buildLayout(placed, stripH, topPad, trackOffsets);
        for (let li = 0; li < placed.length; li++) {
          const it = placed[li];
          const wPenL = _wireOverlapPenalty(layout1b.segs[li], placed, wires);
          if (wPenL.count === 0 && wPenL.approachCount === 0) continue;

          const origDive = it.diveMode || 0;
          const origChan = it.channelYRel;
          const origOff  = it.offsetA || 0;

          let bestScore = cur.score;
          let bestDive = origDive, bestChan = origChan, bestOff = origOff;

          for (const dM of DIVE_MODES) {
            if (dM === origDive) continue;
            it.diveMode = dM;
            for (const cL of laneChoices) {
              if (cL >= topPad - 2 || cL === origChan) continue;
              it.channelYRel = cL;
              const s = evaluate().score;
              if (s < bestScore - 0.5) {
                bestScore = s;
                bestDive = dM; bestChan = cL; bestOff = origOff;
              }
            }
          }
          it.diveMode = origDive; it.channelYRel = origChan;

          for (const dM of DIVE_MODES) {
            if (dM === origDive) continue;
            it.diveMode = dM;
            for (const cO of OFFSET_A_ABS) {
              if (cO === origOff) continue;
              it.offsetA = cO;
              const s = evaluate().score;
              if (s < bestScore - 0.5) {
                bestScore = s;
                bestDive = dM; bestChan = origChan; bestOff = cO;
              }
            }
          }
          it.diveMode = origDive; it.offsetA = origOff;

          if (bestDive !== origDive ||
              bestChan !== origChan ||
              bestOff  !== origOff) {
            it.diveMode    = bestDive;
            it.channelYRel = bestChan;
            it.offsetA     = bestOff;
            cur = { score: bestScore };
            anyImproved = true;
          }
        }
      }

      /* ---- Pass 2: 3-way with the bystander ---- */
      for (let k = 0; k < Math.min(badPairs.length, 4); k++) {
        const { i, j } = badPairs[k];
        const A = placed[i], B = placed[j];

        const cps = [];
        for (const sa of layout0.segs[i]) {
          for (const sb of layout0.segs[j]) {
            if (!_segSegProperCross(sa, sb)) continue;
            const d1x = sa.bx - sa.ax, d1y = sa.by - sa.ay;
            const d2x = sb.bx - sb.ax, d2y = sb.by - sb.ay;
            const denom = d1x * d2y - d1y * d2x;
            const rx = sb.ax - sa.ax, ry = sb.ay - sa.ay;
            const t = (rx * d2y - ry * d2x) / denom;
            cps.push([sa.ax + t * d1x, sa.ay + t * d1y]);
          }
        }
        if (cps.length < 2) continue;

        const candidates = [];
        for (let q = 0; q < placed.length; q++) {
          if (q === i || q === j) continue;
          let minD = Infinity;
          for (const cp of cps) {
            for (const s of layout0.segs[q]) {
              const d = _pointSegDist(cp[0], cp[1],
                                       s.ax, s.ay, s.bx, s.by);
              if (d < minD) minD = d;
            }
          }
          if (minD < BYSTANDER_RADIUS) {
            candidates.push({ idx: q, dist: minD });
          }
        }
        candidates.sort((a, b) => a.dist - b.dist);
        if (!candidates.length) continue;

        const aSave = { diveMode: A.diveMode, channelYRel: A.channelYRel,
                        offsetA: A.offsetA, detourBias: A.detourBias };

        let fixed = false;

        for (let bIdx = 0;
             bIdx < Math.min(MAX_BYSTANDERS, candidates.length) && !fixed;
             bIdx++) {
          const bystanderIdx = candidates[bIdx].idx;
          const C = placed[bystanderIdx];
          const cSave = { diveMode: C.diveMode, channelYRel: C.channelYRel,
                          offsetA: C.offsetA, detourBias: C.detourBias };

          let bestScore = cur.score;
          let bestAMove = null, bestCMove = null;

          for (const aD of [0, 1, 2]) {
            if (aD === aSave.diveMode) continue;
            A.diveMode = aD;
            for (const cD of [0, 1, 2]) {
              if (cD === cSave.diveMode) continue;
              C.diveMode = cD;
              const s = evaluate().score;
              if (s < bestScore - 0.5) {
                bestScore = s;
                bestAMove = { field: "diveMode", value: aD };
                bestCMove = { field: "diveMode", value: cD };
              }
            }
          }
          A.diveMode = aSave.diveMode;
          C.diveMode = cSave.diveMode;

          for (const aD of [0, 1, 2]) {
            if (aD === aSave.diveMode) continue;
            A.diveMode = aD;
            for (const cL of laneChoices) {
              if (cL >= topPad - 2 || cL === cSave.channelYRel) continue;
              C.channelYRel = cL;
              const s = evaluate().score;
              if (s < bestScore - 0.5) {
                bestScore = s;
                bestAMove = { field: "diveMode", value: aD };
                bestCMove = { field: "channelYRel", value: cL };
              }
            }
          }
          A.diveMode = aSave.diveMode;
          C.channelYRel = cSave.channelYRel;

          for (const aD of [0, 1, 2]) {
            if (aD === aSave.diveMode) continue;
            A.diveMode = aD;
            for (const cO of OFFSET_A_ABS) {
              if (cO === cSave.offsetA) continue;
              C.offsetA = cO;
              const s = evaluate().score;
              if (s < bestScore - 0.5) {
                bestScore = s;
                bestAMove = { field: "diveMode", value: aD };
                bestCMove = { field: "offsetA", value: cO };
              }
            }
          }
          A.diveMode = aSave.diveMode;
          C.offsetA = cSave.offsetA;

          if (bestAMove && bestCMove) {
            A[bestAMove.field] = bestAMove.value;
            C[bestCMove.field] = bestCMove.value;
            cur = { score: bestScore };
            anyImproved = true;
            fixed = true;
          }
        }
      }

      if (!anyImproved) break;
    }
  }
}

/* ==========================================================================
   PILL PUSH PASS
   ========================================================================== */

function buildPathSegsFor(it, placed, stripH, topPad, trackOffsets) {
  const chanY    = stripH + (it.channelYRel || 0);
  const pillTopY = stripH + topPad + trackOffsets[it.track];
  const base = computeLeaderPath(
    it.anchorCx, it.anchorCyRel, it.offsetA || 0,
    chanY, it.pillCenterX, pillTopY,
    it, placed, stripH, topPad, trackOffsets, it.diveMode || 0);
  const path = _applyJogsToPath(
    _bevelPath(base, it.bevel0 || 0, it.bevel1 || 0), it);
  return _pathSegments(path, -1, SEG_MIN_LEN);
}

function _pillHasSameTrackCollision(idx, placed) {
  const me = placed[idx];
  const myTrack = me.track;
  const myL = me.pillCenterX - me.w / 2;
  const myR = me.pillCenterX + me.w / 2;

  for (let j = 0; j < placed.length; j++) {
    if (j === idx) continue;
    const other = placed[j];
    if (other.track !== myTrack) continue;
    const oL = other.pillCenterX - other.w / 2;
    const oR = other.pillCenterX + other.w / 2;
    if (myR + PILL_PROX > oL && oR + PILL_PROX > myL) return true;
  }
  return false;
}

function _separatePillsInTracks(placed) {
  const byTrack = new Map();
  for (let i = 0; i < placed.length; i++) {
    const t = placed[i].track;
    if (!byTrack.has(t)) byTrack.set(t, []);
    byTrack.get(t).push(i);
  }
  for (const [, indices] of byTrack) {
    indices.sort((a, b) =>
      placed[a].pillCenterX - placed[b].pillCenterX);
    for (let k = 1; k < indices.length; k++) {
      const prev = placed[indices[k - 1]];
      const cur  = placed[indices[k]];
      const prevR = prev.pillCenterX + prev.w / 2;
      const curL  = cur.pillCenterX - cur.w / 2;
      const gap = curL - prevR;
      if (gap < PILL_PROX) {
        cur.pillCenterX += (PILL_PROX - gap);
      }
    }
  }
}

function pushPillsForLeaderConflicts(placed, stripH, topPad, trackOffsets,
                                     obstacleContext) {
  const PUSH = [];
  for (let d = 4; d <= 32; d += 4) { PUSH.push(d); PUSH.push(-d); }

  const MAX_ROUNDS = 3;

  _separatePillsInTracks(placed);

  for (let round = 0; round < MAX_ROUNDS; round++) {
    let anyMoved = false;

    for (let li = 0; li < placed.length; li++) {
      const it = placed[li];
      let layout = _buildLayout(placed, stripH, topPad, trackOffsets);
      const before = _countConflictsAt(li, layout, obstacleContext);
      if (before === 0) continue;

      const origX = it.pillCenterX;
      let bestX = origX, bestN = before;
      for (const dX of PUSH) {
        it.pillCenterX = origX + dX;
        if (_pillHasSameTrackCollision(li, placed)) continue;
        layout = _buildLayout(placed, stripH, topPad, trackOffsets);
        const n = _countConflictsAt(li, layout, obstacleContext);
        if (n < bestN) { bestN = n; bestX = origX + dX; }
      }
      it.pillCenterX = bestX;
      if (bestX !== origX) anyMoved = true;

      if (bestN > 0) {
        const involved = new Set();
        const selfSegs = layout.segs[li];

        for (let j = 0; j < placed.length; j++) {
          if (j === li) continue;
          const otherSegs = layout.segs[j];
          let cflt = false;

          for (const sa of selfSegs) {
            if (cflt) break;
            for (const sb of otherSegs) {
              if (sa.maxX + SEG_MIN_SEP < sb.minX) continue;
              if (sb.maxX + SEG_MIN_SEP < sa.minX) continue;
              if (sa.maxY + SEG_MIN_SEP < sb.minY) continue;
              if (sb.maxY + SEG_MIN_SEP < sa.minY) continue;
              const d = _segSegDist(sa.ax, sa.ay, sa.bx, sa.by,
                                    sb.ax, sb.ay, sb.bx, sb.by);
              if (d < SEG_MIN_SEP) { cflt = true; break; }
            }
          }

          if (!cflt) {
            const box = layout.boxes[j];
            const expanded = _expandBox(box, PILL_PROX);
            for (const s of selfSegs) {
              if (s.maxX < expanded.qL || s.minX > expanded.qR) continue;
              if (s.maxY < expanded.qT || s.minY > expanded.qB) continue;
              if (_segBoxOverlap(s, expanded) > 0) { cflt = true; break; }
            }
          }

          if (cflt) involved.add(j);
        }

        for (const j of involved) {
          const foreign = placed[j];
          const fOrigX = foreign.pillCenterX;
          let fBestX = fOrigX, fBestN = bestN;
          for (const dX of PUSH) {
            foreign.pillCenterX = fOrigX + dX;
            if (_pillHasSameTrackCollision(j, placed)) continue;
            layout = _buildLayout(placed, stripH, topPad, trackOffsets);
            const n = _countConflictsAt(li, layout, obstacleContext);
            if (n < fBestN) { fBestN = n; fBestX = fOrigX + dX; }
          }
          foreign.pillCenterX = fBestX;
          if (fBestX !== fOrigX) { anyMoved = true; bestN = fBestN; }
        }
      }
    }
    if (!anyMoved) break;
  }

  /* ==========================================================================
     COORDINATED PILL PAIR MOVES
     ==========================================================================

     For pairs of leaders whose polylines cross more than once, no
     single pill move can always fix the pair — moving A alone often
     breaks a conflict with a third leader, and moving B alone breaks
     a different conflict.  This pass tries all combinations of small
     shifts on BOTH pills of a double-crossing pair and scores each
     combination by the TOTAL conflict count across the whole layout,
     not just the pair's own.  This is stricter than the earlier
     version, which only measured A + B's conflicts and could
     therefore accept a shift that fixed the pair while introducing
     two conflicts elsewhere. */
  {
    const SHIFTS = [0, -8, 8, -16, 16, -24, 24];
    const layout0 = _buildLayout(placed, stripH, topPad, trackOffsets);

    const baselineTotal = (() => {
      let n = 0;
      for (let i = 0; i < placed.length; i++) {
        n += _countConflictsAt(i, layout0, obstacleContext);
      }
      return Math.floor(n / 2);
    })();

    const pairs = [];
    for (let i = 0; i < placed.length; i++) {
      for (let j = i + 1; j < placed.length; j++) {
        const xc = _countSegmentCrossings(layout0.segs[i], layout0.segs[j]);
        if (xc >= 2) pairs.push({ i, j, xc });
      }
    }
    pairs.sort((a, b) => b.xc - a.xc);

    for (const p of pairs.slice(0, 4)) {
      const A = placed[p.i];
      const B = placed[p.j];
      const aOrig = A.pillCenterX;
      const bOrig = B.pillCenterX;

      let bestA = aOrig, bestB = bOrig, bestTotal = baselineTotal;

      for (const da of SHIFTS) {
        A.pillCenterX = aOrig + da;
        if (_pillHasSameTrackCollision(p.i, placed)) continue;
        for (const db of SHIFTS) {
          B.pillCenterX = bOrig + db;
          if (_pillHasSameTrackCollision(p.j, placed)) continue;
          const lay = _buildLayout(placed, stripH, topPad, trackOffsets);
          let tot = 0;
          for (let q = 0; q < placed.length; q++) {
            tot += _countConflictsAt(q, lay, obstacleContext);
          }
          tot = Math.floor(tot / 2);
          if (tot < bestTotal - 0.5) {
            bestTotal = tot;
            bestA = aOrig + da;
            bestB = bOrig + db;
          }
        }
      }
      A.pillCenterX = bestA;
      B.pillCenterX = bestB;
    }
  }
}

/* ==========================================================================
   DOUBLE-CROSSING HUG PASS
   ==========================================================================

   When two leaders cross more than once, the current optimiser stalls:
   the 2-way coordinated pass does not try diveMode, and the 3-way pass
   only accepts candidate pairs where BOTH diveMode values differ from
   their current values.  A pair like V5 × V6 — where flipping a single
   leader's diveMode from 0 to 2 resolves both crossings — falls through
   both.

   This pass handles that case directly.  For each pair whose paths
   properly cross twice or more, it tries a small set of "hug"
   reroutes on ONE of the two leaders, mirroring the detour idiom
   _buildChannelToPill already uses around pill boxes:

     • hug above the other's channel   (A.channelYRel = B.channelYRel − HUG_GAP)
     • hug below the other's channel   (A.channelYRel = B.channelYRel + HUG_GAP)
     • diveMode 2                       (A's horizontal moves up to A's
                                          own anchorY, A's descent moves
                                          to A's own pill column — this is
                                          the "hug the pill column" move)
     • hug the other's descent columns  (A's descent column shifts to just
                                          outside B's column range, at
                                          HUG_GAP to the near side)

   Every candidate is only accepted when:

     • the pair's own proper crossing count drops below 2, AND
     • the layout's TOTAL conflict count strictly improves.

   The pass runs after optimizeLeaderGeometry in each polish round, so
   it composes with (and never undoes) the optimiser's work. */
function rerouteDoubleCrossingsByHugging(placed, stripH, topPad, trackOffsets,
                                         boundaries, wireSegments, wallEdges) {
  const HUG_GAP      = 8.0;
  const MIN_CHANNEL  = 2;
  const MAX_CHANNEL  = topPad - 2;
  const MAX_PAIRS    = 8;

  if (MAX_CHANNEL <= MIN_CHANNEL) return;

  const obstacleContext = {
    boundaries:   boundaries   || [],
    wireSegments: wireSegments || [],
    wallEdges:    wallEdges    || [],
    placed, stripH,
  };

  let layout = _buildLayout(placed, stripH, topPad, trackOffsets);

  /* Find every double-crossing pair. */
  const pairs = [];
  for (let i = 0; i < placed.length; i++) {
    for (let j = i + 1; j < placed.length; j++) {
      const xc = _countSegmentCrossings(layout.segs[i], layout.segs[j]);
      if (xc >= 2) pairs.push({ i, j, xc });
    }
  }
  if (!pairs.length) return;
  pairs.sort((a, b) => b.xc - a.xc);

  const totalConflicts = (lay) => {
    let n = 0;
    for (let q = 0; q < placed.length; q++) {
      n += _countConflictsAt(q, lay, obstacleContext);
    }
    return n;
  };

  for (const p of pairs.slice(0, MAX_PAIRS)) {
    /* Re-build the layout for the pair and re-verify the double crossing
       is still present — an earlier pair in this pass may have changed
       one of these leaders. */
    layout = _buildLayout(placed, stripH, topPad, trackOffsets);
    if (_countSegmentCrossings(layout.segs[p.i], layout.segs[p.j]) < 2) {
      continue;
    }

    const totalBefore = totalConflicts(layout);
    let bestTotal = totalBefore;
    let bestMove  = null;

    /* Try both directions: A hugging B, and B hugging A. */
    for (const [idxSelf, idxOther] of [[p.i, p.j], [p.j, p.i]]) {
      const A = placed[idxSelf];
      const B = placed[idxOther];

      const aSave = {
        diveMode:    A.diveMode || 0,
        channelYRel: A.channelYRel,
        offsetA:     A.offsetA || 0,
      };

      /* --- Analyse B's structure ---------------------------------- */
      /* B's channel Y in strip-local coords (relative to stripH). */
      const bChanY = B.channelYRel || 0;

      /* B's structural columns: the x-positions of B's verticals.
         A diveMode 2 leader has only its pill column; other modes
         also carry a column at anchorCx + offsetA. */
      const bCols = [B.pillCenterX];
      if ((B.diveMode || 0) !== 2) {
        bCols.push(B.anchorCx + (B.offsetA || 0));
      }
      const bColMin = Math.min(...bCols);
      const bColMax = Math.max(...bCols);

      /* --- Build candidate moves for A ---------------------------- */
      const candidates = [];

      const hugAbove = bChanY - HUG_GAP;
      if (hugAbove >= MIN_CHANNEL && hugAbove <= MAX_CHANNEL) {
        candidates.push({ diveMode: 0, channelYRel: hugAbove,
                          offsetA: aSave.offsetA });
        candidates.push({ diveMode: 1, channelYRel: hugAbove,
                          offsetA: aSave.offsetA });
      }

      const hugBelow = bChanY + HUG_GAP;
      if (hugBelow >= MIN_CHANNEL && hugBelow <= MAX_CHANNEL) {
        candidates.push({ diveMode: 0, channelYRel: hugBelow,
                          offsetA: aSave.offsetA });
        candidates.push({ diveMode: 1, channelYRel: hugBelow,
                          offsetA: aSave.offsetA });
      }

      /* Dive mode 2: A's horizontal rides up to A's own anchorY and
         A's descent drops at A's own pill column.  This is the move
         that resolves V5 × V6 — it clears both crossings at once by
         pulling A's structure above and to the side of B's. */
      candidates.push({ diveMode: 2, channelYRel: aSave.channelYRel,
                        offsetA: aSave.offsetA });

      /* Hug the other leader's descent column: shift A's descent
         column to just outside B's column range.  Same idiom the
         pill-box detour uses (qL − M / qR + M). */
      if (A.anchorCx > bColMin) {
        const newOffA = (bColMin - HUG_GAP) - A.anchorCx;
        candidates.push({ diveMode: 0, channelYRel: aSave.channelYRel,
                          offsetA: newOffA });
      }
      if (A.anchorCx < bColMax) {
        const newOffA = (bColMax + HUG_GAP) - A.anchorCx;
        candidates.push({ diveMode: 0, channelYRel: aSave.channelYRel,
                          offsetA: newOffA });
      }

      /* --- Test each candidate ------------------------------------ */
      for (const c of candidates) {
        /* Skip no-ops. */
        if (c.diveMode === aSave.diveMode &&
            Math.abs(c.channelYRel - aSave.channelYRel) < 0.5 &&
            Math.abs(c.offsetA     - aSave.offsetA)     < 0.5) {
          continue;
        }
        if (c.channelYRel < MIN_CHANNEL || c.channelYRel > MAX_CHANNEL) {
          continue;
        }

        A.diveMode    = c.diveMode;
        A.channelYRel = c.channelYRel;
        A.offsetA     = c.offsetA;

        const newLayout = _buildLayout(placed, stripH, topPad, trackOffsets);
        const newXc = _countSegmentCrossings(newLayout.segs[idxSelf],
                                              newLayout.segs[idxOther]);

        /* The move must actually resolve the pair's double crossing,
           not just nudge it. */
        if (newXc < 2) {
          const totalAfter = totalConflicts(newLayout);
          if (totalAfter < bestTotal) {
            bestTotal = totalAfter;
            bestMove  = { A, c };
          }
        }

        A.diveMode    = aSave.diveMode;
        A.channelYRel = aSave.channelYRel;
        A.offsetA     = aSave.offsetA;
      }
    }

    if (bestMove) {
      bestMove.A.diveMode    = bestMove.c.diveMode;
      bestMove.A.channelYRel = bestMove.c.channelYRel;
      bestMove.A.offsetA     = bestMove.c.offsetA;
    }
  }
}

/* ==========================================================================
   POLISH LOOP
   ========================================================================== */

function polishLeaderLayout(placed, stripH, topPad, trackOffsets,
                            boundaries, wireSegments, wallEdges) {
  const MAX_ROUNDS = 6;

  const obstacleContext = {
    boundaries:   boundaries   || [],
    wireSegments: wireSegments || [],
    wallEdges:    wallEdges    || [],
    placed:       placed,
    stripH:       stripH,
  };

  /* Snapshot a full optimiser state.  deepClone covers the fields the
     optimiser mutates: bevel, jog, diveMode, channelYRel, offsetA,
     detourBias, and pillCenterX.  Everything else — anchorCx, w, h,
     track — is immutable during the polish loop. */
  const snap = () => placed.map(p => ({
    bevel0: p.bevel0 || 0, bevel1: p.bevel1 || 0,
    jog0:   p.jog0   || 0, jog1:   p.jog1   || 0,
    diveMode: p.diveMode || 0,
    channelYRel: p.channelYRel,
    offsetA:     p.offsetA || 0,
    detourBias:  p.detourBias || 0,
    pillCenterX: p.pillCenterX,
  }));
  const restore = (s) => {
    for (let i = 0; i < placed.length; i++) {
      const p = placed[i], t = s[i];
      p.bevel0 = t.bevel0; p.bevel1 = t.bevel1;
      p.jog0   = t.jog0;   p.jog1   = t.jog1;
      p.diveMode = t.diveMode;
      p.channelYRel = t.channelYRel;
      p.offsetA = t.offsetA;
      p.detourBias = t.detourBias;
      p.pillCenterX = t.pillCenterX;
    }
  };

  const count = () => {
    const layout = _buildLayout(placed, stripH, topPad, trackOffsets);
    let n = 0;
    for (let i = 0; i < placed.length; i++) {
      n += _countConflictsAt(i, layout, obstacleContext);
    }
    return Math.floor(n / 2);
  };

  let prev = count();
  if (prev === 0) return;
  let bestSnap = snap();
  let bestScore = prev;

  for (let round = 0; round < MAX_ROUNDS; round++) {
    optimizeLeaderGeometry(placed, stripH, topPad, trackOffsets,
                           boundaries, wireSegments, wallEdges);

    /* Resolve any remaining double crossings by hugging one leader
       around the other.  Runs after the optimiser (so it composes with,
       rather than fights, the optimiser's six move families) and before
       the pill push (so the pill push sees the hug-cleaned layout). */
    rerouteDoubleCrossingsByHugging(placed, stripH, topPad, trackOffsets,
                                    boundaries, wireSegments, wallEdges);

    pushPillsForLeaderConflicts(placed, stripH, topPad, trackOffsets,
                                obstacleContext);

    const now = count();
    if (now < bestScore) {
      bestScore = now;
      bestSnap = snap();
    }
    if (now >= prev) break;
    prev = now;
    if (now === 0) break;
  }

  /* Restore the best-scoring state across all rounds.  Without this,
     a round that resets diveMode / bevel / jog to 0 at the start of
     optimizeLeaderGeometry would discard the previous round's gains
     whenever the new round failed to improve on them. */
  restore(bestSnap);
}

/* ==========================================================================
   ANGLE-DISPLAY TOGGLE
   ==========================================================================
   Flipped by the "Show cable angles" checkbox on the preview page (see
   pg_export_preview.py).  When true, computeVertexLabelPlacement adds
   one line per cable edge meeting at a vertex pill, showing that
   edge's slope angle from horizontal. */

window.showCableAngles = false;

/* ==========================================================================
   VERTEX-LABEL TYPOGRAPHY
   ==========================================================================
   One knob: VLABEL_FONT_SIZE.  Every dimension the pill draws — its
   own inner padding, its line pitch, and the box that surrounds the
   name — is derived from that one number (plus the ratios below), so
   bumping the size here reflows every pill in the drawing without
   touching any of the placement or drawing math.

   Changing the FONT FAMILY alone is also covered: the name box's
   WIDTH is measured from the actual glyphs at draw time, so a wider
   or narrower face shifts the box with the text. */

const VLABEL_FONT_SIZE   = 12;
const VLABEL_FONT_WEIGHT = 700;

const VLABEL_PADX_RATIO  = 0.65;   // pill inner padding, horizontal
const VLABEL_PADY_RATIO  = 0.35;   // pill inner padding, vertical
const VLABEL_LINE_RATIO  = 1.35;   // line pitch  (LINE_H  / FONT_SIZE)

const VLABEL_BOXPAD_RATIO = 0.30;  // name-box padding around the text
const VLABEL_BOXH_RATIO   = 1.15;  // name-box height / FONT_SIZE
const VLABEL_BOX_TOPAIR_RATIO = 0.22;  // extra top-side air inside the name box

/* ==========================================================================
   OVERHANG-HUGGING FINAL PASS
   ==========================================================================

   The optimiser's offsetA, detourBias, bevel, and jog moves can push a
   leader's intermediate geometry past the strip band's horizontal
   edges — offsetA alone reaches ±240 px, and a jog applied on top of an
   already-out-of-band joint can put a vertical rule hundreds of pixels
   outside [stripAreaX0, stripAreaX1].  The canvas clips the overflow
   silently, so the exported PNG shows the leader truncated on the
   right.

   This pass runs AFTER the polish loop and leaves the optimiser's
   decisions alone everywhere they fit.  Only the offending leaders are
   reshaped.  The endpoints are never touched: pillX is clamped to the
   band by the pill-placing code above, and anchorCx is inside the
   strip.  What is clamped is the interior geometry.

   Leaders that overhang the same edge are given different "hugging
   depths" — lane 0 hugs HUG_MARGIN px from the edge, lane 1 hugs
   HUG_MARGIN + HUG_LANE_STEP, and so on — so two hugged leaders cannot
   share a vertical run.  Deepest overhang first, so the leader that
   lost the most from the clamp ends up in the lane closest to the
   edge.

   Each candidate lane is checked against every foreign pill's expanded
   AABB.  A lane that would put the clamped path through a foreign pill
   is rejected and the leader advances to the next lane.  After
   HUG_MAX_LANES tries the leader is left at the last lane — a
   pathological case that cannot fit is at least inside the band. */

const HUG_MARGIN    = 6;
const HUG_LANE_STEP = 5;
const HUG_MAX_LANES = 20;

function hugOverhangingLeaders(placed, stripAreaX0, stripAreaX1,
                               stripH, topPad, trackOffsets) {
  if (!placed.length) return;

  const loBase = stripAreaX0 + HUG_MARGIN;
  const hiBase = stripAreaX1 - HUG_MARGIN;

  /* 1. Compute every leader's base path, classify overhang. */
  const work = [];
  for (const it of placed) {
    it.finalPath = null;

    const chanY    = stripH + (it.channelYRel || 0);
    const pillTopY = stripH + topPad + trackOffsets[it.track];
    const base = computeLeaderPath(
      it.anchorCx, it.anchorCyRel, it.offsetA || 0,
      chanY, it.pillCenterX, pillTopY,
      it, placed, stripH, topPad, trackOffsets, it.diveMode || 0);
    const bevelled = _bevelPath(base, it.bevel0 || 0, it.bevel1 || 0);
    const path = _applyJogsToPath(bevelled, it);

    let minX = Infinity, maxX = -Infinity;
    for (const p of path) {
      if (p[0] < minX) minX = p[0];
      if (p[0] > maxX) maxX = p[0];
    }

    const overLeft  = loBase - minX;
    const overRight = maxX - hiBase;
    if (overLeft <= 0 && overRight <= 0) continue;

    work.push({
      it,
      path,
      side: (overLeft >= overRight) ? "L" : "R",
      depth: Math.max(overLeft, overRight, 0),
    });
  }
  if (!work.length) return;

  /* 2. Deepest overhang first; the deepest one gets lane 0. */
  work.sort((a, b) => b.depth - a.depth);

  const laneCount = { L: 0, R: 0 };

  for (const job of work) {
    const { it, path, side } = job;
    let assigned = null;

    /* 3. Try each lane from the first unoccupied one onward. */
    for (let lane = laneCount[side]; lane < HUG_MAX_LANES; lane++) {
      const inset  = HUG_MARGIN + lane * HUG_LANE_STEP;
      const loLane = stripAreaX0 + inset;
      const hiLane = stripAreaX1 - inset;

      /* Clamp every intermediate point to the lane; leave the two
         endpoints where they are — they anchor to the pill and the
         strip and must not move. */
      const candidate = path.map((p, i) =>
        (i === 0 || i === path.length - 1)
          ? [p[0], p[1]]
          : [Math.max(loLane, Math.min(hiLane, p[0])), p[1]]);

      /* 4. Reject the lane if the clamped path would run through a
         foreign pill's expanded AABB.  Same PILL_PROX test the
         optimiser's own collision checks use, so the hugging pass
         respects the same no-overlap invariant. */
      const segs = _pathSegments(candidate, -1, 0.5);
      let clear = true;
      for (let j = 0; j < placed.length && clear; j++) {
        const other = placed[j];
        if (other === it) continue;
        const qT = stripH + topPad + trackOffsets[other.track];
        const box = {
          qL: other.pillCenterX - other.w / 2 - PILL_PROX,
          qR: other.pillCenterX + other.w / 2 + PILL_PROX,
          qT: qT - PILL_PROX,
          qB: qT + other.h + PILL_PROX,
        };
        for (const s of segs) {
          if (s.maxX < box.qL || s.minX > box.qR) continue;
          if (s.maxY < box.qT || s.minY > box.qB) continue;
          if (_segBoxOverlap(s, box) > 0) { clear = false; break; }
        }
      }

      if (clear) { assigned = { lane, path: candidate }; break; }
    }

    /* 5. Fallback: last lane, accept whatever overlaps it has.  The
       pathological leader is at least inside the band, which is the
       whole point of the pass. */
    if (!assigned) {
      const inset  = HUG_MARGIN + (HUG_MAX_LANES - 1) * HUG_LANE_STEP;
      const loLane = stripAreaX0 + inset;
      const hiLane = stripAreaX1 - inset;
      const candidate = path.map((p, i) =>
        (i === 0 || i === path.length - 1)
          ? [p[0], p[1]]
          : [Math.max(loLane, Math.min(hiLane, p[0])), p[1]]);
      assigned = { lane: HUG_MAX_LANES - 1, path: candidate };
    }

    it.finalPath = assigned.path;
    laneCount[side] = Math.max(laneCount[side], assigned.lane + 1);
  }
}

/* ---- Vertex coordinate labels ---- */

function computeVertexLabelPlacement(c, chunks, stripOffsetX,
                                     stripAreaX0, stripAreaW, stripH,
                                     orderedIds) {
  const fmtCm = (mm) => String(Math.round(mm / 10));
  const FONT  = VLABEL_FONT_WEIGHT + " " + VLABEL_FONT_SIZE + "px " + FONT_MONO;
  const PAD_X = Math.round(VLABEL_FONT_SIZE * VLABEL_PADX_RATIO);
  const PAD_Y = Math.round(VLABEL_FONT_SIZE * VLABEL_PADY_RATIO);
  const LINE_H = Math.round(VLABEL_FONT_SIZE * VLABEL_LINE_RATIO);
  const TRACK_GAP_X   = 10;
  const TRACK_V_GAP   = 8;
  const GROUP_TOL     = 8;
  const MAX_TRACKS    = 20;
  const AREA_X0 = stripAreaX0;
  const AREA_X1 = stripAreaX0 + stripAreaW;

  const COMPRESS_GAP = 20;

  const boundaries = [];
  const seenBx = new Set();
  for (const ch of chunks) {
    const cands = [stripOffsetX + ch.x0, stripOffsetX + ch.x1];
    for (const bx of cands) {
      const key = Math.round(bx * 2) / 2;
      if (seenBx.has(key)) continue;
      seenBx.add(key);
      boundaries.push(bx);
    }
  }

  const wireSegments = [];
  {
    const byRun = new Map();
    for (const ch of chunks) {
      let list = byRun.get(ch.runIdx);
      if (!list) { list = []; byRun.set(ch.runIdx, list); }
      list.push(ch);
    }
    for (const [, chList] of byRun) {
      const flat = [];
      for (const ch of chList) {
        for (const a of ch.anchors) flat.push(a);
      }
      for (let i = 0; i < flat.length - 1; i++) {
        const ax = stripOffsetX + flat[i].xPx;
        const ay = flat[i].yPx;
        const bx = stripOffsetX + flat[i + 1].xPx;
        const by = flat[i + 1].yPx;
        wireSegments.push({
          ax, ay, bx, by,
          angle: Math.atan2(by - ay, bx - ax),
        });
      }
    }
  }

  const wallEdges = [];
  {
    let stripX0 = Infinity, stripX1 = -Infinity;
    for (const ch of chunks) {
      const x0 = stripOffsetX + ch.x0;
      const x1 = stripOffsetX + ch.x1;
      const yTop = (1 - ch.z_hi / WALL_HEIGHT) * stripH;
      const yBot = (1 - ch.z_lo / WALL_HEIGHT) * stripH;
      wallEdges.push({ y: yTop, x0, x1 });
      wallEdges.push({ y: yBot, x0, x1 });
      if (x0 < stripX0) stripX0 = x0;
      if (x1 > stripX1) stripX1 = x1;
    }
    if (isFinite(stripX0) && isFinite(stripX1)) {
      wallEdges.push({ y: 0,      x0: stripX0, x1: stripX1 });
      wallEdges.push({ y: stripH, x0: stripX0, x1: stripX1 });
    }
  }

  const orderIdx = new Map();
  if (Array.isArray(orderedIds)) {
    orderedIds.forEach((id, i) => orderIdx.set(id, i));
  }

  const rawAnchors = [];
  for (const ch of chunks) {
    const chunkMid = stripOffsetX + (ch.x0 + ch.x1) / 2;
    for (const a of ch.anchors) {
      const anc = anchors.get(a.aid);
      if (!anc || anc.space !== "wall-edge") continue;
      rawAnchors.push({
        anchorCx: stripOffsetX + a.xPx,
        anchorCyRel: a.yPx,
        h: anc.v || 0,
        nativeU: a.nativeU,
        len: ch.len,
        mirror: ch.mirror,
        segIdx: ch.segIdx,
        chunkMid,
        aid: a.aid,
      });
    }
  }

  const clusters = [];
  const used = new Array(rawAnchors.length).fill(false);
  for (let i = 0; i < rawAnchors.length; i++) {
    if (used[i]) continue;
    const A = rawAnchors[i];
    const grp = [A];
    used[i] = true;
    for (let j = i + 1; j < rawAnchors.length; j++) {
      if (used[j]) continue;
      const B = rawAnchors[j];
      if (Math.abs(A.anchorCx - B.anchorCx) < GROUP_TOL &&
          Math.abs(A.anchorCyRel - B.anchorCyRel) < GROUP_TOL) {
        grp.push(B);
        used[j] = true;
      }
    }
    clusters.push(grp);
  }

  const sideLineFor = (m) => {
    const wDist = m.mirror ? (m.len - m.nativeU) : m.nativeU;
    const eDist = m.mirror ? m.nativeU : (m.len - m.nativeU);
    return "W " + fmtCm(wDist) + " . E " + fmtCm(eDist);
  };

  const items = [];
  c.save();
  c.font = FONT;

  /* Pre-compute the pill name for every member anchor, so the angle
     lines below can name the neighbour pill each angle points at.
     A pill's name is "V" + (its minimum ordered index + 1) — the same
     rule the main loop below uses — so this map stays consistent with
     the names drawn on the pills themselves. */
  const anchorPillName = new Map();
  for (const grp of clusters) {
    let minIdx = Infinity;
    for (const m of grp) {
      const oi = orderIdx.get(m.aid);
      if (typeof oi === "number" && oi < minIdx) minIdx = oi;
    }
    if (minIdx === Infinity) continue;
    const pn = "V" + (minIdx + 1);
    for (const m of grp) anchorPillName.set(m.aid, pn);
  }

  for (const grp of clusters) {
    let minIdx = Infinity;
    for (const m of grp) {
      const oi = orderIdx.get(m.aid);
      if (typeof oi === "number" && oi < minIdx) minIdx = oi;
    }
    const name = (minIdx !== Infinity) ? ("V" + (minIdx + 1)) : null;

    const lines = [];
    if (grp.length === 1) {
      const m = grp[0];
      lines.push({ left:  name || "", right: "h " + fmtCm(m.h),
                   isName: !!name });
      lines.push({ left:  sideLineFor(m), right: null });
    } else {
      grp.sort((a, b) => {
        const sa = a.chunkMid < a.anchorCx ? 0 : 1;
        const sb = b.chunkMid < b.anchorCx ? 0 : 1;
        return sa - sb;
      });
      for (let gi = 0; gi < grp.length; gi++) {
        const m = grp[gi];
        lines.push({
          left:  (gi === 0 && name) ? name : "",
          right: "h " + fmtCm(m.h),
          isName: (gi === 0 && !!name),
        });
        lines.push({ left: sideLineFor(m), right: null });
      }
    }

    /* ---- optional angle lines --------------------------------
       When the preview page's "Show cable angles" checkbox is on,
       every cable edge that touches this cluster contributes one
       extra line to the pill: the bearing of that edge in the
       strip's own coordinate frame, measured counter-clockwise
       from the positive-u axis and expressed on a 0..360 scale.

       0°   is due-east in the strip render   (increasing u)
       90°  is straight up                    (increasing height)
       180° is due-west                       (decreasing u)
       270° is straight down                  (decreasing height)

       The strip frame is the visual frame of the exported drawing,
       so the numbers match what a reader sees on the page: a cable
       that climbs to the right reads as 0..90°, one that climbs to
       the left as 90..180°, and so on.  No sign is ever shown —
       the full 0..360 circle is used.

       Only wall-edge neighbours contribute an angle.  A floor
       neighbour would be off-strip and has no visible direction
       in this view, so it is skipped.  Identical integers collapse
       to a single line, so a straight run through a mid-cable
       vertex shows one angle rather than two. */
    /* ---- optional angle lines --------------------------------
       When the preview page's "Show cable angles" checkbox is on,
       every cable edge that touches this cluster contributes one
       extra line to the pill: the bearing of that edge in the
       strip's own coordinate frame, measured counter-clockwise
       from the positive-u axis.

       The scale is zero at the right, +180 and −180 at the left.
       The two extremes describe the same ray; the sign is what
       distinguishes the direction of rotation to reach it:

           0°   due-east in the strip render   (increasing u)
         +90°   straight up                    (increasing height)
        +180°   due-west, reached from above
         −90°   straight down                  (decreasing height)
        −180°   due-west, reached from below

       The strip frame is the visual frame of the exported drawing,
       so the numbers match what a reader sees on the page.

       Only wall-edge neighbours contribute an angle.  A floor
       neighbour would be off-strip and has no visible direction
       in this view, so it is skipped.  Identical integers collapse
       to a single line, so a straight run through a mid-cable
       vertex shows one angle rather than two. */
    if (window.showCableAngles && Array.isArray(orderedIds)) {
      const memberSet = new Set(grp.map(m => m.aid));
      const seenAngles = new Set();
      for (const m of grp) {
        const idx = orderIdx.get(m.aid);
        if (typeof idx !== "number") continue;
        const anchorA = anchors.get(m.aid);
        if (!anchorA || anchorA.space !== "wall-edge") continue;
        for (const nIdx of [idx - 1, idx + 1]) {
          if (nIdx < 0 || nIdx >= orderedIds.length) continue;
          const nId = orderedIds[nIdx];
          if (memberSet.has(nId)) continue;
          const anchorB = anchors.get(nId);
          if (!anchorB || anchorB.space !== "wall-edge") continue;

          /* Strip-frame deltas: u is the unrolled perimeter
             coordinate, v is the anchor's height.  Same (u, v)
             frame the strip is drawn in, so the resulting angle
             matches the visual render. */
          const uA = wallAttachToU(anchorA.segIdx, anchorA.t);
          const vA = anchorA.v || 0;
          const uB = wallAttachToU(anchorB.segIdx, anchorB.t);
          const vB = anchorB.v || 0;
          const du = uB - uA;
          const dv = vB - vA;
          if (Math.hypot(du, dv) < 1e-3) continue;

          /* atan2 already gives a counter-clockwise signed angle
             from the +u axis in (−180, 180], which is exactly the
             convention the pill shows: 0 at the right, positive
             for rotations into the upper half, negative for the
             lower half, and ±180 meeting at the left. */
          const ang = Math.atan2(dv, du) * 180 / Math.PI;
          const rounded = Math.round(ang);
          if (seenAngles.has(rounded)) continue;
          seenAngles.add(rounded);

          let text;
          if (rounded === 0) {
            text = "0\u00B0";
          } else if (rounded > 0) {
            text = "+" + rounded + "\u00B0";
          } else {
            text = rounded + "\u00B0";
          }
          /* The ∠ line names the pill the angle points AT — the
             neighbour this vertex's cable segment connects to, which
             is the pill whose anchor is nId.  If the neighbour is on
             a pill that the collinear filter removed, we still show
             the angle but drop the name rather than show a label that
             does not correspond to any drawn pill. */
          const neighbourPillName = anchorPillName.get(nId);
          const leftText = neighbourPillName
            ? "\u2220 " + neighbourPillName
            : "\u2220";
          lines.push({ left: leftText, right: text });
        }
      }
    }

    let w = 0;
    for (const l of lines) {
      const lw = l.left  ? c.measureText(l.left).width  : 0;
      const rw = l.right ? c.measureText(l.right).width : 0;
      const gap = (l.left && l.right) ? LABEL_LEFT_RIGHT_GAP : 0;
      if (lw + gap + rw > w) w = lw + gap + rw;
    }

    items.push({
      anchorCx: grp[0].anchorCx,
      anchorCyRel: grp[0].anchorCyRel,
      lines,
      w: w + PAD_X * 2,
      h: lines.length * LINE_H + PAD_Y * 2,
      name,
      members: grp.map(x => x.aid),
      fontSize: VLABEL_FONT_SIZE,
    });
  }
  c.restore();

  if (window.filterCollinearVerticesInStrip && Array.isArray(orderedIds)) {
    const oi = new Map();
    orderedIds.forEach((id, i) => oi.set(id, i));

    const anchorMm = new Map();
    const segOfAid = new Map();
    {
      const byRun = new Map();
      for (const ch of chunks) {
        let list = byRun.get(ch.runIdx);
        if (!list) { list = []; byRun.set(ch.runIdx, list); }
        list.push(ch);
      }
      for (const [, chs] of byRun) {
        let cumU = 0;
        for (const ch of chs) {
          for (const a of ch.anchors) {
            const anc = anchors.get(a.aid);
            if (!anc || anc.space !== "wall-edge") continue;
            const uInChunk = ch.mirror
              ? (1 - anc.t) * ch.len
              : anc.t * ch.len;
            anchorMm.set(a.aid, { u: cumU + uInChunk, v: anc.v || 0 });
            segOfAid.set(a.aid, ch.segIdx);
          }
          cumU += ch.len;
        }
      }
    }

    const TOL_MM        = 2.0;
    const LEN_RATIO_MAX = 3.0;
    const kept = [];

    for (const it of items) {
      const idxs = it.members
        .map(id => oi.get(id))
        .filter(v => typeof v === "number")
        .sort((a, b) => a - b);

      if (idxs.length === 0) { kept.push(it); continue; }

      const lo = idxs[0];
      const hi = idxs[idxs.length - 1];

      if (hi - lo + 1 !== idxs.length) { kept.push(it); continue; }
      if (lo === 0 || hi === orderedIds.length - 1) {
        kept.push(it); continue;
      }

      const bP = anchorMm.get(orderedIds[lo - 1]);
      const aP = anchorMm.get(orderedIds[hi + 1]);
      const cP = anchorMm.get(it.members[0]);
      if (!bP || !aP || !cP) { kept.push(it); continue; }

      const CORNER_COS_MIN = 0.985;
      const segs = new Set();
      for (const id of it.members) {
        const s = segOfAid.get(id);
        if (s != null) segs.add(s);
      }
      if (segs.size >= 2) {
        const segArr = Array.from(segs);
        const lens = segArr
          .map(si => (WALL.segments[si] && WALL.segments[si].len) || 0)
          .filter(l => l > 0);

        let realCorner = false;
        if (segArr.length >= 2) {
          const s0 = WALL.segments[segArr[0]];
          if (s0) {
            const d0x = s0.b[0] - s0.a[0], d0y = s0.b[1] - s0.a[1];
            const l0 = Math.hypot(d0x, d0y) || 1;
            for (let i = 1; i < segArr.length; i++) {
              const si = WALL.segments[segArr[i]];
              if (!si) continue;
              const dix = si.b[0] - si.a[0], diy = si.b[1] - si.a[1];
              const li = Math.hypot(dix, diy) || 1;
              const cos = Math.abs((d0x * dix + d0y * diy) / (l0 * li));
              if (cos < CORNER_COS_MIN) { realCorner = true; break; }
            }
          }
        }

        if (realCorner && lens.length >= 2) {
          const ratio = Math.max(...lens) / Math.min(...lens);
          if (ratio > LEN_RATIO_MAX) { kept.push(it); continue; }
        }
      }

      const dx1 = cP.u - bP.u, dy1 = cP.v - bP.v;
      const dx2 = aP.u - cP.u, dy2 = aP.v - cP.v;
      const len2 = Math.hypot(dx2, dy2);
      if (len2 < 0.5) { kept.push(it); continue; }

      const dist = Math.abs(dx1 * dy2 - dy1 * dx2) / len2;
      if (dist >= TOL_MM) kept.push(it);
    }

    items.length = 0;
    for (const it of kept) items.push(it);
  }

  const pillNameOf = new Map();
  for (const it of items) {
    if (it.name && it.members) {
      for (const aid of it.members) pillNameOf.set(aid, it.name);
    }
  }

  if (!items.length) {
    return {
      placed: [], maxTrack: -1, topPad: 0,
      trackOffsets: [], trackHeights: [],
      PAD_X, PAD_Y, LINE_H,
      fontSize: VLABEL_FONT_SIZE,
      pillNameOf,
      areaX0: AREA_X0,
      areaX1: AREA_X1,
    };
  }

  items.sort((a, b) => a.anchorCx - b.anchorCx);

  const tracks = [];

  const usableWidth = AREA_X1 - AREA_X0;
  const totalPillW  = items.reduce((a, it) => a + it.w, 0);
  let numRows = 1;
  while (numRows < MAX_TRACKS) {
    const needed = totalPillW + (items.length - numRows) * TRACK_GAP_X;
    if (needed <= numRows * usableWidth) break;
    numRows++;
  }

  const rows = [];
  for (let i = 0; i < numRows; i++) rows.push([]);
  for (let i = 0; i < items.length; i++) {
    rows[i % numRows].push(items[i]);
  }

  for (let t = 0; t < rows.length; t++) {
    const row = rows[t];
    if (row.length === 0) continue;

    const k = row.length;
    const sumW = row.reduce((a, it) => a + it.w, 0);
    const rowWidth = sumW + (k - 1) * COMPRESS_GAP;
    const edgePad = Math.max(0, (usableWidth - rowWidth) / 2);

    let cur = AREA_X0 + edgePad + row[0].w / 2;
    row[0].pillCenterX = cur;
    for (let i = 1; i < k; i++) {
      cur += row[i - 1].w / 2 + COMPRESS_GAP + row[i].w / 2;
      row[i].pillCenterX = cur;
    }

    const rowRight = row[k - 1].pillCenterX + row[k - 1].w / 2;
    if (rowRight > AREA_X1) {
      const dx = rowRight - AREA_X1;
      for (const it of row) it.pillCenterX -= dx;
    }

    /* Clamp each pill so both of its edges stay inside the label
       band.  Without this a pill anchored near the far right of
       the strip can extend past the canvas edge — the canvas
       clips it silently and the exported PNG shows the strip
       truncated on the right.  That is exactly the symptom that
       appeared once the fonts got wider and every pill grew.  A
       pill wider than the whole band is centred on the band and
       accepted as-is; that case cannot be fixed by translation
       and would need a wider IMG_W. */
    for (const it of row) {
      const halfW = it.w / 2;
      const lo = AREA_X0 + halfW;
      const hi = AREA_X1 - halfW;
      if (lo <= hi) {
        it.pillCenterX = Math.max(lo, Math.min(hi, it.pillCenterX));
      } else {
        it.pillCenterX = (AREA_X0 + AREA_X1) / 2;
      }
    }

    for (const it of row) {
      it.track     = t;
      it._baseDisp = Math.abs(it.pillCenterX - it.anchorCx);
    }
    tracks.push(row);
  }

  const trackHeights = new Array(tracks.length).fill(0);
  for (let t = 0; t < tracks.length; t++) {
    let maxH = 0;
    for (const it of tracks[t]) maxH = Math.max(maxH, it.h);
    trackHeights[t] = maxH + TRACK_V_GAP;
  }
  const trackOffsets = new Array(tracks.length).fill(0);
  let accOff = 0;
  for (let t = 0; t < tracks.length; t++) {
    trackOffsets[t] = accOff;
    accOff += trackHeights[t];
  }

  const placed = [];
  for (const arr of tracks) for (const it of arr) {
    if (it.track != null) placed.push(it);
  }

  const leaders = placed.map(it => ({
    it,
    anchorX: it.anchorCx,
    pillX:   it.pillCenterX,
    x0: Math.min(it.anchorCx, it.pillCenterX),
    x1: Math.max(it.anchorCx, it.pillCenterX),
  }));
  const sortedBySpan =
    [...leaders].sort((a, b) => (b.x1 - b.x0) - (a.x1 - a.x0));
  const slots = [];
  for (const L of sortedBySpan) {
    let assigned = null;
    for (const slot of slots) {
      let overlap = false;
      for (const [l, r] of slot.spans) {
        if (L.x0 < r + 4 && L.x1 > l - 4) { overlap = true; break; }
      }
      if (!overlap) {
        slot.spans.push([L.x0, L.x1]);
        assigned = slot;
        break;
      }
    }
    if (!assigned) {
      const relY = LABEL_CHANNEL_Y0 + slots.length * LABEL_CHANNEL_STEP;
      assigned = { relY, spans: [[L.x0, L.x1]] };
      slots.push(assigned);
    }
    L.it.channelYRel = assigned.relY;
  }
  const numChannels = slots.length;

  const topPad = numChannels === 0
    ? 0
    : LABEL_CHANNEL_Y0 + (numChannels - 1) * LABEL_CHANNEL_STEP
      + LABEL_CHANNEL_GAP;

  refineLeaderOffsets(placed, topPad, trackOffsets, stripH);

  polishLeaderLayout(placed, stripH, topPad, trackOffsets,
                     boundaries, wireSegments, wallEdges);

  /* Overhang-hugging final pass.  Runs after the optimiser, the
     double-crossing hug pass, and the pill push have all finished,
     and before the style-conflict graph is built — so a leader that
     gets clamped to a hugging lane is what the style graph sees,
     which is what gets drawn.  See hugOverhangingLeaders above. */
  hugOverhangingLeaders(placed, stripAreaX0, stripAreaX0 + stripAreaW,
                        stripH, topPad, trackOffsets);

  const conflictAdj = _buildStyleConflictGraph(placed, stripH, topPad,
                                                trackOffsets);

  const styleMap = new Map();
  const orderedForStyle =
    [...placed].sort((a, b) => a.anchorCx - b.anchorCx);

  const seen = new Set();
  for (const seed of orderedForStyle) {
    if (seen.has(seed)) continue;

    const comp = [];
    const queue = [seed];
    seen.add(seed);
    while (queue.length) {
      const u = queue.shift();
      comp.push(u);
      for (const v of conflictAdj.get(u) || []) {
        if (!seen.has(v)) { seen.add(v); queue.push(v); }
      }
    }

    if (comp.length === 1) {
      styleMap.set(comp[0], 0);
      continue;
    }

    let bipartite = true;
    const color = new Map([[comp[0], 0]]);
    const q2 = [comp[0]];
    while (q2.length && bipartite) {
      const u = q2.shift();
      const cu = color.get(u);
      for (const v of conflictAdj.get(u) || []) {
        if (!color.has(v)) { color.set(v, 1 - cu); q2.push(v); }
        else if (color.get(v) === cu) { bipartite = false; break; }
      }
    }

    if (bipartite) {
      let n0 = 0, n1 = 0;
      for (const u of comp) (color.get(u) === 0 ? n0++ : n1++);
      const solidColor = (n0 >= n1) ? 0 : 1;
      for (const u of comp) {
        styleMap.set(u, color.get(u) === solidColor ? 0 : 1);
      }
      continue;
    }

    const dashed = new Set();
    {
      const removed = new Set();
      while (true) {
        let best = null, bestDeg = 0;
        for (const u of comp) {
          if (removed.has(u)) continue;
          let d = 0;
          for (const v of conflictAdj.get(u) || [])
            if (!removed.has(v)) d++;
          if (d > bestDeg) { bestDeg = d; best = u; }
        }
        if (best === null || bestDeg === 0) break;
        dashed.add(best);
        removed.add(best);
      }
    }

    for (let outer = 0; outer < 30; outer++) {
      let changed = false;

      for (const v of Array.from(dashed)) {
        let hasSolid = false;
        for (const u of conflictAdj.get(v) || []) {
          if (!dashed.has(u)) { hasSolid = true; break; }
        }
        if (!hasSolid) { dashed.delete(v); changed = true; }
      }

      for (const v of Array.from(dashed)) {
        let ok = true;
        for (const u of conflictAdj.get(v) || []) {
          if (dashed.has(u)) continue;
          let stillCovered = false;
          for (const w of conflictAdj.get(u) || []) {
            if (w !== v && dashed.has(w)) { stillCovered = true; break; }
          }
          if (!stillCovered) { ok = false; break; }
        }
        if (ok) { dashed.delete(v); changed = true; }
      }

      if (!changed) break;
    }

    for (const u of comp) styleMap.set(u, dashed.has(u) ? 1 : 0);
  }

  for (const it of placed) it.leaderStyle = styleMap.get(it) ?? 0;

  return {
    placed,
    maxTrack: tracks.length - 1,
    topPad,
    trackOffsets,
    trackHeights,
    PAD_X, PAD_Y, LINE_H,
    fontSize: VLABEL_FONT_SIZE,
    pillNameOf,
    areaX0: AREA_X0,
    areaX1: AREA_X1,
  };
}

/* ---- Vertex labels ---- */

function drawVertexLabels(c, placement, stripY, stripH) {
  if (!placement.placed.length) return;
  const { placed, PAD_X, PAD_Y, LINE_H, topPad, trackOffsets,
          fontSize } = placement;
  const stripBottom = stripY + stripH;

  const pillTopYFor = (it) =>
    stripBottom + topPad + trackOffsets[it.track];

  /* Same font the placement pass measured against.  Without this the
     text is drawn in whatever font the caller last set — usually the
     subtitle's 13 px / 600-weight stack — and a right-aligned label
     overflows the pill's right edge by a few pixels. */
  c.font = VLABEL_FONT_WEIGHT + " " + fontSize + "px " + FONT_MONO;

  /* Name-box geometry, all scaled from the font size.  Both the
     horizontal padding and the box height move with fontSize, so a
     bump to VLABEL_FONT_SIZE grows the box, the pill, and the line
     pitch together instead of leaving the box stranded at a fixed
     pixel size. */
  const namePadX    = Math.max(2, fontSize * VLABEL_BOXPAD_RATIO);
  const nameBoxH    = fontSize * VLABEL_BOXH_RATIO;
  const nameStrokeW = Math.max(0.9, fontSize / 12);
  const nameTopAir  = fontSize * VLABEL_BOX_TOPAIR_RATIO;

  for (const it of placed) {
    const pillTopY = pillTopYFor(it);
    const rx = it.pillCenterX - it.w / 2;
    const ry = pillTopY;

    c.fillStyle = "#ffffff";
    c.fillRect(rx, ry, it.w, it.h);
    c.strokeStyle = "#000000";
    c.lineWidth = 1.2;
    c.strokeRect(rx + 0.5, ry + 0.5, it.w - 1, it.h - 1);

    c.fillStyle = "#000000";
    c.textBaseline = "middle";
    let ty = ry + PAD_Y + LINE_H / 2;
    for (const line of it.lines) {
      if (line.left) {
        c.textAlign = "left";
        c.fillText(line.left, rx + PAD_X, ty);

        /* Box around the pill name.  Width is measured from the
           actual glyphs at the current font, so a wider face widens
           the box; height and stroke scale from fontSize.  The box
           is centred on the line's text baseline (`ty`), which keeps
           it symmetric around the text at any size. */
        if (line.isName) {
          const lw   = c.measureText(line.left).width;
          const boxW = lw + 2 * namePadX;
          const boxX = rx + PAD_X - namePadX;

          /* Top edge is pushed up by nameTopAir and the height grows
             to match, so the bottom edge — and therefore the text
             position — does not move.  This balances the two gaps
             around the caps: monospace faces carry descender space
             below the baseline that makes a symmetric box read as
             tight at the top and loose at the bottom. */
          const boxY = ty - nameBoxH / 2 - nameTopAir;
          const boxH = nameBoxH + nameTopAir;

          c.strokeStyle = "#000000";
          c.lineWidth   = nameStrokeW;
          c.strokeRect(boxX + 0.5, boxY + 0.5, boxW - 1, boxH - 1);
        }
      }
      if (line.right) {
        c.textAlign = "right";
        c.fillText(line.right, rx + it.w - PAD_X, ty);
      }
      ty += LINE_H;
    }
  }

  c.save();
  c.strokeStyle = "#000000";
  c.lineWidth = 1.4;
  c.lineJoin = "round";
  c.lineCap = "butt";
  for (const it of placed) {
    if (it.channelYRel == null) continue;
    const anchorX  = it.anchorCx;
    const anchorY  = stripY + it.anchorCyRel;
    const pillX    = it.pillCenterX;
    const chanY    = stripBottom + it.channelYRel;
    const pillTopY = pillTopYFor(it);
    const offA     = it.offsetA || 0;

    let path;
    if (it.finalPath) {
      /* The overhang-hugging pass stores its result in PLACEMENT
         coordinates — the top of the strip band is y = 0 there,
         whereas the drawing pass works in canvas coordinates where
         the strip starts at stripY.  Translate the stored y by
         stripY; the x coordinates are identical in both systems. */
      path = it.finalPath.map(p => [p[0], p[1] + stripY]);
    } else {
      const basePath = computeLeaderPath(
        anchorX, anchorY, offA, chanY, pillX, pillTopY,
        it, placed, stripBottom, topPad, trackOffsets, it.diveMode || 0);
      const bevelled = _bevelPath(basePath, it.bevel0 || 0, it.bevel1 || 0);
      path = _applyJogsToPath(bevelled, it);
    }

    const style = LEADER_STYLES[it.leaderStyle % LEADER_STYLES.length];
    c.setLineDash(style.dash || []);
    c.beginPath();
    c.moveTo(path[0][0], path[0][1]);
    for (let i = 1; i < path.length; i++) {
      c.lineTo(path[i][0], path[i][1]);
    }
    c.stroke();
  }
  c.setLineDash([]);
  c.restore();
}

/* ==========================================================================
   TEXT WRAPPING HELPER
   ==========================================================================
   Splits a string on whitespace and packs the words into lines no
   wider than maxW, measured with the current c.font.  Words that
   alone exceed maxW are left on their own line (rather than broken
   mid-word); the caller is expected to shrink the font in that case
   or accept the overflow.  Used by the info column so long labels
   like "Wall segments . arrow style" or "step face (forward hatch)"
   do not run past INFO_W and paint over the plan. */

function _wrapText(c, text, maxW) {
  const words = String(text).split(/\s+/).filter(w => w.length > 0);
  if (!words.length) return [""];
  const lines = [];
  let cur = "";
  for (const w of words) {
    const test = cur ? cur + " " + w : w;
    if (c.measureText(test).width <= maxW) {
      cur = test;
    } else {
      if (cur) lines.push(cur);
      cur = w;
    }
  }
  if (cur) lines.push(cur);
  return lines;
}

/* ---- Crop and rasterise ---- */

function cropCanvasToContent(srcCanvas, pad) {
  const w = srcCanvas.width, h = srcCanvas.height;
  const srcCtx = srcCanvas.getContext("2d");
  const data = srcCtx.getImageData(0, 0, w, h).data;

  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let y = 0; y < h; y++) {
